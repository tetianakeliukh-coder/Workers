<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Timesheets — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style>
  /* ─── My Timesheets ─────────────────────────────────────────────────
     The worker's own week. Desktop is the period grid — site › supervisor
     › task down the side, days across the top. Below 860px it becomes a
     week strip and a card per day, which is the view that matters most:
     workers enter their hours on a phone. */

  /* ─── Period bar ───────────────────────────────────────────────── */
  .period-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .step {
    width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--white); border: 1px solid var(--grey-350); border-radius: 8px;
    color: var(--grey-700); cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast);
  }
  .step:hover { border-color: var(--border-hover); background: var(--bg-blue-light); color: var(--text-main); }
  .period-range {
    font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap;
    min-width: 210px; text-align: center;
  }
  .period-meta { font-size: 13px; color: var(--grey-600); white-space: nowrap; }
  .period-chip {
    display: none; height: 22px; align-items: center; padding: 0 8px; border-radius: 6px;
    background: var(--bg-blue-light); color: var(--primary);
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .period-chip.visible { display: inline-flex; }
  .period-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  /* ─── Edit bar ─────────────────────────────────────────────────── */
  /* Matches the selection bar on Team Timesheets: plain white, outlined
     actions on the right. */
  .edit-bar {
    display: none; align-items: center; gap: 16px; flex-wrap: wrap;
    height: 52px; padding: 0 2px; background: var(--white);
  }
  body.editing .edit-bar { display: flex; }
  body.editing .period-actions { display: none; }
  .edit-status { font-size: 14px; color: var(--text-main); white-space: nowrap; }
  .edit-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .edit-actions .btn-outline {
    height: 32px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--white); border: 1px solid var(--primary); color: var(--primary);
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; line-height: 18px;
    white-space: nowrap; transition: background var(--t-fast);
  }
  .edit-actions .btn-outline:hover { background: var(--bg-blue-light); }
  .edit-actions .btn-outline:disabled { border-color: var(--grey-350); color: var(--grey-400); cursor: default; }
  .edit-actions .btn-outline:disabled:hover { background: var(--white); }

  /* ─── Period grid (desktop) ────────────────────────────────────── */
  .grid-card table { min-width: 980px; }
  .grid-card th, .grid-card td { white-space: nowrap; }

  th.col-label, td.col-label {
    position: sticky; left: 0; z-index: 2; background: inherit;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* Same hairline the frozen columns use on Team Timesheets. */
  .sx-left th.col-label, .sx-left td.col-label { overflow: visible; }
  .sx-left th.col-label::after, .sx-left td.col-label::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: 1px;
    background: var(--grey-400); pointer-events: none;
  }
  .sx-left th.col-label .tree, .sx-left td.col-label .tree,
  .sx-left td.col-label > .code { max-width: 100%; }
  th.col-day, td.col-day, th.col-total, td.col-total { text-align: right; }
  th.col-total, td.col-total { font-weight: 600; }
  .grid-card thead th {
    position: sticky; top: 0; z-index: 3; background: var(--white); vertical-align: bottom;
  }
  .grid-card thead th.col-label { z-index: 4; }
  .day-head { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; line-height: 16px; }
  .day-head .dow { font-size: 12px; font-weight: 400; color: var(--grey-600); }
  .day-head .dnum { font-size: 14px; font-weight: 500; color: var(--text-main); }
  .day-head.is-today .dow, .day-head.is-today .dnum { color: var(--primary); }

  /* No fills on the parent rows — the Team Timesheets table settled on
     indent, weight and icon for hierarchy, and these two sit side by side. */
  #grid tbody tr { background: var(--white); }
  #grid tbody tr:hover { background: #fafbfe; }

  .tree { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .tree .caret {
    width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--grey-600); transition: transform var(--t-fast); cursor: pointer;
  }
  tr.collapsed .caret { transform: rotate(-90deg); }
  .tree .ico { flex-shrink: 0; color: var(--grey-600); }
  .tree .name { overflow: hidden; text-overflow: ellipsis; }
  .row-site .name { font-weight: 600; }
  .row-sup .name { font-weight: 500; }
  .row-task td.col-label { padding-left: 62px; }
  .row-task .code { font-weight: 500; }
  .row-task .what { color: var(--grey-600); }
  td.col-day, td.col-total { font-variant-numeric: tabular-nums; }

  #grid tfoot td {
    position: sticky; bottom: 0; background: var(--white);
    border-top: 1px solid var(--grey-350); font-weight: 600;
  }
  #grid tfoot td.col-label { z-index: 3; color: var(--grey-700); font-weight: 500; }

  /* Flat rows: the three label columns stay put while the days scroll. */
  th.col-site, td.col-site { position: sticky; left: 0; z-index: 2; background: inherit; }
  th.col-sup,  td.col-sup  { position: sticky; left: 200px; z-index: 2; background: inherit; }
  th.col-task, td.col-task { position: sticky; left: 350px; z-index: 2; background: inherit; }
  th.col-site, td.col-site, th.col-sup, td.col-sup, th.col-task, td.col-task {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  td.col-site { font-weight: 600; }
  td.col-sup { font-weight: 500; }
  td.col-task { color: var(--grey-700); }
  #grid tbody tr.group-top > td { border-top: 1px solid var(--grey-350); }
  .sx-left td.col-task::after, .sx-left th.col-task::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: 1px;
    background: var(--grey-400); pointer-events: none;
  }
  .sx-left td.col-task, .sx-left th.col-task { overflow: visible; }

  .hr-input {
    width: 100%; max-width: 72px; height: 32px; padding: 0 8px; text-align: right;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main);
    border: 1px solid var(--grey-350); border-radius: 6px; background: var(--white);
  }
  .hr-input:focus { outline: none; border-color: var(--primary); }
  .hr-input.changed { border-color: var(--primary); background: var(--bg-blue-light); }

  .grid-foot {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-top: 1px solid var(--grey-300); font-size: 13px; color: var(--grey-600);
  }
  .grid-foot .count { margin-left: auto; }

  /* ─── Mobile list ───────────────────────────────────────────────
     One list for the whole week, broken by date. A day is a timesheet,
     so the date is the heading and it collapses to its total. */
  .week-view { display: none; }
  .week-total { text-align: right; font-size: 13px; color: var(--grey-600); margin: 2px 0 10px; }
  .week-total b { color: var(--text-main); }

  .day-list { display: flex; flex-direction: column; gap: 10px; }
  .day-group { background: var(--white); border: 1px solid var(--grey-300); border-radius: 12px; overflow: hidden; }
  .dgroup-head {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 12px 14px; background: none; border: none; cursor: pointer;
    font-family: var(--fs-sans); text-align: left;
  }
  .dgroup-head .caret {
    width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--grey-600); transition: transform var(--t-fast);
  }
  .day-group.closed .caret { transform: rotate(-90deg); }
  .dgroup-head .dt { font-size: 15px; font-weight: 600; color: var(--text-main); }
  .dgroup-head .today-chip {
    height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 5px;
    background: var(--bg-blue-light); color: var(--primary); font-size: 11px; font-weight: 500;
  }
  .dgroup-head .tot { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--text-main); }
  .day-group.closed .day-rows { display: none; }
  .day-rows { border-top: 1px solid var(--grey-200); }

  .entry {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; background: none; border: none; cursor: pointer;
    font-family: var(--fs-sans); text-align: left;
  }
  .entry + .entry { border-top: 1px solid var(--grey-200); }
  .entry:hover { background: #fafbfe; }
  .entry-main { min-width: 0; flex: 1; }
  .entry-code { display: block; font-size: 14px; font-weight: 500; color: var(--text-main); }
  .entry-sub { display: block; font-size: 12px; line-height: 17px; color: var(--grey-600); margin-top: 2px; }
  .entry-hrs { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .entry-go { width: 16px; height: 16px; color: var(--grey-400); flex-shrink: 0; }
  .dd-chev { width: 12px; height: 12px; margin-left: auto; color: var(--grey-600); }
  .day-empty { padding: 14px; font-size: 14px; color: var(--grey-600); }
  .day-add { padding: 10px 14px 14px; }

  /* ─── Add task ─────────────────────────────────────────────────── */
  .modal.add-modal { max-width: 460px; width: 100%; }
  /* The shell's modal body is flex:1 with a zero basis, which collapses when
     the dialog has no fixed height — size it to its content instead. */
  .add-modal .modal-body {
    padding: 16px 24px 8px; display: flex; flex-direction: column; gap: 14px;
    flex: 0 1 auto; max-height: 68vh; overflow: auto;
  }
  .add-sub { font-size: 14px; line-height: 20px; color: var(--grey-700); margin: 0; }
  .add-sub b { color: var(--text-main); font-weight: 500; }

  /* Recents are rows, not chips — each one has to carry who you worked for
     and when, which is what makes them pickable without thinking. */
  .recent-list { display: flex; flex-direction: column; gap: 6px; }
  .recent-row {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left;
    background: var(--white); border: 1px solid var(--grey-350); font-family: var(--fs-sans);
    transition: border-color var(--t-fast), background var(--t-fast);
  }
  .recent-row:hover { border-color: var(--border-hover); background: var(--bg-blue-light); }
  .recent-row.sel { border-color: var(--primary); background: var(--bg-blue-light); }
  .rr-code { font-size: 14px; font-weight: 500; color: var(--text-main); }
  .rr-sub { font-size: 12px; line-height: 16px; color: var(--grey-600); }
  .recent-empty { font-size: 13px; color: var(--grey-600); }

  /* .step and the footer buttons set display, which beats the browser's
     own [hidden] rule — so say it louder. */
  [hidden] { display: none !important; }
  .wiz-step { display: flex; flex-direction: column; gap: 14px; }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lvl-head {
    font-size: 11px; font-weight: 600; letter-spacing: 0.7px; text-transform: uppercase;
    color: var(--grey-600); padding-top: 2px;
  }

  /* Recents are a quiet helper under the form, not the way in. */
  .quick { border-top: 1px solid var(--grey-300); padding-top: 12px; }
  .quick-label {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.7px;
    text-transform: uppercase; color: var(--grey-600); margin-bottom: 8px;
  }
  .quick-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-row button {
    padding: 6px 10px; border-radius: 999px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-350);
    font-family: var(--fs-sans); font-size: 12px; color: var(--grey-800); white-space: nowrap;
  }
  .quick-row button:hover { border-color: var(--primary); background: var(--bg-blue-light); color: var(--primary); }

  /* Sheets rise from the bottom on a phone. */
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
  body.is-narrow .modal-backdrop.open .modal { animation: sheet-up 0.24s ease; }

  .edit-meta { font-size: 13px; line-height: 19px; color: var(--grey-600); margin: 0; }
  .edit-meta b { color: var(--text-main); font-weight: 500; }
  .edit-modal .modal-footer-actions .btn-delete {
    margin-right: auto; background: none; border: none; cursor: pointer;
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; color: var(--error);
  }
  .edit-modal .modal-footer-actions .btn-delete:hover { text-decoration: underline; }

  .shifts { display: flex; flex-direction: column; gap: 10px; }
  .shift {
    display: grid; grid-template-columns: 1fr 1fr 88px 28px; gap: 8px; align-items: end;
  }
  .shift .fld-label { font-size: 12px; font-weight: 500; color: var(--grey-700); }
  .shift input {
    width: 100%; height: 40px; padding: 0 10px;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main);
    border: 1px solid var(--grey-350); border-radius: 8px; background: var(--white);
  }
  .shift input:focus { outline: none; border-color: var(--primary); }
  .shift-drop {
    width: 28px; height: 40px; border: none; background: none; cursor: pointer;
    color: var(--grey-600); display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .shift-drop:hover { background: var(--grey-100); color: var(--error); }
  .add-shift { align-self: flex-start; font-size: 14px; }
  .shift-total { text-align: right; font-size: 14px; color: var(--grey-700); }
  .shift-total b { color: var(--text-main); font-size: 16px; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld-label { font-size: 14px; font-weight: 500; line-height: 18px; color: var(--text-main); }
  .fld select {
    width: 100%; height: 40px; padding: 0 10px;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main);
    background: var(--white); border: 1px solid var(--grey-350); border-radius: 8px;
  }
  .fld select:focus { outline: none; border-color: var(--primary); }
  .fld-hint { font-size: 12px; color: var(--grey-600); }

  /* The phone layout is a class, not only a media query, so the prototype's
     viewport switcher can show it on a desktop screen. */
  body.is-narrow .grid-card { display: none; }
  body.is-narrow .week-view { display: block; }
  body.is-narrow .period-range { min-width: 0; flex: 1; font-size: 14px; }
  body.is-narrow .period-meta,
  body.is-narrow .period-chip,
  body.is-narrow .period-chip.visible { display: none; }
  /* Collapse all and the global Edit belong to the grid; on a phone each
  day card carries its own Edit. */
  body.is-narrow #btn-edit { display: none; }
  body.is-narrow .period-actions { margin-left: 0; width: 100%; }
  body.is-narrow .period-actions .btn-ghost { flex: 1; justify-content: center; }
  body.is-narrow .edit-actions { width: 100%; margin-left: 0; }
  body.is-narrow .edit-actions .btn-outline,
  body.is-narrow .edit-actions .btn-primary { flex: 1; justify-content: center; }
  body.is-narrow .edit-bar { height: auto; padding: 10px 0; }
  /* ─── Phone preview frame + viewport switcher (prototype only) ──── */
  /* Clears the fixed phone top bar the shell puts in at this size. */
  body.force-mobile .main { background: var(--grey-200); display: flex; justify-content: center; padding: 80px 16px 48px; }
  body.force-mobile .content {
    width: 390px; max-width: 100%; background: var(--white);
    border: 1px solid var(--grey-350); border-radius: 20px;
    padding: 16px; box-shadow: var(--shadow-dialog);
  }

  /* In the phone preview the sheet should read like a phone sheet. */
  body.is-narrow .modal-backdrop { align-items: flex-end; padding: 0; }
  body.is-narrow .modal.add-modal {
    max-width: 390px; max-height: 88vh; border-radius: 16px 16px 0 0;
  }
  body.is-narrow .add-modal .modal-footer-actions { width: 100%; }
  body.is-narrow .add-modal .modal-footer-actions .btn-ghost,
  body.is-narrow .add-modal .modal-footer-actions .btn-primary { flex: 1; justify-content: center; }

  /* Two floating switchers: row layout, then preview size. */
  body.is-narrow .rows-switch { display: none; }
  .vp-switch {
    position: fixed; right: 20px; bottom: 20px; z-index: 400;
    display: inline-flex; padding: 4px; gap: 2px; border-radius: 10px;
    background: var(--white); border: 1px solid var(--grey-350); box-shadow: var(--shadow-dropdown);
  }
  .vp-switch button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px; border: none; border-radius: 7px; cursor: pointer;
    background: none; color: var(--grey-700);
    font-family: var(--fs-sans); font-size: 13px; font-weight: 500;
  }
  .vp-switch button:hover { background: var(--grey-100); color: var(--text-main); }
  .vp-switch button.on { background: var(--bg-blue-light); color: var(--primary); }
  /* Sits to the left of the preview switcher — needs to outrank .vp-switch. */
  .vp-switch.rows-switch { right: 216px; }

  /* ─── Week dropdown ────────────────────────────────────────────── */
  .period-dd .dd-trigger { min-width: 232px; }
  .dd-item .sub { margin-left: auto; font-size: 12px; color: var(--grey-600); }
  #week-cal { padding: 8px; min-width: 268px; }
  #week-cal .cal-head { display: flex; align-items: center; padding: 2px 4px 8px; }
  #week-cal .cal-nav {
    width: 28px; height: 28px; flex-shrink: 0; border: none; border-radius: 50%;
    background: none; cursor: pointer; color: var(--grey-700);
    display: flex; align-items: center; justify-content: center;
  }
  #week-cal .cal-nav:hover { background: var(--grey-200); }
  #week-cal .cal-title { flex: 1; text-align: center; font-size: 14px; font-weight: 500; }
  #week-cal .cal-dow, #week-cal .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  #week-cal .cal-dow span { height: 24px; line-height: 24px; text-align: center; font-size: 11px; color: var(--grey-600); }
  #week-cal .cal-cell { height: 32px; display: flex; align-items: center; justify-content: center; }
  #week-cal .cal-day {
    width: 30px; height: 30px; border: none; border-radius: 50%; background: none; cursor: pointer;
    font-family: var(--fs-sans); font-size: 13px; color: var(--text-main);
  }
  #week-cal .cal-day:hover { background: var(--grey-200); }
  #week-cal .cal-cell.inweek { background: var(--bg-blue-light); }
  #week-cal .cal-cell.wk-start { border-radius: 16px 0 0 16px; }
  #week-cal .cal-cell.wk-end { border-radius: 0 16px 16px 0; }
  #week-cal .cal-foot { margin-top: 6px; padding: 8px 6px 2px; border-top: 1px solid var(--grey-300); font-size: 12px; color: var(--grey-600); }

</style>
</head>
<body data-module="mytime">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <div class="page-header">
        <h1 class="page-title">My Timesheets</h1>
        <div class="header-actions">
          <div class="dd-wrap" id="date-dd">
            <button class="dd-trigger" type="button">
              <span>Date: <span id="date-dd-value">Last 7 days</span></span>
              <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dd-panel" id="date-dd-panel"></div>
          </div>
          <button class="btn-primary" type="button" id="btn-new-task">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            Add task
          </button>
        </div>
      </div>

      <div class="period-bar">
        <div class="period-actions">
          <button class="btn-ghost" type="button" id="btn-edit">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.2 2.8l2 2L6 12H4v-2l7.2-7.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            Edit
          </button>
          <button class="btn-ghost" type="button" id="btn-collapse">Collapse all</button>
        </div>
      </div>

      <div class="edit-bar" id="edit-bar">
        <span class="edit-status" id="edit-status">Editing · no changes yet</span>
        <div class="edit-actions">
          <button class="btn-outline" type="button" id="btn-cancel">Cancel</button>
          <button class="btn-primary" type="button" id="btn-save" disabled>Save</button>
        </div>
      </div>

      <!-- ── Desktop: the period grid ── -->
      <div class="table-card grid-card">
        <div class="table-scroll">
          <table id="grid">
            <colgroup id="grid-cols"></colgroup>
            <thead id="grid-head"></thead>
            <tbody id="grid-body"></tbody>
            <tfoot id="grid-foot"></tfoot>
          </table>
        </div>
        <div class="grid-foot">
          <span id="grid-hint">Hours you enter are saved against the day's timesheet.</span>
          <span class="count" id="grid-count"></span>
        </div>
      </div>

      <!-- ── Mobile: week strip + a card per day ── -->
      <div class="week-view">
        <div class="week-total" id="week-total"></div>
        <div class="day-list" id="day-list"></div>
      </div>

    </div>
  </main>
</div>

<!-- ── Prototype viewport switcher ──────────────────────────────── -->
<div class="vp-switch rows-switch" id="rows-switch" role="group" aria-label="Row layout">
  <button type="button" data-rows="nested" class="on">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 3.5h11M5 8h8.5M7.5 12.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    Nested
  </button>
  <button type="button" data-rows="flat">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1.4" stroke="currentColor" stroke-width="1.3"/><path d="M6.5 3v10M10 3v10" stroke="currentColor" stroke-width="1.3"/></svg>
    Flat
  </button>
</div>

<div class="vp-switch" id="vp-switch" role="group" aria-label="Preview size">
  <button type="button" data-vp="desktop" class="on">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    Desktop
  </button>
  <button type="button" data-vp="mobile">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M7 12.8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    Mobile
  </button>
</div>

<!-- ── Add task: where and what, then the hours ─────────────────── -->
<div class="modal-backdrop" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="modal add-modal">
    <div class="modal-header">
      <div class="modal-heading">
        <span class="modal-title" id="add-title">Add task</span>
        <span class="modal-meta"><span class="meta-item" id="add-step-label">Step 1 of 2 · Where and what</span></span>
      </div>
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Step 1 -->
      <div class="wiz-step" id="step-1">
        <div class="fld">
          <label class="fld-label" for="add-date">Date</label>
          <select id="add-date"></select>
        </div>
        <div class="fld">
          <label class="fld-label" for="add-site">Site</label>
          <select id="add-site"></select>
        </div>
        <div class="fld">
          <label class="fld-label" for="add-sup">Supervisor</label>
          <select id="add-sup"></select>
          <span class="fld-hint" id="date-hint"></span>
        </div>

        <!-- One to four fields, named by the site -->
        <div id="level-fields"></div>

        <div class="quick" id="quick-wrap">
          <span class="quick-label">Recent</span>
          <div class="quick-row" id="quick-tasks"></div>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="wiz-step" id="step-2" hidden>
        <p class="add-sub" id="shift-sub"></p>
        <div class="shifts" id="shifts"></div>
        <button class="btn-text add-shift" type="button" id="add-shift">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Add another shift
        </button>
        <div class="shift-total">Total <b id="shift-total">0</b> h</div>
      </div>
    </div>

    <div class="modal-footer">
      <div class="modal-footer-actions">
        <button class="btn-ghost" type="button" data-close id="add-cancel">Cancel</button>
        <button class="btn-ghost" type="button" id="add-back" hidden>Back</button>
        <button class="btn-primary" type="button" id="add-next">Next</button>
        <button class="btn-primary" type="button" id="add-save" hidden>Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Edit an entry ────────────────────────────────────────────── -->
<div class="modal-backdrop" id="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <div class="modal add-modal edit-modal">
    <div class="modal-header">
      <div class="modal-heading">
        <span class="modal-title" id="edit-title">Edit hours</span>
        <span class="modal-meta"><span class="meta-item" id="edit-when"></span></span>
      </div>
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p class="edit-meta" id="edit-task"></p>
      <div class="shifts" id="edit-shifts"></div>
      <button class="btn-text add-shift" type="button" id="edit-add-shift">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Add another shift
      </button>
      <div class="shift-total">Total <b id="edit-total">0</b> h</div>
    </div>
    <div class="modal-footer">
      <div class="modal-footer-actions">
        <button class="btn-delete" type="button" id="edit-delete">Remove</button>
        <button class="btn-ghost" type="button" data-close>Cancel</button>
        <button class="btn-primary" type="button" id="edit-save">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOW_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  var FULL_DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function startOfDay(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function fromIso(v) { var p = v.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function mondayOf(d) { var x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); }
  function fmtDay(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtHours(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }

  var TODAY = startOfDay(new Date());
  var THIS_MON = mondayOf(TODAY);

  /* ─── Sites, their custom fields and their supervisors ─────────────
     The fields a task is built from differ per site — one to four levels,
     named by the client's own configuration. Mirrors Team Timesheets. */
  var SITE_FIELDS = {
    'MMA VIGILANT – 360': [
      { name: 'Work Order', values: ['WORK-00123', 'WORK-00124', 'WORK-00187', 'WORK-00201'] },
      { name: 'Task',       values: ['Repair the machine', 'Replace hydraulic hose', 'Weld handrail section', 'Deck plating repair'] },
      { name: 'Type',       values: ['Labour', 'Waiting for materials', 'Equipment breakdown'] },
      { name: 'Sub-task',   values: ['Preparation', 'Clean-up'] }
    ],
    'MMA VIGILANT ROV': [
      { name: 'Job Number', values: ['JOB-00451', 'JOB-00478', 'JOB-00492'] },
      { name: 'Activity',   values: ['ROV dive', 'Deck handling', 'Tooling change'] },
      { name: 'Type',       values: ['Labour', 'Weather standby'] }
    ],
    'SA BHP OLYMPIC DAM': [
      { name: 'Work Order', values: ['WORK-00123', 'WORK-00201'] },
      { name: 'Cost Code',  values: ['CC-1140', 'CC-1155', 'CC-1163'] },
      { name: 'Type',       values: ['Labour', 'Waiting for materials'] },
      { name: 'Shift Code', values: ['Day', 'Night'] }
    ]
  };
  var SITES = Object.keys(SITE_FIELDS);
  var SUPS_BY_SITE = {
    'MMA VIGILANT – 360': ['Grace Okafor', 'Tom Halloran'],
    'MMA VIGILANT ROV':   ['Priya Nair'],
    'SA BHP OLYMPIC DAM': ['Grace Okafor', 'Marcus Webb']
  };
  function fieldsFor(site) { return SITE_FIELDS[site] || []; }
  function pathOf(levels) { return levels.filter(Boolean).join(' | '); }
  function keyOf(site, sup, levels) { return site + '§' + sup + '§' + pathOf(levels); }

  /* ─── The worker's own entries ────────────────────────────────────
     Generated around today so the week always has something in it. */
  var entries = [];
  var taskMeta = Object.create(null);         // key -> { site, sup, levels }

  function add(day, site, sup, levels, hours, start, finish) {
    var k = keyOf(site, sup, levels);
    taskMeta[k] = { site: site, sup: sup, levels: levels.slice() };
    entries.push({ date: iso(day), key: k, hours: hours, start: start || '', finish: finish || '' });
  }

  var A = ['WORK-00123', 'Repair the machine', 'Labour', ''];
  var B = ['WORK-00201', 'Deck plating repair', 'Labour', ''];
  var C = ['JOB-00492', 'Tooling change', 'Labour'];
  var lastMon = addDays(THIS_MON, -7);
  for (var i = 0; i < 5; i++) {
    add(addDays(lastMon, i), 'MMA VIGILANT – 360', 'Grace Okafor', A, 8, '06:00', '14:00');
    add(addDays(lastMon, i), 'MMA VIGILANT – 360', 'Grace Okafor', B, 4, '14:00', '18:00');
  }
  add(addDays(lastMon, 3), 'MMA VIGILANT ROV', 'Priya Nair', C, 3, '07:00', '10:00');
  add(addDays(lastMon, 4), 'MMA VIGILANT ROV', 'Priya Nair', C, 2.5, '07:00', '09:30');
  add(THIS_MON, 'MMA VIGILANT – 360', 'Grace Okafor', A, 8, '06:00', '14:00');
  add(THIS_MON, 'MMA VIGILANT – 360', 'Grace Okafor', B, 4, '14:00', '18:00');
  /* Older work, so the quick picks can say when each was last used. */
  add(addDays(THIS_MON, -24), 'MMA VIGILANT – 360', 'Tom Halloran', ['WORK-00187', 'Weld handrail section', 'Labour', ''], 10);
  add(addDays(THIS_MON, -38), 'SA BHP OLYMPIC DAM', 'Marcus Webb', ['WORK-00201', 'CC-1155', 'Labour', 'Day'], 7.5);

  /* ─── State ───────────────────────────────────────────────────── */
  var state = { range: 'last7', from: null, to: null, editing: false, selDay: iso(TODAY) };
  var collapsed = Object.create(null);
  var draft = null;          // 'key|date' -> hours, while editing
  var extraRows = [];        // keys added during this edit

  /* One column per day in the active range. With no date filter the range
     spans whatever the worker has booked. */
  function days() {
    var b = rangeBounds(), from, to;
    if (b && b.from && b.to) { from = fromIso(b.from); to = fromIso(b.to); }
    else {
      var all = entries.map(function (e) { return e.date; }).sort();
      if (!all.length) return [addDays(TODAY, -6), TODAY];
      from = fromIso(all[0]); to = fromIso(all[all.length - 1]);
    }
    var out = [], cur = new Date(from.getTime());
    while (cur <= to && out.length < 120) { out.push(new Date(cur.getTime())); cur.setDate(cur.getDate() + 1); }
    return out;
  }
  function hoursFor(key, isoDate) {
    if (draft) {
      var dk = key + '|' + isoDate;
      if (dk in draft) return draft[dk];
    }
    var sum = 0;
    entries.forEach(function (e) { if (e.key === key && e.date === isoDate) sum += e.hours; });
    return sum;
  }
  function lastUsed(key) {
    var ds = entries.filter(function (e) { return e.key === key; }).map(function (e) { return e.date; }).sort();
    return ds.length ? fromIso(ds[ds.length - 1]) : null;
  }

  /* Tasks on screen this week: anything with hours, plus anything added
     during the current edit. */
  function weekKeys() {
    var ds = days().map(iso), out = [];
    Object.keys(taskMeta).forEach(function (k) {
      var any = ds.some(function (d) { return hoursFor(k, d) > 0; });
      if (any || extraRows.indexOf(k) !== -1) out.push(k);
    });
    return out;
  }
  function weekTree() {
    var sites = [], bySite = Object.create(null);
    weekKeys().forEach(function (k) {
      var m = taskMeta[k];
      if (!bySite[m.site]) { bySite[m.site] = { name: m.site, sups: [], by: Object.create(null) }; sites.push(bySite[m.site]); }
      var S = bySite[m.site];
      if (!S.by[m.sup]) { S.by[m.sup] = { name: m.sup, tasks: [] }; S.sups.push(S.by[m.sup]); }
      S.by[m.sup].tasks.push({ key: k, label: pathOf(m.levels) || 'No task', meta: m });
    });
    return sites;
  }
  function tasksOfSite(site) {
    var out = [];
    site.sups.forEach(function (s) { out = out.concat(s.tasks); });
    return out;
  }
  function sumRow(tasks, isoDate) {
    var n = 0;
    tasks.forEach(function (t) { n += hoursFor(t.key, isoDate); });
    return n;
  }

  /* ─── Desktop grid ────────────────────────────────────────────── */
  var gridCols = document.getElementById('grid-cols');
  var gridHead = document.getElementById('grid-head');
  var gridBody = document.getElementById('grid-body');
  var gridFoot = document.getElementById('grid-foot');

  function cellHtml(value, key, isoDate) {
    if (state.editing && key) {
      var v = value > 0 ? fmtHours(value) : '';
      return '<td class="col-day"><input class="hr-input" type="text" inputmode="decimal" ' +
        'data-key="' + Shell.esc(key) + '" data-date="' + isoDate + '" value="' + v + '" aria-label="Hours" /></td>';
    }
    return '<td class="col-day">' + (value > 0 ? fmtHours(value) : '<span class="cell-empty">&mdash;</span>') + '</td>';
  }
  function caret() {
    return '<span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }
  var ICO_SITE = '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 14V3.5l5-1.5V14M3 14h10V6.5H8M3 14H1.5M13 14h1.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  var ICO_SUP  = '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 13.2c0-2.2 2-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M11.5 4.5h3M13 3v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

  var rowsMode = 'nested';

  function dayHeadCells(ds) {
    return ds.map(function (d) {
      var today = iso(d) === iso(TODAY);
      return '<th class="col-day"><span class="day-head' + (today ? ' is-today' : '') + '">' +
        '<span class="dow">' + DOW[d.getDay()] + '</span><span class="dnum">' + fmtDay(d) + '</span></span></th>';
    }).join('');
  }

  /* Flat: site, supervisor and task each get their own column, and a value
     is printed only when it changes — the hierarchy without the nesting. */
  function renderFlat() {
    var ds = days();
    gridCols.innerHTML = '<col style="width:200px" /><col style="width:150px" /><col style="width:260px" />' +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') + '<col style="width:96px" />';

    gridHead.innerHTML = '<tr>' +
      '<th class="col-site">Site</th><th class="col-sup">Supervisor</th><th class="col-task">Task</th>' +
      dayHeadCells(ds) + '<th class="col-total">Total</th></tr>';

    var rows = [], prevSite = null, prevSup = null, count = 0;
    weekTree().forEach(function (site) {
      site.sups.forEach(function (sup) {
        sup.tasks.forEach(function (t) {
          var showSite = site.name !== prevSite;
          var showSup = showSite || sup.name !== prevSup;
          rows.push('<tr class="row-flat' + (showSite && count ? ' group-top' : '') + '">' +
            '<td class="col-site" title="' + Shell.esc(site.name) + '">' + (showSite ? Shell.esc(site.name) : '') + '</td>' +
            '<td class="col-sup">' + (showSup ? Shell.esc(sup.name) : '') + '</td>' +
            '<td class="col-task" title="' + Shell.esc(t.label) + '">' + Shell.esc(t.label) + '</td>' +
            ds.map(function (d) { return cellHtml(hoursFor(t.key, iso(d)), t.key, iso(d)); }).join('') +
            '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + hoursFor(t.key, iso(d)); }, 0)) + '</td>' +
          '</tr>');
          prevSite = site.name; prevSup = sup.name; count++;
        });
      });
    });

    if (!rows.length) {
      rows.push('<tr><td colspan="' + (ds.length + 4) + '" style="color:var(--grey-600)">No hours recorded this week.</td></tr>');
    }
    gridBody.innerHTML = rows.join('');

    var allTasks = [];
    weekTree().forEach(function (s) { allTasks = allTasks.concat(tasksOfSite(s)); });
    gridFoot.innerHTML = '<tr><td class="col-site">Total hours</td><td class="col-sup"></td><td class="col-task"></td>' +
      ds.map(function (d) {
        var n = sumRow(allTasks, iso(d));
        return '<td class="col-day">' + (n > 0 ? fmtHours(n) : '<span class="cell-empty">&mdash;</span>') + '</td>';
      }).join('') +
      '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(allTasks, iso(d)); }, 0)) + '</td></tr>';

    document.getElementById('grid-count').textContent = 'Displaying ' + count + ' row' + (count === 1 ? '' : 's');
  }

  function renderGrid() {
    if (rowsMode === 'flat') return renderFlat();
    var ds = days();
    gridCols.innerHTML = '<col style="width:360px" />' +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') + '<col style="width:96px" />';

    gridHead.innerHTML = '<tr><th class="col-label">Breakdown</th>' +
      ds.map(function (d) {
        var today = iso(d) === iso(TODAY);
        return '<th class="col-day"><span class="day-head' + (today ? ' is-today' : '') + '">' +
          '<span class="dow">' + DOW[d.getDay()] + '</span><span class="dnum">' + fmtDay(d) + '</span></span></th>';
      }).join('') + '<th class="col-total">Total</th></tr>';

    var tree = weekTree(), rows = [], shown = 0;
    tree.forEach(function (site) {
      var all = tasksOfSite(site), siteKey = 's:' + site.name;
      var siteOpen = collapsed[siteKey] !== true;
      rows.push('<tr class="row-site' + (siteOpen ? '' : ' collapsed') + '" data-key="' + Shell.esc(siteKey) + '">' +
        '<td class="col-label"><span class="tree">' + caret() + ICO_SITE +
          '<span class="name">' + Shell.esc(site.name) + '</span></span></td>' +
        ds.map(function (d) { return cellHtml(sumRow(all, iso(d))); }).join('') +
        '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(all, iso(d)); }, 0)) + '</td></tr>');
      shown++;
      if (!siteOpen) return;

      site.sups.forEach(function (sup) {
        var supKey = siteKey + '|' + sup.name, supOpen = collapsed[supKey] !== true;
        rows.push('<tr class="row-sup' + (supOpen ? '' : ' collapsed') + '" data-key="' + Shell.esc(supKey) + '">' +
          '<td class="col-label"><span class="tree" style="padding-left:20px">' + caret() + ICO_SUP +
            '<span class="name">' + Shell.esc(sup.name) + '</span></span></td>' +
          ds.map(function (d) { return cellHtml(sumRow(sup.tasks, iso(d))); }).join('') +
          '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(sup.tasks, iso(d)); }, 0)) + '</td></tr>');
        shown++;
        if (!supOpen) return;

        sup.tasks.forEach(function (t) {
          rows.push('<tr class="row-task">' +
            '<td class="col-label" title="' + Shell.esc(t.label) + '">' + Shell.esc(t.label) + '</td>' +
            ds.map(function (d) { return cellHtml(hoursFor(t.key, iso(d)), t.key, iso(d)); }).join('') +
            '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + hoursFor(t.key, iso(d)); }, 0)) + '</td></tr>');
          shown++;
        });
      });
    });

    if (!rows.length) {
      rows.push('<tr><td class="col-label" colspan="' + (ds.length + 2) + '" style="color:var(--grey-600)">' +
        'No hours recorded this week.</td></tr>');
    }
    gridBody.innerHTML = rows.join('');

    var allTasks = [];
    tree.forEach(function (s) { allTasks = allTasks.concat(tasksOfSite(s)); });
    gridFoot.innerHTML = '<tr><td class="col-label">Total hours</td>' +
      ds.map(function (d) {
        var n = sumRow(allTasks, iso(d));
        return '<td class="col-day">' + (n > 0 ? fmtHours(n) : '<span class="cell-empty">&mdash;</span>') + '</td>';
      }).join('') +
      '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(allTasks, iso(d)); }, 0)) + '</td></tr>';

    document.getElementById('grid-count').textContent = 'Displaying ' + shown + ' row' + (shown === 1 ? '' : 's');
  }

  /* ─── Mobile list ─────────────────────────────────────────────────
     Everything in the week as one list, broken by date. Each date is a
     timesheet and collapses to its total; tapping an entry opens the
     edit sheet. */
  var dayList = document.getElementById('day-list');
  var weekTotalEl = document.getElementById('week-total');
  var dayClosed = Object.create(null);

  function entriesOn(isoDate) {
    var all = [];
    weekTree().forEach(function (s) { all = all.concat(tasksOfSite(s)); });
    return all.map(function (t) { return { task: t, hours: hoursFor(t.key, isoDate) }; })
              .filter(function (r) { return r.hours > 0; });
  }

  var CHEV = '<svg class="entry-go" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderWeek() {
    var ds = days(), weekTotal = 0;
    ds.forEach(function (d) {
      Object.keys(taskMeta).forEach(function (k) { weekTotal += hoursFor(k, iso(d)); });
    });
    weekTotalEl.innerHTML = 'Total <b>' + fmtHours(weekTotal) + ' h</b>';

    /* Most recent first — you fill in the day you just worked. */
    var shown = ds.slice().reverse().filter(function (d) {
      return entriesOn(iso(d)).length || iso(d) === iso(TODAY);
    });

    dayList.innerHTML = shown.map(function (d) {
      var key = iso(d), rows = entriesOn(key);
      var total = rows.reduce(function (n, r) { return n + r.hours; }, 0);
      var closed = dayClosed[key] === true;

      var body = rows.length ? rows.map(function (r) {
        return '<button class="entry" type="button" data-entry="' + Shell.esc(r.task.key) + '" data-date="' + key + '">' +
          '<span class="entry-main">' +
            '<span class="entry-code">' + Shell.esc(r.task.label) + '</span>' +
            '<span class="entry-sub">' + Shell.esc(r.task.meta.sup) + ' · ' + Shell.esc(r.task.meta.site) + '</span>' +
          '</span>' +
          '<span class="entry-hrs">' + fmtHours(r.hours) + ' h</span>' + CHEV +
        '</button>';
      }).join('') : '<div class="day-empty">No hours recorded.</div>';

      return '<div class="day-group' + (closed ? ' closed' : '') + '">' +
        '<button class="dgroup-head" type="button" data-dayhead="' + key + '">' +
          '<span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '<span class="dt">' + DOW[d.getDay()] + ' ' + fmtDay(d) + '</span>' +
          (key === iso(TODAY) ? '<span class="today-chip">Today</span>' : '') +
          '<span class="tot">' + fmtHours(total) + ' h</span>' +
        '</button>' +
        '<div class="day-rows">' + body +
          '<div class="day-add"><button class="btn-text" type="button" data-card-add="' + key + '">' +
            '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Add task</button></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ─── Date filter ─────────────────────────────────────────────────
     The same control as Team Timesheets, in the same place — one date
     picker across both screens. The grid draws a column per day in range. */
  var datePanel = document.getElementById('date-dd-panel');
  var dateValue = document.getElementById('date-dd-value');
  var dateTrigger = document.querySelector('#date-dd .dd-trigger');
  var CHECK = '<svg class="dd-check" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var DD_CHEV = '<svg class="dd-chev" viewBox="0 0 12 12" fill="none"><path d="M4.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var QUICK = [
    { k: 'today', label: 'Today' },
    { k: 'last7', label: 'Last 7 days' },
    { k: 'month', label: 'Last month' }
  ];

  function daysAgoIso(n) { return iso(addDays(TODAY, -n)); }

  function rangeBounds() {
    if (state.range === 'today')  return { from: daysAgoIso(0),  to: daysAgoIso(0) };
    if (state.range === 'last7')  return { from: daysAgoIso(6),  to: daysAgoIso(0) };
    if (state.range === 'month')  return { from: daysAgoIso(29), to: daysAgoIso(0) };
    if (state.range === 'custom') return { from: state.from, to: state.to };
    return null;
  }

  function fmtRange(from, to) {
    if (from === to) return fmtDay(fromIso(from)) + ' ' + from.slice(0, 4);
    var a = fmtDay(fromIso(from)), b = fmtDay(fromIso(to));
    return a + ' – ' + b + ' ' + to.slice(0, 4);
  }

  function markRange(k) {
    datePanel.querySelectorAll('#date-quick .dd-item').forEach(function (i) {
      i.classList.toggle('active', i.getAttribute('data-range') === k);
    });
  }
  function syncDateLabel() {
    if (state.range === 'custom') { dateValue.textContent = fmtRange(state.from, state.to); return; }
    if (state.range === 'all') { dateValue.textContent = 'All time'; return; }
    dateValue.textContent = QUICK.filter(function (r) { return r.k === state.range; })[0].label;
  }

  datePanel.innerHTML =
    '<div class="dd-view" id="date-quick">' +
      QUICK.map(function (r) {
        return '<button class="dd-item' + (r.k === state.range ? ' active' : '') + '" type="button" data-range="' + r.k + '">' +
          CHECK + r.label + '</button>';
      }).join('') +
      '<button class="dd-item" type="button" data-range="custom">' + CHECK + 'Custom' + DD_CHEV + '</button>' +
      '<hr class="dd-divider" />' +
      '<button class="dd-item" type="button" data-range="all">' + CHECK + 'All time</button>' +
    '</div><div class="cal" id="date-cal"></div>';

  /* ─── Custom range calendar ───────────────────────────────────── */
  var CAL_DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var calAnchor = null, pick = { from: null, to: null }, hoverIso = null;
  var ARROW = '<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function openCalendar() {
    var base = (state.range === 'custom' && state.from) ? fromIso(state.from) : new Date(TODAY.getTime());
    calAnchor = new Date(base.getFullYear(), base.getMonth() - 1, 1);
    pick = state.range === 'custom' ? { from: state.from, to: state.to } : { from: null, to: null };
    hoverIso = null;
    datePanel.classList.add('cal-mode');
    renderCal();
  }

  function monthGrid(y, m) {
    var lead = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate();
    var lo = pick.from, hi = pick.to || (lo && hoverIso && hoverIso > lo ? hoverIso : null);
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell"></div>';
    for (var d = 1; d <= count; d++) {
      var key = iso(new Date(y, m, d));
      var isStart = !!lo && key === lo, isEnd = !!hi && key === hi;
      var cls = 'cal-cell' + (lo && hi && key >= lo && key <= hi ? ' in' : '') +
        (isStart ? ' start' : '') + (isEnd ? ' end' : '') + (isStart || isEnd ? ' sel' : '');
      cells += '<div class="' + cls + '"><button class="cal-day' + (key === iso(TODAY) ? ' today' : '') +
        '" type="button" data-iso="' + key + '">' + d + '</button></div>';
    }
    return '<div class="cal-month">' +
      '<div class="cal-dow">' + CAL_DOW.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div></div>';
  }

  function renderCal() {
    var y = calAnchor.getFullYear(), m = calAnchor.getMonth();
    var right = new Date(y, m + 1, 1);
    var hint = !pick.from ? 'Select start date' : !pick.to ? 'Select end date' : fmtRange(pick.from, pick.to);
    document.getElementById('date-cal').innerHTML =
      '<div class="cal-head">' +
        '<button class="cal-nav" type="button" data-nav="-1" aria-label="Previous month">' + ARROW + '</button>' +
        '<div class="cal-title">' + MONTHS_LONG[m] + ' ' + y + '</div>' +
        '<div class="cal-title">' + MONTHS_LONG[right.getMonth()] + ' ' + right.getFullYear() + '</div>' +
        '<button class="cal-nav next" type="button" data-nav="1" aria-label="Next month">' + ARROW + '</button>' +
      '</div>' +
      '<div class="cal-months">' + monthGrid(y, m) + monthGrid(right.getFullYear(), right.getMonth()) + '</div>' +
      '<div class="cal-foot">' + hint + '</div>';
  }

  function pickDay(key) {
    if (!pick.from || pick.to) { pick = { from: key, to: null }; hoverIso = null; renderCal(); return; }
    if (key < pick.from) { pick.from = key; renderCal(); return; }
    pick.to = key;
    state.range = 'custom'; state.from = pick.from; state.to = pick.to;
    markRange('custom');
    syncDateLabel();
    Shell.closeAllDropdowns();
    render();
  }

  datePanel.addEventListener('click', function (e) { e.stopPropagation(); });
  datePanel.addEventListener('click', function (e) {
    var item = e.target.closest('.dd-item');
    if (item) {
      var k = item.getAttribute('data-range');
      if (k === 'custom') { openCalendar(); return; }
      state.range = k;
      markRange(k);
      syncDateLabel();
      Shell.closeAllDropdowns();
      render();
      return;
    }
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + Number(nav.getAttribute('data-nav')), 1);
      renderCal();
      return;
    }
    var day = e.target.closest('.cal-day');
    if (day) pickDay(day.getAttribute('data-iso'));
  });
  datePanel.addEventListener('mouseover', function (e) {
    var day = e.target.closest('.cal-day');
    if (!day || !pick.from || pick.to) return;
    var key = day.getAttribute('data-iso');
    if (key === hoverIso) return;
    hoverIso = key;
    renderCal();
  });
  dateTrigger.addEventListener('click', function () { datePanel.classList.remove('cal-mode'); });
  syncDateLabel();

  /* ─── Viewport switcher (prototype aid) ───────────────────────── */
  var vp = document.getElementById('vp-switch');
  var narrowQuery = window.matchMedia('(max-width: 860px)');
  var vpMode = 'auto';
  function applyViewport() {
    var narrow = vpMode === 'mobile' ? true : vpMode === 'desktop' ? false : narrowQuery.matches;
    document.body.classList.toggle('is-narrow', narrow);
    document.body.classList.toggle('force-mobile', vpMode === 'mobile');
    if (Shell.setViewport) Shell.setViewport(vpMode === 'mobile' ? 'mobile' : vpMode === 'desktop' ? 'desktop' : 'auto');
    vp.querySelectorAll('[data-vp]').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-vp') === (vpMode === 'auto' ? (narrow ? 'mobile' : 'desktop') : vpMode));
    });
    renderWeek();
  }
  var rowsSwitch = document.getElementById('rows-switch');
  rowsSwitch.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rows]');
    if (!b) return;
    rowsMode = b.getAttribute('data-rows');
    rowsSwitch.querySelectorAll('[data-rows]').forEach(function (x) { x.classList.toggle('on', x === b); });
    /* Nothing nests in the flat table, so its control goes quiet. */
    document.getElementById('btn-collapse').style.display = rowsMode === 'flat' ? 'none' : '';
    renderGrid();
    syncScrollEdge();
  });

  vp.addEventListener('click', function (e) {
    var b = e.target.closest('[data-vp]');
    if (!b) return;
    vpMode = b.getAttribute('data-vp');
    applyViewport();
  });
  narrowQuery.addEventListener('change', function () { if (vpMode === 'auto') applyViewport(); });

  /* ─── Render ──────────────────────────────────────────────────── */
  var scrollBox = document.querySelector('.grid-card .table-scroll');
  function syncScrollEdge() { scrollBox.classList.toggle('sx-left', scrollBox.scrollLeft > 0); }
  scrollBox.addEventListener('scroll', syncScrollEdge);

  function render() {
    renderGrid();
    renderWeek();
    syncEditBar();
    syncScrollEdge();
    syncCollapseBtn();
  }

  /* ─── Collapse ────────────────────────────────────────────────── */
  gridBody.addEventListener('click', function (e) {
    var row = e.target.closest('[data-key]');
    if (!row || e.target.closest('.hr-input')) return;
    var k = row.getAttribute('data-key');
    collapsed[k] = collapsed[k] !== true;
    renderGrid();
    syncCollapseBtn();
  });
  function allKeys() {
    var keys = [];
    weekTree().forEach(function (site) {
      var sk = 's:' + site.name;
      keys.push(sk);
      site.sups.forEach(function (sup) { keys.push(sk + '|' + sup.name); });
    });
    return keys;
  }
  function syncCollapseBtn() {
    var keys = allKeys();
    document.getElementById('btn-collapse').textContent =
      keys.some(function (k) { return collapsed[k] !== true; }) ? 'Collapse all' : 'Expand all';
  }
  document.getElementById('btn-collapse').addEventListener('click', function () {
    var keys = allKeys();
    var anyOpen = keys.some(function (k) { return collapsed[k] !== true; });
    keys.forEach(function (k) { collapsed[k] = anyOpen; });
    renderGrid();
    syncCollapseBtn();
  });

  /* ─── Edit mode ───────────────────────────────────────────────── */
  function changeCount() { return draft ? Object.keys(draft).length : 0; }
  function syncEditBar() {
    var n = changeCount();
    document.getElementById('edit-status').textContent =
      n === 0 ? 'Editing · no changes yet' : 'Editing · ' + n + ' change' + (n === 1 ? '' : 's');
    document.getElementById('btn-save').disabled = n === 0;
  }
  function enterEdit() {
    state.editing = true; draft = Object.create(null); extraRows = [];
    document.body.classList.add('editing');
    render();
  }
  function exitEdit() {
    state.editing = false; draft = null; extraRows = [];
    document.body.classList.remove('editing');
    render();
  }
  document.getElementById('btn-edit').addEventListener('click', enterEdit);
  document.getElementById('btn-cancel').addEventListener('click', exitEdit);
  document.getElementById('btn-save').addEventListener('click', function () {
    var n = changeCount();
    Object.keys(draft).forEach(function (dk) {
      var at = dk.lastIndexOf('|');
      var key = dk.slice(0, at), date = dk.slice(at + 1), hours = draft[dk];
      for (var i = entries.length - 1; i >= 0; i--) {
        if (entries[i].key === key && entries[i].date === date) entries.splice(i, 1);
      }
      if (hours > 0) entries.push({ date: date, key: key, hours: hours, start: '', finish: '' });
    });
    exitEdit();
    Shell.snackbar(n + ' change' + (n === 1 ? '' : 's') + ' saved to your timesheets.');
  });

  document.addEventListener('input', function (e) {
    var box = e.target.closest('.hr-input');
    if (!box || !draft) return;
    var raw = box.value.trim().replace(',', '.');
    var val = raw === '' ? 0 : Number(raw);
    if (isNaN(val) || val < 0) return;
    draft[box.getAttribute('data-key') + '|' + box.getAttribute('data-date')] = val;
    box.classList.add('changed');
    var caretPos = box.selectionStart;
    var k = box.getAttribute('data-key'), dt = box.getAttribute('data-date');
    renderGrid(); renderWeek(); syncEditBar();
    var again = document.querySelector('.hr-input[data-key="' + k.replace(/"/g, '\\"') + '"][data-date="' + dt + '"]');
    if (again) { again.focus(); try { again.setSelectionRange(caretPos, caretPos); } catch (err) {} }
  });

  document.addEventListener('click', function (e) {
    var head = e.target.closest('[data-dayhead]');
    if (head) {
      var hk = head.getAttribute('data-dayhead');
      dayClosed[hk] = dayClosed[hk] !== true;
      renderWeek();
      return;
    }
    var entry = e.target.closest('[data-entry]');
    if (entry) { openEdit(entry.getAttribute('data-entry'), entry.getAttribute('data-date')); return; }
    var cardAdd = e.target.closest('[data-card-add]');
    if (cardAdd) openAdd(cardAdd.getAttribute('data-card-add'));
  });

  /* ─── Add task: step 1 where and what, step 2 the hours ─────────
     Every field is on screen from the start; the recents underneath are
     a shortcut that fills the same form, not the way in. */
  var addModal = document.getElementById('add-modal');
  var shifts = [];
  var addStep = 1;

  function el(id) { return document.getElementById(id); }

  function renderLevelFields(preset) {
    var site = el('add-site').value, fields = fieldsFor(site);
    el('level-fields').innerHTML = '<div class="lvl-head">Task</div>' + fields.map(function (f, i) {
      var val = preset && preset[i] ? preset[i] : '';
      return '<div class="fld"><label class="fld-label" for="lvl-' + i + '">' + Shell.esc(f.name) +
        (i === 0 ? '<span style="color:var(--error)">*</span>' : ' <span style="color:var(--grey-600);font-weight:400">(optional)</span>') + '</label>' +
        '<select id="lvl-' + i + '" data-lvl="' + i + '"><option value="">Select…</option>' +
        f.values.map(function (v) { return '<option' + (v === val ? ' selected' : '') + '>' + Shell.esc(v) + '</option>'; }).join('') +
        '</select></div>';
    }).join('');
  }

  function fillSupervisors(preset) {
    var site = el('add-site').value;
    var list = SUPS_BY_SITE[site] || [];
    el('add-sup').innerHTML = list.map(function (x) {
      return '<option' + (x === preset ? ' selected' : '') + '>' + Shell.esc(x) + '</option>';
    }).join('');
  }

  /* One timesheet is one day on one site, and it belongs to one
     supervisor. Work the same day on another site and that is a second
     timesheet, with its own supervisor. */
  function supervisorOn(isoDate, site) {
    var found = null;
    entries.forEach(function (e) {
      var m = taskMeta[e.key];
      if (!found && e.date === isoDate && m && m.site === site) found = m.sup;
    });
    return found;
  }
  function syncDayHint() {
    var site = el('add-site').value;
    var locked = supervisorOn(el('add-date').value, site);
    var sel = el('add-sup');
    if (locked) {
      sel.value = locked;
      sel.disabled = true;
      el('date-hint').textContent = 'This day already has a timesheet for ' + site + ' with ' + locked +
        '. One site, one supervisor per day.';
    } else {
      sel.disabled = false;
      el('date-hint').textContent = 'No timesheet for this site yet on this day — one will be created.';
    }
  }

  function renderQuick() {
    var recent = Object.keys(taskMeta).map(function (k) {
      return { key: k, meta: taskMeta[k], when: lastUsed(k) };
    }).sort(function (a, b) { return (b.when || 0) - (a.when || 0); }).slice(0, 4);

    el('quick-tasks').innerHTML = recent.map(function (r) {
      return '<button type="button" data-quick="' + Shell.esc(r.key) + '">' +
        Shell.esc(pathOf(r.meta.levels).split(' | ')[0]) + ' · ' + Shell.esc(r.meta.sup) +
        (r.when ? ' · ' + fmtDay(r.when) : '') + '</button>';
    }).join('');
  }

  function setStep(n) {
    addStep = n;
    el('step-1').hidden = n !== 1;
    el('step-2').hidden = n !== 2;
    el('add-step-label').textContent = n === 1 ? 'Step 1 of 2 · Where and what' : 'Step 2 of 2 · Hours';
    el('add-next').hidden = n !== 1;
    el('add-save').hidden = n !== 2;
    el('add-back').hidden = n !== 2;
  }

  function openAdd(dayIso) {
    var ds = days();
    el('add-date').innerHTML = ds.map(function (d) {
      return '<option value="' + iso(d) + '">' + DOW[d.getDay()] + ' ' + fmtDay(d) + '</option>';
    }).join('');
    el('add-date').value = dayIso || (ds.map(iso).indexOf(iso(TODAY)) !== -1 ? iso(TODAY) : iso(ds[0]));

    el('add-site').innerHTML = SITES.map(function (x) { return '<option>' + Shell.esc(x) + '</option>'; }).join('');
    fillSupervisors(supervisorOn(el('add-date').value, el('add-site').value));
    renderLevelFields(null);
    renderQuick();
    syncDayHint();

    shifts = [{ start: '', finish: '', hours: '' }];
    renderShifts();
    setStep(1);
    addModal.classList.add('open');
  }

  el('add-date').addEventListener('change', function () {
    fillSupervisors(supervisorOn(this.value, el('add-site').value));
    syncDayHint();
  });
  el('add-site').addEventListener('change', function () {
    fillSupervisors(supervisorOn(el('add-date').value, this.value));
    renderLevelFields(null);
    syncDayHint();
  });

  el('quick-tasks').addEventListener('click', function (e) {
    var b = e.target.closest('[data-quick]');
    if (!b) return;
    var m = taskMeta[b.getAttribute('data-quick')];
    el('add-site').value = m.site;
    var locked = supervisorOn(el('add-date').value, m.site);
    fillSupervisors(locked || m.sup);
    renderLevelFields(m.levels);
    syncDayHint();
  });

  /* ─── Shifts ──────────────────────────────────────────────────── */
  function parseTime(v) {
    var m = /^(\d{1,2})[:.]?(\d{2})?$/.exec(v.trim());
    if (!m) return null;
    return Number(m[1]) * 60 + Number(m[2] || 0);
  }
  function shiftHours(sh) {
    var a = parseTime(sh.start), b = parseTime(sh.finish);
    if (a == null || b == null) return sh.hours === '' ? 0 : Number(sh.hours) || 0;
    var mins = b - a;
    if (mins <= 0) mins += 24 * 60;                 // finished after midnight
    return Math.round((mins / 60) * 100) / 100;
  }
  function shiftRows(list) {
    return list.map(function (sh, i) {
      return '<div class="shift" data-shift="' + i + '">' +
        '<div><label class="fld-label">Start</label><input type="text" placeholder="07:00" data-f="start" value="' + Shell.esc(sh.start) + '" /></div>' +
        '<div><label class="fld-label">Finish</label><input type="text" placeholder="19:00" data-f="finish" value="' + Shell.esc(sh.finish) + '" /></div>' +
        '<div><label class="fld-label">Hours</label><input type="text" inputmode="decimal" data-f="hours" value="' + Shell.esc(sh.hours) + '" /></div>' +
        (list.length > 1
          ? '<button class="shift-drop" type="button" data-drop="' + i + '" aria-label="Remove shift"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>'
          : '<span></span>') +
      '</div>';
    }).join('');
  }
  function totalOf(list) { return list.reduce(function (n, sh) { return n + shiftHours(sh); }, 0); }

  function renderShifts() {
    var d = fromIso(el('add-date').value);
    el('shift-sub').innerHTML = 'Record the hours for <b>' + DOW[d.getDay()] + ' ' + fmtDay(d) +
      '</b>. Leave the times blank if you only record totals.';
    el('shifts').innerHTML = shiftRows(shifts);
    el('shift-total').textContent = fmtHours(totalOf(shifts));
  }
  function wireShifts(boxId, totalId, listFor, redraw) {
    el(boxId).addEventListener('input', function (e) {
      var row = e.target.closest('[data-shift]');
      if (!row) return;
      var list = listFor();
      var i = Number(row.getAttribute('data-shift')), f = e.target.getAttribute('data-f');
      list[i][f] = e.target.value;
      if (f !== 'hours') {
        var h = shiftHours(list[i]);
        if (h) { list[i].hours = fmtHours(h); row.querySelector('[data-f="hours"]').value = fmtHours(h); }
      }
      el(totalId).textContent = fmtHours(totalOf(list));
    });
    el(boxId).addEventListener('click', function (e) {
      var drop = e.target.closest('[data-drop]');
      if (!drop) return;
      listFor().splice(Number(drop.getAttribute('data-drop')), 1);
      redraw();
    });
  }
  wireShifts('shifts', 'shift-total', function () { return shifts; }, renderShifts);
  el('add-shift').addEventListener('click', function () {
    shifts.push({ start: '', finish: '', hours: '' });
    renderShifts();
  });

  /* ─── Edit an entry ───────────────────────────────────────────────
     The same sheet as adding, opened on what is already there: the task
     for context, its shifts to change, and a way to take the day off. */
  var editSheet = document.getElementById('edit-sheet');
  var editShifts = [];
  var editCtx = null;        // { key, date }

  function renderEditShifts() {
    el('edit-shifts').innerHTML = shiftRows(editShifts);
    el('edit-total').textContent = fmtHours(totalOf(editShifts));
  }
  wireShifts('edit-shifts', 'edit-total', function () { return editShifts; }, renderEditShifts);
  el('edit-add-shift').addEventListener('click', function () {
    editShifts.push({ start: '', finish: '', hours: '' });
    renderEditShifts();
  });

  function openEdit(key, date) {
    editCtx = { key: key, date: date };
    var m = taskMeta[key], d = fromIso(date);
    el('edit-when').textContent = DOW[d.getDay()] + ' ' + fmtDay(d) + ' ' + d.getFullYear();
    el('edit-task').innerHTML = '<b>' + Shell.esc(pathOf(m.levels) || 'No task') + '</b><br>' +
      Shell.esc(m.sup) + ' · ' + Shell.esc(m.site);

    editShifts = entries.filter(function (e) { return e.key === key && e.date === date; })
                        .map(function (e) { return { start: e.start || '', finish: e.finish || '', hours: fmtHours(e.hours) }; });
    if (!editShifts.length) editShifts = [{ start: '', finish: '', hours: '' }];
    renderEditShifts();
    editSheet.classList.add('open');
  }

  function dropEntries(key, date) {
    for (var i = entries.length - 1; i >= 0; i--) {
      if (entries[i].key === key && entries[i].date === date) entries.splice(i, 1);
    }
  }

  el('edit-save').addEventListener('click', function () {
    var total = totalOf(editShifts);
    if (!total) { Shell.snackbar('Add some hours, or remove the task.'); return; }
    dropEntries(editCtx.key, editCtx.date);
    editShifts.forEach(function (sh) {
      var h = shiftHours(sh);
      if (h > 0) entries.push({ date: editCtx.date, key: editCtx.key, hours: h, start: sh.start, finish: sh.finish });
    });
    editSheet.classList.remove('open');
    render();
    Shell.snackbar('Saved — ' + fmtHours(total) + ' h.');
  });

  el('edit-delete').addEventListener('click', function () {
    dropEntries(editCtx.key, editCtx.date);
    editSheet.classList.remove('open');
    render();
    Shell.snackbar('Task removed from this day.');
  });

  editSheet.addEventListener('click', function (e) {
    if (e.target === editSheet || e.target.closest('[data-close]')) editSheet.classList.remove('open');
  });

  /* ─── Steps ───────────────────────────────────────────────────── */
  function currentLevels() {
    return Array.prototype.map.call(el('level-fields').querySelectorAll('[data-lvl]'), function (sel) { return sel.value; });
  }
  el('add-next').addEventListener('click', function () {
    var levels = currentLevels();
    if (!levels[0]) {
      Shell.snackbar('Choose the ' + fieldsFor(el('add-site').value)[0].name.toLowerCase() + ' first.');
      return;
    }
    renderShifts();
    setStep(2);
  });
  el('add-back').addEventListener('click', function () { setStep(1); });

  el('add-save').addEventListener('click', function () {
    var total = shifts.reduce(function (n, sh) { return n + shiftHours(sh); }, 0);
    if (!total) { Shell.snackbar('Add some hours first.'); return; }
    var date = el('add-date').value, site = el('add-site').value, sup = el('add-sup').value;
    var levels = currentLevels();
    var k = keyOf(site, sup, levels);
    taskMeta[k] = { site: site, sup: sup, levels: levels };
    shifts.forEach(function (sh) {
      var h = shiftHours(sh);
      if (h > 0) entries.push({ date: date, key: k, hours: h, start: sh.start, finish: sh.finish });
    });
    addModal.classList.remove('open');
    state.selDay = date;
    render();
    Shell.snackbar(fmtHours(total) + ' h added to ' + DOW[fromIso(date).getDay()] + ' ' + fmtDay(fromIso(date)) + '.');
  });

  addModal.addEventListener('click', function (e) {
    if (e.target === addModal || e.target.closest('[data-close]')) addModal.classList.remove('open');
  });
  document.getElementById('btn-new-task').addEventListener('click', function () { openAdd(null); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (editSheet.classList.contains('open')) { editSheet.classList.remove('open'); return; }
    if (addModal.classList.contains('open')) { addModal.classList.remove('open'); return; }
    if (state.editing) exitEdit();
  });

  render();
  applyViewport();
})();
</script>
</body>
</html>
