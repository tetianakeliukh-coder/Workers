      var k = iso(d), today = k === iso(TODAY);
      var shown = dayTotal(k, true), all = dayTotal(k, false), over = all > DAY_CAP;
      var st = sheetStatus(k);
      return '<th class="col-day' + (today ? ' tdy' : '') + '"' +
        ' data-tip="' + Shell.esc(st) + (STATUS_META[st] && STATUS_META[st].locked
          ? ' — hours can no longer be changed' : '') +
        (over ? '. ' + fmtHours(all) + ' h booked — more than ' + DAY_CAP : '') + '">' +
        '<span class="day-head' + (today ? ' is-today' : '') + '">' +
        '<span class="dnum">' + DOW[d.getDay()] + ', ' + fmtDay(d) + '</span>' +
        '<span class="dtot' + (over ? ' over' : '') + '">' + stMark(k) +
          (shown > 0 ? fmtHours(shown) + ' h' : '<span class="cell-empty">&mdash;</span>') +
        '</span></span></th>';
    }).join('');
  }
  /* The Total column is the same shape turned on its side. */
  function totalHeadCell(ds) {
    var n = ds.reduce(function (a, d) { return a + dayTotal(iso(d), true); }, 0);
    return '<th class="col-total"><span class="day-head">' +
      '<span class="dow">Total</span><span class="dnum">&nbsp;</span>' +
      '<span class="dtot">' + fmtHours(n) + ' h</span></span></th>';
  }

  /* Flat: site, supervisor and task each get their own column, and a value
     is printed only when it changes — the hierarchy without the nesting. */
  function renderFlat() {
    var ds = days();
    gridCols.innerHTML = '<col style="width:' + wPx('site') + '" /><col style="width:' + wPx('sup') + '" />' +
      '<col style="width:' + wPx('task') + '" />' +
      ds.map(function () { return '<col style="width:' + DAY_W + 'px" />'; }).join('') +
      '<col style="width:96px" />' + (state.editing ? '<col style="width:126px" />' : '');

    gridHead.innerHTML = '<tr>' +
      '<th class="col-site" data-w="site">Site' + Shell.colGrip() + '</th>' +
      '<th class="col-sup" data-w="sup">Supervisor' + Shell.colGrip() + '</th>' +
      '<th class="col-task" data-w="task">Task' + Shell.colGrip() + '</th>' +
      dayHeadCells(ds) + totalHeadCell(ds) + actHead() + '</tr>';
    syncStickyX();

    /* Every site + supervisor opens with its own summary line — how many tasks
       sit under it and what they add up to — and the tasks follow beneath. */
    var rows = [], count = 0, first = true;
    weekTree().forEach(function (site) {
      site.sups.forEach(function (sup) {
        var n = sup.tasks.length;
        var fk = flatKey(site.name, sup.name), open = collapsed[fk] !== true;
        rows.push('<tr class="row-flat row-summary' + (open ? '' : ' collapsed') + (first ? '' : ' group-top') +
            '" data-key="' + Shell.esc(fk) + '">' +
          '<td class="col-site" data-tip="Site &mdash; ' + Shell.esc(site.name) + '">' +
            '<span class="tree">' + caret() + '<span class="name">' + Shell.esc(site.name) + '</span></span></td>' +
          '<td class="col-sup" data-tip="Supervisor &mdash; ' + Shell.esc(sup.name) + '">' + Shell.esc(sup.name) + '</td>' +
          '<td class="col-task"><span class="count-pill">' + n + ' task' + (n === 1 ? '' : 's') + '</span></td>' +
          ds.map(function (d) { return dayCellPlain(sumRow(sup.tasks, iso(d)), iso(d)); }).join('') +
          '<td class="col-total">' + fmtHours(ds.reduce(function (acc, d) { return acc + sumRow(sup.tasks, iso(d)); }, 0)) + '</td>' +
          actCell(grpAdd(site.name, sup.name)) +
        '</tr>');
        first = false; count++;
        if (!open) return;

        sup.tasks.forEach(function (t) {
          rows.push('<tr class="row-flat' + (isJustAdded(t.key) ? ' just-added' : '') + '">' +
            '<td class="col-site"></td><td class="col-sup"></td>' +
            '<td class="col-task" data-tip="Task &mdash; ' + Shell.esc(t.label) + '">' + Shell.esc(t.label) + '</td>' +
            ds.map(function (d) { return cellHtml(hoursFor(t.key, iso(d)), t.key, iso(d)); }).join('') +
            '<td class="col-total">' + fmtHours(ds.reduce(function (acc, d) { return acc + hoursFor(t.key, iso(d)); }, 0)) + '</td>' +
            actCell(rowDrop(t.key)) +
          '</tr>');
          count++;
        });
      });
    });

    if (!rows.length) {
      rows.push('<tr><td colspan="' + (ds.length + 4 + (state.editing ? 1 : 0)) + '" style="color:var(--grey-600)">No hours recorded this week.</td></tr>');
    }
    gridBody.innerHTML = rows.join('');

    gridFoot.innerHTML = '';
    document.getElementById('grid-count').textContent = 'Displaying ' + count + ' row' + (count === 1 ? '' : 's');
  }

  function renderGrid() {
    if (rowsMode === 'flat') return renderFlat();
    var ds = days();
    gridCols.innerHTML = '<col style="width:' + wPx('label') + '" />' +
      ds.map(function () { return '<col style="width:' + DAY_W + 'px" />'; }).join('') +
      '<col style="width:96px" />' + (state.editing ? '<col style="width:126px" />' : '');

    gridHead.innerHTML = '<tr><th class="col-label" data-w="label">Breakdown' + Shell.colGrip() + '</th>' +
      dayHeadCells(ds) + totalHeadCell(ds) + actHead() + '</tr>';

    var tree = weekTree(), rows = [], shown = 0;
    tree.forEach(function (site) {
      var all = tasksOfSite(site), siteKey = 's:' + site.name;
      var siteOpen = collapsed[siteKey] !== true;
      rows.push('<tr class="row-site' + (siteOpen ? '' : ' collapsed') + '" data-key="' + Shell.esc(siteKey) + '">' +
        '<td class="col-label" data-tip="Site &mdash; ' + Shell.esc(site.name) + '"><span class="tree">' + caret() + ICO_SITE +
          '<span class="name">' + Shell.esc(site.name) + '</span></span></td>' +
        ds.map(function (d) { return cellHtml(sumRow(all, iso(d))); }).join('') +
        '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(all, iso(d)); }, 0)) + '</td>' +
        actCell(grpAdd(site.name, '')) + '</tr>');
      shown++;
      if (!siteOpen) return;

      site.sups.forEach(function (sup) {
        var supKey = siteKey + '|' + sup.name, supOpen = collapsed[supKey] !== true;
        rows.push('<tr class="row-sup' + (supOpen ? '' : ' collapsed') + '" data-key="' + Shell.esc(supKey) + '">' +
          '<td class="col-label" data-tip="Supervisor &mdash; ' + Shell.esc(sup.name) + '"><span class="tree" style="padding-left:20px">' + caret() + ICO_SUP +
            '<span class="name">' + Shell.esc(sup.name) + '</span></span></td>' +
          ds.map(function (d) { return cellHtml(sumRow(sup.tasks, iso(d))); }).join('') +
          '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(sup.tasks, iso(d)); }, 0)) + '</td>' +
          actCell(grpAdd(site.name, sup.name)) + '</tr>');
        shown++;
        if (!supOpen) return;

        sup.tasks.forEach(function (t) {
          rows.push('<tr class="row-task' + (isJustAdded(t.key) ? ' just-added' : '') + '">' +
            '<td class="col-label" data-tip="Task &mdash; ' + Shell.esc(t.label) + '">' + Shell.esc(t.label) + '</td>' +
            ds.map(function (d) { return cellHtml(hoursFor(t.key, iso(d)), t.key, iso(d)); }).join('') +
            '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + hoursFor(t.key, iso(d)); }, 0)) + '</td>' +
            actCell(rowDrop(t.key)) + '</tr>');
          shown++;
        });
      });
    });

    if (!rows.length) {
      rows.push('<tr><td class="col-label" colspan="' + (ds.length + 2 + (state.editing ? 1 : 0)) + '" style="color:var(--grey-600)">' +
        'No hours recorded this week.</td></tr>');
    }
    gridBody.innerHTML = rows.join('');

    gridFoot.innerHTML = '';
    document.getElementById('grid-count').textContent = 'Displaying ' + shown + ' row' + (shown === 1 ? '' : 's');
  }

  /* ─── Mobile list ─────────────────────────────────────────────────
     Everything in the week as one list, broken by date. Each date is a
     timesheet and collapses to its total; tapping an entry opens the
     edit sheet. */
  var dayList = document.getElementById('day-list');
  var weekTotalEl = document.getElementById('week-total');
  var dayClosed = Object.create(null);

  function entriesOn(isoDate) {
    var all = [];
    weekTree().forEach(function (s) { all = all.concat(tasksOfSite(s)); });
    return all.map(function (t) { return { task: t, hours: hoursFor(t.key, isoDate) }; })
              .filter(function (r) { return r.hours > 0; });
  }

  var CHEV = '<svg class="entry-go" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderWeek() {
    var ds = days(), weekTotal = 0;
    ds.forEach(function (d) {
      Object.keys(taskMeta).forEach(function (k) { weekTotal += hoursFor(k, iso(d)); });
    });
    weekTotalEl.innerHTML = 'Total <b>' + fmtHours(weekTotal) + ' h</b>';

    /* Most recent first — you fill in the day you just worked. */
    var shown = ds.slice().reverse().filter(function (d) {
      return entriesOn(iso(d)).length || iso(d) === iso(TODAY);
    });

    dayList.innerHTML = shown.map(function (d) {
      var key = iso(d), rows = entriesOn(key);
      var total = rows.reduce(function (n, r) { return n + r.hours; }, 0);
      var closed = dayClosed[key] === true;

      var body = rows.length ? rows.map(function (r) {
        return '<button class="entry" type="button" data-entry="' + Shell.esc(r.task.key) + '" data-date="' + key + '">' +
          '<span class="entry-main">' +
            '<span class="entry-code">' + Shell.esc(taskTitle(r.task.meta)) + '</span>' +
            '<span class="entry-sub">' + Shell.esc(taskRest(r.task.meta)) + '</span>' +
            '<span class="entry-where">' + Shell.esc(r.task.meta.sup) + ' · ' + Shell.esc(r.task.meta.site) + '</span>' +
          '</span>' +
          '<span class="entry-hrs">' + fmtHours(r.hours) + ' h</span>' + CHEV +
        '</button>';
      }).join('') : '<div class="day-empty">No hours recorded.</div>';

      return '<div class="day-group' + (closed ? ' closed' : '') + '">' +
        '<button class="dgroup-head" type="button" data-dayhead="' + key + '">' +
          '<span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '<span class="dt">' + DOW[d.getDay()] + ' ' + fmtDay(d) + '</span>' +
          (key === iso(TODAY) ? '<span class="today-chip">Today</span>' : '') +
          '<span class="tot">' + fmtHours(total) + ' h</span>' +
        '</button>' +
        '<div class="day-rows">' + body +
          '<button class="btn-ghost day-add" type="button" data-card-add="' + key + '">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
            'Add task</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ─── Date filter ─────────────────────────────────────────────────
     The same control as Supervisor Timesheets, in the same place — one date
     picker across both screens. The grid draws a column per day in range. */
  var datePanel = document.getElementById('date-dd-panel');
  var dateValue = document.getElementById('date-dd-value');
  var dateTrigger = document.querySelector('#date-dd .dd-trigger');
  var CHECK = '<svg class="dd-check" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var DD_CHEV = '<svg class="dd-chev" viewBox="0 0 12 12" fill="none"><path d="M4.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  /* A timesheet week is the unit people work in, so the quick ranges are
     weeks — anything else is a custom range. */
  var QUICK = [
    { k: 'week',     label: 'Current week' },
    { k: 'lastweek', label: 'Last week' }
  ];

  function daysAgoIso(n) { return iso(addDays(TODAY, -n)); }
  /* n weeks back: Monday to Sunday. */
  function weekStartIso(n) { return iso(addDays(mondayOf(TODAY), -7 * n)); }
  function weekEndIso(n) { return iso(addDays(mondayOf(TODAY), -7 * n + 6)); }

  function rangeBounds() {
    if (state.range === 'week')     return { from: weekStartIso(0), to: weekEndIso(0) };
    if (state.range === 'lastweek') return { from: weekStartIso(1), to: weekEndIso(1) };
    if (state.range === 'custom') return { from: state.from, to: state.to };
    return null;
  }

  function fmtRange(from, to) {
    if (from === to) return fmtDay(fromIso(from)) + ' ' + from.slice(0, 4);
    var a = fmtDay(fromIso(from)), b = fmtDay(fromIso(to));
    return a + ' – ' + b + ' ' + to.slice(0, 4);
  }

  function markRange(k) {
    datePanel.querySelectorAll('#date-quick .dd-item').forEach(function (i) {
      i.classList.toggle('active', i.getAttribute('data-range') === k);
    });
  }
  function syncDateLabel() {
    if (state.range === 'custom') { dateValue.textContent = fmtRange(state.from, state.to); return; }
    dateValue.textContent = QUICK.filter(function (r) { return r.k === state.range; })[0].label;
  }

  datePanel.innerHTML =
    '<div class="dd-view" id="date-quick">' +
      QUICK.map(function (r) {
        return '<button class="dd-item' + (r.k === state.range ? ' active' : '') + '" type="button" data-range="' + r.k + '">' +
          CHECK + r.label + '</button>';
      }).join('') +
      '<button class="dd-item" type="button" data-range="custom">' + CHECK + 'Custom' + DD_CHEV + '</button>' +
    '</div><div class="cal" id="date-cal"></div>';

  /* ─── Custom range calendar ───────────────────────────────────── */
  var CAL_DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var calAnchor = null, pick = { from: null, to: null }, hoverIso = null;
  var ARROW = '<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function openCalendar() {
    var base = (state.range === 'custom' && state.from) ? fromIso(state.from) : new Date(TODAY.getTime());
    calAnchor = new Date(base.getFullYear(), base.getMonth() - 1, 1);
    pick = state.range === 'custom' ? { from: state.from, to: state.to } : { from: null, to: null };
    hoverIso = null;
    datePanel.classList.add('cal-mode');
    renderCal();
  }

  function monthGrid(y, m) {
    var lead = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate();
    var lo = pick.from, hi = pick.to || (lo && hoverIso && hoverIso > lo ? hoverIso : null);
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell"></div>';
    for (var d = 1; d <= count; d++) {
      var key = iso(new Date(y, m, d));
      var isStart = !!lo && key === lo, isEnd = !!hi && key === hi;
      var cls = 'cal-cell' + (lo && hi && key >= lo && key <= hi ? ' in' : '') +
        (isStart ? ' start' : '') + (isEnd ? ' end' : '') + (isStart || isEnd ? ' sel' : '');
      cells += '<div class="' + cls + '"><button class="cal-day' + (key === iso(TODAY) ? ' today' : '') +
        '" type="button" data-iso="' + key + '">' + d + '</button></div>';
    }
    return '<div class="cal-month">' +
      '<div class="cal-dow">' + CAL_DOW.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div></div>';
  }

  function renderCal() {
    var y = calAnchor.getFullYear(), m = calAnchor.getMonth();
    var right = new Date(y, m + 1, 1);
    var hint = !pick.from ? 'Select start date' : !pick.to ? 'Select end date' : fmtRange(pick.from, pick.to);
    document.getElementById('date-cal').innerHTML =
      '<div class="cal-head">' +
        '<button class="cal-nav" type="button" data-nav="-1" aria-label="Previous month">' + ARROW + '</button>' +
        '<div class="cal-title">' + MONTHS_LONG[m] + ' ' + y + '</div>' +
        '<div class="cal-title">' + MONTHS_LONG[right.getMonth()] + ' ' + right.getFullYear() + '</div>' +
        '<button class="cal-nav next" type="button" data-nav="1" aria-label="Next month">' + ARROW + '</button>' +
      '</div>' +
      '<div class="cal-months">' + monthGrid(y, m) + monthGrid(right.getFullYear(), right.getMonth()) + '</div>' +
      '<div class="cal-foot">' + hint + '</div>';
  }

  function pickDay(key) {
    if (!pick.from || pick.to) { pick = { from: key, to: null }; hoverIso = null; renderCal(); return; }
    if (key < pick.from) { pick.from = key; renderCal(); return; }
    pick.to = key;
    state.range = 'custom'; state.from = pick.from; state.to = pick.to;
    markRange('custom');
    syncDateLabel();
    Shell.closeAllDropdowns();
    render();
  }

  datePanel.addEventListener('click', function (e) { e.stopPropagation(); });
  datePanel.addEventListener('click', function (e) {
    var item = e.target.closest('.dd-item');
    if (item) {
      var k = item.getAttribute('data-range');
      if (k === 'custom') { openCalendar(); return; }
      state.range = k;
      markRange(k);
      syncDateLabel();
      Shell.closeAllDropdowns();
      render();
      return;
    }
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + Number(nav.getAttribute('data-nav')), 1);
      renderCal();
      return;
    }
    var day = e.target.closest('.cal-day');
    if (day) pickDay(day.getAttribute('data-iso'));
  });
  datePanel.addEventListener('mouseover', function (e) {
    var day = e.target.closest('.cal-day');
    if (!day || !pick.from || pick.to) return;
    var key = day.getAttribute('data-iso');
    if (key === hoverIso) return;
    hoverIso = key;
    renderCal();
  });
  dateTrigger.addEventListener('click', function () { datePanel.classList.remove('cal-mode'); });
  syncDateLabel();

  /* The phone header carries its own pair of buttons. */
  function shownDayKeys() {
    return [].slice.call(document.querySelectorAll('#day-list [data-dayhead]'))
             .map(function (b) { return b.getAttribute('data-dayhead'); });
  }
  function syncMobileActions() {
    var collapse = document.getElementById('m-collapse');
    var anyOpen = shownDayKeys().some(function (k) { return dayClosed[k] !== true; });
    collapse.innerHTML = anyOpen ? ICO_COLLAPSE + 'Collapse all' : ICO_EXPAND + 'Expand all';
    document.querySelector('.m-actions').style.gridTemplateColumns = '1fr 1fr';
  }
  /* The phone shows a list of days, so this folds the days — the grid it
     used to drive is not even on screen here. */
  document.getElementById('m-collapse').addEventListener('click', function () {
    var keys = shownDayKeys();
    var anyOpen = keys.some(function (k) { return dayClosed[k] !== true; });
    keys.forEach(function (k) { dayClosed[k] = anyOpen; });
    renderWeek();
    syncMobileActions();
  });
  document.getElementById('m-add').addEventListener('click', function () { openAdd(null); });

  /* ─── Search ──────────────────────────────────────────────────── */
  var searchEl = document.getElementById('search');
  var clearBtn = document.getElementById('search-clear');
  searchEl.addEventListener('input', function () {
    state.query = this.value.trim();
    clearBtn.classList.toggle('visible', this.value.length > 0);
    render();
  });
  clearBtn.addEventListener('click', function () {
    searchEl.value = '';
    state.query = '';
    clearBtn.classList.remove('visible');
    searchEl.focus();
    render();
  });

  /* ─── Viewport switcher (prototype aid) ───────────────────────── */
  var vp = document.getElementById('vp-switch');
  var narrowQuery = window.matchMedia('(max-width: 860px)');
  var vpMode = 'auto';
  /* The date control is one element; on a phone it moves under the buttons
     and goes full width rather than being duplicated. */
  var dateDD = document.getElementById('date-dd');
  var headerActions = document.querySelector('.header-actions');
  var mDate = document.getElementById('m-date');

  function applyViewport() {
    var narrow = vpMode === 'mobile' ? true : vpMode === 'desktop' ? false : narrowQuery.matches;
    document.body.classList.toggle('is-narrow', narrow);
    document.body.classList.toggle('force-mobile', vpMode === 'mobile');
    if (narrow && dateDD.parentNode !== mDate) mDate.appendChild(dateDD);
    if (!narrow && dateDD.parentNode !== headerActions) headerActions.insertBefore(dateDD, headerActions.firstChild);
    syncMobileActions();
    if (Shell.setViewport) Shell.setViewport(vpMode === 'mobile' ? 'mobile' : vpMode === 'desktop' ? 'desktop' : 'auto');
    vp.querySelectorAll('[data-vp]').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-vp') === (vpMode === 'auto' ? (narrow ? 'mobile' : 'desktop') : vpMode));
    });
    renderWeek();
  }
  vp.addEventListener('click', function (e) {
    var b = e.target.closest('[data-vp]');
    if (!b) return;
    vpMode = b.getAttribute('data-vp');
    applyViewport();
  });
  narrowQuery.addEventListener('change', function () { if (vpMode === 'auto') applyViewport(); });

  /* ─── Render ──────────────────────────────────────────────────── */
  var scrollBox = document.querySelector('.grid-card .table-scroll');
  function syncScrollEdge() { scrollBox.classList.toggle('sx-left', scrollBox.scrollLeft > 0); }
  scrollBox.addEventListener('scroll', syncScrollEdge);

  function render() {
    renderGrid();
    renderWeek();
    syncEditBar();
    syncScrollEdge();
    syncCollapseBtn();
    syncMobileActions();
  }

  /* ─── Collapse ────────────────────────────────────────────────── */
  /* The chevron folds the group, not the whole row: a row that is also
     a button means every stray click on a name makes the table jump. */
  gridBody.addEventListener('click', function (e) {
    var hit = e.target.closest('.caret');
    if (!hit) return;
    var row = hit.closest('[data-key]');
    if (!row) return;
    var k = row.getAttribute('data-key');
    collapsed[k] = collapsed[k] !== true;
    render();
    syncCollapseBtn();
  });
  /* Flat folds at the one level it has — the site + supervisor summary —
     so its keys live apart from the tree's. */
  function flatKey(site, sup) { return 'f:' + site + '|' + sup; }

  function allKeys() {
    var keys = [];
    weekTree().forEach(function (site) {
      var sk = 's:' + site.name;
      if (rowsMode !== 'flat') keys.push(sk);
      site.sups.forEach(function (sup) {
        keys.push(rowsMode === 'flat' ? flatKey(site.name, sup.name) : sk + '|' + sup.name);
      });
    });
    return keys;
  }

  /* Collapse points the chevrons inward, expand points them out. */
  var ICO_COLLAPSE = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
    '<path d="M4.7 2.7L8 6l3.3-3.3M4.7 13.3L8 10l3.3 3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderStack() {

    /* Either half answers it, so neither is named: "work order" would be
       wrong advice to anyone about to pick a card instead. */
    if (addSite() && !allPicked().length) missing.push('task');
    el('add-go').disabled = missing.length > 0;
    el('add-next').disabled = !addSite() || !addSup();
    /* On step one only the step-one answers are outstanding. */
    var shown = (!addCtx && addStep === 1)
      ? missing.filter(function (m) { return m !== 'task'; })
      : missing;
    el('add-need').textContent = shown.length
      ? 'Still to choose: ' + shown.join(', ') : '';
  }

  /* Everything booked before that still matches what has been filled in,
     most recent first. Each answer makes the list a shorter, more exact
     version of itself; with nothing filled in it is simply the last five
     tasks worked on. */
  /* A site whose naming field repeats — Olympic Dam names tasks by work
     order — hands two cards the same heading, and the thing that tells
     them apart ends up in the grey line. Where a heading would be shared,
     the first level that actually differs is promoted into it. */
  function nameCards(list) {
    var byTitle = Object.create(null);
    list.forEach(function (r) {
      r.cardTitle = taskTitle(r.meta);
      r.cardExtra = -1;
      (byTitle[r.cardTitle] = byTitle[r.cardTitle] || []).push(r);
    });
    Object.keys(byTitle).forEach(function (t) {
      var group = byTitle[t];
      if (group.length < 2) return;
      var depth = 0;
      group.forEach(function (r) { depth = Math.max(depth, r.meta.levels.length); });
      for (var i = 0; i < depth; i++) {
        var vals = group.map(function (r) { return r.meta.levels[i] || ''; });
        var differs = vals.some(function (v) { return v !== vals[0]; });
        if (!differs) continue;
        group.forEach(function (r, k) {
          if (!vals[k]) return;
          r.cardTitle = t + ' · ' + vals[k];
          r.cardExtra = i;
        });
        return;
      }
    });
  }

  /* Everything booked at this site and supervisor before, most recent
     first — the list a block offers as a shortcut to filling itself in. */
  function recentFor() {
    var site = addSite(), sup = addSup();
    var q = (el('task-q').value || '').trim().toLowerCase();
    var recent = Object.keys(taskMeta).map(function (k) {
      return { key: k, meta: taskMeta[k], when: lastUsed(k) };
    }).filter(function (r) { return r.when; })
      .filter(function (r) { return !site || r.meta.site === site; })
      .filter(function (r) { return !sup || r.meta.sup === sup; })
      /* With a site's whole history on the list, finding one is a search —
         but a row that is already ticked is never filtered out of it. */
      .filter(function (r) {
        return ticks[keyOf(site, sup || supervisorFor(site), r.meta.levels)] ||
          !q || pathOf(r.meta.levels).toLowerCase().indexOf(q) !== -1;
      })
      .sort(function (a, b) { return (b.when || 0) - (a.when || 0); });
    /* Ticked first, so a long list still shows what has been chosen. */
    var on = function (r) { return ticks[keyOf(site, sup || supervisorFor(site), r.meta.levels)] ? 0 : 1; };
    recent.sort(function (a, b) { return on(a) - on(b); });
    recent = recent.slice(0, 60);
    nameCards(recent);
    recentCache = recent;
    return recent;
  }

  /* A site has one supervisor at a time, so the supervisor is looked up
     from the work already booked there rather than asked for. */
  function supervisorFor(site) {
    var found = null;
    entries.slice().reverse().forEach(function (e) {
      var m = taskMeta[e.key];
      if (!found && m && m.site === site) found = m.sup;
    });
    return found || (SUPS_BY_SITE[site] || [])[0];
  }

  /* The row lands with no hours and the cell editor opens on it at once,
     which says "fill in the days" better than a sentence could. */
  function syncDayHint() {}

  var addOnDay = null;      // set when the dialog was opened from a day
  var addCtx = null;        // set when it was opened from a group row

  /* ctx is the group the add was started from: { site, sup }. With one,
     the site is settled and only the task is still open. */
  function openAdd(dayIso, ctx) {
    addOnDay = dayIso || null;
    addCtx = ctx || null;
    /* Started from a site row, the supervisor is not chosen but it is not
       unknown either — the row will go to the same one the site's other
       tasks go to, so it is stated rather than left to be discovered. */
    if (addCtx && !addCtx.sup) addCtx.sup = supervisorFor(addCtx.site) || '';
    el('nt-site').innerHTML = '<option value="">Select…</option>' +
      SITES.map(function (x) { return '<option>' + Shell.esc(x) + '</option>'; }).join('');
    el('nt-site').value = addCtx ? addCtx.site : '';
    renderSups();
    if (addCtx) el('nt-sup').value = addCtx.sup || '';

    el('nt-sup').disabled = !el('nt-site').value;

    cards = []; ticks = Object.create(null);
    editing = { levels: [] };
    el('task-q').value = '';
    addStep = 1;
    sync();
    el('add-title').textContent = 'Add a task';
    addModal.classList.add('open');
  }

  /* One pass after any answer changes: the list and the form are two
     views of one set of picks, so neither is updated on its own. */
  function sync() {
    renderStack();
    syncDayHint();
    syncVariant();
    syncAddGo();
  }

  el('nt-site').addEventListener('change', function () {
    renderSups();
    /* Tasks belong to a site, so changing it empties what was set up. */
    cards = []; ticks = Object.create(null);
    editing = { levels: [] };
    sync();
  });
  el('nt-sup').addEventListener('change', sync);
  el('add-next').addEventListener('click', function () { addStep = 2; sync(); });
  el('add-sum-change').addEventListener('click', function () { addStep = 1; sync(); });

  /* Answering a field moves the focus to the next one, so a task can be
     named without the hand leaving the keyboard — and nothing folds
     underneath it while it is still typing. */
  el('tfields').addEventListener('change', function (e) {
    var sel = e.target.closest('[data-lvl]');
    if (!sel) return;
    var i = Number(sel.getAttribute('data-lvl'));
    editing.levels[i] = sel.value;
    /* Answering an earlier field invalidates the ones under it. */
    editing.levels.length = i + 1;
    sync();
    var next = el('tfields').querySelector('#nf' + (i + 1));
    if (next) next.focus();
  });

  /* Ticking a row in the list, and taking one back out of it. A task set
     up here is unticked by being removed, which is the same thing. */
  el('new-list').addEventListener('click', function (e) {
    var pen = e.target.closest('[data-edit]');
    if (pen) {
      /* Editing puts it back in the form. Whatever was half-typed there
         was never added, so it goes. */
      var n = Number(pen.getAttribute('data-edit'));
      editing = { levels: cards[n].levels.slice() };
      cards.splice(n, 1);
      sync();
      var f = el('tfields').querySelector('select');
      if (f) f.focus();
      return;
    }
    var drop = e.target.closest('[data-dropb]');
    if (!drop) return;
    cards.splice(Number(drop.getAttribute('data-dropb')), 1);
    sync();
  });

  el('task-q').addEventListener('input', function () { renderStack(); });

  el('recent-list').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tick]');
    if (!t) return;
    var k = t.getAttribute('data-tick');
    if (ticks[k]) delete ticks[k]; else ticks[k] = 1;
    sync();
  });

  /* What is in the form joins the list above, ticked, and the form
     starts over. */
  el('add-more').addEventListener('click', function () {
    if (!levelsDone(editing.levels)) return;
    var k = keyFor(editing.levels);
    /* Naming one the list also offers does not hand it over to the list:
       a task shows where it was named, and the recent row for it drops
       out so it is never on screen twice. */
    if (weekKeys().indexOf(k) !== -1) {
      Shell.snackbar('That task is already on this timesheet.');
    } else if (!cards.some(function (c) { return keyFor(c.levels) === k; })) {
      cards.unshift({ levels: editing.levels.slice() });
    }
    editing = { levels: [] };
    sync();
    var first = el('tfields').querySelector('select');
    if (first) first.focus();
  });

  el('add-go').addEventListener('click', function () {
    var site = addSite(), sup = addSup() || supervisorFor(site);
    /* Every block that is fully named, each one once. */
    var seen = Object.create(null), picks = [];
    allPicked().forEach(function (b) {
      var k = keyOf(site, sup, b.levels);
      if (seen[k]) return;
      seen[k] = 1;
      picks.push({ key: k, levels: b.levels.slice() });
    });
    if (!picks.length) return;

    var ds = days().map(iso);
    var date = addOnDay || (ds.indexOf(iso(TODAY)) !== -1 ? iso(TODAY) : ds[0]);

    if (!state.editing) enterEdit();
    var lastKey = null;
    picks.forEach(function (p) {
      var k = keyOf(site, sup, p.levels);
      taskMeta[k] = { site: site, sup: sup, levels: p.levels.slice() };
      if (extraRows.indexOf(k) === -1) extraRows.push(k);
      lastKey = k;
    });
    /* The last one added is the one the cell editor opens on; all of them
       are marked, so a batch can be found at a glance. */
    justAdded = lastKey;
    justAddedSet = picks.map(function (p) { return keyOf(site, sup, p.levels); });
    /* Dropping rows inside a folded group hides what you just did, so
       whichever group they land in is opened. */
    delete collapsed['s:' + site];
    delete collapsed['s:' + site + '|' + sup];
    delete collapsed[flatKey(site, sup)];
    addModal.classList.remove('open');
    render();
    if (picks.length > 1) Shell.snackbar(picks.length + ' tasks added to this week.');

    /* Scroll to the first of them, not the last: the batch reads downwards. */
    var landed = document.querySelectorAll('tr.just-added');
    var row = landed[landed.length - 1];
    if (landed.length) {
      landed[0].scrollIntoView({ block: 'center' });
      var box = row.querySelector('.hr-cell:not([disabled])[data-date="' + date + '"]') ||
                row.querySelector('.hr-cell:not([disabled])');
      if (box) openCell(box);
    }
  });

  addModal.addEventListener('click', function (e) {
    if (e.target === addModal || e.target.closest('[data-close]')) addModal.classList.remove('open');
  });

  /* ─── Shifts ──────────────────────────────────────────────────── */
  function parseTime(v) {
    var m = /^(\d{1,2})[:.]?(\d{2})?$/.exec(v.trim());
    if (!m) return null;
    return Number(m[1]) * 60 + Number(m[2] || 0);
  }
  function shiftHours(sh) {
    var a = parseTime(sh.start), b = parseTime(sh.finish);
    if (a == null || b == null) return sh.hours === '' ? 0 : Number(sh.hours) || 0;
    var mins = b - a;
    if (mins <= 0) mins += 24 * 60;                 // finished after midnight
    return Math.round((mins / 60) * 100) / 100;
  }
  function shiftRows(list) {
    return list.map(function (sh, i) {
      return '<div class="shift" data-shift="' + i + '">' +
        '<div><label class="fld-label">Start</label><input type="text" placeholder="07:00" data-f="start" value="' + Shell.esc(sh.start) + '" /></div>' +
        '<div><label class="fld-label">Finish</label><input type="text" placeholder="19:00" data-f="finish" value="' + Shell.esc(sh.finish) + '" /></div>' +
        '<div><label class="fld-label">Hours</label><input type="text" inputmode="decimal" data-f="hours" value="' + Shell.esc(sh.hours) + '" /></div>' +
        '<button class="shift-drop" type="button" data-drop="' + i + '" aria-label="Remove shift" title="Remove shift">' +
          '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.6 8.2a1 1 0 001 .8h4.8a1 1 0 001-.8l.6-8.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 7v4M9.4 7v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' +
        '</button>' +
      '</div>';
    }).join('');
  }
  function totalOf(list) { return list.reduce(function (n, sh) { return n + shiftHours(sh); }, 0); }

  function wireShifts(boxId, totalId, listFor, redraw, onEmpty) {
    el(boxId).addEventListener('input', function (e) {
      var row = e.target.closest('[data-shift]');
      if (!row) return;
      var list = listFor();
      var i = Number(row.getAttribute('data-shift')), f = e.target.getAttribute('data-f');
      list[i][f] = e.target.value;
      if (f !== 'hours') {
        var h = shiftHours(list[i]);
        if (h) { list[i].hours = fmtHours(h); row.querySelector('[data-f="hours"]').value = fmtHours(h); }
      }
      el(totalId).textContent = fmtHours(totalOf(list));
    });
    el(boxId).addEventListener('click', function (e) {
      var drop = e.target.closest('[data-drop]');
      if (!drop) return;
      var list = listFor(), i = Number(drop.getAttribute('data-drop'));
      /* The last shift takes its task with it, so that one is confirmed. */
      if (list.length === 1 && onEmpty) { onEmpty(); return; }
      list.splice(i, 1);
      if (!list.length) list.push({ start: '', finish: '', hours: '' });
      redraw();
    });
  }
  /* ─── Edit an entry ───────────────────────────────────────────────
     The same sheet as adding, opened on what is already there: the task
     for context, its shifts to change, and a way to take the day off. */
  var editSheet = document.getElementById('edit-sheet');
  var editShifts = [];
  var editCtx = null;        // { key, date }

  function renderEditShifts() {
    el('edit-shifts').innerHTML = shiftRows(editShifts);
    el('edit-total').textContent = fmtHours(totalOf(editShifts));
  }
  wireShifts('edit-shifts', 'edit-total', function () { return editShifts; }, renderEditShifts, confirmLastShift);
  el('edit-add-shift').addEventListener('click', function () {
    editShifts.push({ start: '', finish: '', hours: '' });
    renderEditShifts();
  });

  function openEdit(key, date) {
    editCtx = { key: key, date: date };
    var m = taskMeta[key], d = fromIso(date);
    el('edit-facts').innerHTML =
      '<div class="fact"><dt>Task</dt><dd><span class="fact-name">' + Shell.esc(taskTitle(m)) + '</span>' +
        (taskRest(m) ? '<span class="fact-sub">' + Shell.esc(taskRest(m)) + '</span>' : '') + '</dd></div>' +
      '<div class="fact"><dt>Site</dt><dd>' + Shell.esc(m.site) + '</dd></div>' +
      '<div class="fact"><dt>Supervisor</dt><dd>' + Shell.esc(m.sup) + '</dd></div>' +
      '<div class="fact fact-date"><dt>Date</dt><dd>' + DOW[d.getDay()] + ' ' + fmtDay(d) + ' ' + d.getFullYear() + '</dd></div>';

    editShifts = entries.filter(function (e) { return e.key === key && e.date === date; })
                        .map(function (e) { return { start: e.start || '', finish: e.finish || '', hours: fmtHours(e.hours) }; });
    if (!editShifts.length) editShifts = [{ start: '', finish: '', hours: '' }];
    renderEditShifts();
    editSheet.classList.add('open');
  }

  function dropEntries(key, date) {
    for (var i = entries.length - 1; i >= 0; i--) {
      if (entries[i].key === key && entries[i].date === date) entries.splice(i, 1);
    }
  }

  el('edit-save').addEventListener('click', function () {
    var total = totalOf(editShifts);
    if (!total) { Shell.snackbar('Add some hours, or remove the task.'); return; }
    dropEntries(editCtx.key, editCtx.date);
    editShifts.forEach(function (sh) {
      var h = shiftHours(sh);
      if (h > 0) entries.push({ date: editCtx.date, key: editCtx.key, hours: h, start: sh.start, finish: sh.finish });
    });
    editSheet.classList.remove('open');
    render();
    Shell.snackbar('Saved — ' + fmtHours(total) + ' h.');
  });

  /* ─── Confirming a removal ────────────────────────────────────────
     One shift is the whole record of a task on a day, and one task can be
     the whole timesheet for that day — so the dialog names what goes. */
  var confirmSheet = document.getElementById('confirm-sheet');
  var confirmAction = null;

  function askConfirm(title, lead, points, onYes) {
    el('confirm-title').textContent = title;
    el('confirm-lead').textContent = lead;
    el('confirm-list').innerHTML = points.map(function (p) { return '<li>' + p + '</li>'; }).join('');
    confirmAction = onYes;
    confirmSheet.classList.add('open');
  }
  el('confirm-ok').addEventListener('click', function () {
    var run = confirmAction;
    confirmAction = null;
    confirmSheet.classList.remove('open');
    if (run) run();
  });
  confirmSheet.addEventListener('click', function (e) {
    if (e.target === confirmSheet || e.target.closest('[data-close]')) {
      confirmAction = null;
      confirmSheet.classList.remove('open');
    }
  });

  /* Other tasks booked on the same day, this one aside. */
  function otherTasksOn(isoDate, key) {
    var seen = Object.create(null), n = 0;
    entries.forEach(function (e) {
      if (e.date !== isoDate || e.key === key || seen[e.key]) return;
      seen[e.key] = true; n++;
    });
    return n;
  }

  function confirmLastShift() {
    var m = taskMeta[editCtx.key], d = fromIso(editCtx.date);
    var when = DOW[d.getDay()] + ' ' + fmtDay(d);
    var others = otherTasksOn(editCtx.date, editCtx.key);
    var points = ['<b>' + Shell.esc(taskTitle(m)) + '</b> will be removed from ' + when + '.'];

    if (others) {
      points.push(others === 1
        ? 'The other task booked on ' + when + ' stays as it is.'
        : 'The ' + others + ' other tasks booked on ' + when + ' stay as they are.');
    } else {
      points.push('It is the only task on that day, so the <b>timesheet for ' + when +
        '</b> is removed as well.');
    }
    askConfirm('Remove this shift?',
      'This is the only shift on this task.', points, removeEntry);
  }

  function removeEntry() {
    dropEntries(editCtx.key, editCtx.date);
    editSheet.classList.remove('open');
    render();
    Shell.snackbar('Task removed from this day.');
  }

  editSheet.addEventListener('click', function (e) {
    if (e.target === editSheet || e.target.closest('[data-close]')) editSheet.classList.remove('open');
  });

  document.getElementById('btn-new-task').addEventListener('click', function () { openAdd(null, null); });
  var fieldsSwitch = document.getElementById('fields-switch');
  fieldsSwitch.addEventListener('click', function (e) {
    var b = e.target.closest('[data-fields]');
    if (!b) return;
    FIELD_CAP = Number(b.getAttribute('data-fields'));
    fieldsSwitch.querySelectorAll('[data-fields]').forEach(function (x) { x.classList.toggle('on', x === b); });
    /* Fewer fields is a different set of answers, so what was part-named
       with the old set is dropped rather than half-kept. */
    if (addModal.classList.contains('open')) {
      cards = []; ticks = Object.create(null);
      editing = { levels: [] };
      sync();
    }
  });


  /* Taking back a row this edit added. Empty, it simply goes; with hours
     on it, it is worth asking, because the hours go with it. */
  function dropRow(key) {
    extraRows = extraRows.filter(function (k) { return k !== key; });
    if (draft) {
      Object.keys(draft).forEach(function (dk) {
        if (dk.indexOf(key + '|') === 0) delete draft[dk];
      });
    }
    /* Nothing was ever booked against it, so the task itself goes too. */
    var everUsed = entries.some(function (e) { return e.key === key; });
    if (!everUsed) delete taskMeta[key];
    if (justAdded === key) justAdded = null;
    justAddedSet = justAddedSet.filter(function (k) { return k !== key; });
    render(); syncEditBar();
  }

  document.addEventListener('click', function (e) {
    var x = e.target.closest ? e.target.closest('[data-drop-key]') : null;
    if (!x) return;
    e.preventDefault();
    e.stopPropagation();
    var key = x.getAttribute('data-drop-key');
    var m = taskMeta[key];
    var hours = days().reduce(function (n, d) { return n + hoursFor(key, iso(d)); }, 0);
    if (!hours) { dropRow(key); return; }
    askConfirm('Remove this task?',
      pathOf(m.levels) + ' has ' + fmtHours(hours) + ' h on it this week.',
      ['The hours entered against it are removed with it.',
       'It was added during this edit and has not been saved.'],
      function () { dropRow(key); Shell.snackbar('Task removed from this week.'); });
  }, true);

  /* Capture, and ahead of the row's own collapse handler: the click is for
     the button, not for the group it sits on. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.grp-add') : null;
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    openAdd(null, { site: b.getAttribute('data-add-site'), sup: b.getAttribute('data-add-sup') || '' });
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (editSheet.classList.contains('open')) { editSheet.classList.remove('open'); return; }
    if (addModal.classList.contains('open')) { addModal.classList.remove('open'); return; }
    if (state.editing) exitEdit();
  });

  el('add-hint-x').addEventListener('click', function () { el('add-hint').hidden = true; });

  render();
  applyViewport();
  syncVariant();
})();
</script>
</body>
</html>
