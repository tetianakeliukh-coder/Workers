  var addModal = document.getElementById('add-modal');
  function el(id) { return document.getElementById(id); }

  var recentCache = [];
  var basket = [];          // the tasks chosen so far, as {key, title, levels}
  var addStep = 1;          // in the stepped variant, which one

  /* The site in play: the group's when the dialog was opened from one,
     otherwise whatever the select is currently on — '' until chosen. */
  function addSite() { return addCtx ? addCtx.site : el('nt-site').value; }
  function addSup() { return addCtx ? (addCtx.sup || '') : el('nt-sup').value; }

  function renderSups() {
    var site = el('nt-site').value;
    var list = SUPS_BY_SITE[site] || [];
    el('nt-sup').innerHTML = '<option value="">Select…</option>' +
      list.map(function (x) { return '<option>' + Shell.esc(x) + '</option>'; }).join('');
    el('nt-sup').disabled = !site;
  }

  /* A site's fields are its own, so they cannot be drawn before one is
     chosen — between 0 and 4 of them, per site. */
  function syncVariant() {
    /* Opened from a group row the first step is already behind you. */
    var stepped = !addCtx;
    document.body.classList.toggle('addstep-1', stepped && addStep === 1);
    document.body.classList.toggle('addstep-2', !stepped || addStep === 2);

    el('add-sum').hidden = true;
    var onStepOne = stepped && addStep === 1;
    el('add-next').hidden = !onStepOne;
    el('add-go').hidden = onStepOne;

    el('add-steps').hidden = !stepped;
    if (stepped) {
      [].forEach.call(el('add-steps').children, function (li) {
        var n = Number(li.getAttribute('data-step'));
        li.classList.toggle('on', n === addStep);
        li.classList.toggle('done', n < addStep);
      });
    }
  }

  function renderLevels() {
    var site = addSite(), fields = fieldsFor(site), had = levelValues();
    el('nt-levels').innerHTML = fields.map(function (f, i) {
      return '<div class="fld"><label class="fld-label" for="nt-' + i + '">' + Shell.esc(f.name) +
        (i === 0 ? '<span class="req">*</span>' : '') + '</label>' +
        '<select id="nt-' + i + '" data-lvl="' + i + '"><option value="">Select…</option>' +
        f.values.map(function (v) { return '<option>' + Shell.esc(v) + '</option>'; }).join('') +
        '</select></div>';
    }).join('');
    setLevels(had);
  }
  function levelValues() {
    return [].slice.call(el('nt-levels').querySelectorAll('select')).map(function (x) { return x.value; });
  }
  function setLevels(vals) {
    [].slice.call(el('nt-levels').querySelectorAll('select')).forEach(function (x, i) {
      x.value = (vals && vals[i]) || '';
      /* A value the new site does not offer silently falls back to ''. */
      if (x.selectedIndex === -1) x.value = '';
    });
  }
  function newLevels() { return levelValues(); }

  /* Named, not merely refused: a button that will not say what it is
     waiting for leaves the reader to audit the form by eye. */
  function syncAddGo() {
    var missing = [];
    if (!addSite()) missing.push('site');
    if (!addSup()) missing.push('supervisor');
    /* Either half answers it, so neither is named: "work order" would be
       wrong advice to anyone about to pick a card instead. */
    if (addSite()) {
      var first = el('nt-0');
      if (!basket.length && !(first && first.value)) missing.push('task');
    }
    el('add-go').disabled = missing.length > 0;
    el('add-next').disabled = !addSite() || !addSup();
    /* On step one only the step-one answers are outstanding. */
    var shown = (!addCtx && addStep === 1)
      ? missing.filter(function (m) { return m !== 'task'; })
      : missing;
    el('add-need').textContent = shown.length
      ? 'Still to choose: ' + shown.join(', ') : '';
  }

  /* Everything booked before that still matches what has been filled in,
     most recent first. Each answer makes the list a shorter, more exact
     version of itself; with nothing filled in it is simply the last five
     tasks worked on. */
  /* A site whose naming field repeats — Olympic Dam names tasks by work
     order — hands two cards the same heading, and the thing that tells
     them apart ends up in the grey line. Where a heading would be shared,
     the first level that actually differs is promoted into it. */
  function nameCards(list) {
    var byTitle = Object.create(null);
    list.forEach(function (r) {
      r.cardTitle = taskTitle(r.meta);
      r.cardExtra = -1;
      (byTitle[r.cardTitle] = byTitle[r.cardTitle] || []).push(r);
    });
    Object.keys(byTitle).forEach(function (t) {
      var group = byTitle[t];
      if (group.length < 2) return;
      var depth = 0;
      group.forEach(function (r) { depth = Math.max(depth, r.meta.levels.length); });
      for (var i = 0; i < depth; i++) {
        var vals = group.map(function (r) { return r.meta.levels[i] || ''; });
        var differs = vals.some(function (v) { return v !== vals[0]; });
        if (!differs) continue;
        group.forEach(function (r, k) {
          if (!vals[k]) return;
          r.cardTitle = t + ' · ' + vals[k];
          r.cardExtra = i;
        });
        return;
      }
    });
  }

  /* Everything on the left narrows what is on the right, level by level:
     a job number cuts the list, an activity cuts it further. Describing
     the task is how you find the one you have booked before. */
  function renderRecent() {
    var site = addSite(), sup = addSup(), lv = levelValues();
    var filtered = !!(site || sup || lv.some(Boolean));
    var recent = Object.keys(taskMeta).map(function (k) {
      return { key: k, meta: taskMeta[k], when: lastUsed(k) };
    }).filter(function (r) { return r.when; })
      .filter(function (r) { return !site || r.meta.site === site; })
      .filter(function (r) { return !sup || r.meta.sup === sup; })
      .filter(function (r) {
        return lv.every(function (v, i) { return !v || r.meta.levels[i] === v; });
      })
      .sort(function (a, b) { return (b.when || 0) - (a.when || 0); }).slice(0, 5);
    nameCards(recent);

    el('sec-title').textContent = 'Recent tasks' + (recent.length ? ' (' + recent.length + ')' : '');
    el('sec-sub').hidden = !filtered;

    el('recent-list').innerHTML = recent.length ? recent.map(function (r, i) {
      /* Whatever the dialog already states is left off the card: with a
         site chosen that is the site, and the supervisor a task was last
         booked under is not where this row is going anyway. */
      var rest = taskRest(r.meta, r.cardExtra);
      var sub = (site
                  ? [rest, 'last booked ' + fmtDay(r.when)]
                  : [rest, r.meta.sup, r.meta.site, 'last booked ' + fmtDay(r.when)])
                  .filter(Boolean).join(' · ');
      var on = inBasket(r.key);
      return '<button class="recent-row' + (on ? ' sel' : '') + '" type="button" data-recent="' + i + '">' +
        '<span class="rr-tick"><svg width="10" height="10" viewBox="0 0 12 12" fill="none">' +
          '<path d="M2.5 6.2l2.4 2.4 4.6-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<span class="rr-body"><span class="rr-code">' + Shell.esc(r.cardTitle) + '</span>' +
        '<span class="rr-sub">' + Shell.esc(sub) + '</span></span></button>';
    }).join('')
      /* Empty for two different reasons, and they need different words. */
      : '<div class="recent-empty">' + (filtered
          ? 'Nothing booked here before. Set a new task up instead.'
          : 'Nothing booked yet.') + '</div>';
    recentCache = recent;
    renderBasket();
  }

  /* ─── The basket ──────────────────────────────────────────────────
     What has been chosen so far, gathered where it can be read back and
     taken out again. Several tasks go on in one trip, which is what
     setting up a week actually is. */
  function inBasket(key) {
    return basket.some(function (x) { return x.key === key; });
  }
  function renderBasket() {
    el('basket').hidden = !basket.length;
    el('basket-n').textContent = 'Selected (' + basket.length + ')';
    el('basket-chips').innerHTML = basket.map(function (x, i) {
      return '<span class="basket-chip"><span class="t">' + Shell.esc(x.title) + '</span>' +
        '<button type="button" data-drop="' + i + '" aria-label="Remove ' + Shell.esc(x.title) + '">' +
        '<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
        '</button></span>';
    }).join('');
    el('add-go').textContent = basket.length > 1 ? 'Add ' + basket.length + ' tasks' : 'Add';
  }
  el('basket-chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-drop]');
    if (!b) return;
    basket.splice(Number(b.getAttribute('data-drop')), 1);
    sync();
  });

  /* A site has one supervisor at a time, so the supervisor is looked up
     from the work already booked there rather than asked for. */
  function supervisorFor(site) {
    var found = null;
    entries.slice().reverse().forEach(function (e) {
      var m = taskMeta[e.key];
      if (!found && m && m.site === site) found = m.sup;
    });
    return found || (SUPS_BY_SITE[site] || [])[0];
  }

  /* The row lands with no hours and the cell editor opens on it at once,
     which says "fill in the days" better than a sentence could. */
  function syncDayHint() {}

  var addOnDay = null;      // set when the dialog was opened from a day
  var addCtx = null;        // set when it was opened from a group row

  /* ctx is the group the add was started from: { site, sup }. With one,
     the site is settled and only the task is still open. */
  function openAdd(dayIso, ctx) {
    addOnDay = dayIso || null;
    addCtx = ctx || null;
    /* Started from a site row, the supervisor is not chosen but it is not
       unknown either — the row will go to the same one the site's other
       tasks go to, so it is stated rather than left to be discovered. */
    if (addCtx && !addCtx.sup) addCtx.sup = supervisorFor(addCtx.site) || '';
    el('nt-site').innerHTML = '<option value="">Select…</option>' +
      SITES.map(function (x) { return '<option>' + Shell.esc(x) + '</option>'; }).join('');
    el('nt-site').value = addCtx ? addCtx.site : '';
    renderSups();
    if (addCtx) el('nt-sup').value = addCtx.sup || '';

    /* Opened from a group, the two are answered. A disabled dropdown
       still carries a chevron and still invites the click it will
       refuse, so they are printed in their place instead. */
    el('add-where').hidden = !!addCtx;
    el('add-where-set').hidden = !addCtx;
    if (addCtx) {
      el('add-where-set').innerHTML =
        '<div class="fld-static"><span class="fld-label">Site</span>' +
          '<span class="v">' + Shell.esc(addCtx.site) + '</span></div>' +
        '<div class="fld-static"><span class="fld-label">Supervisor</span>' +
          '<span class="v">' + Shell.esc(addCtx.sup || '—') + '</span></div>';
    }
    el('nt-sup').disabled = !el('nt-site').value;

    setLevels([]);
    renderLevels();
    basket = [];
    addStep = 1;
    sync();
    el('add-title').textContent = 'Add a task';
    addModal.classList.add('open');
  }

  /* One pass after any answer changes: the list on the right is a view of
     the form on the left, so it is never updated on its own. */
  function sync() {
    renderRecent();
    syncDayHint();
    syncVariant();
    syncAddGo();
  }

  el('nt-site').addEventListener('change', function () {
    renderSups();
    setLevels([]);
    renderLevels();   // a different site, a different set of fields
    /* Tasks belong to a site, so changing it empties what was chosen. */
    basket = [];
    sync();
  });
  el('nt-sup').addEventListener('change', sync);
  /* Naming a level narrows the list, and a card that stops matching
     leaves the list — renderRecent drops the pick with it. */
  el('nt-levels').addEventListener('change', sync);

  /* Picking a card is the answer, so the fields under it let go. */
  el('add-next').addEventListener('click', function () { addStep = 2; sync(); });
  el('add-sum-change').addEventListener('click', function () { addStep = 1; sync(); });

  el('recent-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-recent]');
    if (!b) return;
    /* Ticking adds it to the basket and unticking takes it out; the
       fields are what narrowed the list down to it, so they stay. */
    var r = recentCache[Number(b.getAttribute('data-recent'))];
    if (!r) return;
    if (inBasket(r.key)) {
      basket = basket.filter(function (x) { return x.key !== r.key; });
    } else {
      basket.push({ key: r.key, title: r.cardTitle, levels: r.meta.levels.slice() });
    }
    sync();
  });

  /* Naming a task on the fields and pressing the button drops it in the
     same basket, so the two ways of choosing end in one place. */
  el('sec-switch').addEventListener('click', function () {
    var first = el('nt-0');
    if (!first || !first.value) { first && first.focus(); return; }
    var levels = newLevels(), site = addSite(), sup = addSup() || supervisorFor(site);
    var k = keyOf(site, sup, levels);
    if (!inBasket(k)) {
      taskMeta[k] = { site: site, sup: sup, levels: levels.slice() };
      basket.push({ key: k, title: taskTitle(taskMeta[k]), levels: levels.slice() });
    }
    setLevels([]);
    sync();
  });

  el('add-go').addEventListener('click', function () {
    var site = addSite(), sup = addSup() || supervisorFor(site);
    /* Whatever is in the basket, plus anything left named in the fields
       that was never put there — nobody should lose a task because they
       did not press the second button. */
    var picks = basket.slice();
    var first = el('nt-0');
    if (first && first.value) {
      var lv = newLevels(), k0 = keyOf(site, sup, lv);
      if (!picks.some(function (x) { return x.key === k0; })) {
        taskMeta[k0] = { site: site, sup: sup, levels: lv.slice() };
        picks.push({ key: k0, title: taskTitle(taskMeta[k0]), levels: lv.slice() });
      }
    }
    if (!picks.length) return;

    var ds = days().map(iso);
    var date = addOnDay || (ds.indexOf(iso(TODAY)) !== -1 ? iso(TODAY) : ds[0]);

    if (!state.editing) enterEdit();
    var lastKey = null;
    picks.forEach(function (p) {
      var k = keyOf(site, sup, p.levels);
      taskMeta[k] = { site: site, sup: sup, levels: p.levels.slice() };
      if (extraRows.indexOf(k) === -1) extraRows.push(k);
      lastKey = k;
    });
    /* The last one added is the one the cell editor opens on. */
    justAdded = lastKey;
    /* Dropping rows inside a folded group hides what you just did, so
       whichever group they land in is opened. */
    delete collapsed['s:' + site];
    delete collapsed['s:' + site + '|' + sup];
    delete collapsed[flatKey(site, sup)];
    addModal.classList.remove('open');
    render();
    if (picks.length > 1) Shell.snackbar(picks.length + ' tasks added to this week.');

    var row = document.querySelector('tr.just-added');
    if (row) {
      row.scrollIntoView({ block: 'center' });
      var box = row.querySelector('.hr-cell:not([disabled])[data-date="' + date + '"]') ||
                row.querySelector('.hr-cell:not([disabled])');
      if (box) openCell(box);
    }
  });

  addModal.addEventListener('click', function (e) {
    if (e.target === addModal || e.target.closest('[data-close]')) addModal.classList.remove('open');
  });

  /* ─── Shifts ──────────────────────────────────────────────────── */
  function parseTime(v) {
    var m = /^(\d{1,2})[:.]?(\d{2})?$/.exec(v.trim());
    if (!m) return null;
    return Number(m[1]) * 60 + Number(m[2] || 0);
  }
  function shiftHours(sh) {
    var a = parseTime(sh.start), b = parseTime(sh.finish);
    if (a == null || b == null) return sh.hours === '' ? 0 : Number(sh.hours) || 0;
    var mins = b - a;
    if (mins <= 0) mins += 24 * 60;                 // finished after midnight
    return Math.round((mins / 60) * 100) / 100;
  }
  function shiftRows(list) {
    return list.map(function (sh, i) {
      return '<div class="shift" data-shift="' + i + '">' +
        '<div><label class="fld-label">Start</label><input type="text" placeholder="07:00" data-f="start" value="' + Shell.esc(sh.start) + '" /></div>' +
        '<div><label class="fld-label">Finish</label><input type="text" placeholder="19:00" data-f="finish" value="' + Shell.esc(sh.finish) + '" /></div>' +
        '<div><label class="fld-label">Hours</label><input type="text" inputmode="decimal" data-f="hours" value="' + Shell.esc(sh.hours) + '" /></div>' +
        '<button class="shift-drop" type="button" data-drop="' + i + '" aria-label="Remove shift" title="Remove shift">' +
          '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.6 8.2a1 1 0 001 .8h4.8a1 1 0 001-.8l.6-8.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 7v4M9.4 7v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' +
        '</button>' +
      '</div>';
    }).join('');
  }
  function totalOf(list) { return list.reduce(function (n, sh) { return n + shiftHours(sh); }, 0); }

  function wireShifts(boxId, totalId, listFor, redraw, onEmpty) {
    el(boxId).addEventListener('input', function (e) {
      var row = e.target.closest('[data-shift]');
      if (!row) return;
      var list = listFor();
      var i = Number(row.getAttribute('data-shift')), f = e.target.getAttribute('data-f');
      list[i][f] = e.target.value;
      if (f !== 'hours') {
        var h = shiftHours(list[i]);
        if (h) { list[i].hours = fmtHours(h); row.querySelector('[data-f="hours"]').value = fmtHours(h); }
      }
      el(totalId).textContent = fmtHours(totalOf(list));
    });
    el(boxId).addEventListener('click', function (e) {
      var drop = e.target.closest('[data-drop]');
      if (!drop) return;
      var list = listFor(), i = Number(drop.getAttribute('data-drop'));
      /* The last shift takes its task with it, so that one is confirmed. */
      if (list.length === 1 && onEmpty) { onEmpty(); return; }
      list.splice(i, 1);
      if (!list.length) list.push({ start: '', finish: '', hours: '' });
      redraw();
    });
  }
  /* ─── Edit an entry ───────────────────────────────────────────────
     The same sheet as adding, opened on what is already there: the task
     for context, its shifts to change, and a way to take the day off. */
  var editSheet = document.getElementById('edit-sheet');
  var editShifts = [];
  var editCtx = null;        // { key, date }

  function renderEditShifts() {
    el('edit-shifts').innerHTML = shiftRows(editShifts);
    el('edit-total').textContent = fmtHours(totalOf(editShifts));
  }
  wireShifts('edit-shifts', 'edit-total', function () { return editShifts; }, renderEditShifts, confirmLastShift);
  el('edit-add-shift').addEventListener('click', function () {
    editShifts.push({ start: '', finish: '', hours: '' });
    renderEditShifts();
  });

  function openEdit(key, date) {
    editCtx = { key: key, date: date };
    var m = taskMeta[key], d = fromIso(date);
    el('edit-facts').innerHTML =
      '<div class="fact"><dt>Task</dt><dd><span class="fact-name">' + Shell.esc(taskTitle(m)) + '</span>' +
        (taskRest(m) ? '<span class="fact-sub">' + Shell.esc(taskRest(m)) + '</span>' : '') + '</dd></div>' +
      '<div class="fact"><dt>Site</dt><dd>' + Shell.esc(m.site) + '</dd></div>' +
      '<div class="fact"><dt>Supervisor</dt><dd>' + Shell.esc(m.sup) + '</dd></div>' +
      '<div class="fact fact-date"><dt>Date</dt><dd>' + DOW[d.getDay()] + ' ' + fmtDay(d) + ' ' + d.getFullYear() + '</dd></div>';

    editShifts = entries.filter(function (e) { return e.key === key && e.date === date; })
                        .map(function (e) { return { start: e.start || '', finish: e.finish || '', hours: fmtHours(e.hours) }; });
    if (!editShifts.length) editShifts = [{ start: '', finish: '', hours: '' }];
    renderEditShifts();
    editSheet.classList.add('open');
  }

  function dropEntries(key, date) {
    for (var i = entries.length - 1; i >= 0; i--) {
      if (entries[i].key === key && entries[i].date === date) entries.splice(i, 1);
    }
  }

  el('edit-save').addEventListener('click', function () {
    var total = totalOf(editShifts);
    if (!total) { Shell.snackbar('Add some hours, or remove the task.'); return; }
    dropEntries(editCtx.key, editCtx.date);
    editShifts.forEach(function (sh) {
      var h = shiftHours(sh);
      if (h > 0) entries.push({ date: editCtx.date, key: editCtx.key, hours: h, start: sh.start, finish: sh.finish });
    });
    editSheet.classList.remove('open');
    render();
    Shell.snackbar('Saved — ' + fmtHours(total) + ' h.');
  });

  /* ─── Confirming a removal ────────────────────────────────────────
     One shift is the whole record of a task on a day, and one task can be
     the whole timesheet for that day — so the dialog names what goes. */
  var confirmSheet = document.getElementById('confirm-sheet');
  var confirmAction = null;

  function askConfirm(title, lead, points, onYes) {
    el('confirm-title').textContent = title;
    el('confirm-lead').textContent = lead;
    el('confirm-list').innerHTML = points.map(function (p) { return '<li>' + p + '</li>'; }).join('');
    confirmAction = onYes;
    confirmSheet.classList.add('open');
  }
  el('confirm-ok').addEventListener('click', function () {
    var run = confirmAction;
    confirmAction = null;
    confirmSheet.classList.remove('open');
    if (run) run();
  });
  confirmSheet.addEventListener('click', function (e) {
    if (e.target === confirmSheet || e.target.closest('[data-close]')) {
      confirmAction = null;
      confirmSheet.classList.remove('open');
    }
  });

  /* Other tasks booked on the same day, this one aside. */
  function otherTasksOn(isoDate, key) {
    var seen = Object.create(null), n = 0;
    entries.forEach(function (e) {
      if (e.date !== isoDate || e.key === key || seen[e.key]) return;
      seen[e.key] = true; n++;
    });
    return n;
  }

  function confirmLastShift() {
    var m = taskMeta[editCtx.key], d = fromIso(editCtx.date);
    var when = DOW[d.getDay()] + ' ' + fmtDay(d);
    var others = otherTasksOn(editCtx.date, editCtx.key);
    var points = ['<b>' + Shell.esc(taskTitle(m)) + '</b> will be removed from ' + when + '.'];

    if (others) {
      points.push(others === 1
        ? 'The other task booked on ' + when + ' stays as it is.'
        : 'The ' + others + ' other tasks booked on ' + when + ' stay as they are.');
    } else {
      points.push('It is the only task on that day, so the <b>timesheet for ' + when +
        '</b> is removed as well.');
    }
    askConfirm('Remove this shift?',
      'This is the only shift on this task.', points, removeEntry);
  }

  function removeEntry() {
    dropEntries(editCtx.key, editCtx.date);
    editSheet.classList.remove('open');
    render();
    Shell.snackbar('Task removed from this day.');
  }

  editSheet.addEventListener('click', function (e) {
    if (e.target === editSheet || e.target.closest('[data-close]')) editSheet.classList.remove('open');
  });

  document.getElementById('btn-new-task').addEventListener('click', function () { openAdd(null, null); });

  /* Capture, and ahead of the row's own collapse handler: the click is for
     the button, not for the group it sits on. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.grp-add') : null;
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    openAdd(null, { site: b.getAttribute('data-add-site'), sup: b.getAttribute('data-add-sup') || '' });
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (editSheet.classList.contains('open')) { editSheet.classList.remove('open'); return; }
    if (addModal.classList.contains('open')) { addModal.classList.remove('open'); return; }
    if (state.editing) exitEdit();
  });

  render();
  applyViewport();
  syncVariant();
})();
</script>
</body>
</html>
