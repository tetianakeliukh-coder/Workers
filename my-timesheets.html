<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Timesheets — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style>
  /* ─── My Timesheets ─────────────────────────────────────────────────
     The worker's own week. Desktop is the period grid — site › supervisor
     › task down the side, days across the top. Below 860px it becomes a
     week strip and a card per day, which is the view that matters most:
     workers enter their hours on a phone. */

  /* ─── Period bar ───────────────────────────────────────────────── */
  .period-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .step {
    width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--white); border: 1px solid var(--grey-350); border-radius: 8px;
    color: var(--grey-700); cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast);
  }
  .step:hover { border-color: var(--border-hover); background: var(--bg-blue-light); color: var(--text-main); }
  .period-range {
    font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap;
    min-width: 210px; text-align: center;
  }
  .period-meta { font-size: 13px; color: var(--grey-600); white-space: nowrap; }
  .period-chip {
    display: none; height: 22px; align-items: center; padding: 0 8px; border-radius: 6px;
    background: var(--bg-blue-light); color: var(--primary);
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .period-chip.visible { display: inline-flex; }
  .period-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  /* ─── Edit bar ─────────────────────────────────────────────────── */
  /* Matches the selection bar on Team Timesheets: plain white, outlined
     actions on the right. */
  .edit-bar {
    display: none; align-items: center; gap: 16px; flex-wrap: wrap;
    height: 52px; padding: 0 2px; background: var(--white);
  }
  body.editing .edit-bar { display: flex; }
  body.editing .period-actions { display: none; }
  .edit-status { font-size: 14px; color: var(--text-main); white-space: nowrap; }
  .edit-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .edit-actions .btn-outline {
    height: 32px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--white); border: 1px solid var(--primary); color: var(--primary);
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; line-height: 18px;
    white-space: nowrap; transition: background var(--t-fast);
  }
  .edit-actions .btn-outline:hover { background: var(--bg-blue-light); }
  .edit-actions .btn-outline:disabled { border-color: var(--grey-350); color: var(--grey-400); cursor: default; }
  .edit-actions .btn-outline:disabled:hover { background: var(--white); }

  /* ─── Period grid (desktop) ────────────────────────────────────── */
  .grid-card table { min-width: 980px; }
  .grid-card th, .grid-card td { white-space: nowrap; }

  th.col-label, td.col-label {
    position: sticky; left: 0; z-index: 2; background: inherit;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* Same hairline the frozen columns use on Team Timesheets. */
  .sx-left th.col-label, .sx-left td.col-label { overflow: visible; }
  .sx-left th.col-label::after, .sx-left td.col-label::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: 1px;
    background: var(--grey-400); pointer-events: none;
  }
  .sx-left th.col-label .tree, .sx-left td.col-label .tree,
  .sx-left td.col-label > .code { max-width: 100%; }
  th.col-day, td.col-day, th.col-total, td.col-total { text-align: right; }
  th.col-total, td.col-total { font-weight: 600; }
  .grid-card thead th {
    position: sticky; top: 0; z-index: 3; background: var(--white); vertical-align: bottom;
  }
  .grid-card thead th.col-label { z-index: 4; }
  .day-head { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; line-height: 16px; }
  .day-head .dow { font-size: 12px; font-weight: 400; color: var(--grey-600); }
  .day-head .dnum { font-size: 14px; font-weight: 500; color: var(--text-main); }
  .day-head.is-today .dow, .day-head.is-today .dnum { color: var(--primary); }

  /* No fills on the parent rows — the Team Timesheets table settled on
     indent, weight and icon for hierarchy, and these two sit side by side. */
  #grid tbody tr { background: var(--white); }
  #grid tbody tr:hover { background: #fafbfe; }

  .tree { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .tree .caret {
    width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--grey-600); transition: transform var(--t-fast); cursor: pointer;
  }
  tr.collapsed .caret { transform: rotate(-90deg); }
  .tree .ico { flex-shrink: 0; color: var(--grey-600); }
  .tree .name { overflow: hidden; text-overflow: ellipsis; }
  .row-site .name { font-weight: 600; }
  .row-sup .name { font-weight: 500; }
  .row-task td.col-label { padding-left: 62px; }
  .row-task .code { font-weight: 500; }
  .row-task .what { color: var(--grey-600); }
  td.col-day, td.col-total { font-variant-numeric: tabular-nums; }

  #grid tfoot td {
    position: sticky; bottom: 0; background: var(--white);
    border-top: 1px solid var(--grey-350); font-weight: 600;
  }
  #grid tfoot td.col-label { z-index: 3; color: var(--grey-700); font-weight: 500; }

  .hr-input {
    width: 100%; max-width: 72px; height: 32px; padding: 0 8px; text-align: right;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main);
    border: 1px solid var(--grey-350); border-radius: 6px; background: var(--white);
  }
  .hr-input:focus { outline: none; border-color: var(--primary); }
  .hr-input.changed { border-color: var(--primary); background: var(--bg-blue-light); }

  .grid-foot {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-top: 1px solid var(--grey-300); font-size: 13px; color: var(--grey-600);
  }
  .grid-foot .count { margin-left: auto; }

  /* ─── Week view (mobile) ───────────────────────────────────────── */
  .week-view { display: none; }
  .week-strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  .day-chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 2px; border-radius: 10px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-300);
  }
  .day-chip .d { font-size: 11px; color: var(--grey-600); }
  .day-chip .n { font-size: 16px; font-weight: 600; color: var(--text-main); }
  .day-chip .h { font-size: 12px; color: var(--primary); font-weight: 500; }
  .day-chip .h.none { color: var(--grey-400); font-weight: 400; }
  .day-chip.today { border-color: var(--primary); }
  .day-chip.sel { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .day-chip.weekend { background: var(--grey-100); }

  .week-total { text-align: right; font-size: 13px; color: var(--grey-600); margin-top: 8px; }
  .week-total b { color: var(--text-main); }

  .day-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .day-card { background: var(--white); border: 1px solid var(--grey-300); border-radius: 12px; }
  .day-card-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--grey-200);
  }
  .day-card-head .dt { font-size: 15px; font-weight: 600; }
  .day-card-head .tot { margin-left: auto; font-size: 14px; font-weight: 600; }
  .day-card-head .btn-text { font-size: 14px; }
  .entry { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; }
  .entry + .entry { border-top: 1px solid var(--grey-200); }
  .entry-main { min-width: 0; flex: 1; }
  .entry-code { display: block; font-size: 14px; font-weight: 500; }
  .entry-sub { display: block; font-size: 12px; line-height: 17px; color: var(--grey-600); margin-top: 2px; }
  .entry-hrs { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .entry .hr-input { max-width: 86px; }
  .day-card-foot { padding: 0 16px 14px; display: flex; gap: 8px; }
  .day-empty { padding: 16px; font-size: 14px; color: var(--grey-600); }

  /* ─── Add task ─────────────────────────────────────────────────── */
  .modal.add-modal { max-width: 460px; width: 100%; }
  .add-modal .modal-body { padding: 16px 24px 8px; display: flex; flex-direction: column; gap: 14px; }
  .add-sub { font-size: 14px; line-height: 20px; color: var(--grey-700); margin: 0; }
  .add-sub b { color: var(--text-main); font-weight: 500; }

  /* Recents are rows, not chips — each one has to carry who you worked for
     and when, which is what makes them pickable without thinking. */
  .recent-list { display: flex; flex-direction: column; gap: 6px; }
  .recent-row {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left;
    background: var(--white); border: 1px solid var(--grey-350); font-family: var(--fs-sans);
    transition: border-color var(--t-fast), background var(--t-fast);
  }
  .recent-row:hover { border-color: var(--border-hover); background: var(--bg-blue-light); }
  .recent-row.sel { border-color: var(--primary); background: var(--bg-blue-light); }
  .rr-code { font-size: 14px; font-weight: 500; color: var(--text-main); }
  .rr-sub { font-size: 12px; line-height: 16px; color: var(--grey-600); }
  .recent-empty { font-size: 13px; color: var(--grey-600); }

  .another { display: none; flex-direction: column; gap: 14px; }
  .another.open { display: flex; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld-label { font-size: 14px; font-weight: 500; line-height: 18px; color: var(--text-main); }
  .fld select {
    width: 100%; height: 40px; padding: 0 10px;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main);
    background: var(--white); border: 1px solid var(--grey-350); border-radius: 8px;
  }
  .fld select:focus { outline: none; border-color: var(--primary); }
  .fld-hint { font-size: 12px; color: var(--grey-600); }

  /* The phone layout is a class, not only a media query, so the prototype's
     viewport switcher can show it on a desktop screen. */
  body.is-narrow .grid-card { display: none; }
  body.is-narrow .week-view { display: block; }
  body.is-narrow .period-range { min-width: 0; flex: 1; font-size: 14px; }
  body.is-narrow .period-meta,
  body.is-narrow .period-chip,
  body.is-narrow .period-chip.visible { display: none; }
  /* Collapse all and the global Edit belong to the grid; on a phone each
  day card carries its own Edit. */
  body.is-narrow .period-actions { display: none; }
  body.is-narrow .edit-actions { width: 100%; margin-left: 0; }
  body.is-narrow .edit-actions .btn-outline,
  body.is-narrow .edit-actions .btn-primary { flex: 1; justify-content: center; }
  body.is-narrow .edit-bar { height: auto; padding: 10px 0; }
  /* ─── Phone preview frame + viewport switcher (prototype only) ──── */
  /* Clears the fixed phone top bar the shell puts in at this size. */
  body.force-mobile .main { background: var(--grey-200); display: flex; justify-content: center; padding: 80px 16px 48px; }
  body.force-mobile .content {
    width: 390px; max-width: 100%; background: var(--white);
    border: 1px solid var(--grey-350); border-radius: 20px;
    padding: 16px; box-shadow: var(--shadow-dialog);
  }

  /* In the phone preview the sheet should read like a phone sheet. */
  body.is-narrow .modal-backdrop { align-items: flex-end; padding: 0; }
  body.is-narrow .modal.add-modal {
    max-width: 390px; max-height: 88vh; border-radius: 16px 16px 0 0;
  }
  body.is-narrow .add-modal .modal-footer-actions { width: 100%; }
  body.is-narrow .add-modal .modal-footer-actions .btn-ghost,
  body.is-narrow .add-modal .modal-footer-actions .btn-primary { flex: 1; justify-content: center; }

  .vp-switch {
    position: fixed; right: 20px; bottom: 20px; z-index: 400;
    display: inline-flex; padding: 4px; gap: 2px; border-radius: 10px;
    background: var(--white); border: 1px solid var(--grey-350); box-shadow: var(--shadow-dropdown);
  }
  .vp-switch button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px; border: none; border-radius: 7px; cursor: pointer;
    background: none; color: var(--grey-700);
    font-family: var(--fs-sans); font-size: 13px; font-weight: 500;
  }
  .vp-switch button:hover { background: var(--grey-100); color: var(--text-main); }
  .vp-switch button.on { background: var(--bg-blue-light); color: var(--primary); }

  /* ─── Week dropdown ────────────────────────────────────────────── */
  .period-dd .dd-trigger { min-width: 232px; }
  .dd-item .sub { margin-left: auto; font-size: 12px; color: var(--grey-600); }
  #week-cal { padding: 8px; min-width: 268px; }
  #week-cal .cal-head { display: flex; align-items: center; padding: 2px 4px 8px; }
  #week-cal .cal-nav {
    width: 28px; height: 28px; flex-shrink: 0; border: none; border-radius: 50%;
    background: none; cursor: pointer; color: var(--grey-700);
    display: flex; align-items: center; justify-content: center;
  }
  #week-cal .cal-nav:hover { background: var(--grey-200); }
  #week-cal .cal-title { flex: 1; text-align: center; font-size: 14px; font-weight: 500; }
  #week-cal .cal-dow, #week-cal .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  #week-cal .cal-dow span { height: 24px; line-height: 24px; text-align: center; font-size: 11px; color: var(--grey-600); }
  #week-cal .cal-cell { height: 32px; display: flex; align-items: center; justify-content: center; }
  #week-cal .cal-day {
    width: 30px; height: 30px; border: none; border-radius: 50%; background: none; cursor: pointer;
    font-family: var(--fs-sans); font-size: 13px; color: var(--text-main);
  }
  #week-cal .cal-day:hover { background: var(--grey-200); }
  #week-cal .cal-cell.inweek { background: var(--bg-blue-light); }
  #week-cal .cal-cell.wk-start { border-radius: 16px 0 0 16px; }
  #week-cal .cal-cell.wk-end { border-radius: 0 16px 16px 0; }
  #week-cal .cal-foot { margin-top: 6px; padding: 8px 6px 2px; border-top: 1px solid var(--grey-300); font-size: 12px; color: var(--grey-600); }

</style>
</head>
<body data-module="mytime">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <div class="page-header">
        <h1 class="page-title">My Timesheets</h1>
        <div class="header-actions">
          <button class="btn-primary" type="button" id="btn-new-task">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            Add task
          </button>
        </div>
      </div>

      <div class="period-bar">
        <button class="step" type="button" data-step="-1" aria-label="Previous week">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="dd-wrap period-dd" id="week-dd">
          <button class="dd-trigger" type="button">
            <span>Week: <span id="period-range"></span></span>
            <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="dd-panel align-left" id="week-dd-panel"></div>
        </div>

        <button class="step" type="button" data-step="1" aria-label="Next week">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="period-chip" id="period-chip">Current week</span>

        <div class="period-actions">
          <button class="btn-ghost" type="button" id="btn-edit">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.2 2.8l2 2L6 12H4v-2l7.2-7.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            Edit
          </button>
          <button class="btn-ghost" type="button" id="btn-collapse">Collapse all</button>
        </div>
      </div>

      <div class="edit-bar" id="edit-bar">
        <span class="edit-status" id="edit-status">Editing · no changes yet</span>
        <div class="edit-actions">
          <button class="btn-outline" type="button" id="btn-add-task">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Add task
          </button>
          <button class="btn-outline" type="button" id="btn-cancel">Cancel</button>
          <button class="btn-primary" type="button" id="btn-save" disabled>Save</button>
        </div>
      </div>

      <!-- ── Desktop: the period grid ── -->
      <div class="table-card grid-card">
        <div class="table-scroll">
          <table id="grid">
            <colgroup id="grid-cols"></colgroup>
            <thead id="grid-head"></thead>
            <tbody id="grid-body"></tbody>
            <tfoot id="grid-foot"></tfoot>
          </table>
        </div>
        <div class="grid-foot">
          <span id="grid-hint">Hours you enter are saved against the day's timesheet.</span>
          <span class="count" id="grid-count"></span>
        </div>
      </div>

      <!-- ── Mobile: week strip + a card per day ── -->
      <div class="week-view">
        <div class="week-strip" id="week-strip"></div>
        <div class="week-total" id="week-total"></div>
        <div class="day-cards" id="day-cards"></div>
      </div>

    </div>
  </main>
</div>

<!-- ── Prototype viewport switcher ──────────────────────────────── -->
<div class="vp-switch" id="vp-switch" role="group" aria-label="Preview size">
  <button type="button" data-vp="desktop" class="on">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    Desktop
  </button>
  <button type="button" data-vp="mobile">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M7 12.8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    Mobile
  </button>
</div>

<!-- ── Add task ─────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="modal add-modal">
    <div class="modal-header">
      <div class="modal-heading"><span class="modal-title" id="add-title">Add task</span></div>
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="fld" id="date-fld">
        <label class="fld-label" for="add-date">Date</label>
        <select id="add-date"></select>
        <span class="fld-hint" id="date-hint"></span>
      </div>
      <p class="add-sub" id="add-sub"></p>
      <div class="recent-list" id="recent-tasks"></div>

      <div class="another" id="another">
        <div class="fld">
          <label class="fld-label" for="add-sup">Supervisor</label>
          <select id="add-sup"></select>
          <span class="fld-hint" id="sup-hint"></span>
        </div>
        <div class="fld">
          <label class="fld-label" for="add-site">Site</label>
          <select id="add-site"></select>
        </div>
        <div class="fld">
          <label class="fld-label" for="add-task">Job code</label>
          <select id="add-task"></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div class="modal-footer-actions">
        <button class="btn-ghost" type="button" data-close>Cancel</button>
        <button class="btn-ghost" type="button" id="add-another">Choose another task</button>
        <button class="btn-primary" type="button" id="add-confirm">Add task</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOW_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  var FULL_DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function startOfDay(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function iso(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function mondayOf(d) {
    var x = startOfDay(d), back = (x.getDay() + 6) % 7;   // Monday starts the week
    return addDays(x, -back);
  }
  function fmtDay(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtHours(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }

  var TODAY = startOfDay(new Date());
  var THIS_MON = mondayOf(TODAY);

  /* ─── The worker's tasks and their week ───────────────────────────
     Generated around today so the screen never ages out: last week is a
     full week, this week has started. */
  var TASKS = [
    { code: 'WORK-00123', name: 'Repair the machine',    site: 'MMA VIGILANT – 360', sup: 'Grace Okafor' },
    { code: 'WORK-00201', name: 'Deck plating repair',   site: 'MMA VIGILANT – 360', sup: 'Grace Okafor' },
    { code: 'JOB-00492',  name: 'Tooling change-out',    site: 'MMA VIGILANT ROV',   sup: 'Priya Nair' },
    { code: 'WORK-00187', name: 'Weld handrail section', site: 'MMA VIGILANT – 360', sup: 'Tom Halloran' },
    { code: 'JOB-00451',  name: 'ROV mobilisation',      site: 'MMA VIGILANT ROV',   sup: 'Priya Nair' }
  ];
  function taskBy(code) { return TASKS.filter(function (t) { return t.code === code; })[0]; }

  var entries = [];                     // { date, code, hours }
  function seed(day, code, hours) { entries.push({ date: iso(day), code: code, hours: hours }); }
  var lastMon = addDays(THIS_MON, -7);
  for (var i = 0; i < 5; i++) {
    seed(addDays(lastMon, i), 'WORK-00123', 8);
    seed(addDays(lastMon, i), 'WORK-00201', 4);
  }
  seed(addDays(lastMon, 4), 'JOB-00492', 2.5);
  seed(addDays(lastMon, 3), 'JOB-00492', 3);
  // This week has begun.
  seed(THIS_MON, 'WORK-00123', 8);
  seed(THIS_MON, 'WORK-00201', 4);
  /* Older work, so the recents list can say when each task was last
     touched — that date is what makes a recent worth tapping. */
  seed(addDays(THIS_MON, -24), 'WORK-00187', 10);
  seed(addDays(THIS_MON, -38), 'JOB-00451', 7.5);

  /* ─── State ───────────────────────────────────────────────────── */
  var state = { weekStart: new Date(THIS_MON.getTime()), editing: false, selDay: iso(TODAY) };
  var collapsed = Object.create(null);
  var draft = null;        // { 'code|date': hours } while editing
  var extraRows = [];      // task codes added during this edit

  function days() {
    var out = [];
    for (var i = 0; i < 7; i++) out.push(addDays(state.weekStart, i));
    return out;
  }
  function hoursFor(code, isoDate) {
    if (draft) {
      var k = code + '|' + isoDate;
      if (k in draft) return draft[k];
    }
    var sum = 0;
    entries.forEach(function (e) { if (e.code === code && e.date === isoDate) sum += e.hours; });
    return sum;
  }

  /* Rows that belong to this week: anything with hours, plus anything
     added during the current edit. */
  function weekTree() {
    var ds = days().map(iso);
    var codes = [];
    TASKS.forEach(function (t) {
      var any = ds.some(function (d) { return hoursFor(t.code, d) > 0; });
      if (any || extraRows.indexOf(t.code) !== -1) codes.push(t.code);
    });

    var sites = [], bySite = Object.create(null);
    codes.forEach(function (code) {
      var t = taskBy(code);
      if (!bySite[t.site]) { bySite[t.site] = { name: t.site, sups: [], bySup: Object.create(null) }; sites.push(bySite[t.site]); }
      var s = bySite[t.site];
      if (!s.bySup[t.sup]) { s.bySup[t.sup] = { name: t.sup, tasks: [] }; s.sups.push(s.bySup[t.sup]); }
      s.bySup[t.sup].tasks.push(t);
    });
    return sites;
  }

  function sumRow(tasks, isoDate) {
    var n = 0;
    tasks.forEach(function (t) { n += hoursFor(t.code, isoDate); });
    return n;
  }
  function sitesTasks(site) {
    var out = [];
    site.sups.forEach(function (s) { out = out.concat(s.tasks); });
    return out;
  }

  /* ─── Desktop grid ────────────────────────────────────────────── */
  var gridCols = document.getElementById('grid-cols');
  var gridHead = document.getElementById('grid-head');
  var gridBody = document.getElementById('grid-body');
  var gridFoot = document.getElementById('grid-foot');

  function cellHtml(value, code, isoDate) {
    if (state.editing && code) {
      var v = value > 0 ? fmtHours(value) : '';
      return '<td class="col-day"><input class="hr-input" type="text" inputmode="decimal" ' +
        'data-code="' + code + '" data-date="' + isoDate + '" value="' + v + '" aria-label="Hours" /></td>';
    }
    return '<td class="col-day">' + (value > 0 ? fmtHours(value) : '<span class="cell-empty">&mdash;</span>') + '</td>';
  }

  function caret() {
    return '<span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }
  var ICO_SITE = '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 14V3.5l5-1.5V14M3 14h10V6.5H8M3 14H1.5M13 14h1.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  var ICO_SUP  = '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 13.2c0-2.2 2-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M11.5 4.5h3M13 3v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

  function renderGrid() {
    var ds = days();

    gridCols.innerHTML = '<col style="width:340px" />' +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') +
      '<col style="width:96px" />';

    gridHead.innerHTML = '<tr>' +
      '<th class="col-label">Site › Supervisor › Task</th>' +
      ds.map(function (d) {
        var today = iso(d) === iso(TODAY);
        return '<th class="col-day"><span class="day-head' + (today ? ' is-today' : '') + '">' +
          '<span class="dow">' + DOW[d.getDay()] + '</span>' +
          '<span class="dnum">' + fmtDay(d) + '</span></span></th>';
      }).join('') +
      '<th class="col-total">Total</th>' +
    '</tr>';

    var tree = weekTree(), rows = [], shown = 0;
    tree.forEach(function (site) {
      var all = sitesTasks(site);
      var siteKey = 's:' + site.name;
      var siteOpen = collapsed[siteKey] !== true;

      rows.push('<tr class="row-site' + (siteOpen ? '' : ' collapsed') + '" data-key="' + Shell.esc(siteKey) + '">' +
        '<td class="col-label"><span class="tree">' + caret() + ICO_SITE +
          '<span class="name">' + Shell.esc(site.name) + '</span></span></td>' +
        ds.map(function (d) { return cellHtml(sumRow(all, iso(d))); }).join('') +
        '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(all, iso(d)); }, 0)) + '</td>' +
      '</tr>');
      shown++;
      if (!siteOpen) return;

      site.sups.forEach(function (sup) {
        var supKey = siteKey + '|' + sup.name;
        var supOpen = collapsed[supKey] !== true;
        rows.push('<tr class="row-sup' + (supOpen ? '' : ' collapsed') + '" data-key="' + Shell.esc(supKey) + '">' +
          '<td class="col-label"><span class="tree" style="padding-left:20px">' + caret() + ICO_SUP +
            '<span class="name">' + Shell.esc(sup.name) + '</span></span></td>' +
          ds.map(function (d) { return cellHtml(sumRow(sup.tasks, iso(d))); }).join('') +
          '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(sup.tasks, iso(d)); }, 0)) + '</td>' +
        '</tr>');
        shown++;
        if (!supOpen) return;

        sup.tasks.forEach(function (t) {
          rows.push('<tr class="row-task">' +
            '<td class="col-label" title="' + Shell.esc(t.code + ' — ' + t.name) + '">' +
              '<span class="code">' + Shell.esc(t.code) + '</span> <span class="what">' + Shell.esc(t.name) + '</span></td>' +
            ds.map(function (d) { return cellHtml(hoursFor(t.code, iso(d)), t.code, iso(d)); }).join('') +
            '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + hoursFor(t.code, iso(d)); }, 0)) + '</td>' +
          '</tr>');
          shown++;
        });
      });
    });

    if (!rows.length) {
      rows.push('<tr><td class="col-label" colspan="' + (ds.length + 2) + '" style="color:var(--grey-600)">' +
        'No hours recorded this week.' + (state.editing ? ' Use Add task to start.' : '') + '</td></tr>');
    }
    gridBody.innerHTML = rows.join('');

    var allTasks = [];
    tree.forEach(function (s) { allTasks = allTasks.concat(sitesTasks(s)); });
    gridFoot.innerHTML = '<tr>' +
      '<td class="col-label">Total hours</td>' +
      ds.map(function (d) {
        var n = sumRow(allTasks, iso(d));
        return '<td class="col-day">' + (n > 0 ? fmtHours(n) : '<span class="cell-empty">&mdash;</span>') + '</td>';
      }).join('') +
      '<td class="col-total">' + fmtHours(ds.reduce(function (n, d) { return n + sumRow(allTasks, iso(d)); }, 0)) + '</td>' +
    '</tr>';

    document.getElementById('grid-count').textContent = 'Displaying ' + shown + ' row' + (shown === 1 ? '' : 's');
  }

  /* ─── Mobile week view ────────────────────────────────────────── */
  var strip = document.getElementById('week-strip');
  var weekTotalEl = document.getElementById('week-total');
  var dayCards = document.getElementById('day-cards');

  function entriesOn(isoDate) {
    var tree = weekTree(), all = [];
    tree.forEach(function (s) { all = all.concat(sitesTasks(s)); });
    return all.map(function (t) { return { task: t, hours: hoursFor(t.code, isoDate) }; })
              .filter(function (r) { return r.hours > 0 || (state.editing && extraRows.indexOf(r.task.code) !== -1); });
  }

  function renderWeek() {
    var ds = days(), weekTotal = 0;

    strip.innerHTML = ds.map(function (d) {
      var key = iso(d), n = 0;
      TASKS.forEach(function (t) { n += hoursFor(t.code, key); });
      weekTotal += n;
      var cls = 'day-chip' + (key === iso(TODAY) ? ' today' : '') + (key === state.selDay ? ' sel' : '') +
                (d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : '');
      return '<button class="' + cls + '" type="button" data-day="' + key + '">' +
        '<span class="d">' + DOW_SHORT[d.getDay()] + '</span>' +
        '<span class="n">' + d.getDate() + '</span>' +
        '<span class="h' + (n > 0 ? '' : ' none') + '">' + (n > 0 ? fmtHours(n) : '&mdash;') + '</span>' +
      '</button>';
    }).join('');

    weekTotalEl.innerHTML = 'Week total <b>' + fmtHours(weekTotal) + ' h</b>';

    /* Most recent day first — the day you are filling in is the one you
       just worked. */
    var cards = ds.slice().reverse().filter(function (d) {
      return entriesOn(iso(d)).length || iso(d) === state.selDay;
    });

    dayCards.innerHTML = cards.map(function (d) {
      var key = iso(d), rows = entriesOn(key);
      var total = rows.reduce(function (n, r) { return n + r.hours; }, 0);
      var open = state.editing && key === state.selDay;

      var body = rows.length ? rows.map(function (r) {
        return '<div class="entry">' +
          '<span class="entry-main">' +
            '<span class="entry-code">' + Shell.esc(r.task.code) + '</span>' +
            '<span class="entry-sub">' + Shell.esc(r.task.name) + ' · ' + Shell.esc(r.task.sup) + ' · ' + Shell.esc(r.task.site) + '</span>' +
          '</span>' +
          (open
            ? '<input class="hr-input" type="text" inputmode="decimal" data-code="' + r.task.code + '" data-date="' + key + '" value="' + (r.hours > 0 ? fmtHours(r.hours) : '') + '" aria-label="Hours" />'
            : '<span class="entry-hrs">' + fmtHours(r.hours) + ' h</span>') +
        '</div>';
      }).join('') : '<div class="day-empty">No hours recorded.</div>';

      return '<div class="day-card">' +
        '<div class="day-card-head">' +
          '<span class="dt">' + FULL_DOW[d.getDay()] + ' ' + fmtDay(d) + '</span>' +
          '<span class="tot">' + fmtHours(total) + ' h</span>' +
          '<button class="btn-text" type="button" data-edit-day="' + key + '">' + (open ? 'Done' : 'Edit') + '</button>' +
        '</div>' + body +
        (open ? '<div class="day-card-foot"><button class="btn-text" type="button" id="card-add" data-day="' + key + '">' +
            '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
            'Add task</button></div>' : '') +
      '</div>';
    }).join('');
  }

  /* ─── Period bar ──────────────────────────────────────────────── */
  function weekLabel(start) {
    var a = start, b = addDays(start, 6);
    return fmtDay(a) + ' – ' + fmtDay(b) + ' ' + b.getFullYear();
  }

  function syncPeriod() {
    document.getElementById('period-range').textContent = weekLabel(state.weekStart);
    document.getElementById('period-chip').classList.toggle('visible', iso(state.weekStart) === iso(THIS_MON));
    renderWeekMenu();
  }

  /* ─── Week dropdown ───────────────────────────────────────────────
     The period control Team Timesheets uses, scoped to whole weeks —
     a timesheet is a day, and a worker fills one week at a time. */
  var weekPanel = document.getElementById('week-dd-panel');
  var CHECK = '<svg class="dd-check" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var calMonth = null;

  function quickWeeks() {
    return [
      { k: 'this', label: 'This week',     start: THIS_MON },
      { k: 'last', label: 'Last week',     start: addDays(THIS_MON, -7) },
      { k: 'prev', label: 'Two weeks ago', start: addDays(THIS_MON, -14) }
    ];
  }

  function renderWeekMenu() {
    if (weekPanel.classList.contains('cal-mode')) return;
    var cur = iso(state.weekStart);
    weekPanel.innerHTML = quickWeeks().map(function (w) {
      return '<button class="dd-item' + (iso(w.start) === cur ? ' active' : '') + '" type="button" data-week="' + iso(w.start) + '">' +
        CHECK + w.label + '<span class="sub">' + weekLabel(w.start) + '</span></button>';
    }).join('') +
    '<hr class="dd-divider" />' +
    '<button class="dd-item" type="button" data-week="pick">' + CHECK + 'Choose a week…</button>';
  }

  function renderWeekCal() {
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    var lead = (new Date(y, m, 1).getDay() + 6) % 7;      // Monday-first grid
    var count = new Date(y, m + 1, 0).getDate();
    var selStart = iso(state.weekStart), selEnd = iso(addDays(state.weekStart, 6));

    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell"></div>';
    for (var d = 1; d <= count; d++) {
      var cur = new Date(y, m, d), key = iso(cur);
      var inWeek = key >= selStart && key <= selEnd;
      var cls = 'cal-cell' + (inWeek ? ' inweek' : '') +
                (key === selStart ? ' wk-start' : '') + (key === selEnd ? ' wk-end' : '');
      cells += '<div class="' + cls + '"><button class="cal-day" type="button" data-pickday="' + key + '">' + d + '</button></div>';
    }
    weekPanel.innerHTML = '<div id="week-cal">' +
      '<div class="cal-head">' +
        '<button class="cal-nav" type="button" data-cal="-1" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="cal-title">' + ['January','February','March','April','May','June','July','August','September','October','November','December'][m] + ' ' + y + '</div>' +
        '<button class="cal-nav" type="button" data-cal="1" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '</div>' +
      '<div class="cal-dow">' + ['M','T','W','T','F','S','S'].map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-foot">Pick any day — the week it belongs to opens.</div>' +
    '</div>';
  }

  weekPanel.addEventListener('click', function (e) {
    e.stopPropagation();
    var nav = e.target.closest('[data-cal]');
    if (nav) {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(nav.getAttribute('data-cal')), 1);
      renderWeekCal();
      return;
    }
    var day = e.target.closest('[data-pickday]');
    if (day) {
      goToWeek(mondayOf(new Date(day.getAttribute('data-pickday').replace(/-/g, '/'))));
      weekPanel.classList.remove('cal-mode');
      Shell.closeAllDropdowns();
      return;
    }
    var item = e.target.closest('[data-week]');
    if (!item) return;
    var v = item.getAttribute('data-week');
    if (v === 'pick') {
      calMonth = new Date(state.weekStart.getFullYear(), state.weekStart.getMonth(), 1);
      weekPanel.classList.add('cal-mode');
      renderWeekCal();
      return;
    }
    goToWeek(new Date(v.replace(/-/g, '/')));
    Shell.closeAllDropdowns();
  });

  document.querySelector('#week-dd .dd-trigger').addEventListener('click', function () {
    weekPanel.classList.remove('cal-mode');
    renderWeekMenu();
  });

  function goToWeek(start) {
    state.weekStart = startOfDay(start);
    var ds = days().map(iso);
    if (ds.indexOf(state.selDay) === -1) state.selDay = ds[0];
    render();
  }

  /* ─── Viewport switcher (prototype aid, not product UI) ─────────── */
  var vp = document.getElementById('vp-switch');
  var narrowQuery = window.matchMedia('(max-width: 860px)');
  var vpMode = 'auto';

  function applyViewport() {
    var narrow = vpMode === 'mobile' ? true : vpMode === 'desktop' ? false : narrowQuery.matches;
    document.body.classList.toggle('is-narrow', narrow);
    document.body.classList.toggle('force-mobile', vpMode === 'mobile');
    if (Shell.setViewport) Shell.setViewport(vpMode === 'mobile' ? 'mobile' : vpMode === 'desktop' ? 'desktop' : 'auto');
    vp.querySelectorAll('[data-vp]').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-vp') === (vpMode === 'auto' ? (narrow ? 'mobile' : 'desktop') : vpMode));
    });
    renderWeek();
  }
  vp.addEventListener('click', function (e) {
    var b = e.target.closest('[data-vp]');
    if (!b) return;
    vpMode = b.getAttribute('data-vp');
    applyViewport();
  });
  narrowQuery.addEventListener('change', function () { if (vpMode === 'auto') applyViewport(); });

  var scrollBox = document.querySelector('.grid-card .table-scroll');
  function syncScrollEdge() {
    scrollBox.classList.toggle('sx-left', scrollBox.scrollLeft > 0);
  }
  scrollBox.addEventListener('scroll', syncScrollEdge);

  function render() {
    syncPeriod();
    renderGrid();
    renderWeek();
    syncEditBar();
    syncScrollEdge();
  }

  document.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (state.editing) return;
      goToWeek(addDays(state.weekStart, 7 * Number(b.getAttribute('data-step'))));
    });
  });

  /* ─── Collapse ────────────────────────────────────────────────── */
  gridBody.addEventListener('click', function (e) {
    var row = e.target.closest('[data-key]');
    if (!row || e.target.closest('.hr-input')) return;
    var k = row.getAttribute('data-key');
    collapsed[k] = collapsed[k] !== true;
    renderGrid();
    syncCollapseBtn();
  });

  function allKeys() {
    var keys = [];
    weekTree().forEach(function (site) {
      var sk = 's:' + site.name;
      keys.push(sk);
      site.sups.forEach(function (sup) { keys.push(sk + '|' + sup.name); });
    });
    return keys;
  }
  function syncCollapseBtn() {
    var keys = allKeys();
    var anyOpen = keys.some(function (k) { return collapsed[k] !== true; });
    document.getElementById('btn-collapse').textContent = anyOpen ? 'Collapse all' : 'Expand all';
  }
  document.getElementById('btn-collapse').addEventListener('click', function () {
    var keys = allKeys();
    var anyOpen = keys.some(function (k) { return collapsed[k] !== true; });
    keys.forEach(function (k) { collapsed[k] = anyOpen; });
    renderGrid();
    syncCollapseBtn();
  });

  /* ─── Edit mode ───────────────────────────────────────────────── */
  function changeCount() { return draft ? Object.keys(draft).length : 0; }

  function syncEditBar() {
    var n = changeCount();
    document.getElementById('edit-status').textContent =
      n === 0 ? 'Editing · no changes yet' : 'Editing · ' + n + ' change' + (n === 1 ? '' : 's');
    document.getElementById('btn-save').disabled = n === 0;
  }

  function enterEdit() {
    state.editing = true;
    draft = Object.create(null);
    extraRows = [];
    document.body.classList.add('editing');
    render();
  }
  function exitEdit() {
    state.editing = false;
    draft = null;
    extraRows = [];
    document.body.classList.remove('editing');
    render();
  }

  document.getElementById('btn-edit').addEventListener('click', enterEdit);
  document.getElementById('btn-cancel').addEventListener('click', exitEdit);

  document.getElementById('btn-save').addEventListener('click', function () {
    var n = changeCount();
    Object.keys(draft).forEach(function (k) {
      var parts = k.split('|'), code = parts[0], date = parts[1], hours = draft[k];
      for (var i = entries.length - 1; i >= 0; i--) {
        if (entries[i].code === code && entries[i].date === date) entries.splice(i, 1);
      }
      if (hours > 0) entries.push({ date: date, code: code, hours: hours });
    });
    exitEdit();
    Shell.snackbar(n + ' change' + (n === 1 ? '' : 's') + ' saved to your timesheets.');
  });

  /* Typing anywhere in the week updates the draft and the totals. */
  document.addEventListener('input', function (e) {
    var box = e.target.closest('.hr-input');
    if (!box || !draft) return;
    var raw = box.value.trim().replace(',', '.');
    var val = raw === '' ? 0 : Number(raw);
    if (isNaN(val) || val < 0) return;
    var key = box.getAttribute('data-code') + '|' + box.getAttribute('data-date');
    draft[key] = val;
    box.classList.add('changed');

    // Totals have to follow the typing, but re-rendering would steal focus.
    var active = document.activeElement;
    var caret = active && active.selectionStart;
    renderGrid();
    renderWeek();
    syncEditBar();
    var again = document.querySelector('.hr-input[data-code="' + box.getAttribute('data-code') +
      '"][data-date="' + box.getAttribute('data-date') + '"]');
    if (again) {
      again.focus();
      if (caret != null) { try { again.setSelectionRange(caret, caret); } catch (err) {} }
    }
  });

  /* ─── Mobile: edit one day at a time ──────────────────────────── */
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-day]');
    if (chip) { state.selDay = chip.getAttribute('data-day'); renderWeek(); return; }

    var dayEdit = e.target.closest('[data-edit-day]');
    if (dayEdit) {
      var key = dayEdit.getAttribute('data-edit-day');
      state.selDay = key;
      if (!state.editing) enterEdit(); else renderWeek();
      return;
    }

    var cardAdd = e.target.closest('#card-add');
    if (cardAdd) openAdd(cardAdd.getAttribute('data-day'));
  });

  /* ─── Add task ──────────────────────────────────────────────────
     Recents first, the way a worker thinks: the same job, again. Picking
     "Choose another task" opens the supervisor › site › job code path. */
  var addModal = document.getElementById('add-modal');
  var anotherBox = document.getElementById('another');
  var addPick = null;
  var addForDay = null;                 // set when opened from a day card

  /* When the worker last booked time against a task, for the recents list. */
  function lastWorked(code) {
    var dates = entries.filter(function (e) { return e.code === code; })
                       .map(function (e) { return e.date; }).sort();
    if (!dates.length) return null;
    var parts = dates[dates.length - 1].split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /* A timesheet is one day, so adding work starts with the date. Opened
     from a day card the date is already known and the field is hidden. */
  function supervisorOn(dayIso) {
    var found = null;
    entries.forEach(function (e) {
      if (e.date === dayIso && !found) found = taskBy(e.code).sup;
    });
    return found;
  }

  function syncDateHint() {
    var day = document.getElementById('add-date').value;
    var sup = supervisorOn(day);
    document.getElementById('date-hint').textContent = sup
      ? 'This day already has a timesheet with ' + sup + '.'
      : 'No timesheet for this day yet — one will be created.';
    if (sup) {
      var sel = document.getElementById('add-sup');
      if (Array.prototype.some.call(sel.options, function (o) { return o.value === sup || o.text === sup; })) {
        sel.value = sup;
        fillJobCodes();
      }
    }
  }
  document.getElementById('add-date').addEventListener('change', syncDateHint);

  function openAdd(dayIso) {
    addPick = null;
    addForDay = dayIso || null;
    anotherBox.classList.remove('open');
    document.getElementById('add-another').style.display = '';

    var dateFld = document.getElementById('date-fld');
    dateFld.style.display = addForDay ? 'none' : '';
    if (!addForDay) {
      var ds = days();
      var preferred = ds.filter(function (d) { return iso(d) === iso(TODAY); })[0] || ds[0];
      document.getElementById('add-date').innerHTML = ds.map(function (d) {
        return '<option value="' + iso(d) + '">' + DOW[d.getDay()] + ' ' + fmtDay(d) + '</option>';
      }).join('');
      document.getElementById('add-date').value = iso(preferred);
    }

    document.getElementById('add-sub').innerHTML = addForDay
      ? 'Choose one of your recent tasks for <b>' + FULL_DOW[new Date(addForDay.replace(/-/g, '/')).getDay()] +
        ' ' + fmtDay(new Date(addForDay.replace(/-/g, '/'))) + '</b>, or another.'
      : 'Then choose one of your recent tasks, or another.';

    var used = [];
    weekTree().forEach(function (s) { sitesTasks(s).forEach(function (t) { used.push(t.code); }); });
    var available = TASKS.filter(function (t) { return used.indexOf(t.code) === -1; });

    document.getElementById('recent-tasks').innerHTML = available.length
      ? available.map(function (t) {
          var when = lastWorked(t.code);
          return '<button class="recent-row" type="button" data-pick="' + t.code + '">' +
            '<span class="rr-code">' + Shell.esc(t.code) + ' · ' + Shell.esc(t.name) + '</span>' +
            '<span class="rr-sub">' + Shell.esc(t.sup) + ' · ' + Shell.esc(t.site) +
              (when ? ' · last ' + DOW[when.getDay()] + ' ' + fmtDay(when) : ' · not worked yet') +
            '</span></button>';
        }).join('')
      : '<span class="recent-empty">Everything you work on is already on this week.</span>';

    var sites = [], sups = [];
    TASKS.forEach(function (t) {
      if (sites.indexOf(t.site) === -1) sites.push(t.site);
      if (sups.indexOf(t.sup) === -1) sups.push(t.sup);
    });
    document.getElementById('add-sup').innerHTML = sups.map(function (x) { return '<option>' + Shell.esc(x) + '</option>'; }).join('');
    document.getElementById('add-site').innerHTML = sites.map(function (x) { return '<option>' + Shell.esc(x) + '</option>'; }).join('');
    fillJobCodes();
    if (!addForDay) syncDateHint();
    addModal.classList.add('open');
  }

  /* Job codes follow the supervisor and site, the way the real form does. */
  function fillJobCodes() {
    var sup = document.getElementById('add-sup').value;
    var site = document.getElementById('add-site').value;
    var opts = TASKS.filter(function (t) { return t.sup === sup && t.site === site; });
    document.getElementById('add-task').innerHTML = opts.length
      ? opts.map(function (t) { return '<option value="' + t.code + '">' + Shell.esc(t.code + ' — ' + t.name) + '</option>'; }).join('')
      : '<option value="">No job codes for this pairing</option>';
    addPick = opts.length ? opts[0].code : null;

    var when = lastWorked(TASKS.filter(function (t) { return t.sup === sup; }).map(function (t) { return t.code; })[0] || '');
    document.getElementById('sup-hint').textContent = when
      ? 'Last timesheet with them ' + DOW[when.getDay()] + ' ' + fmtDay(when)
      : 'No timesheets with them yet';
  }
  ['add-sup', 'add-site'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', fillJobCodes);
  });
  document.getElementById('add-task').addEventListener('change', function () { addPick = this.value || null; });

  document.getElementById('add-another').addEventListener('click', function () {
    anotherBox.classList.add('open');
    this.style.display = 'none';
    document.getElementById('recent-tasks').querySelectorAll('.recent-row').forEach(function (b) { b.classList.remove('sel'); });
    fillJobCodes();
  });

  document.getElementById('btn-add-task').addEventListener('click', function () { openAdd(null); });
  document.getElementById('btn-new-task').addEventListener('click', function () { openAdd(null); });

  addModal.addEventListener('click', function (e) {
    if (e.target === addModal || e.target.closest('[data-close]')) { addModal.classList.remove('open'); return; }
    var pick = e.target.closest('[data-pick]');
    if (pick) {
      addPick = pick.getAttribute('data-pick');
      addModal.querySelectorAll('[data-pick]').forEach(function (b) { b.classList.toggle('sel', b === pick); });
    }
  });

  document.getElementById('add-confirm').addEventListener('click', function () {
    if (!addPick) { Shell.snackbar('Choose a task first.'); return; }
    if (extraRows.indexOf(addPick) === -1) extraRows.push(addPick);
    var day = addForDay || document.getElementById('add-date').value;
    if (day) {
      state.selDay = day;
      addForDay = day;
      /* The week has to be showing the day we just picked. */
      if (days().map(iso).indexOf(day) === -1) goToWeek(mondayOf(new Date(day.replace(/-/g, '/'))));
    }
    addModal.classList.remove('open');
    if (!state.editing) enterEdit(); else render();
    var sel = addForDay
      ? '.day-card .hr-input[data-code="' + addPick + '"][data-date="' + addForDay + '"]'
      : '.hr-input[data-code="' + addPick + '"]';
    var first = document.querySelector(sel) || document.querySelector('.hr-input[data-code="' + addPick + '"]');
    if (first) first.focus();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (addModal.classList.contains('open')) { addModal.classList.remove('open'); return; }
    if (state.editing) exitEdit();
  });

  render();
  syncCollapseBtn();
  applyViewport();
})();
</script>
</body>
</html>
