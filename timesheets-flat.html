        : '<p class="rv-none">None claimed.</p>') +

      '<div class="rv-sec">Comments</div>' +
      (notes.length
        ? '<ul class="rv-notes">' + notes.map(function (x) {
            return '<li' + (rvOn(x.u) ? '' : ' class="off"') + '>' +
              '<span class="rv-alw-d">' + DOW[fromIso(x.u.date).getDay()] + ' ' + fromIso(x.u.date).getDate() + '</span>' +
              '<span class="rv-note-b"><span class="rv-note-t">' + Shell.esc(x.e.task) + '</span>' +
              '<span class="rv-note-c">' + Shell.esc(x.e.comment) + '</span></span></li>';
          }).join('') + '</ul>'
        : '<p class="rv-none">Nothing written against these days.</p>');
  }

  function rvRender() {
    var left = rvSheets.reduce(function (n, s) { return n + rvLive(s).length; }, 0);
    el('rv-q-head').textContent = rvSheets.length + ' timesheet' + (rvSheets.length === 1 ? '' : 's') + ' to review';
    el('rv-q-list').innerHTML = rvSheets.map(function (s, i) {
      var live = rvLive(s).length;
      return '<button class="rv-q-item' + (i === rvAt ? ' on' : '') + (live ? '' : ' done') +
        '" type="button" data-rv="' + i + '">' +
        '<span class="rv-q-txt"><span class="t">' + Shell.esc(s.worker) + '</span>' +
        '<span class="s">' + (live ? live + ' day' + (live === 1 ? '' : 's') + ' to approve' : 'done') +
          '</span></span>' +
        (live ? '' : '<span class="appr-tick">' + ICO_TICK + '</span>') + '</button>';
    }).join('');
    var s = rvSheets[rvAt];
    el('rv-main').innerHTML = s ? rvDetail(s) : '';
    el('rv-all').disabled = !left;
    el('rv-all').textContent = left ? 'Approve all (' + left + ')' : 'Approve all';
  }

  /* After approving, land on the next sheet that still needs a decision
     rather than the next in line, which may already be done. */
  function rvAdvance() {
    for (var n = 1; n <= rvSheets.length; n++) {
      var i = (rvAt + n) % rvSheets.length;
      if (rvLive(rvSheets[i]).length) { rvAt = i; return true; }
    }
    return false;
  }

  /* What the bar says. The hours are the hours of the days picked, and
     the allowances are counted because they are the thing the table has
     no room to show and the supervisor still has to know about. */
  function syncBar() {
    var sel = selected();
    el('sel-bar').classList.toggle('open', sel.length > 0);
    if (!sel.length) return;
    var keys = Object.create(null), who = Object.create(null), dys = Object.create(null);
    sel.forEach(function (u) { keys[u.key] = 1; who[u.worker] = 1; dys[u.date] = 1; });
    var list = rows().filter(function (e) { return keys[keyOf(e)] === 1; });
    var nd = Object.keys(dys).length, nw = Object.keys(who).length;
    var alw = allowTally(list);
    el('sel-what').textContent =
      nd + ' day' + (nd === 1 ? '' : 's') + ' · ' +
      nw + ' worker' + (nw === 1 ? '' : 's') + ' · ' +
      fmtHours(sumOf(list)) + ' h' + (alw ? ' · ' + alw : '');
  }

  /* ─── Render ──────────────────────────────────────────────────────── */
  var CARET = '<span class="g-caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  /* A cell holds hours, and may hold the times they came from — some
     clients record one, some the other. The draft keeps all three
     together so the cell editor can read and write them as one thing. */
  function cellKey(e, isoDate) { return e.id + '|' + (isoDate || e.date); }
  function cellOf(e, isoDate) {
    var k = cellKey(e, isoDate);
    if (draft && k in draft) return draft[k];
    if (isoDate && e.date !== isoDate) return { h: '', s: '', f: '', a: [] };
    return { h: e.hours, s: e.start || '', f: e.finish || '', a: (e.allowances || []).slice() };
  }
  /* Worded as the rest of the product words it, down to the brackets. */
  function allowTip(list) {
    return (list || []).map(function (x) {
      return x.type === 'amount' ? x.name + ' (' + x.qty + ')' : x.name;
    }).join(' · ');
  }
  /* Three coins falling into an open hand. */
  var ICO_FLAG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<circle cx="8" cy="4" r="1.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<circle cx="14" cy="6" r="1.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<circle cx="11" cy="10" r="1.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<path d="M3.5 14.5v3a4 4 0 004 4h7.5a4 4 0 003.6-2.3l1.7-3.6a1.4 1.4 0 00-2.4-1.4L14 18" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  /* Left of the figure: a mark that follows the number pushes it off the
     right edge, and then one column no longer lines up with the next. */
  /* hand-coins, as the product draws it — the same mark My Timesheets
     uses, so a claim reads the same on either structure. */
  var ICO_ALW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/>' +
    '<path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/>' +
    '<path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>';
  function alwMark(c) {
    if (!c.a || !c.a.length) return '';
    return '<span class="alw-mark" data-tip="Allowance &mdash; ' + Shell.esc(allowTip(c.a)) + '">' + ICO_ALW + '</span>';
  }

  /* ─── A day, and what is true of it ────────────────────────────────
     The worker's day is one timesheet whatever sites it spans, so its
     status belongs to the date and is drawn once at the head of the
     column — not repeated in every cell under it, where six copies of
     one fact crowded out the figures. A day is only as far along as the
     least far of the entries on it. */
  var ICO_DRAFT = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none">' +
    '<circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 2"/></svg>';
  var STATUS_RANK = { Draft: 0, Revised: 1, Submitted: 2, Finalised: 3 };
  /* Only the worker's own screen has one timesheet a day; a supervisor's
     day spans people, so there the status stays on the row. */
  function dayHasStatus() { return state.tab === 'mine'; }
  function dayStatus(list, isoDate) {
    var best = null;
    list.forEach(function (e) {
      if (e.date !== isoDate || e.isNew) return;
      if (best === null || STATUS_RANK[e.status] < STATUS_RANK[best]) best = e.status;
    });
    return best || 'Draft';
  }
  function stMark(name) {
    var st = STATUS_META[name] || STATUS_META.Draft;
    return '<span class="hr-st st-' + String(name).toLowerCase() + '">' +
      (st.icon || ICO_DRAFT) + '</span>';
  }
  /* Everything booked to one day, across every task on screen — drafts
     included, and drafts written against a day the row did not start on.
     cellOf answers all three cases. */
  function dayTotal(list, isoDate) {
    return list.reduce(function (n, e) {
      return n + (Number(cellOf(e, isoDate).h) || 0);
    }, 0);
  }
  /* The cap is one person's day, never a column's: a supervisor's column
     adds up several people and is meant to be bigger than a day. It is
     also measured over everything booked, not over what the filters are
     letting through. */
  function workerDayTotal(worker, isoDate) {
    return ENTRIES.concat(pending).reduce(function (n, e) {
      return e.worker === worker ? n + (Number(cellOf(e, isoDate).h) || 0) : n;
    }, 0);
  }
  /* Every person-day on screen that holds more than a day's worth. */
  function badDays() {
    var all = ENTRIES.concat(pending), out = [];
    days().forEach(function (d) {
      var k = iso(d), by = Object.create(null), order = [];
      all.forEach(function (e) {
        var h = Number(cellOf(e, k).h) || 0;
        if (!h) return;
        if (!(e.worker in by)) { by[e.worker] = 0; order.push(e.worker); }
        by[e.worker] += h;
      });
      order.forEach(function (w) {
        if (by[w] > DAY_CAP) out.push({ date: k, worker: w, hours: by[w] });
      });
    });
    return out;
  }
  /* The one cell whose figure put a day over. Everything else on that day
     was already there and is not what is wrong. */
  var overKey = null;
  function hoursOf(e, isoDate) { return cellOf(e, isoDate).h; }

  /* The cell is a button, not a bare input: typing a number is still the
     fast path, but times have to be reachable from somewhere, and a cell
     nobody can open is a feature nobody finds. */
  function hrInput(e, isoDate) {
    var c = cellOf(e, isoDate), k = cellKey(e, isoDate);
    var changed = draft && k in draft;
    var st = statusOf(e), lock = isLocked(e, isoDate);
    var dayOver = overKey === k && workerDayTotal(e.worker, isoDate || e.date) > DAY_CAP;
    return '<button class="hr-cell' + (changed ? ' changed' : '') + (lock ? ' locked' : '') +
      (dayOver ? ' over' : '') +
      '" type="button" data-cell="' + k + '"' + (lock ? ' disabled data-tip="' + (isApproved(e, isoDate) ? 'Approved' : e.status) + ' — hours can no longer be changed"' : '') + '>' +
      alwMark(c) +
      (st.icon && !(state.mode === 'period' && dayHasStatus())
        ? '<span class="hr-st st-' + String(e.status).toLowerCase() + '">' + st.icon + '</span>' : '') +
      (c.h === '' || c.h === 0 ? '<span class="cell-empty">&mdash;</span>' : fmtHours(c.h)) +
      '</button>';
  }
  /* Out of edit mode the status still has to be visible, because Period
     has no Status column to carry it. */
  function dayValue(e, isoDate) {
    var c = cellOf(e, isoDate), st = statusOf(e);
    return alwMark(c) +
      (st.icon && !(state.mode === 'period' && dayHasStatus())
        ? '<span class="hr-st" data-tip="' + e.status + '">' + st.icon + '</span>' : '') +
      (c.h === '' || c.h === 0 ? '<span class="cell-empty">&mdash;</span>' : fmtHours(c.h));
  }
  /* A field the context could not supply arrives as a cell on the row,
     prefilled with the best guess, rather than as another question in a
     dialog before the row exists. */
  function optsFor(e, k) {
    var plain = function (a) { return (a || []).map(function (x) { return { v: x, t: x }; }); };
    if (k === 'date') return days().map(function (d) { return { v: iso(d), t: fmtDay(d) }; });
    if (k === 'site') return plain(SITES);
    if (k === 'sup') return plain(SUPS[e.site]);
    if (k === 'worker') return plain(WORKERS);
    if (k === 'project') return plain(PROJECTS[e.site]);
    return [];
  }
  /* Which of a new row's cells are its own questions. The worker is one
     only where there is more than one worker on screen. */
  var PICKABLE = { date: 1, site: 1, sup: 1, worker: 1, project: 1 };
  function isPick(e, k) {
    if (!e.isNew) return false;
    if (k === 'worker') return state.tab !== 'mine';
    return !!PICKABLE[k];
  }
  function pickCell(e, f) {
    var opts = optsFor(e, f.k);
    /* Site decides what the other answers can be, so until it is given
       they have nothing to offer. */
    var off = !e.site && (f.k === 'sup' || f.k === 'project');
    return '<select class="cell-input' + (e[f.k] ? '' : ' need') + '" data-field="' + f.k +
      '" data-row="' + e.id + '"' + (off ? ' disabled' : '') + '>' +
      '<option value="">Select\u2026</option>' +
      opts.map(function (o) {
        return '<option value="' + Shell.esc(o.v) + '"' + (o.v === e[f.k] ? ' selected' : '') + '>' +
          Shell.esc(o.t) + '</option>';
      }).join('') + '</select>';
  }
  function taskBtn(e) {
    return '<button class="task-pick' + (e.task ? '' : ' empty need') + '" type="button" data-task="' +
      e.id + '">' + (e.task ? Shell.esc(e.task) : 'Select task\u2026') + '</button>';
  }

  function cellHtml(e, f) {
    if (f.k === 'allow') return allowHtml(e);
    if (f.k === 'hours') {
      if (state.editing && e.kind !== 'allow') return hrInput(e);
      return e.hours === '' ? '<span class="cell-empty">&mdash;</span>' : fmtHours(e.hours);
    }
    if (f.k === 'status') return statusChip(e.status);
    if (e.isNew && f.k === 'task') return taskBtn(e);
    if (isPick(e, f.k)) return pickCell(e, f);
    var v = f.get(e);
    return v ? Shell.highlight(v, state.q) : '<span class="cell-empty">&mdash;</span>';
  }

  /* ─── Period ────────────────────────────────────────────────────────
     The same rows, pivoted: the date stops being a column of values and
     becomes the columns themselves. A leaf is a task, and its hours land
     in whichever day they were booked to — which is what lets a new row
     ask for nothing but the task. */
  /* A row being added is its own row until it is saved — otherwise a
     copy of a task would fold straight back into the row it was copied
     from, and nothing would have happened on screen. */
  function taskKey(e) { return e.isNew ? e.id : [e.site, e.sup, e.worker, e.task].join('\u00a7'); }

  /* A row being added sits above the table only while it has nothing to
     be grouped by. Once it knows what it is it belongs under its own
     heading — which, for a copy, is true from the first moment. */
  function isLoose(e) {
    if (!e.isNew) return false;
    var g = groups();
    if (!g.length) return true;
    return g.some(function (k) { return !e[k]; });
  }

  function renderPeriod(list, lead, ds) {
    var cols = lead.concat([field('task')]);
    var offs = [], off = PICK_W;
    cols.forEach(function (c) { offs.push(off); off += c.w; });

    /* A row here is a task over the whole period, so its tick stands for
       that worker's week on that site — every day of it. Which days
       actually go through is settled in the review dialog, where there
       is room to see what each one holds. */
    function sheetRows(e) {
      return list.filter(function (x) { return !x.isNew && x.worker === e.worker; });
    }

    el('grid-cols').innerHTML = '<col style="width:' + PICK_W + 'px" />' +
      cols.map(function (c) { return '<col style="width:' + c.w + 'px" />'; }).join('') +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') + '<col style="width:92px" />' +
      '<col style="width:64px" />';

    var overSet = badDays();
    el('grid-head').innerHTML = '<tr>' +
      '<th class="col-pick">' + chkHtml(pickState(list), 'data-pickset="' + setRef(list) + '"') + '</th>' +
      cols.map(function (c, i) {
        return '<th class="col-lead' + (i === cols.length - 1 ? ' last' : '') +
          '" data-w="' + c.k + '" style="left:' + offs[i] + 'px">' +
          Shell.esc(c.label) + Shell.colGrip() + '</th>';
      }).join('') +
      ds.map(function (d) {
        var k = iso(d), t = k === iso(TODAY);
        /* The column's own figure is a column's figure — on a supervisor's
           screen it adds up several people and is meant to be large. What
           is marked is a person's day going over, whoever that person is. */
        var tot = dayTotal(list, k);
        var over = overSet.some(function (b) { return b.date === k; });
        var st = dayHasStatus() ? dayStatus(list, k) : '';
        var hit = overSet.filter(function (b) { return b.date === k; })[0];
        var tip = (st ? st + (STATUS_META[st] && STATUS_META[st].locked
          ? ' \u2014 hours can no longer be changed' : '') : '') +
          (hit ? (st ? '. ' : '') + (dayHasStatus() ? '' : hit.worker + ': ') +
            fmtHours(hit.hours) + ' h booked \u2014 more than ' + DAY_CAP : '');
        return '<th class="col-day' + (t ? ' tdy' : '') + '"' +
          (tip ? ' data-tip="' + Shell.esc(tip) + '"' : '') + '>' +
          '<span class="day-head' + (t ? ' is-today' : '') + '">' +
          '<span class="dnum">' + DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</span>' +
          '<span class="dtot' + (over ? ' over' : '') + '">' + (st ? stMark(st) : '') +
          (tot > 0 ? fmtHours(tot) + ' h' : '<span class="cell-empty">&mdash;</span>') +
          '</span></span></th>';
      }).join('') +
      '<th class="num col-hrs" data-w="hours"><span class="day-head">' +
        '<span class="dnum">Total</span><span class="dtot">' + fmtHours(sumOf(list)) + ' h</span>' +
      '</span>' + Shell.colGrip() + '</th>' +
      '<th class="col-act"></th></tr>';

    el('grid').style.minWidth = (off + ds.length * 92 + 92 + 64) + 'px';

    var out = [], shown = 0, openKeys = [];

    function leafRows(rowsIn) {
      var order = [], by = Object.create(null);
      rowsIn.forEach(function (e) {
        var k = taskKey(e);
        if (!by[k]) { by[k] = []; order.push(k); }
        by[k].push(e);
      });
      return order.map(function (k) { return by[k]; });
    }

    function dayCell(group, d) {
      var key = iso(d), hit = null;
      group.forEach(function (e) { if (e.date === key) hit = e; });
      /* The day is the unit here, so the green sits on the cell. */
      var ap = hit && isApproved(hit, key) ? ' appr' : '';
      /* An approved day is closed: edit mode does not reopen it. */
      if (ap) {
        return '<td class="col-day' + (key === iso(TODAY) ? ' tdy' : '') + ap + '">' +
          (hit ? dayValue(hit, key) : '<span class="cell-empty">&mdash;</span>') + '</td>';
      }
      if (state.editing && hit && hit.kind !== 'allow') {
        return '<td class="col-day' + (key === iso(TODAY) ? ' tdy' : '') + ap + '">' + hrInput(hit, key) + '</td>';
      }
      if (state.editing && !hit) {
        /* An empty day on a row that exists: open it and the entry is
           created against that date. The column is the date. */
        var seed = group[0];
        var k = seed.id + '|' + key, changed = draft && k in draft;
        var c = changed ? draft[k] : { h: '', s: '', f: '' };
        /* A day filled in here is a day like any other, so it answers to
           the cap like any other. */
        var dayOver = overKey === k && workerDayTotal(seed.worker, key) > DAY_CAP;
        return '<td class="col-day' + (key === iso(TODAY) ? ' tdy' : '') + '">' +
          '<button class="hr-cell' + (changed ? ' changed' : '') + (dayOver ? ' over' : '') +
          '" type="button" data-cell="' + k + '">' +
          (c.h === '' || c.h === 0 ? '<span class="cell-empty">&mdash;</span>' : fmtHours(c.h)) +
          '</button></td>';
      }
      return '<td class="col-day' + (key === iso(TODAY) ? ' tdy' : '') + ap + '">' +
        (hit ? dayValue(hit, key) : '<span class="cell-empty">&mdash;</span>') + '</td>';
    }

    function taskRow(group) {
      shown++;
      var e = group[0];
      /* A task added here often already has a row — the booking is just
         another day on it — so the mark belongs to the group, not to the
         first entry in it. Without this, adding a task you have done
         before leaves nothing on screen to show for it. */
      var fresh = group.filter(function (x) { return x.isNew; })[0];
      var isJust = group.some(function (x) { return x.id === justAdded; });
      var total = ds.reduce(function (n, d) {
        var h = 0;
        group.forEach(function (x) { if (x.date === iso(d)) h += Number(hoursOf(x, iso(d))) || 0; });
        return n + h;
      }, 0);
      /* The tick belongs to the worker, not the task — a row here is one
         of their tasks and ticking it would light up the others, which
         reads as a fault. When there is a heading row it carries the
         tick; without grouping there is nowhere else for it to go. */
      var onRow = !groups().length && !fresh;
      return '<tr class="' + (fresh ? 'new-row' : '') + (isJust ? ' just-added' : '') +
          (allApproved(group) ? ' appr' : '') + '">' +
        /* The ghost shows what is true of THIS row, not of the worker it
           belongs to. It is how the rule becomes visible: pick a
           supervisor's group and the other supervisor's lines on the
           same days light up too, because a day is approved whole. */
        (onRow ? pickCellFor(sheetRows(e))
          : '<td class="col-pick">' + (fresh ? '' : chkGhost(pickState(group))) + '</td>') +
        cols.map(function (c, i) {
          var html = '';
          if (i === cols.length - 1) {
            /* Whatever the view has no column for is asked in the task
               cell; what it does have a column for is asked there. */
            html = fresh ? taskBtn(fresh) : Shell.highlight(e.task, state.q);
          } else if (fresh && isPick(fresh, c.k)) {
            html = pickCell(fresh, c);
          }
          return '<td class="col-lead' + (i === cols.length - 1 ? ' last' : '') +
            '" style="left:' + offs[i] + 'px">' + html + '</td>';
        }).join('') +
        ds.map(function (d) { return dayCell(group, d); }).join('') +
        '<td class="num col-hrs">' + fmtHours(total) + '</td>' + actCell(fresh || e) + '</tr>';
    }

    function headRow(node, depth, key, open) {
      var total = sumOf(node.rows);
      return '<tr class="g-row d' + depth + (open ? '' : ' collapsed') +
          (allApproved(node.rows) ? ' appr' : '') + '"' +
          (depth === 1 ? ' data-key="' + Shell.esc(key) + '"' : '') + '>' +
        pickCellFor(node.rows) +
        cols.map(function (c, i) {
          var html = '';
          if (i === depth - 1) {
            var name = '<span class="g-name">' + Shell.highlight(String(node.name), state.q) + '</span>';
            html = depth === 1 ? '<button class="g-btn" type="button">' + CARET + name + '</button>' : name;
          } else if (i > depth - 1 && i < lead.length) {
            html = '<span class="g-tally-in">' + tally(node.rows, cols[i]) + '</span>';
          } else if (i === cols.length - 1) {
            html = '<span class="g-tally-in">' + tally(node.rows, field('task')) + '</span>';
          }
          return '<td class="col-lead' + (i === cols.length - 1 ? ' last' : '') +
            '" style="left:' + offs[i] + 'px">' + html + '</td>';
        }).join('') +
        ds.map(function (d) {
          var h = 0;
          node.rows.forEach(function (x) { if (x.date === iso(d)) h += Number(hoursOf(x, iso(d))) || 0; });
          return '<td class="col-day g-tally' + (iso(d) === iso(TODAY) ? ' tdy' : '') + '">' +
            (h ? fmtHours(h) : '') + '</td>';
        }).join('') +
        '<td class="num col-hrs">' + fmtHours(total) + '</td>' + actCell(null, key) + '</tr>';
    }

    function walk(nodes, depth, path) {
      nodes.forEach(function (node) {
        var key = path + '\u00a7' + node.name;
        var top = depth === 1;
        var open = !top || collapsed[key] !== true;
        if (top) openKeys.push(key);
        out.push(headRow(node, depth, key, open));
        if (!open) return;
        if (node.kids) walk(node.kids, depth + 1, key);
        else leafRows(node.rows).forEach(function (grp) { out.push(taskRow(grp)); });
      });
    }

    var fresh = list.filter(isLoose);
    var settled = list.filter(function (e) { return !isLoose(e); });
    fresh.forEach(function (e) { out.push(taskRow([e])); });
    var g = groups();
    if (!g.length) leafRows(settled).forEach(function (grp) { out.push(taskRow(grp)); });
    else walk(nest(settled, g), 1, '');

    el('grid-body').innerHTML = out.length ? out.join('')
      : '<tr><td colspan="' + (cols.length + ds.length + 3) + '"><div class="empty">Nothing booked in this period.</div></td></tr>';
    return { shown: shown, openKeys: openKeys };
  }

  var ICO_BIN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.6 8.2a1 1 0 001 .8h4.8a1 1 0 001-.8l.6-8.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 7v4M9.4 7v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  var ICO_DUP = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="5.6" y="5.6" width="7.9" height="7.9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 3.4H4a1.6 1.6 0 00-1.6 1.6v6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  var ICO_PLUS = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

  /* One column at the end of every row, in both modes. A row that exists
     can be copied; a row being added can be thrown away; a heading can
     start another row under itself, already knowing what it groups by. */
  function actCell(e, addKey) {
    var out = '';
    if (e && e.isNew) {
      out = '<button class="row-act row-drop" type="button" data-drop="' + e.id +
        '" aria-label="Remove this row" data-tip="Remove this row">' + ICO_BIN + '</button>';
    } else if (e) {
      out = '<button class="row-act" type="button" data-dup="' + e.id +
        '" aria-label="Duplicate this row" data-tip="Duplicate this row">' + ICO_DUP + '</button>';
    } else if (state.editing && addKey != null) {
      out = '<button class="row-act" type="button" data-addhere="' + Shell.esc(addKey) +
        '" aria-label="Add a task here" data-tip="Add a task here">' + ICO_PLUS + '</button>';
    }
    return '<td class="col-act">' + out + '</td>';
  }

  function render() {
    var lead = leadCols(), rest = restCols(), cols = lead.concat(rest);
    var g = groups(), list = rows();

    document.body.classList.toggle('editing', state.editing);
    pickSets = [];

    if (state.mode === 'period') {
      /* Every day of the period, weekend or not: a seven-day roster is a
         setting, not an exception, and a site that works Saturdays would
         lose the column it books to. */
      var r = renderPeriod(list, lead, days());
      finish(r.shown, list, r.openKeys);
      return;
    }

    /* The heading columns stay put while the rest scrolls, so a row read
       on the right still says whose it is. The tick column goes in front
       of them and stays put too. */
    var off = PICK_W, offsets = lead.map(function (c) { var at = off; off += c.w; return at; });

    el('grid-cols').innerHTML = '<col style="width:' + PICK_W + 'px" />' +
      cols.map(function (c) {
        return '<col style="width:' + c.w + 'px" />';
      }).join('') + '<col style="width:64px" />';

    el('grid-head').innerHTML = '<tr>' +
      '<th class="col-pick">' + chkHtml(pickState(list), 'data-pickset="' + setRef(list) + '"') + '</th>' +
      cols.map(function (c, i) {
      var isLead = i < lead.length;
      return '<th class="' + (isLead ? 'col-lead' + (i === lead.length - 1 ? ' last' : '') : '') +
        (c.num ? ' num' : '') + (c.k === 'hours' ? ' col-hrs' : '') + '" data-w="' + c.k + '"' +
        (isLead ? ' style="left:' + offsets[i] + 'px"' : '') + '>' +
        Shell.esc(c.label) + Shell.colGrip() + '</th>';
    }).join('') + '<th class="col-act"></th></tr>';

    var out = [], shown = 0, openKeys = [];

    function leadCell(i, html) {
      return '<td class="col-lead' + (i === lead.length - 1 ? ' last' : '') +
        '" style="left:' + offsets[i] + 'px">' + (html || '') + '</td>';
    }

    function entryRow(e) {
      shown++;
      var done = !e.isNew && isApproved(e);
      /* Every row of this worker's day ticks together, so the box stands
         for the pair and not for the row it happens to sit on. */
      var mates = !e.isNew && list.filter(function (x) { return !x.isNew && keyOf(x) === keyOf(e); });
      return '<tr class="' + (e.isNew ? 'new-row' : '') +
          (e.id === justAdded ? ' just-added' : '') + (done ? ' appr' : '') +
          (!e.isNew && !done && picked[keyOf(e)] ? ' picked' : '') + '">' +
        (e.isNew ? '<td class="col-pick"></td>' : done ? approvedCell() : pickCellFor(mates)) +
        lead.map(function (c, i) {
          /* A row still being added shows its grouped fields as pickers
             rather than blanks: those are what decide where it lands, so
             a wrong guess has to be correctable from the row itself. */
          if (e.isNew && c.k === 'task') return leadCell(i, taskBtn(e));
          if (isPick(e, c.k)) return leadCell(i, pickCell(e, c));
          return leadCell(i, '');
        }).join('') +
        rest.map(function (c) {
          var cls = (c.num ? 'num' : '') + (c.k === 'hours' ? ' col-hrs' : '');
          var tip = c.k === 'task' ? ' data-tip="' + Shell.esc(c.label + ' — ' + c.get(e)) + '"' : '';
          return '<td class="' + cls + '"' + tip + '>' + cellHtml(e, c) + '</td>';
        }).join('') + actCell(e) +
      '</tr>';
    }

    /* What a heading row says in a column it is not the heading for. */
    function rollup(c, rows) {
      if (c.k === 'hours') return '<td class="num col-hrs">' + fmtHours(sumOf(rows)) + '</td>';
      if (c.k === 'allow') return '<td class="g-tally">' + allowTally(rows) + '</td>';
      if (COUNTABLE[c.k]) return '<td class="g-tally">' + tally(rows, c) + '</td>';
      return '<td></td>';
    }

    /* Only the top level folds. One chevron on the screen, in one column,
       and everything under a closed one goes with it — the deeper rows are
       the detail you opened it to read, not more drawers to open. */
    function walk(nodes, depth, path) {
      nodes.forEach(function (node) {
        var key = path + '\u00a7' + node.name;
        var top = depth === 1;
        var open = !top || collapsed[key] !== true;
        if (top) openKeys.push(key);

        out.push('<tr class="g-row d' + depth + (open ? '' : ' collapsed') +
            (allApproved(node.rows) ? ' appr' : '') + '"' +
            (top ? ' data-key="' + Shell.esc(key) + '"' : '') + '>' +
          pickCellFor(node.rows) +
          lead.map(function (c, i) {
            if (i < depth - 1) return leadCell(i, '');            // said already, above
            if (i === depth - 1) {
              var name = '<span class="g-name">' + Shell.highlight(String(node.name), state.q) + '</span>';
              return leadCell(i, top ? '<button class="g-btn" type="button">' + CARET + name + '</button>' : name);
            }
            /* A field grouped below this one: how many are coming. */
            return leadCell(i, '<span class="g-tally-in">' + tally(node.rows, c) + '</span>');
          }).join('') +
          rest.map(function (c) { return rollup(c, node.rows); }).join('') + actCell(null, key) +
        '</tr>');

        if (!open) return;
        if (node.kids) walk(node.kids, depth + 1, key);
        else node.rows.forEach(function (e) { out.push(entryRow(e)); });
      });
    }

    var fresh = list.filter(isLoose);
    var settled = list.filter(function (e) { return !isLoose(e); });
    fresh.forEach(function (e) { out.push(entryRow(e)); });
    if (!g.length) settled.forEach(function (e) { out.push(entryRow(e)); });
    else walk(nest(settled, g), 1, '');

    el('grid-body').innerHTML = out.length
      ? out.join('')
      : '<tr><td colspan="' + (cols.length + 2) + '"><div class="empty">Nothing booked in this period.</div></td></tr>';

    el('grid').style.minWidth =
      (cols.reduce(function (n, c) { return n + c.w; }, 0) + PICK_W + 64) + 'px';
    finish(shown, list, openKeys);
  }

  function finish(shown, list, openKeys) {
    el('grid-note').textContent = state.tab === 'mine'
      ? 'Your own entries. Hours are saved against the day you book them to.'
      : 'Every entry the filters let through, whoever booked it.';
    el('grid-count').textContent = 'Displaying ' + shown + ' ' +
      (state.mode === 'period' ? 'task' + (shown === 1 ? '' : 's') : 'entr' + (shown === 1 ? 'y' : 'ies')) +
      ' \u00b7 ' + fmtHours(sumOf(list)) + ' h';

    el('btn-collapse').hidden = !openKeys.length;
    el('btn-collapse').dataset.keys = openKeys.join('\u0000');
    syncCollapseBtn(openKeys);
    renderGroupBy();
    renderFilters();
    syncEditNote();
    syncBar();
    syncScrollEdges();
  }

  var ICO_COLLAPSE = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
    '<path d="M4.7 2.7L8 6l3.3-3.3M4.7 13.3L8 10l3.3 3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICO_EXPAND = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
    '<path d="M4.7 6L8 2.7 11.3 6M4.7 10L8 13.3 11.3 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function syncCollapseBtn(keys) {
    var anyOpen = keys.some(function (k) { return collapsed[k] !== true; });
    el('btn-collapse').innerHTML = anyOpen ? ICO_COLLAPSE + 'Collapse all' : ICO_EXPAND + 'Expand all';
  }
  el('btn-collapse').addEventListener('click', function () {
    var keys = (this.dataset.keys || '').split('\u0000').filter(Boolean);
    var anyOpen = keys.some(function (k) { return collapsed[k] !== true; });
    keys.forEach(function (k) { collapsed[k] = anyOpen; });
    render();
  });

  el('grid-body').addEventListener('click', function (e) {
    /* A heading row folds when it is clicked, but its own tick is not a
       fold — picking a group must not also close it. */
    if (e.target.closest('.chk')) return;
    var row = e.target.closest('[data-key]');
    if (!row) return;
    var k = row.getAttribute('data-key');
    collapsed[k] = collapsed[k] !== true;
    render();
  });

  /* ─── Picking what to approve ───────────────────────────────────────
     On the table rather than the body: the day columns are ticked in the
     head, and this runs after the body's own handlers have passed. */
  function togglePick(box) {
    var ref = box.getAttribute('data-pickset');
    if (ref == null) return;
    var list = pickSets[+ref] || [];
    setPick(list, pickState(list) !== 'all');
    render();
  }
  el('grid').addEventListener('click', function (e) {
    var box = e.target.closest('.chk');
    if (box) togglePick(box);
  });
  el('grid').addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    var box = e.target.closest('.chk');
    if (!box) return;
    e.preventDefault();
    togglePick(box);
  });
  el('approval-switch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-approval]');
    if (!b || b.classList.contains('on')) return;
    window.location.href = b.getAttribute('data-approval');
  });
  el('sel-approve').addEventListener('click', rvOpen);
  el('sel-clear').addEventListener('click', function () { clearPick(); render(); });

  el('rv-modal').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-rv-close]')) { rvClose(); return; }
    if (e.target.closest('#rv-one')) {
      var s = rvSheets[rvAt];
      if (!s) return;
      var live = rvLive(s);
      if (!live.length) return;
      approveUnits(live);
      if (!rvAdvance()) { rvRender(); rvClose(); clearPick(); render(); return; }
      rvRender();
      return;
    }
    var pick = e.target.closest('[data-rv]');
    if (pick) { rvAt = +pick.getAttribute('data-rv'); rvRender(); }
  });
  el('rv-all').addEventListener('click', function () {
    var left = [];
    rvSheets.forEach(function (s) { left = left.concat(rvLive(s)); });
    approveUnits(left);
    rvRender();
    rvClose();
    clearPick();
    render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && el('rv-modal').classList.contains('open')) rvClose();
  });

  /* ─── Group by ────────────────────────────────────────────────────── */
  var TICK = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.2l2.4 2.4L9.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* Every field can be hidden except the one the table adds up and the
     ones it is grouped on — dropping those would leave headings with no
     column to sit in. */
  /* Two lists in one panel: what state the entry is in, and whose crew
     it belongs to. The supervisors offered are the ones actually in the
     period, not every name in the system. */
  function supsInPlay() {
    var seen = Object.create(null), out = [];
    ENTRIES.forEach(function (e) { if (e.sup && !seen[e.sup]) { seen[e.sup] = true; out.push(e.sup); } });
    return out.sort();
  }
  function fltRow(group, v, label) {
    var on = state.filters[group][v] === true;
    return '<button class="gb-row' + (on ? ' on' : '') + '" type="button" data-flt="' + group +
      '" data-v="' + Shell.esc(v) + '">' +
      '<span class="cb-box">' + (on ? TICK : '') + '</span>' +
      '<span>' + Shell.esc(label || v) + '</span></button>';
  }
  function fltCount() {
    var n = 0;
    ['status', 'sup'].forEach(function (g) {
      for (var k in state.filters[g]) { if (state.filters[g][k]) n++; }
    });
    return n;
  }
  function renderFilters() {
    el('flt-panel').innerHTML =
      '<div class="gb-head">Status</div>' +
      STATUSES.map(function (s) { return fltRow('status', s); }).join('') +
      '<div class="gb-head">Supervisor</div>' +
      supsInPlay().map(function (s) { return fltRow('sup', s); }).join('');
    var n = fltCount();
    el('flt-count').textContent = n;
    el('flt-count').classList.toggle('is-off', !n);
    el('flt-clear').classList.toggle('is-off', !n);
  }

  function renderCols() {
    el('cols-panel').innerHTML =
      '<div class="gb-head">Show columns</div>' +
      hideable().map(function (f) {
        var lock = locked(f.k);
        var on = lock || !hidden[f.k];
        return '<button class="gb-row' + (on ? ' on' : '') + '" type="button" data-col="' + f.k + '"' +
          (lock ? ' disabled' : '') + '>' +
          '<span class="cb-box">' + (on ? TICK : '') + '</span>' +
          '<span>' + Shell.esc(f.label) + '</span>' +
          (lock ? '<span class="lock">' + (f.k === 'hours' ? 'always' : 'grouped') + '</span>' : '') +
          '</button>';
      }).join('');
  }

  function renderGroupBy() {
    var g = groups();
    /* The count, never the names: the control keeps one width whatever is
       chosen, and the table below is already showing the names in its own
       headings. */
    el('gb-count').textContent = g.length || '0';
    el('gb-count').classList.toggle('is-off', !g.length);
    el('gb-clear').classList.toggle('is-off', !g.length);

    el('gb-panel').innerHTML =
      '<div class="gb-head">Group by, in order</div>' +
      groupable().map(function (f) {
        var at = g.indexOf(f.k);
        var full = at === -1 && g.length >= MAX_GROUPS;
        return '<button class="gb-row' + (at !== -1 ? ' on' : '') + '" type="button" data-gb="' + f.k + '"' +
          (full ? ' disabled' : '') + '>' +
          '<span class="gb-order">' + (at !== -1 ? (at + 1) : '') + '</span>' +
          '<span>' + Shell.esc(f.label) + '</span></button>';
      }).join('') +
      '<div class="gb-why">The table groups on the combination, so the order is the order the ' +
        'columns read in.</div>';
    renderCols();
  }

  var gbWrap = el('gb-wrap'), colsWrap = el('cols-wrap'), fltWrap = el('flt-wrap');
  function openOnly(w) {
    [gbWrap, colsWrap, fltWrap].forEach(function (x) {
      var on = x === w && !x.classList.contains('open');
      x.classList.toggle('open', on);
      x.querySelector('.gb-trigger').setAttribute('aria-expanded', on ? 'true' : 'false');
    });
  }
  el('gb-trigger').addEventListener('click', function (e) { e.stopPropagation(); openOnly(gbWrap); });
  el('cols-trigger').addEventListener('click', function (e) { e.stopPropagation(); openOnly(colsWrap); });
  el('flt-trigger').addEventListener('click', function (e) { e.stopPropagation(); openOnly(fltWrap); });
  el('flt-clear').addEventListener('click', function (e) {
    e.stopPropagation();
    state.filters = { status: Object.create(null), sup: Object.create(null) };
    render();
  });
  el('flt-panel').addEventListener('click', function (e) {
    e.stopPropagation();
    var b = e.target.closest('[data-flt]');
    if (!b) return;
    var g = b.getAttribute('data-flt'), v = b.getAttribute('data-v');
    if (state.filters[g][v]) delete state.filters[g][v]; else state.filters[g][v] = true;
    render();
  });

  el('gb-clear').addEventListener('click', function (e) {
    e.stopPropagation();
    state.groups[state.tab] = [];
    render();
  });

  el('cols-panel').addEventListener('click', function (e) {
    e.stopPropagation();

  /* ─── Edit mode ─────────────────────────────────────────────────── */
  /* What a row still owes before it can be filed. */
  function incomplete() {
    return pending.filter(function (r) {
      return !r.site || !r.sup || !r.project || !r.task ||
        (state.tab !== 'mine' && !r.worker);
    });
  }
  /* The dates this row will actually write to. A row that writes nothing
     is not a change, whatever the counter says. */
  function datesOn(r) {
    var out = [];
    Object.keys(draft || {}).forEach(function (k) {
      if (k.indexOf(r.id + '|') !== 0) return;
      if (Number(draft[k].h) > 0) out.push(k.slice(k.indexOf('|') + 1));
    });
    return out;
  }
  function sameAsExisting(r, d) {
    return ENTRIES.some(function (e) {

        e.sup === r.sup && e.project === r.project && e.task === r.task;
    });
  }
  /* A copy that has not been changed is the row it was copied from. The
     same task cannot sit on the same day twice, so Save waits until
     something about it is different — another day, or another task. */
  function clashRows() {
    return pending.filter(function (r) {
      if (rowGaps(r).length) return false;
      var ds = datesOn(r);
      return ds.length > 0 && ds.every(function (d) { return sameAsExisting(r, d); });
    });
  }
  /* A row with no hours on it never becomes an entry, so saving would
     quietly throw it away. */
  function emptyRows() {
    return pending.filter(function (r) {
      return !rowGaps(r).length && datesOn(r).length === 0;
    });
  }

  /* ─── Saving as you go ─────────────────────────────────────────────
     What is typed is saved as soon as it can be. It cannot be while a day
     is over 24 hours, while a copied row still matches the row it came
     from, or while a new row is still being filled in — and the header
     says which, in the place Save used to stand. One reason at a time,
     the most specific first: a list of everything wrong is a list nobody
     reads. A row being filled in is not an error, so it is said in grey. */
  var saveTimer = null;
  function saveState(st, text, tip) {
    var box = el('save-state');
    box.setAttribute('data-state', st);
    box.textContent = text;
    if (tip) box.setAttribute('data-tip', tip); else box.removeAttribute('data-tip');
  }
  function syncEditNote() {
    var n = Object.keys(draft).length + pending.length;
    var bad = incomplete(), over = badDays(), clash = clashRows(), blank = emptyRows();
    clearTimeout(saveTimer);
    saveTimer = null;
    if (over.length) {
      saveState('error',
        over.length === 1
          ? fmtDay(fromIso(over[0].date)) + ' is over ' + DAY_CAP + ' hours — not saved'
          : over.length + ' days are over ' + DAY_CAP + ' hours — not saved',
        'A day holds ' + DAY_CAP + ' hours. Bring it down and the change saves itself.');
    } else if (clash.length) {
      saveState('error',
        clash.length === 1 ? 'That row is already on the timesheet — not saved'
          : clash.length + ' rows are already on the timesheet — not saved',
        'A copy is the row it was copied from until something on it changes — ' +
        'book it to another day, or name another task.');
    } else if (bad.length) {
      saveState('pending', 'Finish the new row to save it',
        'A new row is saved once it has its site, supervisor, project, task and hours.');
    } else if (blank.length) {
      saveState('pending', 'Add hours to the new row to save it',
        'A row with no hours on it is not saved, so there would be nothing to save.');
    } else if (n) {
      saveState('saving', 'Saving…');
      saveTimer = setTimeout(saveNow, 450);
    } else {
      saveState('idle', 'All changes saved');
    }
  }

  /* Writing what was typed into the entries. Not while a cell or a task
     is open — the table redraws on save, and the field somebody is typing
     into would be pulled out from under them. */
  function saveNow() {
    saveTimer = null;
    if (popKey || tpId) { saveTimer = setTimeout(saveNow, 450); return; }
    /* A pending row with no hours on it never becomes an entry. */
    pending.forEach(function (row) {
      var any = Object.keys(draft).some(function (k) {
        return k.indexOf(row.id + '|') === 0 && draft[k].h > 0;
      });
      if (!any) return;
      delete row.isNew;
      ENTRIES.push(row);
    });
    Object.keys(draft).forEach(function (k) {
      var id = k.slice(0, k.indexOf('|')), date = k.slice(k.indexOf('|') + 1);
      var e = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
      if (!e) return;
      var c = draft[k];
      if (e.date === date) {
        e.hours = c.h; e.start = c.s; e.finish = c.f; e.allowances = c.a || [];
        return;
      }
      /* Filled in another day: that is a new entry on that date, which is
         the whole point of the date being a column. */
      ENTRIES.push(Object.assign({}, e, {
        id: 'e' + (ENTRIES.length + 1000), date: date,
        hours: c.h, start: c.s, finish: c.f, allowances: c.a || []
      }));
    });
    draft = Object.create(null); pending = []; justAdded = null;
    render();
  }


  /* ─── One cell ──────────────────────────────────────────────────────
     Hours, or the times they were worked. Both are recorded because
     different clients record different ones, and times had nowhere to go
     while a cell was a bare number field. */
  var pop = el('cell-pop'), popKey = null, popCell = null;

  /* The clock here is 24-hour, so "6" can only mean 06:00 — which is what
     people type. The field fills itself in when it loses focus rather
     than making anyone punch out the zeros. */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function normTime(v) {
    v = (v || '').trim();
    if (!v) return '';
    var h, m;
    if (/^\d{3,4}$/.test(v)) {                 // 630, 1430
      var n = ('0000' + v).slice(-4);
      h = Number(n.slice(0, 2)); m = Number(n.slice(2));
    } else {
      var p = /^(\d{1,2})[:.\s]?(\d{1,2})?$/.exec(v);
      if (!p) return v;                        // not a time: leave it be
      h = Number(p[1]);
      m = p[2] == null ? 0 : Number(p[2].length === 1 ? p[2] + '0' : p[2]);
    }
    if (h > 23 || m > 59) return v;
    return pad2(h) + ':' + pad2(m);
  }
  function parseTime(v) {
    var t = normTime(v);
    var m = /^(\d{2}):(\d{2})$/.exec(t);
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  function hoursBetween(a, b) {
    var x = parseTime(a), y = parseTime(b);
    if (x == null || y == null) return null;
    var mins = y - x;
    if (mins <= 0) mins += 24 * 60;          // finished after midnight
    return Math.round(mins / 60 * 100) / 100;
  }

  /* The site's allowances, with whatever this cell claims selected. */
  function renderCellAllowances(site, claimed) {
    var list = allowancesFor(site);
    if (!list.length) {
      el('cp-alw').innerHTML = '<div class="alw-empty">This site has no allowances.</div>';
      return;
    }
    var has = (claimed || [])[0] || null, amount = false;
    var opts = '<option value="">None</option>' + list.map(function (a) {
      var on = has && has.name === a.name;
      if (on && a.type === 'amount') amount = true;
      return '<option' + (on ? ' selected' : '') + '>' + Shell.esc(a.name) + '</option>';
    }).join('');
    el('cp-alw').innerHTML = '<div class="alw-pick"><select id="cp-alw-name">' + opts + '</select>' +
      '<input class="alw-qty" id="cp-alw-qty" type="text" inputmode="numeric" placeholder="Qty"' +
      ' value="' + (amount ? has.qty : '') + '"' + (amount ? '' : ' hidden') + ' /></div>';
  }
  function cellAllowances(site) {
    var sel = el('cp-alw-name');
    if (!sel || !sel.value) return [];
    var a = null;
    allowancesFor(site).forEach(function (x) { if (x.name === sel.value) a = x; });
    if (!a) return [];
    if (a.type !== 'amount') return [{ name: a.name, type: 'check' }];
    var q = Number((el('cp-alw-qty') || {}).value);
    return [{ name: a.name, type: 'amount', qty: !q || q < 1 ? 1 : q }];
  }
  el('cp-alw').addEventListener('change', function (e) {
    if (!e.target.closest('#cp-alw-name')) return;
    var sel = el('cp-alw-name'), q = el('cp-alw-qty'), a = null;
    allowancesFor(popSite).forEach(function (x) { if (x.name === sel.value) a = x; });
    var amount = !!a && a.type === 'amount';
    q.hidden = !amount;
    q.value = amount ? (q.value || '1') : '';
  });

  var popSite = '';
  function openCell(btn) {
    popKey = btn.getAttribute('data-cell');
    var id = popKey.slice(0, popKey.indexOf('|')), date = popKey.slice(popKey.indexOf('|') + 1);
    var e = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
    var c = draft && popKey in draft ? draft[popKey]
          : (e && e.date === date
              ? { h: e.hours, s: e.start || '', f: e.finish || '', a: (e.allowances || []).slice() }
              : { h: '', s: '', f: '', a: [] });

    popSite = e ? e.site : '';
    var period = entryModeFor(popSite) === 'period';
    /* The site decides which of the two is the question and which the

    el('cp-times').hidden = !period;
    el('cp-h').disabled = period;
    el('cp-hrow').classList.toggle('derived', period);

  /* What this person's day has left once this cell's own hours are set
     aside — the room the figure being typed has to fit into. */
  function popEntry() {
    if (!popKey) return null;
    var id = popKey.slice(0, popKey.indexOf('|'));
    return ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0] || null;
  }
  function popDate() { return popKey ? popKey.slice(popKey.indexOf('|') + 1) : ''; }
  function roomLeft() {
    var e = popEntry();
    if (!e) return DAY_CAP;
    var own = Number(cellOf(e, popDate()).h) || 0;
    return Math.max(0, Math.round((DAY_CAP - (workerDayTotal(e.worker, popDate()) - own)) * 100) / 100);
  }
  function typedHours() {
    if (entryModeFor(popSite) === 'period') {

    }
    var h = el('cp-h').value.trim().replace(',', '.');
    return h === '' ? 0 : Number(h);
  }
  /* Said as it is typed, beside the field it is typed in. */
  function syncCellErr() {
    if (!popKey) return;
    var left = roomLeft(), v = typedHours(), over = !isNaN(v) && v > left;
    el('cp-err').hidden = !over;

        fmtHours(v) + ' h was entered.';

    if (popCell) popCell.classList.toggle('over', over);

  /* Two cells are the same when they say the same thing, so an editor
     opened and left alone writes nothing and Save stays dark. */
  function sameCell(a, b) {
    if (a.h !== b.h || (a.s || '') !== (b.s || '') || (a.f || '') !== (b.f || '')) return false;
    var x = a.a || [], y = b.a || [];
    if (x.length !== y.length) return false;
    return x.every(function (v, i) {
      return v.name === y[i].name && v.type === y[i].type && (v.qty || 0) === (y[i].qty || 0);
    });

    if (!popKey) return;

    } else {

    /* Nobody works more than a day in a day — but silently cutting what

       say. The figure is kept, the cell is marked, and Save is what
       refuses until the day adds up. */
    if (e) {

            : (e && e.date === date
                ? { h: e.hours, s: e.start || '', f: e.finish || '', a: (e.allowances || []).slice() }
                : { h: '', s: '', f: '', a: [] });

    popCell = null;

  }

  /* Times win when both are given, because they are the more specific
     answer — and the figure they imply is shown as it is typed. */
  /* Hours and the times are two ways of saying the same thing, so typing
     one lets go of the other — otherwise a number typed over a cell that

  el('cp-h').addEventListener('input', function () {
    el('cp-s').value = '';

  });

  ['cp-s', 'cp-f'].forEach(function (id) {
    el(id).addEventListener('input', function () {

    el(id).addEventListener('blur', function () {
      this.value = normTime(this.value);

      if (v != null) el('cp-h').value = fmtHours(v);
    });
  });
  el('cp-clear').addEventListener('click', function () {
    if (popKey) draft[popKey] = { h: 0, s: '', f: '', a: [] };

  pop.addEventListener('click', function (e) { e.stopPropagation(); });
  pop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitCell(); }
    /* Escape keeps nothing — and must not travel on, or the page's own
       Escape would end the whole edit. */
    if (e.key === 'Escape') { e.stopPropagation(); closeCell(); }
  });

  window.addEventListener('scroll', function () { if (popKey) commitCell(); }, true);

  el('grid-body').addEventListener('click', function (e) {
    var cell = e.target.closest('.hr-cell');
    if (!cell || cell.disabled) return;
    e.stopPropagation();
    /* Committing re-renders, so the cell just clicked is detached by the
       time it would be opened — it is found again by what it was. */
    var k = cell.getAttribute('data-cell');
    if (popKey) commitCell();
    var fresh = null;
    [].forEach.call(document.querySelectorAll('.hr-cell'), function (x) {
      if (!fresh && x.getAttribute('data-cell') === k) fresh = x;
    });
    openCell(fresh || cell);
  });

  el('grid-body').addEventListener('input', function (e) {
    var sel = e.target.closest('.cell-input');
    if (!sel) return;
    var row = pending.filter(function (x) { return x.id === sel.getAttribute('data-row'); })[0];
    if (!row) return;
    var k = sel.getAttribute('data-field'), was = row[k];
    row[k] = sel.value;
    /* Hours are kept against a date, so moving the row to another day has
       to take them with it — otherwise the figure stays booked to the day
       it was typed on and the row saves to two days at once. */
    if (k === 'date' && was !== row.date) {
      Object.keys(draft || {}).forEach(function (key) {
        if (key !== row.id + '|' + was) return;
        draft[row.id + '|' + row.date] = draft[key];
        delete draft[key];
      });
    }
    /* The site is what the other answers are drawn from, so changing it
       lets go of the ones that came from the old one — and does not
       guess the new ones. A site runs several supervisors and several
       projects, and a guess printed as an answer is read as one. */
    if (k === 'site') { row.levels = []; row.task = ''; row.sup = ''; row.project = ''; }
    render();
  });

  el('grid-body').addEventListener('click', function (e) {
    var drop = e.target.closest('[data-drop]');
    if (!drop) return;
    e.stopPropagation();
    var id = drop.getAttribute('data-drop');
    pending = pending.filter(function (x) { return x.id !== id; });
    Object.keys(draft || {}).forEach(function (k) { if (k.indexOf(id + '|') === 0) delete draft[k]; });
    render();
  });

  /* ─── Add a task ────────────────────────────────────────────────────
     Not a dialog. Add task drops an empty row at the top of the table and
     the row itself is the form: every answer is a cell, on the line the
     answer will live on. Which cells those are depends on the view —
     Entries has a column per field, Period has one, the task. */
  function supervisorOn(date, site) {
    var found = null;
    ENTRIES.forEach(function (e) { if (!found && e.date === date && e.site === site) found = e.sup; });
    return found;
  }

  /* The day the week is sitting on, so the row lands somewhere real. */
  function defaultDate() {
    var ds = days(), t = iso(TODAY);

    return ds.length ? iso(ds[0]) : t;
  }

  var nSeq = 0;
  /* What a row still has to be asked for. */
  function rowGaps(r) {

    if (state.tab !== 'mine' && !r.worker) out.push('worker');
    if (!r.task) out.push('task');

  /* A seed is whatever is already settled: the group the add was started

  function addInlineRow(seed) {
    if (popKey) commitCell();
    closeTaskPop();
    var row = {
      id: 'n' + (++nSeq), date: defaultDate(),
      site: '', sup: '', worker: state.tab === 'mine' ? ME : '',
      project: '', task: '', levels: [], status: 'Draft',
      allowances: [], start: '', finish: '', hours: '', isNew: true
    };
    Object.keys(seed || {}).forEach(function (k) { if (seed[k]) row[k] = seed[k]; });
    pending.unshift(row);
    justAdded = row.id;
    addedOn = row.date;
    render();
    /* After this click has finished travelling: the close-on-outside
       handler is still on its way up and would shut the editor again. */
    setTimeout(function () {
      var tr = document.querySelector('tr.just-added');
      if (tr) tr.scrollIntoView({ block: 'center' });
      /* A copy is already answered — it only wants its hours, so nothing
         is opened over it. */
      if (!rowGaps(row).length) return;
      var btn = document.querySelector('[data-task="' + row.id + '"]');
      /* Period has nowhere else to ask, so it asks at once. Entries has
         the whole row, so it starts at the first blank on it. */
      if (state.mode === 'period' && rowGaps(row).indexOf('task') !== -1) {
        if (btn) openTaskPop(btn);

      if (first) first.focus();

  }
  el('btn-new-task').addEventListener('click', function () { addInlineRow(null); });

  /* A heading already says what it groups by, so a row started from one

  function seedFromKey(key) {
    var vals = String(key || '').split('\u00a7').slice(1);
    var g = groups(), seed = {};
    vals.forEach(function (v, i) {
      if (!g[i] || v === '\u2014') return;
      seed[g[i]] = v;
    });
    /* The date is a value in Entries and a column in Period; either way
       it is a date, not a field the row has to be told twice. */
    if (seed.date) { var d = fromIso(seed.date); if (isNaN(d)) delete seed.date; }
    return seed;
  }

  el('grid-body').addEventListener('click', function (e) {
    var add = e.target.closest('[data-addhere]');
    if (!add) return;
    e.stopPropagation();
    addInlineRow(seedFromKey(add.getAttribute('data-addhere')));
  });

  /* The same task again, on another day. Everything that said what the
     row was for is copied; the hours are not, because those are the
     thing being written. */
  el('grid-body').addEventListener('click', function (e) {
    var dup = e.target.closest('[data-dup]');
    if (!dup) return;
    e.stopPropagation();
    var id = dup.getAttribute('data-dup');
    var src = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
    if (!src) return;
    addInlineRow({
      date: src.date, site: src.site, sup: src.sup, worker: src.worker,
      project: src.project, task: src.task,
      levels: String(src.task || '').split(' | ').filter(Boolean)
    });
  });

  /* ─── The task, and whatever the view has no column for ───────────── */
  var tpop = el('task-pop'), tpId = null;
  function tpRow() { return pending.filter(function (x) { return x.id === tpId; })[0] || null; }

  function tpFields(r) {
    var out = [];
    /* Period shows one column, so the rest of the row is asked here —
       except for what grouping has put back on screen as a column of its
       own, which the row asks for in that column. */
    if (state.mode === 'period') {
      var g = groups();
      var ask = function (k, name) { if (g.indexOf(k) === -1) out.push({ k: k, name: name }); };
      ask('site', 'Site');
      if (state.tab !== 'mine') ask('worker', 'Worker');
      ask('sup', 'Supervisor');
      ask('project', 'Project');
    }
    (SITE_FIELDS[r.site] || []).forEach(function (f, i) {
      out.push({ k: 'lvl' + i, name: f.name, values: f.values });
    });
    return out;
  }

  function renderTaskPop() {
    var r = tpRow();
    if (!r) return;
    var html = tpFields(r).map(function (f) {
      var lvl = f.k.indexOf('lvl') === 0;
      var vals = lvl ? f.values : optsFor(r, f.k).map(function (o) { return o.v; });
      var cur = lvl ? (r.levels[Number(f.k.slice(3))] || '') : (r[f.k] || '');
      return '<label class="tp-fld"><span class="tp-lab">' + Shell.esc(f.name) + '</span>' +
        '<select class="cell-input' + (cur ? '' : ' need') + '" data-tp="' + f.k + '">' +
        '<option value="">Select\u2026</option>' +
        vals.map(function (v) {
          return '<option' + (v === cur ? ' selected' : '') + '>' + Shell.esc(v) + '</option>';
        }).join('') + '</select></label>';
    }).join('');
    el('tp-fields').innerHTML = html ||
      '<div class="alw-empty">Choose the site on the row first.</div>';
  }

  /* The editor follows the cell it belongs to, the way the hours one
     does — and the cell is rebuilt on every answer, so it is found again
     by the row it is for rather than held on to. */
  function anchorTaskPop() {
    var btn = document.querySelector('[data-task="' + tpId + '"]');
    if (!btn) { closeTaskPop(); return; }
    var r = btn.getBoundingClientRect();
    var top = r.bottom + 6, left = r.left;
    if (top + tpop.offsetHeight > window.innerHeight - 8) top = r.top - tpop.offsetHeight - 6;
    if (left + tpop.offsetWidth > window.innerWidth - 8) left = window.innerWidth - tpop.offsetWidth - 8;
    tpop.style.top = Math.max(8, top) + 'px';
    tpop.style.left = Math.max(8, left) + 'px';
  }
  function openTaskPop(btn) {
    tpId = btn.getAttribute('data-task');
    if (!tpRow()) { tpId = null; return; }
    tpop.classList.add('open');
    renderTaskPop();
    anchorTaskPop();
    var first = tpop.querySelector('select:not(:disabled)');
    if (first) first.focus();
  }
  function closeTaskPop() { tpop.classList.remove('open'); tpId = null; }

  el('tp-fields').addEventListener('change', function (ev) {
    var sel = ev.target.closest('[data-tp]');
    var r = tpRow();
    if (!sel || !r) return;
    var k = sel.getAttribute('data-tp');
    if (k.indexOf('lvl') === 0) r.levels[Number(k.slice(3))] = sel.value;
    else {
      r[k] = sel.value;
      if (k === 'site') { r.levels = []; r.sup = ''; r.project = ''; }
    }
    /* A task is its levels, in order, as far as they have been given. */
    r.task = (r.levels || []).filter(Boolean).join(' | ');
    renderTaskPop();
    render();
    anchorTaskPop();
  });

  el('tp-clear').addEventListener('click', function () {
    var r = tpRow();
    if (!r) return;
    r.levels = []; r.task = '';
    renderTaskPop();
    render();
    anchorTaskPop();
  });
  el('tp-done').addEventListener('click', closeTaskPop);

  tpop.addEventListener('click', function (e) { e.stopPropagation(); });
  tpop.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.stopPropagation(); closeTaskPop(); }
  });
  document.addEventListener('click', function () { if (tpId) closeTaskPop(); });
  window.addEventListener('scroll', function () { if (tpId) anchorTaskPop(); }, true);

  el('grid-body').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-task]');
    if (!btn) return;
    e.stopPropagation();
    if (popKey) commitCell();
    var id = btn.getAttribute('data-task');
    if (tpId === id) { closeTaskPop(); return; }
    closeTaskPop();
    /* Committing the hours editor re-renders, so the button just clicked
       may already be detached — it is found again by the row it is for. */
    openTaskPop(document.querySelector('[data-task="' + id + '"]') || btn);
  });

  /* ─── Entries or Period ─────────────────────────────────────────── */
  el('modeswitch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mode]');
    if (!b) return;
    state.mode = b.getAttribute('data-mode');
    this.querySelectorAll('.seg-btn').forEach(function (x) { x.classList.toggle('active', x === b); });
    collapsed = Object.create(null);
    render();
  });

  render();
})();
</script>
</body>
</html>
