<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave Requests — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style>
  /* ─── Leave Requests ────────────────────────────────────────────────
     Built to the shape of the Expense Claims manager screen: a tab per
     state, one row per request, and a details dialog with the queue down
     its left edge so a manager can work through the pile without going
     back to the table. What differs is what a request is made of —
     a stretch of days rather than an amount, and a balance it comes out
     of. */

  /* Several blocks here set display, which beats the browser's own
     [hidden] rule — so say it louder. */
  [hidden] { display: none !important; }

  .lr-caption { font-size: 14px; font-weight: 500; color: var(--text-main); margin-top: 4px; }

  /* ─── Tabs ──────────────────────────────────────────────────────── */
  .lr-tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--grey-300); }
  .lr-tab {
    position: relative; height: 36px; padding: 0 14px; border: none; background: none;
    cursor: pointer; font-family: var(--fs-sans); font-size: 14px; font-weight: 500;
    color: var(--grey-600); white-space: nowrap;
  }
  .lr-tab:hover { color: var(--text-main); }
  .lr-tab.on { color: var(--primary); }
  .lr-tab.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--primary); border-radius: 2px 2px 0 0;
  }
  .lr-tab .n { color: inherit; }

  /* ─── Table ─────────────────────────────────────────────────────── */
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who .av {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--white);
  }
  .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.col-view, th.col-view { text-align: right; }
  .view-link {
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; color: var(--primary);
  }
  .view-link:hover { text-decoration: underline; }
  #lr-table td { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lr-when { font-weight: 500; }
  .lr-empty { padding: 40px 16px; text-align: center; color: var(--grey-600); font-size: 14px; }

  /* ─── Details dialog ────────────────────────────────────────────────
     Queue on the left, the request in the middle, whatever was attached
     to it on the right — the manager's three questions in reading
     order: what else is waiting, what is this, and is it evidenced. */
  /* The roster needs the room: 64px a day over four weeks does not fit
     in a dialog sized for a form. */
  /* Sized to what is in it. The old 96vw × 90vh was cut for a roster
     that ran the width of the screen; a calendar is a compact thing and
     the rest was empty dialog. */
  .rd-modal { width: min(96vw, 1340px); max-width: 96vw; height: auto; max-height: 90vh; }
  .rd-queue-list { max-height: none; }
  .rd-body { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  .rd-queue { border-right: 1px solid var(--grey-300); display: flex; flex-direction: column; min-height: 0; }
  .rd-queue-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px 16px; font-size: 14px; font-weight: 500; color: var(--text-main);
  }
  .rd-queue-list { overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .rd-q-item {
    text-align: left; border: none; background: none; cursor: pointer;
    padding: 10px 12px; border-radius: 8px; font-family: var(--fs-sans);
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .rd-q-item:hover { background: var(--grey-100); }
  .rd-q-item.on { background: var(--grey-200); }
  .rd-q-item .t { font-size: 14px; font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-q-item .s { font-size: 12px; color: var(--grey-600); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .rd-main-head {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--grey-300);
  }
  .rd-main-title { font-size: 15px; font-weight: 600; color: var(--text-main); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .btn-reject {
    height: 36px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-350);
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; color: var(--grey-800);
  }
  .btn-reject:hover { border-color: var(--error); color: var(--error); }

  /* The request is read once; the roster is scanned, so it takes the
     room. */
  /* start, not stretch: the details card is as tall as what it says. */
  .rd-split {
    display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px;
    padding: 20px 24px; min-height: 0; overflow: auto; align-items: start;
  }
  .rd-card { border: 1px solid var(--grey-350); border-radius: 10px; padding: 16px; }
  .rd-card-title { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
  .rd-rows { display: grid; grid-template-columns: 116px 1fr; gap: 10px 16px; align-items: baseline; }
  .rd-rows dt { font-size: 13px; color: var(--grey-600); }
  .rd-rows dd { font-size: 14px; color: var(--text-main); margin: 0; }
  .rd-note { font-size: 13px; line-height: 18px; color: var(--grey-700); }

  /* The attachment pane, with the viewer's own controls — the same set
     the expense screen carries, since it is the same kind of thing. */
  .rd-doc { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  /* ─── The worker's roster ───────────────────────────────────────────
     The rostering screen's own board, to its own measurements: a 285px
     sticky label column, 64px a day, a 56×24 block in each cell, rows of
     32/32/36 for project, position and worker, and the same hover rings.
     Copied rather than approximated, because a board a manager already
     reads daily should not be a second dialect of itself. */
  .rd-roster {
    position: relative;
    display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0;
    border: 1px solid var(--grey-350); border-radius: 10px; padding: 16px;
  }
  .rd-roster-head { display: flex; align-items: center; gap: 12px; }
  .ros-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .ros-month { font-size: 13px; color: var(--grey-700); min-width: 150px; text-align: center; }

  .ros-clash { font-size: 13px; line-height: 18px; }
  .ros-clash.hit { color: var(--error); font-weight: 500; }
  .ros-clash.free { color: #289e1a; font-weight: 500; }
  .ros-clash .ros-off {
    display: block; margin-top: 2px; font-weight: 400; color: var(--grey-600);
  }

  /* ─── Two months, side by side ──────────────────────────────────
     Never one, never three: a request near a month boundary needs the
     next month whatever its length, and a length-dependent view is one
     more thing to understand before you can read it. Scrolls freely
     both ways, because a manager checking a clash often wants the week
     before it as much as the week of it. */
  .ros-cal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; min-width: 0; }
  .cal-m-head {
    font-size: 13px; font-weight: 600; color: var(--text-main);
    height: 22px; display: flex; align-items: center;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal-dow {
    height: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; color: var(--grey-600);
  }
  /* Every day is a cell of the same size whether or not anything is on
     it, so the shape of a month is the shape of the month. */
  .cal-day {
    position: relative; height: 34px; border-radius: 6px; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--fs-sans); font-size: 12.5px; color: var(--text-main);
    background: none; cursor: default;
  }
  .cal-day.out { color: var(--grey-400); }
  .cal-day.on { cursor: pointer; }
  .cal-day.on:hover, .cal-day.open { box-shadow: 0 0 0 1px var(--primary); }
  /* The days being asked for, drawn over whatever is under them: the
     question is what the leave lands on, so both have to be legible. */
  .cal-day.req { box-shadow: inset 0 0 0 1.5px var(--primary); font-weight: 600; color: var(--primary); }
  .cal-day.req.on:hover, .cal-day.req.open { box-shadow: inset 0 0 0 1.5px var(--primary), 0 0 0 1px var(--primary); }
  .cal-day.today::after {
    content: ''; position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
    width: 12px; height: 2px; border-radius: 1px; background: var(--grey-600);
  }

  /* Hover says it on a desktop, a tap says it on a tablet — the same
     three lines either way. */
  /* Placed against the window, not against the card: a calendar is only
     six rows tall, and a panel kept inside it had nowhere to go but over
     the month it was explaining. */
  .cal-pop {
    position: fixed; z-index: 340; width: 232px; padding: 10px 12px;
    border-radius: 8px; background: var(--white);
    border: 1px solid var(--grey-300); box-shadow: var(--shadow-dropdown);
  }
  .cal-pop[hidden] { display: none; }
  .cal-pop .cp-when { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
  .cal-pop .cp-when .req { color: var(--primary); font-weight: 600; }
  .cal-pop dl { display: grid; grid-template-columns: 74px 1fr; gap: 3px 10px; margin: 0; }
  .cal-pop dt { font-size: 11px; color: var(--grey-600); }
  .cal-pop dd { font-size: 12px; line-height: 16px; color: var(--text-main); margin: 0; }
  .cal-pop .cp-sep { height: 1px; background: var(--grey-300); margin: 8px 0; }
  .cal-pop .cp-none { font-size: 12px; color: var(--grey-600); }

  .ros-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11px; color: var(--grey-600); }
  .ros-key span { display: inline-flex; align-items: center; gap: 6px; }
  .ros-key .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw-day { background: #cfe0f7; } .sw-night { background: #f6cff6; }
  .sw-travel { background: #b9e3e6; }
  .sw-leave { background: rgba(0,51,255,0.07); box-shadow: inset 0 0 0 1px rgba(0,51,255,0.4); }
  .rd-doc-bar { display: flex; align-items: center; gap: 6px; }
  .doc-btn {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-350); color: var(--grey-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .doc-btn:hover { border-color: var(--primary); color: var(--primary); }
  .doc-btn:disabled { color: var(--grey-400); cursor: default; border-color: var(--grey-350); }
  .doc-page { font-size: 12px; color: var(--grey-600); margin: 0 4px; }
  .rd-doc-bar .right { margin-left: auto; display: flex; gap: 6px; }
  .rd-doc-stage {
    flex: 1; min-height: 220px; border-radius: 10px; background: var(--grey-100);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .doc-sheet {
    background: var(--white); border-radius: 4px; padding: 20px 22px; width: 240px;
    box-shadow: 0 2px 10px rgba(8,17,21,0.12); transform-origin: center;
  }
  .doc-sheet h4 { font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; }
  .doc-sheet p { font-size: 10px; line-height: 15px; color: var(--grey-700); }
  .doc-none { font-size: 13px; color: var(--grey-600); }

  /* ─── A phone gets one column ───────────────────────────────────── */
  body.is-narrow .rd-modal { height: auto; max-height: 88vh; }
  body.is-narrow .rd-modal { max-width: 100vw; width: 100%; height: auto; max-height: 88vh; }
  body.is-narrow .rd-body { grid-template-columns: 1fr; }
  body.is-narrow .rd-queue { display: none; }
  body.is-narrow .rd-split { grid-template-columns: 1fr; }
  /* One month at a time once there is no room for two side by side. */
  body.is-narrow .ros-cal { grid-template-columns: 1fr; }
  body.is-narrow .lr-tabs { overflow-x: auto; }
</style>
</head>
<body data-module="leave">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <div class="page-header">
        <h1 class="page-title">Leave Requests</h1>
      </div>

      <div class="search-wrap">
        <label class="search-bar">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input class="search-input-el" id="search" type="text" placeholder="Search" autocomplete="off" />
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </label>
      </div>

      <div class="lr-tabs" id="lr-tabs"></div>
      <div class="lr-caption" id="lr-caption"></div>

      <div class="table-card">
        <div class="table-scroll">
          <table id="lr-table">
            <colgroup>
              <col style="width:215px" /><col style="width:180px" /><col style="width:200px" />
              <col style="width:150px" /><col style="width:72px" /><col style="width:78px" />
              <col /><col style="width:150px" /><col style="width:130px" /><col style="width:90px" />
            </colgroup>
            <thead>
              <!-- A manager's question is when someone is away, so that is
                   the heading of the row rather than the kind of leave. -->
              <tr>
                <th>Dates</th><th>Worker</th><th>Site</th>
                <th>Leave Type</th>
                <th class="num" data-tip="Working days &mdash; weekends are not counted">Days</th>
                <th class="num" data-tip="Hours are only given for a single day">Hours</th>
                <th>Description</th><th>Approver</th><th>Created</th><th class="col-view"></th>
              </tr>
            </thead>
            <tbody id="lr-body"></tbody>
          </table>
        </div>
        <div class="lr-empty" id="lr-empty" hidden></div>
      </div>

    </div>
  </main>
</div>

<!-- ── Request details ──────────────────────────────────────────── -->
<div class="modal-backdrop" id="rd-modal" role="dialog" aria-modal="true" aria-labelledby="rd-title">
  <div class="modal rd-modal">
    <div class="modal-header">
      <div class="modal-heading">
        <span class="modal-title" id="rd-title">Request Details</span>
      </div>
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body rd-body">
      <div class="rd-queue">
        <div class="rd-queue-head">
          <span id="rd-queue-title">All Pending Requests</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.5 12h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <div class="rd-queue-list" id="rd-queue-list"></div>
      </div>

      <div class="rd-main">
        <div class="rd-main-head">
          <span class="rd-main-title" id="rd-main-title"></span>
          <div class="rd-actions" id="rd-actions">
            <button class="btn-primary" type="button" id="rd-approve">Approve</button>
            <button class="btn-reject" type="button" id="rd-reject">Reject</button>
          </div>
        </div>

        <div class="rd-split">
          <div class="rd-card">
            <div class="rd-card-title">Details</div>
            <dl class="rd-rows" id="rd-rows"></dl>
          </div>

          <!-- The roster is the evidence for a leave request the way a
               receipt is for a claim: the question a manager actually has
               is whether this person is already standing on a shift in
               those days, and nothing else on the screen answers it. -->
          <div class="rd-roster">
            <div class="rd-roster-head">
              <span class="rd-card-title" id="ros-title">Roster</span>
              <span class="ros-nav">
                <button class="doc-btn" type="button" id="ros-prev" aria-label="Earlier">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <span class="ros-month" id="ros-month"></span>
                <button class="doc-btn" type="button" id="ros-next" aria-label="Later">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </span>
            </div>
            <div class="ros-clash" id="ros-clash"></div>
            <div class="ros-cal" id="ros-cal"></div>
            <div class="ros-key">
              <span><i class="sw sw-day"></i>Day shift</span>
              <span><i class="sw sw-night"></i>Night shift</span>
              <span><i class="sw sw-travel"></i>Travel</span>
              <span><i class="sw sw-leave"></i>Requested leave</span>
            </div>
            <!-- Hover on a desktop, tap on a tablet: the same three
                 lines either way, next to the day they are about. -->
            <div class="cal-pop" id="cal-pop" hidden></div>
          </div>

          <div class="rd-doc" hidden>
            <div class="rd-doc-bar">
              <button class="doc-btn" type="button" id="doc-out" aria-label="Zoom out">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 7h4M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              </button>
              <button class="doc-btn" type="button" id="doc-in" aria-label="Zoom in">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 7h4M7 5v4M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              </button>
              <button class="doc-btn" type="button" id="doc-prev" aria-label="Previous page">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="doc-page" id="doc-page">1/1</span>
              <button class="doc-btn" type="button" id="doc-next" aria-label="Next page">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="right">
                <button class="doc-btn" type="button" aria-label="Download" data-tip="Download">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2.5v7m0 0L5.5 7M8 9.5L10.5 7M3 12.5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="doc-btn" type="button" aria-label="Open" data-tip="Open in a new tab">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M11.2 2.8l2 2L6 12H4v-2l7.2-7.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                </button>
              </span>
            </div>
            <div class="rd-doc-stage" id="doc-stage"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  function el(id) { return document.getElementById(id); }

  /* ─── Mock data ───────────────────────────────────────────────────
     Hardcoded, as in every other OPMS prototype — there is no backend. */
  var TYPES = ['Annual Leave', 'Sick Leave', 'Parental Leave', 'Unpaid Leave'];
  /* A request belongs to a site, and is approved by a person — both are
     part of what is being decided, so both travel on the request. */
  var SITES = ['MMA VIGILANT \u2013 360', 'MMA VIGILANT ROV', 'SA BHP OLYMPIC DAM',
    'GDR09 Factory Shutdown', 'GDR12 Tank Farm Shutdown'];
  var APPROVERS = ['Grace Okafor', 'Tom Halloran', 'Priya Nair', 'Marcus Webb', 'Olivia Rhye'];

  var WORKERS = [
    { name: 'John Sith',    colour: '#3b7dd8' },
    { name: 'Emma Stone',   colour: '#c4845c' },
    { name: 'Sophia Adams', colour: '#7b6c9e' },
    { name: 'Olivia Brown', colour: '#4a9b6f' },
    { name: 'Olivia Rhye',  colour: '#b85555' },
    { name: 'Liam Baker',   colour: '#3a7ab5' },
    { name: 'Noah Davis',   colour: '#5b8c8c' },
    { name: 'Ava Miller',   colour: '#8b7355' }
  ];
  function worker(n) { return WORKERS.filter(function (w) { return w.name === n; })[0] || WORKERS[0]; }
  function initials(n) { return n.split(' ').map(function (p) { return p[0]; }).join('').slice(0, 2); }

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmt(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  /* A stretch of days reads as one thing when it is one month, and as
     two when it crosses one. */
  function fmtRange(a, b) {
    if (a === b) return fmt(a);
    var x = new Date(a + 'T00:00:00'), y = new Date(b + 'T00:00:00');
    if (x.getMonth() === y.getMonth() && x.getFullYear() === y.getFullYear()) {

  /* Fixed to the window, so a scroll would leave it behind the day it
     belongs to. */
  window.addEventListener('scroll', hidePop, true);

  function renderDoc(r) {
    page = 1; zoom = 1;
    var pages = r.doc ? 2 : 0;
    el('doc-page').textContent = pages ? page + '/' + pages : '—';
    el('doc-prev').disabled = true;
    el('doc-next').disabled = pages < 2;
    el('doc-in').disabled = !pages;
    el('doc-out').disabled = !pages;
    el('doc-stage').innerHTML = r.doc
      ? '<div class="doc-sheet" id="doc-sheet"><h4>' + Shell.esc(r.doc) + '</h4>' +
        '<p>Patient: ' + Shell.esc(r.who) + '<br />Issued: ' + Shell.esc(fmt(r.made)) + '<br />' +
        'Unfit for work from ' + Shell.esc(fmt(r.from)) + ' to ' + Shell.esc(fmt(r.to)) + '.</p></div>'
      : '<span class="doc-none">Nothing was attached to this request.</span>';
    el('doc-stage').dataset.pages = pages;
  }
  function syncDoc() {
    var sheet = el('doc-sheet');
    if (sheet) sheet.style.transform = 'scale(' + zoom + ')';
    var pages = Number(el('doc-stage').dataset.pages || 0);
    el('doc-page').textContent = pages ? page + '/' + pages : '—';
    el('doc-prev').disabled = page <= 1;
    el('doc-next').disabled = page >= pages;
  }
  el('doc-in').addEventListener('click', function () { zoom = Math.min(1.8, zoom + 0.2); syncDoc(); });
  el('doc-out').addEventListener('click', function () { zoom = Math.max(0.6, zoom - 0.2); syncDoc(); });
  el('doc-prev').addEventListener('click', function () { page = Math.max(1, page - 1); syncDoc(); });
  el('doc-next').addEventListener('click', function () {
    page = Math.min(Number(el('doc-stage').dataset.pages || 1), page + 1); syncDoc();
  });

  function openRequest(id) {
    openId = id;
    var r = byId(id);
    /* Open a few days before the request, so what leads up to it is on
       screen as well as the request itself. */
    rosAnchor = monthStart(new Date(r.from + 'T00:00:00'));
    renderQueue();
    renderDetails();
    /* Shown first: the band's edges are measured off the day headings,
       and a dialog that is still display:none measures as nothing. */
    modal.classList.add('open');
    renderRoster();
  }
  function closeModal() { hidePop(); modal.classList.remove('open'); openId = null; }

  el('lr-body').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]');
    var tr = e.target.closest('tr[data-id]');
    if (b) { openRequest(Number(b.getAttribute('data-view'))); return; }
    if (tr) openRequest(Number(tr.getAttribute('data-id')));
  });
  el('rd-queue-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-q]');
    if (b) openRequest(Number(b.getAttribute('data-q')));
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal || e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  /* Settling a request moves it to another tab, so the queue it was in
     is one shorter — the next one in that queue opens, since working
     through the pile is the whole job. */
  function settle(to, verb) {
    var r = byId(openId);
    var queue = rowsFor(r.state, state.q.toLowerCase());
    var at = queue.map(function (x) { return x.id; }).indexOf(r.id);
    r.state = to;
    var next = queue[at + 1] || queue[at - 1] || null;
    render();
    Shell.snackbar(verb + ' ' + r.who + '’s ' + r.type.toLowerCase() + '.');
    if (next && next.state === state.tab) openRequest(next.id);
    else closeModal();
  }
  el('rd-approve').addEventListener('click', function () { settle('approved', 'Approved'); });
  el('rd-reject').addEventListener('click', function () { settle('rejected', 'Rejected'); });

  render();
})();
</script>
</body>
</html>
