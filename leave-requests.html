<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave Requests — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style>
  /* Graphite: not a status, not a brand colour, readable over every
     fill a day cell can take. */
  :root { --mark: #3d4659; }
  /* ─── Leave Requests ────────────────────────────────────────────────
     Built to the shape of the Expense Claims manager screen: a tab per
     state, one row per request, and a details dialog with the queue down
     its left edge so a manager can work through the pile without going
     back to the table. What differs is what a request is made of —
     a stretch of days rather than an amount, and a balance it comes out
     of. */

  /* Several blocks here set display, which beats the browser's own
     [hidden] rule — so say it louder. */
  [hidden] { display: none !important; }

  .lr-caption { font-size: 14px; font-weight: 500; color: var(--text-main); margin-top: 4px; }

  /* ─── Tabs ──────────────────────────────────────────────────────── */
  .lr-tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--grey-300); }
  .lr-tab {
    position: relative; height: 36px; padding: 0 14px; border: none; background: none;
    cursor: pointer; font-family: var(--fs-sans); font-size: 14px; font-weight: 500;
    color: var(--grey-600); white-space: nowrap;
  }
  .lr-tab:hover { color: var(--text-main); }
  .lr-tab.on { color: var(--primary); }
  .lr-tab.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--primary); border-radius: 2px 2px 0 0;
  }
  .lr-tab .n { color: inherit; }

  /* ─── Table ─────────────────────────────────────────────────────── */
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who .av {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--white);
  }
  .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  /* The table is wider than most screens, and the one control on the
     row was the first thing to scroll off it. It stays put, with a rule
     down its left so it reads as its own column. */
  td.col-view, th.col-view {
    position: sticky; right: 0; z-index: 2; text-align: right;
    background: var(--white); box-shadow: inset 1px 0 0 var(--grey-350);
  }
  #lr-table thead th.col-view { z-index: 6; }
  #lr-body tr:hover td.col-view { background: #fafbfe; }
  .view-link {
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; color: var(--primary);
  }
  .view-link:hover { text-decoration: underline; }
  #lr-table td { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lr-when { font-weight: 500; }
  /* Picking several at once. Only the pending tab has anything to act
     on, so only it carries the column. */
  td.col-pick, th.col-pick { padding-right: 0; }
  .lr-check {
    width: 16px; height: 16px; margin: 0; cursor: pointer;
    accent-color: var(--primary);
  }
  /* The bar stands in for the caption rather than appearing under it:
     one line in that place, saying either what the tab is or what has
     been picked out of it. */
  /* A line of controls, not a panel. A tinted box here only drew the
     eye to the fact that something was ticked, which the ticks already
     say, and the blue is the product's acting colour. */
  .lr-bulk {
    display: flex; align-items: center; gap: 12px;
    margin: 10px 0 2px; min-height: 36px;
  }
  .lr-bulk[hidden] { display: none; }
  .lr-bulk .n { font-size: 14px; font-weight: 600; color: var(--text-main); }
  .lr-bulk .sp { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .lr-bulk .btn-text {
    border: none; background: none; cursor: pointer; padding: 0 4px;
    font-family: var(--fs-sans); font-size: 13px; color: var(--grey-700);
  }
  .lr-bulk .btn-text:hover { color: var(--text-main); }
  body.has-picked .lr-caption { display: none; }
  .lr-empty { padding: 40px 16px; text-align: center; color: var(--grey-600); font-size: 14px; }

  /* ─── Details dialog ────────────────────────────────────────────────
     Queue on the left, the request in the middle, whatever was attached
     to it on the right — the manager's three questions in reading
     order: what else is waiting, what is this, and is it evidenced. */
  /* The roster needs the room: 64px a day over four weeks does not fit
     in a dialog sized for a form. */
  /* Sized to what is in it. The old 96vw × 90vh was cut for a roster
     that ran the width of the screen; a calendar is a compact thing and
     the rest was empty dialog. */
  .rd-modal { width: min(96vw, 1340px); max-width: 96vw; height: auto; max-height: 90vh; }
  .rd-queue-list { max-height: none; }
  .rd-body { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  .rd-queue { border-right: 1px solid var(--grey-300); display: flex; flex-direction: column; min-height: 0; }
  .rd-queue-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px 16px; font-size: 14px; font-weight: 500; color: var(--text-main);
  }
  .rd-queue-list { overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .rd-q-item {
    text-align: left; border: none; background: none; cursor: pointer;
    padding: 10px 12px; border-radius: 8px; font-family: var(--fs-sans);
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .rd-q-item:hover { background: var(--grey-100); }
  .rd-q-item.on { background: var(--grey-200); }
  .rd-q-item .t { font-size: 14px; font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-q-item .s { font-size: 12px; color: var(--grey-600); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .rd-main-head {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--grey-300);
  }
  .rd-main-title { font-size: 15px; font-weight: 600; color: var(--text-main); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .btn-reject {
    height: 36px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-350);
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; color: var(--grey-800);
  }
  .btn-reject:hover { border-color: var(--error); color: var(--error); }

  /* The request is read once; the roster is scanned, so it takes the
     room. */
  /* start, not stretch: the details card is as tall as what it says. */
  .rd-split {
    display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px;
    padding: 20px 24px; min-height: 0; overflow: auto; align-items: start;
  }
  .rd-card { border: 1px solid var(--grey-350); border-radius: 10px; padding: 16px; }
  .rd-card-title { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
  .rd-rows { display: grid; grid-template-columns: 116px 1fr; gap: 10px 16px; align-items: baseline; }
  .rd-rows dt { font-size: 13px; color: var(--grey-600); }
  .rd-rows dd { font-size: 14px; color: var(--text-main); margin: 0; }
  .rd-note { font-size: 13px; line-height: 18px; color: var(--grey-700); }

  /* The attachment pane, with the viewer's own controls — the same set
     the expense screen carries, since it is the same kind of thing. */
  .rd-doc { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  /* ─── The worker's roster ───────────────────────────────────────────
     The rostering screen's own board, to its own measurements: a 285px
     sticky label column, 64px a day, a 56×24 block in each cell, rows of
     32/32/36 for project, position and worker, and the same hover rings.
     Copied rather than approximated, because a board a manager already
     reads daily should not be a second dialect of itself. */
  .rd-roster {
    position: relative;
    display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0;
    border: 1px solid var(--grey-350); border-radius: 10px; padding: 16px;
  }
  .rd-roster-head { display: flex; align-items: center; gap: 12px; }
  .ros-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .ros-month { font-size: 13px; color: var(--grey-700); min-width: 150px; text-align: center; }

  .ros-clash { font-size: 13px; line-height: 18px; }
  .ros-clash.hit { color: var(--error); font-weight: 500; }
  .ros-clash.free { color: #289e1a; font-weight: 500; }
  /* Two panes, one at a time. */
  .rd-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  /* The same tabs the page itself uses. A segmented control here was a
     second dialect for the same job. */
  .rd-rtabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--grey-300); }
  .rd-rtab {
    position: relative; height: 36px; padding: 0 14px; border: none; background: none;
    cursor: pointer; font-family: var(--fs-sans); font-size: 14px; font-weight: 500;
    color: var(--grey-600); white-space: nowrap;
  }
  .rd-rtab:hover:not(:disabled) { color: var(--text-main); }
  .rd-rtab.on { color: var(--primary); }
  .rd-rtab.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--primary); border-radius: 2px 2px 0 0;
  }
  .rd-rtab:disabled { color: var(--grey-400); cursor: default; }
  .rd-doc[hidden], .rd-roster[hidden] { display: none; }
  .rd-doc {
    border: 1px solid var(--grey-350); border-radius: 10px; padding: 16px;
  }

  /* ─── Rejecting says why ───────────────────────────────────────── */
  .modal.rj-modal { max-width: 520px; }
  .rj-modal .modal-body { padding: 18px 24px 8px; }
  .rj-lead { margin: 0 0 10px; font-size: 14px; color: var(--text-main); }
  #rj-note {
    width: 100%; resize: vertical; min-height: 96px; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--grey-350); background: var(--white);
    font-family: var(--fs-sans); font-size: 14px; line-height: 20px; color: var(--text-main);
  }
  #rj-note:focus { outline: none; border-color: var(--primary); }
  .rj-count { margin-top: 6px; text-align: right; font-size: 12px; color: var(--grey-600); }
  .rj-modal .modal-footer { padding: 12px 24px 20px; }
  /* Why it was turned down, where the request is read. */
  .rd-why {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #fdecee; font-size: 13px; line-height: 18px; color: var(--text-main);
  }
  .rd-why b { display: block; margin-bottom: 2px; color: var(--error); }

  .ros-clash .ros-off {
    display: block; margin-top: 2px; font-weight: 400; color: var(--grey-600);
  }
  /* What else this worker has on in the months being looked at. Only
     what is agreed or still asked for — a refused request is not a
     thing anyone has to work around. */
  .ros-also { font-size: 13px; line-height: 18px; color: var(--grey-700); margin-top: -4px; }
  .ros-also b { font-weight: 500; color: var(--text-main); }
  .cal-pop .cp-also { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--grey-700); }
  .cal-pop .cp-also b { display: block; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }

  /* ─── Two months, side by side ──────────────────────────────────
     Never one, never three: a request near a month boundary needs the
     next month whatever its length, and a length-dependent view is one
     more thing to understand before you can read it. Scrolls freely
     both ways, because a manager checking a clash often wants the week
     before it as much as the week of it. */
  .ros-cal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; min-width: 0; }
  .cal-m-head {
    font-size: 13px; font-weight: 600; color: var(--text-main);
    height: 22px; display: flex; align-items: center;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal-dow {
    height: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; color: var(--grey-600);
  }
  /* Every day is a cell of the same size whether or not anything is on
     it, so the shape of a month is the shape of the month. */
  .cal-day {
    position: relative; height: 34px; border-radius: 6px; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--fs-sans); font-size: 12.5px; color: var(--text-main);
    background: none; cursor: default;
  }
  .cal-day.out { color: var(--grey-400); }
  .cal-day.on { cursor: pointer; }
  /* ─── The days being asked for ─────────────────────────────────
     Drawn over whatever is under them: the question is what the leave
     lands on, so both have to stay legible. Not red or amber — asking
     for a day is not a fault — and not blue, which is the colour of
     something to press. What is left is a neutral graphite and three
     shapes to carry it, switchable at the foot of the screen because
     the old desktop app already spends patterns on work types.

       run   a bracket round the whole stretch, joined across the days
       bar   a rule under the stretch, joined the same way
       hatch diagonal stripes, which is what Outlook and the leave
             tools use for "proposed" — and what may well collide */
  .cal-day.req { font-weight: 600; }
  /* Hover is an outline rather than a shadow, so it does not fight the
     shadows the bracket and the bar are drawn with. */
  .cal-day.on:hover, .cal-day.open { box-shadow: none; outline: 1px solid var(--primary); outline-offset: -1px; }

  /* ── Bracket ── */
  body.mark-run .cal-day.req {
    border-radius: 0;
    box-shadow: inset 0 2px 0 var(--mark), inset 0 -2px 0 var(--mark);
  }
  body.mark-run .cal-day.req.rs {
    border-radius: 6px 0 0 6px;
    box-shadow: inset 0 2px 0 var(--mark), inset 0 -2px 0 var(--mark), inset 2px 0 0 var(--mark);
  }
  body.mark-run .cal-day.req.re {
    border-radius: 0 6px 6px 0;
    box-shadow: inset 0 2px 0 var(--mark), inset 0 -2px 0 var(--mark), inset -2px 0 0 var(--mark);
  }
  body.mark-run .cal-day.req.rs.re { border-radius: 6px; box-shadow: inset 0 0 0 2px var(--mark); }

  /* ── Bar ── */
  body.mark-bar .cal-day.req::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 2px;
    height: 3px; background: var(--mark); pointer-events: none;
  }
  body.mark-bar .cal-day.req.rs::before { left: 4px; border-radius: 2px 0 0 2px; }
  body.mark-bar .cal-day.req.re::before { right: 4px; border-radius: 0 2px 2px 0; }
  body.mark-bar .cal-day.req.rs.re::before { border-radius: 2px; }

  /* ── Hatch ── */
  body.mark-hatch .cal-day.req::before {
    content: ''; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
    background: repeating-linear-gradient(45deg,
      rgba(16, 24, 40, 0) 0 3px, rgba(16, 24, 40, 0.26) 3px 6px);
  }
  /* Three things can land on one cell, so they are given an order:
     the wash of other leave underneath, the mark of this request over
     it, the number on top of both. */
  .cal-day .w {
    position: absolute; inset: 0; border-radius: 6px; z-index: 0; pointer-events: none;
    background: rgba(61, 70, 89, 0.16);
  }
  .cal-day.oth-p .w { background: rgba(61, 70, 89, 0.08); }
  .cal-day.req::before { z-index: 1; }
  .cal-day .n { position: relative; z-index: 2; }
  /* Already off, so the day is not theirs to be asked for again. */
  .cal-day.oth .n { color: var(--grey-600); }
  /* Today moves to a corner, so it is not a second bar under a number. */
  .cal-day.today::after {
    content: ''; position: absolute; top: 4px; right: 4px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--grey-400);
  }

  /* Hover says it on a desktop, a tap says it on a tablet — the same
     three lines either way. */
  /* Placed against the window, not against the card: a calendar is only
     six rows tall, and a panel kept inside it had nowhere to go but over
     the month it was explaining. */
  .cal-pop {
    position: fixed; z-index: 340; width: 232px; padding: 10px 12px;
    border-radius: 8px; background: var(--white);
    border: 1px solid var(--grey-300); box-shadow: var(--shadow-dropdown);
  }
  .cal-pop[hidden] { display: none; }
  .cal-pop .cp-when { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
  .cal-pop .cp-when .req { color: var(--grey-600); font-weight: 500; }
  .cal-pop dl { display: grid; grid-template-columns: 74px 1fr; gap: 3px 10px; margin: 0; }
  .cal-pop dt { font-size: 11px; color: var(--grey-600); }
  .cal-pop dd { font-size: 12px; line-height: 16px; color: var(--text-main); margin: 0; }
  .cal-pop .cp-sep { height: 1px; background: var(--grey-300); margin: 8px 0; }
  .cal-pop .cp-none { font-size: 12px; color: var(--grey-600); }

  .vp-switch {
    position: fixed; right: 20px; bottom: 20px; z-index: 400;
    display: inline-flex; align-items: center; padding: 4px; gap: 2px; border-radius: 10px;
    background: var(--white); border: 1px solid var(--grey-350); box-shadow: var(--shadow-dropdown);
  }
  .vp-switch .vp-label { font-size: 13px; color: var(--grey-600); padding: 0 8px 0 6px; }
  .vp-switch button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 12px; border: none; border-radius: 7px; cursor: pointer;
    background: none; color: var(--grey-700);
    font-family: var(--fs-sans); font-size: 13px; font-weight: 500;
  }
  .vp-switch button:hover { background: var(--grey-100); color: var(--text-main); }
  .vp-switch button.on { background: var(--bg-blue-light); color: var(--primary); }

  .ros-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11px; color: var(--grey-600); }
  .ros-key span { display: inline-flex; align-items: center; gap: 6px; }
  .ros-key .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw-day { background: #ddd3f7; } .sw-night { background: #f8c0e4; }
  .sw-travel { background: #b9e3e6; }
  .sw-oth { background: rgba(61, 70, 89, 0.16); }
  /* The key shows whichever mark the days are carrying. */
  body.mark-run .ros-key .sw-leave { background: none; box-shadow: inset 0 0 0 2px var(--mark); }
  body.mark-bar .ros-key .sw-leave {
    background: none; border-radius: 0; height: 3px; width: 14px;
    align-self: center; background-color: var(--mark);
  }
  body.mark-hatch .ros-key .sw-leave {
    background: repeating-linear-gradient(45deg,
      rgba(16, 24, 40, 0) 0 2px, rgba(16, 24, 40, 0.3) 2px 4px);
    box-shadow: inset 0 0 0 1px var(--grey-300);
  }
  .rd-doc-bar { display: flex; align-items: center; gap: 6px; }
  .doc-btn {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-350); color: var(--grey-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .doc-btn:hover { border-color: var(--primary); color: var(--primary); }
  .doc-btn:disabled { color: var(--grey-400); cursor: default; border-color: var(--grey-350); }
  .doc-page { font-size: 12px; color: var(--grey-600); margin: 0 4px; }
  .rd-doc-bar .right { margin-left: auto; display: flex; gap: 6px; }
  .rd-doc-stage {
    flex: 1; min-height: 220px; border-radius: 10px; background: var(--grey-100);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .doc-sheet {
    background: var(--white); border-radius: 4px; padding: 20px 22px; width: 240px;
    box-shadow: 0 2px 10px rgba(8,17,21,0.12); transform-origin: center;
  }
  .doc-sheet h4 { font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; }
  .doc-sheet p { font-size: 10px; line-height: 15px; color: var(--grey-700); }
  .doc-none { font-size: 13px; color: var(--grey-600); }

  /* ─── A phone gets one column ───────────────────────────────────── */
  body.is-narrow .rd-modal { height: auto; max-height: 88vh; }
  body.is-narrow .rd-modal { max-width: 100vw; width: 100%; height: auto; max-height: 88vh; }
  body.is-narrow .rd-body { grid-template-columns: 1fr; }
  body.is-narrow .rd-queue { display: none; }
  body.is-narrow .rd-split { grid-template-columns: 1fr; }
  /* One month at a time once there is no room for two side by side. */
  body.is-narrow .ros-cal { grid-template-columns: 1fr; }
  body.is-narrow .lr-tabs { overflow-x: auto; }
</style>
</head>
<body data-module="leave" class="mark-run">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <div class="page-header">
        <h1 class="page-title">Leave Requests</h1>
        <div class="header-actions">
          <!-- One site at a time: an approver works a site, and the rules
               a request is read against — whether a weekend counts, for
               one — are the site's own. -->
          <div class="dd-wrap" id="site-dd">
            <button class="dd-trigger" type="button">
              <span>Site: <span id="site-dd-value"></span></span>
              <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dd-panel" id="site-dd-panel"></div>
          </div>
        </div>
      </div>

      <div class="search-wrap">
        <label class="search-bar">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input class="search-input-el" id="search" type="text" placeholder="Search" autocomplete="off" />

  /* Not named iso: fmt() already takes a parameter by that name, and a

  function isoOf(d) {

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function onDay(a, d) {

    var w = d.getDay();
    if (a.pattern === 'weekdays') return w !== 0 && w !== 6;
    if (a.pattern === 'mwf') return w === 1 || w === 3 || w === 5;
    return true;
  }

  /* ─── State ───────────────────────────────────────────────────── */
  var TABS = [
    { k: 'pending',   label: 'Pending',   caption: 'All Pending Requests:' },
    { k: 'approved',  label: 'Approved',  caption: 'All Approved Requests:' },
    { k: 'rejected',  label: 'Rejected',  caption: 'All Rejected Requests:' },
    { k: 'cancelled', label: 'Cancelled', caption: 'All Cancelled Requests:' }

  var state = { tab: 'pending', q: '', site: SITES[3] };
  var openId = null;
  /* Only a pending request can be settled, so only that tab is pickable

  var picked = Object.create(null);
  function canPick() { return state.tab === 'pending'; }
  function pickedIds() {

  }

  function onSite(r) { return r.site === state.site; }

  }

  }

  /* ─── The site being looked at ─────────────────────────────────── */
  var CHECK = '<svg class="dd-check" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderSiteDD() {
    el('site-dd-value').textContent = state.site;

      return '<button class="dd-item' + (x === state.site ? ' active' : '') +
        '" type="button" data-site="' + Shell.esc(x) + '">' + CHECK + Shell.esc(x) + '</button>';
    }).join('');

  }
  el('site-dd-panel').addEventListener('click', function (e) {
    var b = e.target.closest('[data-site]');
    if (!b) return;

    clearPicked();
    Shell.closeAllDropdowns();
    render();
  });

  /* ─── Table ───────────────────────────────────────────────────── */
  function renderTabs() {
    el('lr-tabs').innerHTML = TABS.map(function (t) {
      var n = countOf(t.k);
      return '<button class="lr-tab' + (t.k === state.tab ? ' on' : '') + '" type="button" data-tab="' + t.k + '">' +
        Shell.esc(t.label) + (n ? ' <span class="n">(' + n + ')</span>' : '') + '</button>';
    }).join('');
    var tab = TABS.filter(function (t) { return t.k === state.tab; })[0];
    el('lr-caption').textContent = tab.caption;
  }

  function render() {
    renderSiteDD();
    renderTabs();
    var q = state.q.toLowerCase();
    var rows = rowsFor(state.tab, q);

    el('lr-body').innerHTML = rows.map(function (r) {
      var w = worker(r.who);
      var when = fmtRange(r.from, r.to);
      return '<tr data-id="' + r.id + '">' +
        '<td class="col-pick">' + (canPick()
          ? '<input class="lr-check" type="checkbox" data-pick="' + r.id + '"' +
            (picked[r.id] ? ' checked' : '') + ' aria-label="Select this request" />'
          : '') + '</td>' +
        '<td class="lr-when" data-tip="' + Shell.esc(when) + '">' + Shell.highlight(when, state.q) + '</td>' +
        '<td><span class="who"><span class="av" style="background:' + w.colour + '">' + initials(r.who) + '</span>' +
          '<span class="nm">' + Shell.highlight(r.who, state.q) + '</span></span></td>' +
        '<td data-tip="' + Shell.esc(r.site) + '">' + Shell.highlight(r.site, state.q) + '</td>' +
        '<td>' + Shell.highlight(r.type, state.q) + '</td>' +
        '<td class="num">' + daysOf(r) + '</td>' +
        '<td class="num">' + hoursCell(r) + '</td>' +
        '<td data-tip="' + Shell.esc(r.why || '') + '">' +
          (r.why ? Shell.highlight(r.why, state.q) : '<span class="cell-empty">&mdash;</span>') + '</td>' +
        '<td>' + Shell.highlight(r.approver, state.q) + '</td>' +
        '<td>' + Shell.esc(fmt(r.made)) + '</td>' +
        '<td class="col-view"><button class="view-link" type="button" data-view="' + r.id + '">View</button></td>' +
      '</tr>';
    }).join('');

    /* A pick only survives while the row it is on is still on screen:
       searching or changing tab is choosing a different pile. */
    var here = Object.create(null);
    rows.forEach(function (r) { here[r.id] = 1; });
    Object.keys(picked).forEach(function (k) { if (!here[k]) delete picked[k]; });
    syncBulk();

    var none = !rows.length;
    el('lr-empty').hidden = !none;
    el('lr-empty').textContent = state.q
      ? 'Nothing matches “' + state.q + '” in this tab.'
      : 'No requests here.';
    el('lr-table').hidden = none;
  }

  el('lr-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    state.tab = b.getAttribute('data-tab');
    clearPicked();
    render();
  });

  /* ─── Settling several at once ─────────────────────────────────── */
  function syncBulk() {
    var n = pickedIds().length;
    el('lr-bulk').hidden = !n;
    document.body.classList.toggle('has-picked', !!n);
    el('lr-bulk-n').textContent = n + ' request' + (n === 1 ? '' : 's') + ' selected';

    var all = el('lr-all');
    if (!all) return;
    var rows = rowsFor(state.tab, state.q.toLowerCase());
    all.disabled = !canPick() || !rows.length;
    all.checked = canPick() && rows.length > 0 && n === rows.length;
    all.indeterminate = n > 0 && n < rows.length;
  }

  el('lr-body').addEventListener('change', function (e) {
    var c = e.target.closest('[data-pick]');
    if (!c) return;
    var id = c.getAttribute('data-pick');
    if (c.checked) picked[id] = 1; else delete picked[id];
    syncBulk();
  });
  /* The row opens the request; the box in it does not. */
  el('lr-body').addEventListener('click', function (e) {
    if (e.target.closest('.col-pick')) e.stopPropagation();
  }, true);

  el('lr-all').addEventListener('change', function () {
    clearPicked();
    if (this.checked) {
      rowsFor(state.tab, state.q.toLowerCase()).forEach(function (r) { picked[r.id] = 1; });
    }
    render();
  });
  el('lr-bulk-clear').addEventListener('click', function () { clearPicked(); render(); });

  function settleMany(to, verb) {
    var ids = pickedIds();
    if (!ids.length) return;
    REQUESTS.forEach(function (r) { if (ids.indexOf(r.id) !== -1) r.state = to; });
    clearPicked();
    render();
    Shell.snackbar(verb + ' ' + ids.length + ' request' + (ids.length === 1 ? '' : 's') + '.');
  }
  el('lr-bulk-approve').addEventListener('click', function () { settleMany('approved', 'Approved'); });
  el('lr-bulk-reject').addEventListener('click', function () { askReject(pickedIds(), false); });

  var searchEl = el('search'), clearBtn = el('search-clear');
  searchEl.addEventListener('input', function () {
    state.q = this.value.trim();
    clearPicked();
    clearBtn.classList.toggle('visible', this.value.length > 0);
    render();
  });
  clearBtn.addEventListener('click', function () {
    searchEl.value = ''; state.q = '';
    clearBtn.classList.remove('visible');
    render(); searchEl.focus();
  });

  /* ─── Details ─────────────────────────────────────────────────── */
  var modal = el('rd-modal');
  var zoom = 1, page = 1;

  function byId(id) { return REQUESTS.filter(function (r) { return r.id === id; })[0]; }

  function renderQueue() {
    var r = byId(openId);
    var tab = TABS.filter(function (t) { return t.k === r.state; })[0];
    el('rd-queue-title').textContent = 'All ' + tab.label + ' Requests';
    var list = rowsFor(r.state, state.q.toLowerCase());
    el('rd-queue-list').innerHTML = list.map(function (x) {
      return '<button class="rd-q-item' + (x.id === openId ? ' on' : '') + '" type="button" data-q="' + x.id + '">' +
        '<span class="t">' + Shell.esc(reqName(x)) + '</span>' +
        '<span class="s">' + Shell.esc(x.type) + '</span></button>';
    }).join('');
  }

  function renderDetails() {
    var r = byId(openId), d = daysOf(r);
    el('rd-main-title').textContent = reqName(r);
    /* Days is worked out rather than asked for: counting from the 29th
       to the 13th by hand is where the mistakes are. */
    el('rd-rows').innerHTML =
      row('Worker', Shell.esc(r.who)) +
      row('Site', Shell.esc(r.site)) +
      row('Leave Type', Shell.esc(r.type)) +
      row('Dates', Shell.esc(fmtRange(r.from, r.to))) +
      row('Days', d + (d === 1 ? ' day' : ' days')) +
      row('Hours', r.hours == null
        ? '<span class="cell-empty">Whole days</span>'
        : fmtNum(r.hours) + ' h') +
      row('Description', r.why
        ? '<span class="rd-note">' + Shell.esc(r.why) + '</span>'
        : '<span class="cell-empty">&mdash;</span>') +
      row('Approver', Shell.esc(r.approver)) +
      row('Requested', Shell.esc(fmt(r.made)));

    /* A request is either approved and rejected from here, or it is
       already settled and there is nothing to do but read it. */
    var why = el('rd-why');
    why.hidden = !(r.state === 'rejected' && r.rejectNote);
    if (!why.hidden) {
      why.innerHTML = '<b>Rejected</b>' + Shell.esc(r.rejectNote);
    }

    renderDoc(r);
    syncRight();
  }
  function row(k, v) { return '<dt>' + k + '</dt><dd>' + v + '</dd>'; }
  function fmtNum(n) { return (Math.round(n * 10) / 10) + ''; }

  /* ─── The worker's roster, two months at a time ────────────────────
     Always two, never one and never three. A request that ends near a
     month boundary needs the next month whatever its own length, and a
     view that changes shape with the length of the request is one more
     thing to work out before it can be read. It opens on the month the
     request starts in, and scrolls freely either way. */
  var rosAnchor = null;              // the first of the left-hand month
  var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  var DOW_SHORT = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  var TODAY_ISO = isoOf(new Date());

  function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }

  /* The colours the rostering board already uses, so the same shift is
     the same colour wherever a manager meets it. */
  /* No blue among them: blue is what the reader can act on, and a day
     cell is a fact. Violet, pink and teal are far enough apart to tell
     at 34 pixels. */
  var KIND_FILL = { day: '#ddd3f7', night: '#f8c0e4', travel: '#b9e3e6', other: '#e6dcc6' };
  function onThat(list, d) {
    return list.filter(function (a) { return onDay(a, d); });
  }

  /* Everything else this worker has on, whichever site it is against —
     leave is the person's, not the site's. Only what is agreed or
     still being asked for: a refused or withdrawn request is not
     something anyone has to work around, and the tools that show this
     leave those two out for the same reason. */
  function otherLeave(r) {
    return REQUESTS.filter(function (x) {

        (x.state === 'pending' || x.state === 'approved');
    });
  }
  function otherOn(list, k) {
    return list.filter(function (x) { return k >= x.from && k <= x.to; });
  }
  /* Two things on one day is a real thing — a travel day laid over a
     shift — so the cell is split rather than picking a winner. */
  function fillOf(as) {
    if (!as.length) return '';
    var c = as.map(function (a) { return KIND_FILL[a.kind] || KIND_FILL.other; });
    return c.length === 1
      ? 'background:' + c[0] + ';'
      : 'background:linear-gradient(135deg,' + c[0] + ' 50%,' + c[1] + ' 50%);';
  }

  function monthHtml(anchor, r, list, others) {
    var y = anchor.getFullYear(), m = anchor.getMonth();
    var first = new Date(y, m, 1);
    /* Monday first, as the rest of the product counts a week. Six rows
       always, so the two months beside each other are the same height
       whatever shape their weeks happen to be. */
    var start = addDays(first, -((first.getDay() + 6) % 7));

    /* Worked out in one pass, drawn in the next: a day has to know
       whether the days either side of it are being asked for too, so a
       stretch can be bracketed as one thing rather than five. A week
       break ends a run, because a run cannot turn a corner. */
    var grid = [];
    for (var i = 0; i < 42; i++) {
      var d = addDays(start, i), k = isoOf(d);
      var out = d.getMonth() !== m;
      var oth = out ? [] : otherOn(others, k);

        as: out ? [] : onThat(list, d),
        req: !out && k >= r.from && k <= r.to,
        oth: oth

    }

    var cells = '';
    grid.forEach(function (c, i) {
      var rs = c.req && (i % 7 === 0 || !grid[i - 1].req);
      var re = c.req && (i % 7 === 6 || !grid[i + 1] || !grid[i + 1].req);
      /* Agreed outranks asked-for when both fall on a day: the wash is
         stronger for leave that is already settled. */
      var anyApproved = c.oth.some(function (x) { return x.state === 'approved'; });
      var cls = 'cal-day' + (c.out ? ' out' : '') + (c.req ? ' req' : '') +
        (rs ? ' rs' : '') + (re ? ' re' : '') +
        (c.oth.length ? (anyApproved ? ' oth' : ' oth oth-p') : '') +
        (c.as.length || c.oth.length ? ' on' : '') + (c.k === TODAY_ISO ? ' today' : '');
      var inner = (c.oth.length ? '<i class="w"></i>' : '') +
        '<span class="n">' + c.d.getDate() + '</span>';
      cells += (c.as.length || c.oth.length)
        ? '<button type="button" class="' + cls + '" data-day="' + c.k + '" style="' +
            fillOf(c.as) + '">' + inner + '</button>'
        : '<div class="' + cls + '">' + inner + '</div>';
    });
    return '<div class="cal-month">' +
      '<div class="cal-m-head">' + MONTHS_LONG[m] + ' ' + y + '</div>' +
      '<div class="cal-grid">' +
        DOW_SHORT.map(function (x) { return '<div class="cal-dow">' + x + '</div>'; }).join('') +
        cells +
      '</div></div>';
  }

  function renderRoster() {
    hidePop();
    var r = byId(openId), list = rosterFor(r.who);
    el('ros-title').textContent = 'Roster \u2014 ' + r.who;

    var right = addMonths(rosAnchor, 1);
    el('ros-month').textContent = rosAnchor.getFullYear() === right.getFullYear()
      ? MONTHS_LONG[rosAnchor.getMonth()] + ' \u2013 ' + MONTHS_LONG[right.getMonth()] + ' ' + right.getFullYear()
      : MONTHS_LONG[rosAnchor.getMonth()] + ' ' + rosAnchor.getFullYear() + ' \u2013 ' +
        MONTHS_LONG[right.getMonth()] + ' ' + right.getFullYear();

    var others = otherLeave(r);
    el('ros-cal').innerHTML = monthHtml(rosAnchor, r, list, others) +
      monthHtml(right, r, list, others);

    /* The one sentence a manager is after, whatever is on screen: it is
       about the request, not about the months being looked at. */
    var clash = 0, dd = new Date(r.from + 'T00:00:00'), end = new Date(r.to + 'T00:00:00');
    while (dd <= end) {
      if (list.some(function (a) { return onDay(a, dd); })) clash++;
      dd = addDays(dd, 1);
    }
    var need = daysOf(r);
    var box = el('ros-clash');
    box.className = 'ros-clash ' + (clash ? 'hit' : 'free');
    var lastShown = isoOf(addDays(addMonths(right, 1), -1));
    var off = r.from < isoOf(rosAnchor) || r.to > lastShown;
    box.innerHTML = (clash
      ? 'Rostered on ' + clash + ' of the ' + need + ' day' + (need === 1 ? '' : 's') + ' requested.'
      : 'Not rostered on any of the days requested.') +
      (off ? '<span class="ros-off">Part of this request falls outside the two months shown.</span>' : '');

    /* Named rather than only shaded: three weeks off in one month is
       the thing an approver wants to notice before the third one is
       agreed to, and a wash on a calendar is easy to read past. */
    var firstShown = isoOf(rosAnchor);
    var near = others.filter(function (x) { return x.from <= lastShown && x.to >= firstShown; })
      .sort(function (a, b) { return a.from < b.from ? -1 : 1; });
    var also = el('ros-also');
    also.hidden = !near.length;
    if (near.length) {
      var shown = near.slice(0, 3).map(function (x) {
        return '<b>' + Shell.esc(fmtRange(x.from, x.to)) + '</b> (' + x.state + ')';
      }).join(', ');
      also.innerHTML = 'Also off in these months: ' + shown +
        (near.length > 3 ? ' and ' + (near.length - 3) + ' more' : '') + '.';
    }
  }
  el('ros-prev').addEventListener('click', function () { rosAnchor = addMonths(rosAnchor, -1); renderRoster(); });
  el('ros-next').addEventListener('click', function () { rosAnchor = addMonths(rosAnchor, 1); renderRoster(); });

  /* Three ways to say the same thing, so the one that does not collide
     with the desktop app can be chosen by looking at them. */
  var markSwitch = el('mark-switch');
  markSwitch.addEventListener('click', function (e) {
    var b = e.target.closest('[data-mark]');
    if (!b) return;
    var k = b.getAttribute('data-mark');
    ['run', 'bar', 'hatch'].forEach(function (x) {
      document.body.classList.toggle('mark-' + x, x === k);
    });
    markSwitch.querySelectorAll('[data-mark]').forEach(function (x) {
      x.classList.toggle('on', x === b);
    });
  });

  /* ─── What is on a day ─────────────────────────────────────────────
     A pointer asks by hovering and a finger asks by tapping, so it does
     both: hover shows it while the pointer is there, a tap pins it until
     something else is tapped. */
  var calPop = el('cal-pop'), calOn = null, calPinned = false;

  function hidePop() {
    if (!calPop) return;
    calPop.hidden = true;
    if (calOn) calOn.classList.remove('open');
    calOn = null; calPinned = false;
  }

  function showPop(btn, pin) {
    hidePop();
    var r = byId(openId), list = rosterFor(r.who);
    var k = btn.getAttribute('data-day');
    var as = onThat(list, new Date(k + 'T00:00:00'));
    var req = k >= r.from && k <= r.to;
    var oth = otherOn(otherLeave(r), k);

    calPop.innerHTML = '<div class="cp-when">' + Shell.esc(fmt(k)) +
      (req ? ' <span class="req">\u00b7 requested</span>' : '') + '</div>' +
      (as.length ? as.map(function (a, i) {
        return (i ? '<div class="cp-sep"></div>' : '') +
          '<dl><dt>Project</dt><dd>' + Shell.esc(a.project) + '</dd>' +
          '<dt>Work type</dt><dd>' + Shell.esc(a.work) + '</dd>' +
          '<dt>Shift</dt><dd>' + Shell.esc(a.shift) + '</dd></dl>';
      }).join('') : '<div class="cp-none">Nothing rostered on this day.</div>') +
      (oth.length ? '<div class="cp-also"><b>Also off this day</b>' +
        oth.map(function (x) {
          /* The type and the state, never the reason — which is what the
             tools that show other people's leave are careful about. */
          return Shell.esc(x.type) + ' \u00b7 ' + x.state;
        }).join('<br />') + '</div>' : '');

    calPop.hidden = false;
    var b = btn.getBoundingClientRect();
    var left = b.left + b.width / 2 - calPop.offsetWidth / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - calPop.offsetWidth - 8));
    var top = b.bottom + 8;
    if (top + calPop.offsetHeight > window.innerHeight - 8) {
      top = b.top - calPop.offsetHeight - 8;
    }
    calPop.style.left = Math.round(left) + 'px';
    calPop.style.top = Math.round(Math.max(8, top)) + 'px';

    calOn = btn; btn.classList.add('open');
    calPinned = !!pin;
  }

  el('ros-cal').addEventListener('mouseover', function (e) {
    if (calPinned) return;

    if (b && b !== calOn) showPop(b, false);
  });
  el('ros-cal').addEventListener('mouseout', function (e) {
    if (calPinned) return;
    var b = e.target.closest('[data-day]');
    if (!b) return;
    if (e.relatedTarget && b.contains(e.relatedTarget)) return;

  });
  el('ros-cal').addEventListener('click', function (e) {
    var b = e.target.closest('[data-day]');
    if (!b) return;

    if (calPinned && calOn === b) { hidePop(); return; }
    showPop(b, true);
  });
  calPop.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (calPinned) hidePop(); });
  /* Fixed to the window, so a scroll would leave it behind the day it
     belongs to. */
  window.addEventListener('scroll', hidePop, true);

  /* ─── Roster or attachment ─────────────────────────────────────
     Two kinds of evidence read one at a time. A request with nothing
     attached says so on the tab rather than offering an empty pane. */
  var rtab = 'roster';
  function syncRight() {
    var r = byId(openId);
    var t = el('rt-doc');
    t.disabled = !r.doc;
    t.textContent = r.doc ? 'Attachment' : 'No attachment';
    if (!r.doc && rtab === 'doc') rtab = 'roster';
    [].forEach.call(el('rd-rtabs').children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-rt') === rtab);
    });
    el('pane-roster').hidden = rtab !== 'roster';
    el('pane-doc').hidden = rtab !== 'doc';
  }
  el('rd-rtabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rt]');
    if (!b || b.disabled) return;
    rtab = b.getAttribute('data-rt');
    hidePop();
    syncRight();
  });

  function renderDoc(r) {
    page = 1; zoom = 1;
    var pages = r.doc ? 2 : 0;
    el('doc-page').textContent = pages ? page + '/' + pages : '—';
    el('doc-prev').disabled = true;
    el('doc-next').disabled = pages < 2;
    el('doc-in').disabled = !pages;
    el('doc-out').disabled = !pages;
    el('doc-stage').innerHTML = r.doc
      ? '<div class="doc-sheet" id="doc-sheet"><h4>' + Shell.esc(r.doc) + '</h4>' +
        '<p>Patient: ' + Shell.esc(r.who) + '<br />Issued: ' + Shell.esc(fmt(r.made)) + '<br />' +
        'Unfit for work from ' + Shell.esc(fmt(r.from)) + ' to ' + Shell.esc(fmt(r.to)) + '.</p></div>'
      : '<span class="doc-none">Nothing was attached to this request.</span>';
    el('doc-stage').dataset.pages = pages;
  }
  function syncDoc() {
    var sheet = el('doc-sheet');
    if (sheet) sheet.style.transform = 'scale(' + zoom + ')';
    var pages = Number(el('doc-stage').dataset.pages || 0);
    el('doc-page').textContent = pages ? page + '/' + pages : '—';
    el('doc-prev').disabled = page <= 1;
    el('doc-next').disabled = page >= pages;
  }
  el('doc-in').addEventListener('click', function () { zoom = Math.min(1.8, zoom + 0.2); syncDoc(); });
  el('doc-out').addEventListener('click', function () { zoom = Math.max(0.6, zoom - 0.2); syncDoc(); });
  el('doc-prev').addEventListener('click', function () { page = Math.max(1, page - 1); syncDoc(); });
  el('doc-next').addEventListener('click', function () {
    page = Math.min(Number(el('doc-stage').dataset.pages || 1), page + 1); syncDoc();
  });

  function openRequest(id) {
    openId = id;
    var r = byId(id);
    /* Open a few days before the request, so what leads up to it is on
       screen as well as the request itself. */
    rosAnchor = monthStart(new Date(r.from + 'T00:00:00'));
    rtab = 'roster';
    renderQueue();
    renderDetails();
    /* Shown first: the band's edges are measured off the day headings,
       and a dialog that is still display:none measures as nothing. */
    modal.classList.add('open');
    renderRoster();
  }
  function closeModal() { hidePop(); modal.classList.remove('open'); openId = null; }

  el('lr-body').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]');
    var tr = e.target.closest('tr[data-id]');
    if (b) { openRequest(Number(b.getAttribute('data-view'))); return; }
    if (tr) openRequest(Number(tr.getAttribute('data-id')));
  });
  el('rd-queue-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-q]');
    if (b) openRequest(Number(b.getAttribute('data-q')));
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal || e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (rjModal.classList.contains('open')) { rjModal.classList.remove('open'); return; }
    if (modal.classList.contains('open')) closeModal();
  });

  /* Settling a request moves it to another tab, so the queue it was in
     is one shorter — the next one in that queue opens, since working
     through the pile is the whole job. */
  function settle(to, verb) {
    var r = byId(openId);
    var queue = rowsFor(r.state, state.q.toLowerCase());
    var at = queue.map(function (x) { return x.id; }).indexOf(r.id);
    r.state = to;
    var next = queue[at + 1] || queue[at - 1] || null;
    render();
    Shell.snackbar(verb + ' ' + r.who + '’s ' + r.type.toLowerCase() + '.');
    if (next && next.state === state.tab) openRequest(next.id);
    else closeModal();
  }
  el('rd-approve').addEventListener('click', function () { settle('approved', 'Approved'); });

  /* ─── Rejecting says why ───────────────────────────────────────
     The same dialog the expense screen uses, and the same rule: a
     request turned down without a reason is a phone call tomorrow. */
  var rjModal = el('rj-modal'), rjIds = [], rjFromModal = false;

  function askReject(ids, fromModal) {
    if (!ids.length) return;
    rjIds = ids.slice();
    rjFromModal = !!fromModal;
    el('rj-title').textContent = ids.length > 1
      ? 'Reject ' + ids.length + ' Requests' : 'Reject Request';
    el('rj-note').value = '';
    el('rj-n').textContent = '0';
    el('rj-save').disabled = true;
    rjModal.classList.add('open');
    el('rj-note').focus();
  }
  el('rj-note').addEventListener('input', function () {
    el('rj-n').textContent = this.value.length;
    el('rj-save').disabled = !this.value.trim();
  });
  rjModal.addEventListener('click', function (e) {
    if (e.target === rjModal || e.target.closest('[data-close]')) rjModal.classList.remove('open');
  });
  el('rj-save').addEventListener('click', function () {
    var note = el('rj-note').value.trim();
    if (!note) return;
    rjModal.classList.remove('open');
    REQUESTS.forEach(function (r) {
      if (rjIds.indexOf(r.id) !== -1) r.rejectNote = note;
    });
    if (rjFromModal) settle('rejected', 'Rejected');
    else settleMany('rejected', 'Rejected');
  });

  el('rd-reject').addEventListener('click', function () { askReject([openId], true); });

  render();
})();
</script>
</body>
</html>
