     A level per grouped field, in the order they were picked. A heading
     row carries its own field's value in its own column; the columns for
     the fields above it stay blank, because those rows are already on
     screen above, and the columns for the fields below it carry how many
     different values are coming — so a site row says "2 supervisors"
     before the two supervisor rows arrive. */
  function nest(list, keys) {
    if (!keys.length) return null;
    var f = field(keys[0]), order = [], by = Object.create(null);
    list.forEach(function (e) {
      var v = f.get(e) || '—';
      if (!by[v]) { by[v] = []; order.push(v); }
      by[v].push(e);
    });
    order.sort();
    return order.map(function (v) {
      return { name: v, rows: by[v], kids: nest(by[v], keys.slice(1)) };
    });
  }
  function sumOf(list) {
    return list.reduce(function (n, e) { return n + (Number(hoursOf(e)) || 0); }, 0);
  }

  /* ─── Approving: by entry ───────────────────────────────────────────
     The second of two approval models, compared side by side (the tabs
     above the toolbar). timesheets-flat.html approves a worker's whole
     day. This page approves entries — one task, one site, one day — and
     works out everything above them:

       Timesheet  worker + period   what the worker submits, payroll finalises
         Day      worker + date     where the 24-hour rule lives
           Entry  task + site       what a supervisor approves

     A day or a timesheet is never approved as such. Its state is read
     off its entries: none, some or all of them approved.

     Splitting a day does not break the 24-hour rule. The rule is checked
     where hours are typed, against the whole day — `workerDayTotal` sums
     every site — and approved hours still count towards it. Nothing typed
     later can push a day over, however much of it is already locked.

     So every grouping is honest: whatever the rows are grouped by, a tick
     picks the entries under it and nothing else. Group by Supervisor and
     tick one, and that supervisor's lines go through, not the other's. */
  var approved = Object.create(null);   // entry id
  var picked = Object.create(null);
  var pickSets = [];                    // rebuilt each render, so a heading can carry its own rows
  var PICK_W = 44;                      // the tick column, ahead of the frozen heading columns

  function keyOf(e) { return e.id; }
  function isApproved(e) { return approved[e.id] === true; }

  /* The state an entry is in. There is no edit mode in the product, so
     whether a cell can be typed in is read off this and nothing else:

       Open       the worker types, the supervisor types
       Submitted  the worker is done; the supervisor can still correct
       Approved   the supervisor said yes; nobody types
       Finalised  payroll closed it; nobody types, approval stays          */
  /* Finalised is shown as Approved for now: how the two differ is a
     question for Stijn, and two closed states on one screen read as one
     too many. */
  var STATE_ORDER = ['Open', 'Submitted', 'Approved'];
  function entryState(e) {
    if (e.status === 'Finalised' || approved[e.id]) return 'Approved';
    if (e.status === 'Submitted') return 'Submitted';
    return 'Open';                       // Draft and Revised are still the worker's
  }
  function isClosed(e) { return entryState(e) === 'Approved'; }

  /* A row still being added has nothing to approve yet, and a closed one
     is out of the running. */
  function unitsIn(list) {
    var out = [];
    list.forEach(function (e) {
      if (e.isNew || isClosed(e)) return;
      out.push({ key: e.id, worker: e.worker, date: e.date, site: e.site, e: e });
    });
    return out;
  }
  function selected() {
    return unitsIn(rows()).filter(function (u) { return picked[u.key] === true; });
  }

  /* none / some / all, for the box a row carries. */
  function pickState(list) {
    var all = unitsIn(list);
    if (!all.length) return 'none';
    var on = all.filter(function (u) { return picked[u.key] === true; }).length;
    return !on ? 'none' : on === all.length ? 'all' : 'some';
  }
  function setPick(list, on) {
    unitsIn(list).forEach(function (u) { picked[u.key] = on; });
  }
  function clearPick() { picked = Object.create(null); }

  var ICO_TICK = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
    '<path d="M3.5 8.4l2.9 2.9 6.1-6.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICO_LOCK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
    '<rect x="3" y="7" width="10" height="6.5" rx="1.3" stroke="currentColor" stroke-width="1.3"/>' +
    '<path d="M5.5 7V5.2a2.5 2.5 0 015 0V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

  function chkHtml(st, attrs) {
    return '<span class="chk' + (st === 'all' ? ' checked' : st === 'some' ? ' indeterminate' : '') +
      '" role="checkbox" tabindex="0" aria-checked="' +
      (st === 'all' ? 'true' : st === 'some' ? 'mixed' : 'false') + '" ' + (attrs || '') + '></span>';
  }
  /* A heading cannot name its rows in an attribute without writing them
     all out, so the render keeps them and the row carries the index. */
  function setRef(list) { pickSets.push(list); return pickSets.length - 1; }

  /* Everything under this row closed? Then there is nothing to tick, and
     the margin says why: a tick for approved, a lock for finalised. */
  function allClosed(list) {
    var n = 0, shut = 0;
    list.forEach(function (e) { if (e.isNew) return; n++; if (isClosed(e)) shut++; });
    return n > 0 && n === shut;
  }
  function closedCell() {
    return '<td class="col-pick"><span class="chk disabled" aria-disabled="true"></span></td>';
  }
  function pickCellFor(list) {
    if (allClosed(list)) return closedCell(list);
    return '<td class="col-pick">' + chkHtml(pickState(list), 'data-pickset="' + setRef(list) + '"') + '</td>';
  }

  /* What a heading row says about the entries under it. A count under the
     name ("2 of 5") left the reader asking 2 of 5 what — so the chip says
     only how far along the group is, and the count, with its noun, is on
     hover. Only the top level carries it: one chip per group is the
     answer, a chip on every heading is a column of them to read past.
     Nothing until something is approved — "Open" everywhere is noise. */
  /* Counted over the whole group in the period, not over the rows the
     filters let through: under a supervisor filter a worker read
     "Approved" while their lines on another site were still open. */
  function rollChip(list, depth, name) {
    if (depth && depth !== 1) return '';
    var scope = list;
    if (name != null && groups().length) {
      var f = field(groups()[0]), b = bounds();
      scope = ENTRIES.filter(function (e) {
        if (b && (e.date < b.from || e.date > b.to)) return false;
        if (state.tab === 'mine' && e.worker !== ME) return false;
        return (f.get(e) || '\u2014') === name;
      });
    }
    var n = 0, done = 0;
    scope.forEach(function (e) { if (e.isNew) return; n++; if (isClosed(e)) done++; });
    if (!n || !done) return '';
    var tip = done + ' of ' + n + ' entr' + (n === 1 ? 'y' : 'ies') + ' approved';
    return done === n
      ? '<span class="roll-chip all" data-tip="' + tip + '">Approved</span>'
      : '<span class="roll-chip" data-tip="' + tip + '">Partly approved</span>';
  }

  /* Approving closes the hours at once, so one wrong click must be
     takeable back — from the message that says it happened, because by
     then the rows it closed may be scrolled away or folded. */
  function approveUnits(us) {
    if (!us.length) return;
    var who = Object.create(null), keys = [], hrs = 0;
    us.forEach(function (u) {
      approved[u.key] = true; who[u.worker] = 1; delete picked[u.key];
      keys.push(u.key); hrs += Number(hoursOf(u.e)) || 0;
    });
    var names = Object.keys(who);
    render();
    Shell.snackbar('Approved ' + fmtHours(hrs) + ' h for ' +
      (names.length === 1 ? names[0] : names.length + ' workers') + '.', {
      ms: 6000,
      action: { label: 'Undo', onClick: function () {
        keys.forEach(function (k) { delete approved[k]; });
        render();
        if (el('rv-modal').classList.contains('open')) rvRender();
        Shell.snackbar('Approval undone.');
      } }
    });
  }

  /* ─── Review before approving ───────────────────────────────────────
     The queue is one item per worker. The pane beside it is the Period
     view of what was picked for them: tasks down the side with their
     site, days across, hours where they meet. Underneath, written out,
     what the table has no room for: allowances and comments.

     Because a day can now be approved in part, the total row says both
     figures — the hours being approved, and the whole day they sit in —
     so nobody approves half a day without seeing that it is half. */
  var rvSheets = [], rvAt = 0;

  function rvOn(u) { return !isClosed(u.e); }
  function rvLive(sheet) { return sheet.units.filter(rvOn); }

  /* The queue follows how the table is grouped: the first level is the
     list on the left, the second splits the pane on the right. With no
     grouping the queue is by worker. Whatever the levels are, a row
     inside is always one worker — their day is what the 24-hour rule,
     the allowances and the comments are about. */
  function rvLevels() {
    var g = groups();
    return { first: field(g[0] || 'worker'), second: g[1] ? field(g[1]) : null };
  }

  function rvOpen() {
    var sel = selected();
    if (!sel.length) return;
    var f1 = rvLevels().first, by = Object.create(null), order = [];
    sel.forEach(function (u) {
      var k = f1.get(u.e) || '—';
      if (!by[k]) { by[k] = { key: k, label: k, units: [] }; order.push(k); }
      by[k].units.push(u);
    });
    order.sort();
    rvSheets = order.map(function (k) { return by[k]; });
    rvAt = 0;
    el('rv-modal').classList.add('open');
    rvRender();
  }
  function rvClose() { el('rv-modal').classList.remove('open'); }

  function rvDistinct(list, f) {
    var seen = Object.create(null), out = [];
    list.forEach(function (x) { var v = f(x); if (v && !seen[v]) { seen[v] = true; out.push(v); } });
    return out.sort();
  }
  function rvDay(d) { var x = fromIso(d); return DOW[x.getDay()] + ' ' + x.getDate(); }
  function rvAlw(e) {
    return (e.allowances || []).map(function (a) {
      return '<span class="rvx-tag">' + Shell.esc(a.name) +
        (a.qty != null ? ' × ' + a.qty : '') + '</span>';
    }).join('');
  }
  function rvCode(e) { return String(e.task || '').split(' | ')[0]; }
  function rvRest(e) { return String(e.task || '').split(' | ').slice(1).join(' | '); }
  function rvHours(list) {
    return list.reduce(function (n, e) { return n + (Number(hoursOf(e)) || 0); }, 0);
  }
  /* The day the 24-hour rule watches is the worker's whole day, every
     site — so when this slice is only part of it, the rest is said. */
  function rvOf(worker, d, mine) {
    var whole = workerDayTotal(worker, d);
    return whole > mine ? '<span class="rvx-of">of ' + fmtHours(whole) + ' h that day</span>' : '';
  }

  /* ─── The week as a grid, the detail inside each cell ─────────────
     Every section of one review shares one set of day columns at one
     width, so a column reads straight down through all of them — two
     tables of different days under each other did not line up. */
  /* `inSel` is the set of entry ids being approved. The grid shows the
     whole week of the workers involved, not only what was picked — the
     question the dialog has to answer is "what am I approving, out of
     what" — so every task block says which of three it is: going
     through now, already approved, or left out of this approval. */
  function rvGrid(entries, dates, inSel) {
    var who = rvDistinct(entries, function (e) { return e.worker; });
    return '<div class="rvx-gridwrap"><table class="rvx-grid"><colgroup><col class="c-who" />' +
      dates.map(function () { return '<col class="c-day" />'; }).join('') + '<col class="c-tot" /></colgroup>' +
      '<thead><tr><th class="rvx-who">Worker</th>' +
      dates.map(function (d) { return '<th>' + rvDay(d) + '</th>'; }).join('') +
      '<th class="rvx-tot">Total</th></tr></thead><tbody>' +
      who.map(function (w) {
        var mineAll = entries.filter(function (e) { return e.worker === w; });
        var going = mineAll.filter(function (e) { return inSel[e.id] && !isClosed(e); });
        return '<tr><td class="rvx-who">' + Shell.esc(w) + '</td>' +
          dates.map(function (d) {
            var on = mineAll.filter(function (e) { return e.date === d; });
            if (!on.length) return '<td><span class="cell-empty">&mdash;</span></td>';
            var h = rvHours(on);
            /* A task can be on the day more than once — its hours on one
               line, an allowance claimed on another — so the cell is built
               per task: one block each, with the claims and the note that
               belong to it inside the block. The task's own figure is
               only said when there is more than one task. */
            var tk = [], byT = Object.create(null);
            on.forEach(function (e) {
              var t = byT[e.task];
              if (!t) { t = byT[e.task] = { task: e.task, h: 0, alw: [], notes: [], go: false, open: false }; tk.push(t); }

              '<div class="rvx-h">' + fmtHours(h) + ' h</div>' + rvOf(w, d, h) +
              tk.map(function (t) {

                  '<div class="rvx-task-h"><span class="rvx-code">' + Shell.esc(tp[0]) + '</span>' +
                  (tk.length > 1 ? '<span class="rvx-lh">' + (t.h ? fmtHours(t.h) + ' h' : '—') + '</span>' : '') +
                  '</div>' +
                  (tp.length > 1 ? '<div class="rvx-tpath">' + Shell.esc(tp.slice(1).join(' | ')) + '</div>' : '') +
                  (t.alw.length ? '<div class="rvx-tags">' + t.alw.map(function (a) {

  function rvDetail(sheet) {
    var lv = rvLevels(), live = rvLive(sheet);
    var inSel = Object.create(null), workers = Object.create(null);
    sheet.units.forEach(function (u) { inSel[u.e.id] = true; workers[u.e.worker] = true; });
    /* The week around what was picked: the same slice of the table — the
       same first-level value — for the same workers, every day of it. */
    var all = rows().filter(function (e) {
      return !e.isNew && workers[e.worker] && (lv.first.get(e) || '—') === sheet.key;
    });
    var dates = rvDistinct(all, function (e) { return e.date; });
    var secs = [], by = Object.create(null);
    all.forEach(function (e) {
      var v = lv.second ? (lv.second.get(e) || '—') : '';
      if (!by[v]) { by[v] = []; secs.push(v); }
      by[v].push(e);
    });
    secs.sort();
    var hrs = live.reduce(function (n, u) { return n + (Number(hoursOf(u.e)) || 0); }, 0);

       is the system's word for it rather than theirs. */
    return '<div class="rv-head"><div class="rv-who">' + Shell.esc(sheet.label) + '</div>' +
        '<button class="btn-primary" type="button" id="rv-one"' + (live.length ? '' : ' disabled') + '>' +
          (live.length ? 'Approve ' + fmtHours(hrs) + ' h' : 'Nothing left to approve') + '</button>' +
      '</div>' +
      secs.map(function (v) {

          (lv.second ? '<div class="rvx-sec-h"><span class="rvx-sec-v">' + Shell.esc(v) + '</span></div>' : '') +
          rvGrid(by[v], dates, inSel) + '</div>';

  function rvRender() {

        '<span class="rv-q-txt"><span class="t">' + Shell.esc(s.label) + '</span>' +
        '<span class="s">' + (live ? fmtHours(rvLive(s).reduce(function (n, u) { return n + (Number(hoursOf(u.e)) || 0); }, 0)) + ' h to approve' : 'done') +

    }, 0);

  }

  function rvAdvance() {

  }

  /* What the bar says: entries first, because that is what is approved,
     then the days and people they come to. */
  function syncBar() {
    var sel = selected();

    document.body.classList.toggle('has-picked', sel.length > 0);
    el('btn-new-task').disabled = sel.length > 0;
    if (!sel.length) return;
    var who = Object.create(null), dys = Object.create(null);
    sel.forEach(function (u) { who[u.worker] = 1; dys[u.worker + '§' + u.date] = 1; });
    var list = sel.map(function (u) { return u.e; });
    var nd = Object.keys(dys).length, nw = Object.keys(who).length;
    var alw = allowTally(list);

    el('sel-what').textContent =

  }

  /* ─── Render ──────────────────────────────────────────────────────── */
  var CARET = '<span class="g-caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  /* A cell holds hours, and may hold the times they came from — some
     clients record one, some the other. The draft keeps all three
     together so the cell editor can read and write them as one thing. */
  function cellKey(e, isoDate) { return e.id + '|' + (isoDate || e.date); }
  function cellOf(e, isoDate) {

  /* Worded as the rest of the product words it, down to the brackets. */

  /* Three coins falling into an open hand. */
  var ICO_FLAG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<circle cx="8" cy="4" r="1.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<circle cx="14" cy="6" r="1.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<circle cx="11" cy="10" r="1.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<path d="M3.5 14.5v3a4 4 0 004 4h7.5a4 4 0 003.6-2.3l1.7-3.6a1.4 1.4 0 00-2.4-1.4L14 18" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  /* Left of the figure: a mark that follows the number pushes it off the
     right edge, and then one column no longer lines up with the next. */
  /* hand-coins, as the product draws it — the same mark My Timesheets

  var ICO_ALW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/>' +
    '<path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/>' +
    '<path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>';
  function alwMark(c) {
    if (!c.a || !c.a.length) return '';
    return '<span class="alw-mark" data-tip="Allowance &mdash; ' + Shell.esc(allowTip(c.a)) + '">' + ICO_ALW + '</span>';
  }

  /* ─── A day, and what is true of it ────────────────────────────────
     The worker's day is one timesheet whatever sites it spans, so its
     status belongs to the date and is drawn once at the head of the
     column — not repeated in every cell under it, where six copies of
     one fact crowded out the figures. A day is only as far along as the
     least far of the entries on it. */
  var ICO_DRAFT = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none">' +
    '<circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 2"/></svg>';
  var STATUS_RANK = { Draft: 0, Revised: 1, Submitted: 2, Finalised: 3 };
  /* Only the worker's own screen has one timesheet a day; a supervisor's
     day spans people, so there the status stays on the row. */
  function dayHasStatus() { return state.tab === 'mine'; }
  function dayStatus(list, isoDate) {
    var best = null;
    list.forEach(function (e) {
      if (e.date !== isoDate || e.isNew) return;
      if (best === null || STATUS_RANK[e.status] < STATUS_RANK[best]) best = e.status;
    });
    return best || 'Draft';
  }
  function stMark(name) {
    var st = STATUS_META[name] || STATUS_META.Draft;
    return '<span class="hr-st st-' + String(name).toLowerCase() + '">' +
      (st.icon || ICO_DRAFT) + '</span>';
  }
  /* Everything booked to one day, across every task on screen — drafts

  function dayTotal(list, isoDate) {

  }
  /* The cap is one person's day, never a column's: a supervisor's column

     also measured over everything booked, not over what the filters are
     letting through. */
  function workerDayTotal(worker, isoDate) {

      return e.worker === worker ? n + (Number(cellOf(e, isoDate).h) || 0) : n;
    }, 0);
  }
  /* Every person-day on screen that holds more than a day's worth. */
  function badDays() {
    var all = ENTRIES.concat(pending), out = [];
    days().forEach(function (d) {
      var k = iso(d), by = Object.create(null), order = [];
      all.forEach(function (e) {
        var h = Number(cellOf(e, k).h) || 0;
        if (!h) return;
        if (!(e.worker in by)) { by[e.worker] = 0; order.push(e.worker); }
        by[e.worker] += h;
      });
      order.forEach(function (w) {
        if (by[w] > DAY_CAP) out.push({ date: k, worker: w, hours: by[w] });
      });
    });
    return out;
  }
  /* The one cell whose figure put a day over. Everything else on that day
     was already there and is not what is wrong. */
  var overKey = null;
  function hoursOf(e, isoDate) { return cellOf(e, isoDate).h; }

  /* ═══ One cell, typed into where it is ═══════════════════════════════
     Ported from My Timesheets. A cell nobody is typing into is a figure;
     the rule appears under the pointer, and a click puts the field where
     the figure was. Only one cell is ever open. Leaving it is the whole
     act: the figure is written there and then, and the cell flashes
     green once it is in. Enter goes down, Tab goes across, the arrows
     leave the field once the caret has run out of figure, Escape puts
     back what was there. A day a worker could not have worked — more
     than 24 hours across every site — is refused at the keystroke: the
     figure stays, red, and is not written until it is changed. */
  var liveCell = null;                    // 'entryId|date' being typed into
  var justSaved = Object.create(null);    // cells still fading green
  var savedTimer = Object.create(null);
  var cellErr = Object.create(null);      // cells refused, and why
  var inFlight = Object.create(null);     // cells on their way in

  function entryById(id) {
    return ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0] || null;
  }
  function splitKey(k) { var at = k.indexOf('|'); return { id: k.slice(0, at), date: k.slice(at + 1) }; }

  /* The work order is what a row is found by, so it leads on its own
     line; the rest of the path is what tells it from the row under it. */
  function taskName(t) {
    var parts = String(t || '').split(' | ');
    return '<span class="tname"><span class="tn-code">' + Shell.highlight(parts[0], state.q) + '</span>' +
      (parts.length > 1
        ? '<span class="tn-rest">' + Shell.highlight(parts.slice(1).join(' | '), state.q) + '</span>' : '') +
      '</span>';
  }

  /* One <td>, whole: its state is painted on the cell, so the cell has
     to be drawn here rather than just its contents. `e` is the entry the
     figure belongs to — or, for an empty day on a Period row, the row's
     first entry, which a figure typed there is copied from. */
  function cellTd(e, isoDate, base, alwOverride) {
    var k = cellKey(e, isoDate), d = isoDate || e.date;
    var c = cellOf(e, isoDate), v = Number(c.h) || 0;
    var owns = !isoDate || e.date === isoDate;
    var lock = owns && !e.isNew && isLocked(e);
    var bad = cellErr[k], fly = inFlight[k];
    var td = base + (lock ? ' shut' : '') + (fly && fly.slow ? ' c-load' : '') +
      (justSaved[k] ? ' c-saved' : '') + (bad ? ' c-cap' : '');
    var fig = '<span class="cfig">' +
      (v > 0 ? fmtHours(v) : '<span class="cell-empty">&mdash;</span>') + '</span>';
    var marks = alwMark({ a: alwOverride || c.a || [] });

      var over = workerDayTotal(e.worker, d) > DAY_CAP;
      return '<td class="' + td + '"><input class="hr-cell' + (over ? ' over' : '') +
        '" type="text" inputmode="decimal" autocomplete="off" placeholder="&ndash;" data-ck="' +
        Shell.esc(k) + '" value="' + (v > 0 ? fmtHours(v) : '') + '" /></td>';
    }
    if (lock) {
      return '<td class="' + td + '" data-tip="' + entryState(e) + ' — hours can no longer be changed">' +

      '<button class="hr-view" type="button" data-ck="' + Shell.esc(k) + '">' +

  function liveInput() {
    if (!liveCell) return null;

    [].forEach.call(document.querySelectorAll('#grid-body input.hr-cell'), function (x) {
      if (!hit && x.getAttribute('data-ck') === liveCell) hit = x;
    });
    return hit;
  }
  function openHours(k) {
    if (liveCell === k) { var cur = liveInput(); if (cur) { cur.focus({ preventScroll: true }); cur.select(); } return; }
    if (liveCell) commitHours();

  /* The browser's own scroll-into-view does not know about the frozen

    var box = document.querySelector('.table-scroll');
    if (!box || !node) return;
    var r = node.getBoundingClientRect(), b = box.getBoundingClientRect(), tr = node.closest('tr');
    var frozen = tr ? tr.querySelectorAll('td.col-lead, td.col-pick') : [];
    var left = frozen.length ? frozen[frozen.length - 1].getBoundingClientRect().right : b.left;
    var tot = tr && tr.querySelector('td.col-hrs');
    var right = tot && !node.closest('td.col-hrs') ? tot.getBoundingClientRect().left : b.right;

    else if (r.right > right - 8) box.scrollLeft += (r.right - (right - 8));

  }

  }
  /* Writes one typed cell into its entry. A figure on a day the row did

     made — that is the cell the green belongs on. */

    if (!(k in draft)) return null;
    var p = splitKey(k), e = entryById(p.id), c = draft[k];
    if (!e) { delete draft[k]; return null; }
    if (e.date === p.date) {
      e.hours = c.h; e.start = c.s; e.finish = c.f; e.allowances = c.a || [];
      delete draft[k];
      return k;
    }
    delete draft[k];
    if (!(Number(c.h) > 0)) return null;
    var made = Object.assign({}, e, {
      id: 'e' + (ENTRIES.length + 1000), date: p.date, status: 'Draft', comment: '',
      hours: c.h, start: c.s, finish: c.f, allowances: c.a || []
    });

  }
  function commitHours() {

    liveCell = null;

    if (!(k in draft)) { render(); return; }
    if (e && workerDayTotal(e.worker, p.date) > DAY_CAP) {
      cellErr[k] = { kind: 'cap', msg: e.worker + ' — ' + fmtDay(fromIso(p.date)) + ' comes to ' +
        fmtHours(Math.round(workerDayTotal(e.worker, p.date) * 100) / 100) + ' h. A day holds ' +
        DAY_CAP + ', so this was not saved.' };

    }

  /* Hours are a number: digits and one decimal mark. What does not

    });

  }

    render();

  function hideCellWarn() { el('cell-warn').hidden = true; }

    var p = splitKey(liveCell), e = entryById(p.id);
    var tot = e ? workerDayTotal(e.worker, p.date) : 0;
    if (tot <= DAY_CAP) { w.hidden = true; return; }
    el('cell-warn-t').textContent = e.worker + ' — ' + fmtDay(fromIso(p.date)) + ' would come to ' +
      fmtHours(Math.round(tot * 100) / 100) + ' h. A day holds ' + DAY_CAP + ', so this will not be saved.';

  /* ─── Walking the grid ─────────────────────────────────────────────

     where the column is Hours, and in Period, where it is a day. */
  function navIn(scope) {
    return [].slice.call(scope.querySelectorAll('.hr-view[data-ck], input.hr-cell[data-ck]'));
  }
  function neighbourKey(node, dx, dy) {
    var td = node.closest('td'), tr = td && td.parentNode;
    if (!tr) return null;
    if (dx) {
      var row = navIn(tr), n = row[row.indexOf(node) + dx];
      return n ? n.getAttribute('data-ck') : null;
    }
    var col = td.cellIndex, r = tr;
    while ((r = dy > 0 ? r.nextElementSibling : r.previousElementSibling)) {
      var cell = r.cells[col];

      if (t) return t.getAttribute('data-ck');
    }
    return null;
  }
  function stepFrom(inp, dx, dy) {
    var next = neighbourKey(inp, dx, dy);
    /* The edge of the table ends the walk; it does not lose the figure. */
    if (!next) { commitHours(); return; }
    openHours(next);
  }

  /* The cell is a button, not a bare input: typing a number is still the
     fast path, but times have to be reachable from somewhere, and a cell
     nobody can open is a feature nobody finds. */
  function hrInput(e, isoDate) {
    var c = cellOf(e, isoDate), k = cellKey(e, isoDate);
    var changed = draft && k in draft;
    var st = statusOf(e), lock = isLocked(e);
    var dayOver = overKey === k && workerDayTotal(e.worker, isoDate || e.date) > DAY_CAP;
    return '<button class="hr-cell' + (changed ? ' changed' : '') + (lock ? ' locked' : '') +
      (dayOver ? ' over' : '') +
      '" type="button" data-cell="' + k + '"' + (lock ? ' disabled data-tip="' + entryState(e) + ' — hours can no longer be changed"' : '') + '>' +
      alwMark(c) +
      (st.icon && !(state.mode === 'period' && dayHasStatus())
        ? '<span class="hr-st st-' + String(e.status).toLowerCase() + '">' + st.icon + '</span>' : '') +
      (c.h === '' || c.h === 0 ? '<span class="cell-empty">&mdash;</span>' : fmtHours(c.h)) +
      '</button>';
  }
  /* Out of edit mode the status still has to be visible, because Period
     has no Status column to carry it. */
  function dayValue(e, isoDate) {
    var c = cellOf(e, isoDate), st = statusOf(e);
    return alwMark(c) +
      (st.icon && !(state.mode === 'period' && dayHasStatus())
        ? '<span class="hr-st" data-tip="' + e.status + '">' + st.icon + '</span>' : '') +
      (c.h === '' || c.h === 0 ? '<span class="cell-empty">&mdash;</span>' : fmtHours(c.h));
  }
  /* A field the context could not supply arrives as a cell on the row,
     prefilled with the best guess, rather than as another question in a
     dialog before the row exists. */
  function optsFor(e, k) {
    var plain = function (a) { return (a || []).map(function (x) { return { v: x, t: x }; }); };
    if (k === 'date') return days().map(function (d) { return { v: iso(d), t: fmtDay(d) }; });
    if (k === 'site') return plain(SITES);
    if (k === 'sup') return plain(SUPS[e.site]);
    if (k === 'worker') return plain(WORKERS);
    if (k === 'project') return plain(PROJECTS[e.site]);
    return [];
  }
  /* Which of a new row's cells are its own questions. The worker is one
     only where there is more than one worker on screen. */
  var PICKABLE = { date: 1, site: 1, sup: 1, worker: 1, project: 1 };
  function isPick(e, k) {
    if (!e.isNew) return false;
    if (k === 'worker') return state.tab !== 'mine';
    return !!PICKABLE[k];
  }
  function pickCell(e, f) {
    var opts = optsFor(e, f.k);
    /* Site decides what the other answers can be, so until it is given
       they have nothing to offer. */
    var off = !e.site && (f.k === 'sup' || f.k === 'project');
    return '<select class="cell-input' + (e[f.k] ? '' : ' need') + '" data-field="' + f.k +
      '" data-row="' + e.id + '"' + (off ? ' disabled' : '') + '>' +
      '<option value="">Select\u2026</option>' +
      opts.map(function (o) {
        return '<option value="' + Shell.esc(o.v) + '"' + (o.v === e[f.k] ? ' selected' : '') + '>' +
          Shell.esc(o.t) + '</option>';
      }).join('') + '</select>';
  }
  function taskBtn(e) {
    return '<button class="task-pick' + (e.task ? '' : ' empty need') + '" type="button" data-task="' +
      e.id + '">' + (e.task ? Shell.esc(e.task) : 'Select task\u2026') + '</button>';
  }

  function cellHtml(e, f) {
    if (f.k === 'allow') return allowHtml(e);
    if (f.k === 'hours') {
      if (state.editing && e.kind !== 'allow') return hrInput(e);
      return e.hours === '' ? '<span class="cell-empty">&mdash;</span>' : fmtHours(e.hours);
    }
    if (f.k === 'status') return statusChip(entryState(e));
    if (e.isNew && f.k === 'task') return taskBtn(e);
    if (f.k === 'task') return e.task ? taskName(e.task) : '<span class="cell-empty">&mdash;</span>';
    if (isPick(e, f.k)) return pickCell(e, f);
    var v = f.get(e);
    return v ? Shell.highlight(v, state.q) : '<span class="cell-empty">&mdash;</span>';
  }

  /* ─── Period ────────────────────────────────────────────────────────
     The same rows, pivoted: the date stops being a column of values and
     becomes the columns themselves. A leaf is a task, and its hours land
     in whichever day they were booked to — which is what lets a new row
     ask for nothing but the task. */
  /* A row being added is its own row until it is saved — otherwise a
     copy of a task would fold straight back into the row it was copied
     from, and nothing would have happened on screen. */
  function taskKey(e) { return e.isNew ? e.id : [e.site, e.sup, e.worker, e.task].join('\u00a7'); }

  /* A row being added sits above the table only while it has nothing to
     be grouped by. Once it knows what it is it belongs under its own
     heading — which, for a copy, is true from the first moment. */
  /* ─── A row stays where it was put ─────────────────────────────────
     A row added to the table used to sit loose at the top until the field
     it was grouped by was filled in, and then leap into its group — the
     thing being typed into moved out from under the pointer. Now every
     row this session adds is pinned to where it was added: under the
     heading whose + it came from, or at the top for Add task. It stays
     there while it is filled in and after it is saved, and settles into
     its group the next time the table is regrouped, refiltered, or moved
     to another period — which is a moment the reader expects things to
     move. */
  var pinnedAt = Object.create(null);      // row id -> group key ('' = top)
  function unpinAll() { pinnedAt = Object.create(null); }
  function groupKeyOf(e) {
    return groups().map(function (k) { return '\u00a7' + (field(k).get(e) || '\u2014'); }).join('');
  }
  /* A heading a task can be added under: every field it groups by has to
     be something a new row can be given. A status is not — nobody files a
     new line under "Approved". */
  var NOT_GIVEN = { status: 1 };
  function canAddUnder(key) {
    var depth = String(key).split('\u00a7').length - 1;
    return groups().slice(0, depth).every(function (k) { return !NOT_GIVEN[k]; });
  }

  function isLoose(e) {
    if (!e.isNew) return false;
    var g = groups();
    if (!g.length) return true;
    return g.some(function (k) { return !e[k]; });
  }

  function renderPeriod(list, lead, ds) {
    var cols = lead.concat([field('task')]);
    var offs = [], off = PICK_W;
    cols.forEach(function (c) { offs.push(off); off += c.w; });


    el('grid-cols').innerHTML = '<col style="width:' + PICK_W + 'px" />' +
      cols.map(function (c) { return '<col style="width:' + c.w + 'px" />'; }).join('') +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') + '<col style="width:92px" />' +
      '<col style="width:64px" />';

    var overSet = badDays();
    el('grid-head').innerHTML = '<tr>' +
      '<th class="col-pick">' + chkHtml(pickState(list), 'data-pickset="' + setRef(list) + '"') + '</th>' +
      cols.map(function (c, i) {
        return '<th class="col-lead' + (i === cols.length - 1 ? ' last' : '') +
          '" data-w="' + c.k + '" style="left:' + offs[i] + 'px">' +
          Shell.esc(c.label) + Shell.colGrip() + '</th>';
      }).join('') +
      ds.map(function (d) {
        var k = iso(d), t = k === iso(TODAY);
        /* The column's own figure is a column's figure — on a supervisor's
           screen it adds up several people and is meant to be large. What
           is marked is a person's day going over, whoever that person is. */
        var tot = dayTotal(list, k);
        var over = overSet.some(function (b) { return b.date === k; });
        var st = dayHasStatus() ? dayStatus(list, k) : '';
        var hit = overSet.filter(function (b) { return b.date === k; })[0];
        var tip = (st ? st + (STATUS_META[st] && STATUS_META[st].locked
          ? ' \u2014 hours can no longer be changed' : '') : '') +
          (hit ? (st ? '. ' : '') + (dayHasStatus() ? '' : hit.worker + ': ') +
            fmtHours(hit.hours) + ' h booked \u2014 more than ' + DAY_CAP : '');
        return '<th class="col-day' + (t ? ' tdy' : '') + '"' +
          (tip ? ' data-tip="' + Shell.esc(tip) + '"' : '') + '>' +
          '<span class="day-head' + (t ? ' is-today' : '') + '">' +
          '<span class="dnum">' + DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</span>' +
          '<span class="dtot' + (over ? ' over' : '') + '">' + (st ? stMark(st) : '') +
          (tot > 0 ? fmtHours(tot) + ' h' : '<span class="cell-empty">&mdash;</span>') +
          '</span></span></th>';
      }).join('') +
      '<th class="num col-hrs" data-w="hours"><span class="day-head">' +
        '<span class="dnum">Total</span><span class="dtot">' + fmtHours(sumOf(list)) + ' h</span>' +
      '</span>' + Shell.colGrip() + '</th>' +
      '<th class="col-act"></th></tr>';

    function leafRows(rowsIn) {

      rowsIn.forEach(function (e) {

        if (!by[k]) { by[k] = []; order.push(k); }
        by[k].push(e);
      });
      return order.map(function (k) { return by[k]; });
    }

    /* One task on one day. An allowance is claimed on a line of its own
       with no hours, so the figure is the line that carries hours and the
       claims of every line that day hang off it. */
    function dayCell(group, d) {
      var key = iso(d);
      var on = group.filter(function (e) { return e.date === key; });
      var host = on.filter(function (e) { return e.hours !== '' && e.hours != null; })[0] || on[0] || null;
      var alw = [];
      on.forEach(function (e) { alw = alw.concat(e.allowances || []); });
      return cellTd(host || group[0], key, 'col-day' + (key === iso(TODAY) ? ' tdy' : ''), host ? alw : null);
    }

    function taskRow(group) {
      shown++;
      var e = group[0];
      /* A task added here often already has a row — the booking is just
         another day on it — so the mark belongs to the group, not to the
         first entry in it. Without this, adding a task you have done
         before leaves nothing on screen to show for it. */
      var fresh = group.filter(function (x) { return x.isNew; })[0];
      var isJust = group.some(function (x) { return x.id === justAdded; });
      var total = ds.reduce(function (n, d) {
        var h = 0;
        group.forEach(function (x) { if (x.date === iso(d)) h += Number(hoursOf(x, iso(d))) || 0; });
        return n + h;
      }, 0);
      /* On this page a task row is its own set of entries, so its tick
         picks exactly those — nothing of the worker's other tasks. */
      return '<tr class="' + (fresh ? 'new-row' : '') + (isJust ? ' just-added' : '') +
          (allClosed(group) ? ' appr' : '') + '">' +
        (fresh ? '<td class="col-pick"></td>' : pickCellFor(group)) +
        cols.map(function (c, i) {
          var html = '';
          if (i === cols.length - 1) {
            /* Whatever the view has no column for is asked in the task
               cell; what it does have a column for is asked there. */
            html = fresh ? taskBtn(fresh) : taskName(e.task);
          } else if (fresh && isPick(fresh, c.k)) {
            html = pickCell(fresh, c);
          }
          return '<td class="col-lead' + (i === cols.length - 1 ? ' last' : '') +
            '" style="left:' + offs[i] + 'px">' + html + '</td>';
        }).join('') +
        ds.map(function (d) { return dayCell(group, d); }).join('') +
        '<td class="num col-hrs">' + fmtHours(total) + '</td>' + actCell(fresh || e) + '</tr>';
    }

    function headRow(node, depth, key, open) {
      var total = sumOf(node.rows);
      return '<tr class="g-row d' + depth + (open ? '' : ' collapsed') +
          (allClosed(node.rows) ? ' appr' : '') + '"' +
          (depth === 1 ? ' data-key="' + Shell.esc(key) + '"' : '') + '>' +
        pickCellFor(node.rows) +
        cols.map(function (c, i) {
          var html = '';
          if (i === depth - 1) {
            var name = '<span class="g-stack"><span class="g-name">' + Shell.highlight(String(node.name), state.q) +
              '</span>' + rollChip(node.rows, depth, node.name) + '</span>';
            html = depth === 1 ? '<button class="g-btn" type="button">' + CARET + name + '</button>' : name;
          } else if (i > depth - 1 && i < lead.length) {
            html = '<span class="g-tally-in">' + tally(node.rows, cols[i]) + '</span>';
          } else if (i === cols.length - 1) {

          }
          return '<td class="col-lead' + (i === cols.length - 1 ? ' last' : '') +
            '" style="left:' + offs[i] + 'px">' + html + '</td>';
        }).join('') +
        ds.map(function (d) {
          var k = iso(d), h = 0, any = 0, shut = 0;
          node.rows.forEach(function (x) {
            if (x.date !== k) return;

          });

          return '<td class="col-day' + (k === iso(TODAY) ? ' tdy' : '') + (lock ? ' shut' : '') + '"' +
            (lock ? ' data-tip="Everything under this on ' + fmtDay(d) + ' is closed"' : '') + '>' +
            '<span class="sum-fig"><span class="cfig">' +
            (h ? fmtHours(h) : '<span class="cell-empty">&mdash;</span>') + '</span>' +
            (lock ? '<span class="cm-lock is-lock">' + ICO_LOCK + '</span>' : '') + '</span></td>';
        }).join('') +
        '<td class="num col-hrs">' + fmtHours(total) + '</td>' + actCell(null, key) + '</tr>';
    }

    function walk(nodes, depth, path) {
      nodes.forEach(function (node) {
        var key = path + '\u00a7' + node.name;
        var top = depth === 1;
        var open = !top || collapsed[key] !== true;
        if (top) openKeys.push(key);
        out.push(headRow(node, depth, key, open));
        var here = pinsAt(key);
        if (!open) return;
        here.forEach(function (e) { out.push(taskRow([e])); });
        if (node.kids) walk(node.kids, depth + 1, key);
        else leafRows(node.rows).forEach(function (grp) { out.push(taskRow(grp)); });
      });
    }

    var pins = list.filter(function (e) { return e.id in pinnedAt; });
    var placed = Object.create(null);
    function pinsAt(key) {
      return pins.filter(function (e) {
        if (pinnedAt[e.id] !== key) return false;
        placed[e.id] = 1; return true;
      });
    }
    var fresh = list.filter(function (e) { return !(e.id in pinnedAt) && isLoose(e); });
    var settled = list.filter(function (e) { return !(e.id in pinnedAt) && !isLoose(e); });
    var g = groups();
    if (!g.length) leafRows(settled).forEach(function (grp) { out.push(taskRow(grp)); });
    else walk(nest(settled, g), 1, '');
    /* Pinned to the top, or to a heading that is no longer on screen. */
    var head = [];
    pins.forEach(function (e) { if (!placed[e.id]) head.push(taskRow([e])); });
    fresh.forEach(function (e) { head.push(taskRow([e])); });
    out = head.concat(out);

    el('grid-body').innerHTML = out.length ? out.join('')
      : '<tr><td colspan="' + (cols.length + ds.length + 3) + '"><div class="empty">Nothing booked in this period.</div></td></tr>';
    return { shown: shown, openKeys: openKeys };
  }

  var ICO_BIN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.6 8.2a1 1 0 001 .8h4.8a1 1 0 001-.8l.6-8.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 7v4M9.4 7v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  var ICO_DUP = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="5.6" y="5.6" width="7.9" height="7.9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 3.4H4a1.6 1.6 0 00-1.6 1.6v6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  var ICO_PLUS = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

  /* One column at the end of every row, in both modes. A row that exists
     can be copied; a row being added can be thrown away; a heading can
     start another row under itself, already knowing what it groups by. */
  function actCell(e, addKey) {
    var out = '';
    /* While something is picked, approving is the one thing to do — every
       other button on the page steps back, these with them. */
    var off = anyOn(picked) ? ' disabled' : '';
    if (e && e.isNew) {
      out = '<button class="row-act row-drop" type="button" data-drop="' + e.id +
        '" aria-label="Remove this row" data-tip="Remove this row"' + off + '>' + ICO_BIN + '</button>';
    } else if (e) {
      out = '<button class="row-act" type="button" data-dup="' + e.id +
        '" aria-label="Duplicate this row" data-tip="Duplicate this row"' + off + '>' + ICO_DUP + '</button>';
    } else if (state.editing && addKey != null && canAddUnder(addKey)) {
      out = '<button class="row-act" type="button" data-addhere="' + Shell.esc(addKey) +
        '" aria-label="Add a task here" data-tip="Add a task here"' + off + '>' + ICO_PLUS + '</button>';
    }
    return '<td class="col-act">' + out + '</td>';
  }

  function render() {
    var lead = leadCols(), rest = restCols(), cols = lead.concat(rest);
    var g = groups(), list = rows();

    document.body.classList.toggle('editing', state.editing);
    pickSets = [];

    if (state.mode === 'period') {
      /* Every day of the period, weekend or not: a seven-day roster is a
         setting, not an exception, and a site that works Saturdays would
         lose the column it books to. */
      var r = renderPeriod(list, lead, days());
      finish(r.shown, list, r.openKeys);
      return;
    }

    /* The heading columns stay put while the rest scrolls, so a row read
       on the right still says whose it is. The tick column goes in front
       of them and stays put too. */
    var off = PICK_W, offsets = lead.map(function (c) { var at = off; off += c.w; return at; });

    el('grid-cols').innerHTML = '<col style="width:' + PICK_W + 'px" />' +
      cols.map(function (c) {
        return '<col style="width:' + c.w + 'px" />';
      }).join('') + '<col style="width:64px" />';

    el('grid-head').innerHTML = '<tr>' +
      '<th class="col-pick">' + chkHtml(pickState(list), 'data-pickset="' + setRef(list) + '"') + '</th>' +
      cols.map(function (c, i) {
      var isLead = i < lead.length;
      return '<th class="' + (isLead ? 'col-lead' + (i === lead.length - 1 ? ' last' : '') : '') +
        (c.num ? ' num' : '') + (c.k === 'hours' ? ' col-hrs' : '') + '" data-w="' + c.k + '"' +
        (isLead ? ' style="left:' + offsets[i] + 'px"' : '') + '>' +
        Shell.esc(c.label) + Shell.colGrip() + '</th>';
    }).join('') + '<th class="col-act"></th></tr>';

    var out = [], shown = 0, openKeys = [];

    function leadCell(i, html) {
      return '<td class="col-lead' + (i === lead.length - 1 ? ' last' : '') +
        '" style="left:' + offsets[i] + 'px">' + (html || '') + '</td>';
    }

    function entryRow(e) {
      shown++;
      var done = !e.isNew && isClosed(e);
      /* Every row of this worker's day ticks together, so the box stands
         for the pair and not for the row it happens to sit on. */
      var mates = !e.isNew && list.filter(function (x) { return !x.isNew && keyOf(x) === keyOf(e); });
      return '<tr class="' + (e.isNew ? 'new-row' : '') +
          (e.id === justAdded ? ' just-added' : '') + (done ? ' appr' : '') +
          (!e.isNew && !done && picked[keyOf(e)] ? ' picked' : '') + '">' +
        (e.isNew ? '<td class="col-pick"></td>' : done ? closedCell([e]) : pickCellFor(mates)) +
        lead.map(function (c, i) {
          /* A row still being added shows its grouped fields as pickers
             rather than blanks: those are what decide where it lands, so
             a wrong guess has to be correctable from the row itself. */
          if (e.isNew && c.k === 'task') return leadCell(i, taskBtn(e));
          if (isPick(e, c.k)) return leadCell(i, pickCell(e, c));
          return leadCell(i, '');
        }).join('') +
        rest.map(function (c) {
          if (c.k === 'hours') return cellTd(e, undefined, 'col-hrs col-edit');
          var cls = (c.num ? 'num' : '');
          var tip = c.k === 'task' ? ' data-tip="' + Shell.esc(c.label + ' — ' + c.get(e)) + '"' : '';
          return '<td class="' + cls + '"' + tip + '>' + cellHtml(e, c) + '</td>';
        }).join('') + actCell(e) +
      '</tr>';
    }

    /* What a heading row says in a column it is not the heading for. */
    function rollup(c, rows) {
      if (c.k === 'hours') return '<td class="num col-hrs">' + fmtHours(sumOf(rows)) + '</td>';
      if (c.k === 'allow') return '<td class="g-tally">' + allowTally(rows) + '</td>';
      if (COUNTABLE[c.k]) return '<td class="g-tally">' + tally(rows, c) + '</td>';
      return '<td></td>';
    }

    /* Only the top level folds. One chevron on the screen, in one column,
       and everything under a closed one goes with it — the deeper rows are
       the detail you opened it to read, not more drawers to open. */
    function walk(nodes, depth, path) {
      nodes.forEach(function (node) {
        var key = path + '\u00a7' + node.name;
        var top = depth === 1;
        var open = !top || collapsed[key] !== true;
        if (top) openKeys.push(key);

        out.push('<tr class="g-row d' + depth + (open ? '' : ' collapsed') +
            (allClosed(node.rows) ? ' appr' : '') + '"' +
            (top ? ' data-key="' + Shell.esc(key) + '"' : '') + '>' +
          pickCellFor(node.rows) +
          lead.map(function (c, i) {
            if (i < depth - 1) return leadCell(i, '');            // said already, above
            if (i === depth - 1) {
              var name = '<span class="g-stack"><span class="g-name">' + Shell.highlight(String(node.name), state.q) +
                '</span>' + rollChip(node.rows, depth, node.name) + '</span>';
              return leadCell(i, top ? '<button class="g-btn" type="button">' + CARET + name + '</button>' : name);
            }
            /* A field grouped below this one: how many are coming. */
            return leadCell(i, '<span class="g-tally-in">' + tally(node.rows, c) + '</span>');
          }).join('') +
          rest.map(function (c) { return rollup(c, node.rows); }).join('') + actCell(null, key) +
        '</tr>');

        var here = pinsAt(key);
        if (!open) return;
        here.forEach(function (e) { out.push(entryRow(e)); });
        if (node.kids) walk(node.kids, depth + 1, key);
        else node.rows.forEach(function (e) { out.push(entryRow(e)); });
      });
    }

    var pins = list.filter(function (e) { return e.id in pinnedAt; });
    var placed = Object.create(null);
    function pinsAt(key) {
      return pins.filter(function (e) {
        if (pinnedAt[e.id] !== key) return false;
        placed[e.id] = 1; return true;
      });
    }
    var fresh = list.filter(function (e) { return !(e.id in pinnedAt) && isLoose(e); });
    var settled = list.filter(function (e) { return !(e.id in pinnedAt) && !isLoose(e); });
    if (!g.length) settled.forEach(function (e) { out.push(entryRow(e)); });
    else walk(nest(settled, g), 1, '');
    var head = [];
    pins.forEach(function (e) { if (!placed[e.id]) head.push(entryRow(e)); });
    fresh.forEach(function (e) { head.push(entryRow(e)); });
    out = head.concat(out);

    el('grid-body').innerHTML = out.length
      ? out.join('')
      : '<tr><td colspan="' + (cols.length + 2) + '"><div class="empty">Nothing booked in this period.</div></td></tr>';

    el('grid').style.minWidth =
      (cols.reduce(function (n, c) { return n + c.w; }, 0) + PICK_W + 64) + 'px';
    finish(shown, list, openKeys);

  /* ─── Edit mode ─────────────────────────────────────────────────── */
  /* What a row still owes before it can be filed. */

  /* The dates this row will actually write to. A row that writes nothing

  function datesOn(r) {

  function sameAsExisting(r, d) {
    return ENTRIES.some(function (e) {

     same task cannot sit on the same day twice, so Save waits until
     something about it is different — another day, or another task. */
  function clashRows() {
    return pending.filter(function (r) {
      if (rowGaps(r).length) return false;
      var ds = datesOn(r);
      return ds.length > 0 && ds.every(function (d) { return sameAsExisting(r, d); });
    });
  }

     quietly throw it away. */

    return pending.filter(function (r) {

  /* ─── Saving as you go ─────────────────────────────────────────────

     is over 24 hours, while a copied row still matches the row it came
     from, or while a new row is still being filled in — and the header
     says which, in the place Save used to stand. One reason at a time,
     the most specific first: a list of everything wrong is a list nobody
     reads. A row being filled in is not an error, so it is said in grey. */
  var saveTimer = null;

  function syncEditNote() {
    var n = Object.keys(draft).filter(function (k) { return k !== liveCell && !cellErr[k]; }).length + pending.length;
    var flying = Object.keys(inFlight).length;

    clearTimeout(saveTimer);

          : over.length + ' days are over ' + DAY_CAP + ' hours — not saved',

          : clash.length + ' rows are already on the timesheet — not saved',

  /* Writing what was typed into the entries. Not while a cell or a task
     is open — the table redraws on save, and the field somebody is typing
     into would be pulled out from under them. */
  function saveNow() {
    saveTimer = null;
    if (popKey || tpId || liveCell) { saveTimer = setTimeout(saveNow, 450); return; }
    /* A pending row with no hours on it never becomes an entry. */
    pending.forEach(function (row) {
      var any = Object.keys(draft).some(function (k) {
        return k.indexOf(row.id + '|') === 0 && draft[k].h > 0;
      });
      if (!any) return;
      delete row.isNew;
      ENTRIES.push(row);
    });

      var id = k.slice(0, k.indexOf('|')), date = k.slice(k.indexOf('|') + 1);
      var e = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
      if (!e) return;
      var c = draft[k];
      if (e.date === date) {
        e.hours = c.h; e.start = c.s; e.finish = c.f; e.allowances = c.a || [];
        return;
      }
      /* Filled in another day: that is a new entry on that date, which is
         the whole point of the date being a column. */
      ENTRIES.push(Object.assign({}, e, {
        id: 'e' + (ENTRIES.length + 1000), date: date,
        hours: c.h, start: c.s, finish: c.f, allowances: c.a || []
      }));

  /* ─── One cell ──────────────────────────────────────────────────────
     Hours, or the times they were worked. Both are recorded because
     different clients record different ones, and times had nowhere to go
     while a cell was a bare number field. */
  var pop = el('cell-pop'), popKey = null, popCell = null;

  /* The clock here is 24-hour, so "6" can only mean 06:00 — which is what
     people type. The field fills itself in when it loses focus rather
     than making anyone punch out the zeros. */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function normTime(v) {
    v = (v || '').trim();
    if (!v) return '';
    var h, m;
    if (/^\d{3,4}$/.test(v)) {                 // 630, 1430
      var n = ('0000' + v).slice(-4);
      h = Number(n.slice(0, 2)); m = Number(n.slice(2));
    } else {
      var p = /^(\d{1,2})[:.\s]?(\d{1,2})?$/.exec(v);
      if (!p) return v;                        // not a time: leave it be
      h = Number(p[1]);
      m = p[2] == null ? 0 : Number(p[2].length === 1 ? p[2] + '0' : p[2]);

    return pad2(h) + ':' + pad2(m);

    return Math.round(mins / 60 * 100) / 100;
  }

      ' value="' + (amount ? has.qty : '') + '"' + (amount ? '' : ' hidden') + ' /></div>';
  }

    var a = null;
    allowancesFor(site).forEach(function (x) { if (x.name === sel.value) a = x; });
    if (!a) return [];
    if (a.type !== 'amount') return [{ name: a.name, type: 'check' }];
    var q = Number((el('cp-alw-qty') || {}).value);
    return [{ name: a.name, type: 'amount', qty: !q || q < 1 ? 1 : q }];
  }
  el('cp-alw').addEventListener('change', function (e) {

    var amount = !!a && a.type === 'amount';

  var popSite = '';
  function openCell(btn) {
    popKey = btn.getAttribute('data-cell');
    var id = popKey.slice(0, popKey.indexOf('|')), date = popKey.slice(popKey.indexOf('|') + 1);
    var e = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
    var c = draft && popKey in draft ? draft[popKey]
          : (e && e.date === date
              ? { h: e.hours, s: e.start || '', f: e.finish || '', a: (e.allowances || []).slice() }
              : { h: '', s: '', f: '', a: [] });

    popSite = e ? e.site : '';
    var period = entryModeFor(popSite) === 'period';
    /* The site decides which of the two is the question and which the
       answer: an hours site is never shown times. */
    el('cp-times').hidden = !period;
    el('cp-h').disabled = period;
    el('cp-hrow').classList.toggle('derived', period);
    renderCellAllowances(popSite, c.a);
    el('cp-h').value = c.h === '' ? '' : fmtHours(c.h);
    el('cp-s').value = c.s || '';
    el('cp-f').value = c.f || '';
    popCell = btn;
    el('cp-err').hidden = true;

    var r = btn.getBoundingClientRect();
    pop.classList.add('open');
    var top = r.bottom + 6, left = r.right - pop.offsetWidth;
    if (top + pop.offsetHeight > window.innerHeight - 8) top = r.top - pop.offsetHeight - 6;
    pop.style.top = Math.max(8, top) + 'px';
    pop.style.left = Math.max(8, left) + 'px';
    el('cp-h').focus();
    el('cp-h').select();
  }

  /* What this person's day has left once this cell's own hours are set
     aside — the room the figure being typed has to fit into. */
  function popEntry() {
    if (!popKey) return null;
    var id = popKey.slice(0, popKey.indexOf('|'));
    return ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0] || null;
  }
  function popDate() { return popKey ? popKey.slice(popKey.indexOf('|') + 1) : ''; }
  function roomLeft() {
    var e = popEntry();
    if (!e) return DAY_CAP;
    var own = Number(cellOf(e, popDate()).h) || 0;
    return Math.max(0, Math.round((DAY_CAP - (workerDayTotal(e.worker, popDate()) - own)) * 100) / 100);
  }
  function typedHours() {
    if (entryModeFor(popSite) === 'period') {
      var v = hoursBetween(el('cp-s').value, el('cp-f').value);
      return v == null ? 0 : v;
    }
    var h = el('cp-h').value.trim().replace(',', '.');
    return h === '' ? 0 : Number(h);
  }
  /* Said as it is typed, beside the field it is typed in. */
  function syncCellErr() {
    if (!popKey) return;
    var left = roomLeft(), v = typedHours(), over = !isNaN(v) && v > left;
    el('cp-err').hidden = !over;
    if (over) {
      el('cp-err-t').textContent = fmtHours(left) + ' h left on this day, but ' +
        fmtHours(v) + ' h was entered.';
    }
    /* The cell that was clicked is what is wrong, so it is what turns red. */
    if (popCell) popCell.classList.toggle('over', over);
  }

  /* Two cells are the same when they say the same thing, so an editor
     opened and left alone writes nothing and Save stays dark. */
  function sameCell(a, b) {
    if (a.h !== b.h || (a.s || '') !== (b.s || '') || (a.f || '') !== (b.f || '')) return false;
    var x = a.a || [], y = b.a || [];
    if (x.length !== y.length) return false;
    return x.every(function (v, i) {
      return v.name === y[i].name && v.type === y[i].type && (v.qty || 0) === (y[i].qty || 0);
    });
  }
  function commitCell() {
    if (!popKey) return;
    var period = entryModeFor(popSite) === 'period';
    var v, sT = '', fT = '';
    if (period) {
      sT = normTime(el('cp-s').value); fT = normTime(el('cp-f').value);
      var fromTimes = hoursBetween(sT, fT);
      if (fromTimes == null) { sT = ''; fT = ''; v = 0; } else { v = fromTimes; }
    } else {
      var h = el('cp-h').value.trim().replace(',', '.');
      v = h === '' ? 0 : Number(h);
    }
    if (isNaN(v) || v < 0) v = 0;
    var id = popKey.slice(0, popKey.indexOf('|')), date = popKey.slice(popKey.indexOf('|') + 1);
    var e = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
    /* Nobody works more than a day in a day — but silently cutting what
       was typed back to the room left loses the thing the person meant to
       say. The figure is kept, the cell is marked, and Save is what
       refuses until the day adds up. */
    if (e) {
      var others = workerDayTotal(e.worker, date) - (Number(cellOf(e, date).h) || 0);
      overKey = (others + v > DAY_CAP) ? popKey : null;
    }
    var was = draft && popKey in draft ? draft[popKey]
            : (e && e.date === date
                ? { h: e.hours, s: e.start || '', f: e.finish || '', a: (e.allowances || []).slice() }
                : { h: '', s: '', f: '', a: [] });
    var next = { h: v, s: sT, f: fT, a: cellAllowances(popSite) };
    if (!sameCell(next, was)) draft[popKey] = next;
    closeCell();
    render();
  }
  function closeCell() {
    pop.classList.remove('open');
    popKey = null;
    popCell = null;
    el('cp-err').hidden = true;
  }

  /* Times win when both are given, because they are the more specific
     answer — and the figure they imply is shown as it is typed. */
  /* Hours and the times are two ways of saying the same thing, so typing
     one lets go of the other — otherwise a number typed over a cell that
     already has times is silently overruled by them on Done. */
  el('cp-h').addEventListener('input', function () {
    el('cp-s').value = '';
    el('cp-f').value = '';
    syncCellErr();
  });

  ['cp-s', 'cp-f'].forEach(function (id) {
    el(id).addEventListener('input', function () {
      var v = hoursBetween(el('cp-s').value, el('cp-f').value);
      if (v != null) el('cp-h').value = fmtHours(v);
      syncCellErr();
    });
    el(id).addEventListener('blur', function () {
      this.value = normTime(this.value);
      var v = hoursBetween(el('cp-s').value, el('cp-f').value);
      if (v != null) el('cp-h').value = fmtHours(v);
    });
  });
  el('cp-clear').addEventListener('click', function () {
    if (popKey) draft[popKey] = { h: 0, s: '', f: '', a: [] };
    closeCell();
    render();
  });
  pop.addEventListener('click', function (e) { e.stopPropagation(); });
  pop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitCell(); }
    /* Escape keeps nothing — and must not travel on, or the page's own
       Escape would end the whole edit. */
    if (e.key === 'Escape') { e.stopPropagation(); closeCell(); }
  });
  /* Leaving the editor keeps what is in it: typing a number and clicking
     the next cell is the whole job on a site that books plain hours. */
  document.addEventListener('click', function () { if (popKey) commitCell(); });
  window.addEventListener('scroll', function () { if (popKey) commitCell(); }, true);

  /* A click on a figure opens it where it is. Anywhere else commits the
     one that is open. */
  el('grid-body').addEventListener('click', function (e) {
    var v = e.target.closest('.hr-view[data-ck]');
    if (!v) return;
    e.stopPropagation();
    openHours(v.getAttribute('data-ck'));
  });
  document.addEventListener('click', function (e) {
    if (!liveCell) return;
    if (e.target.closest && e.target.closest('input.hr-cell')) return;
    commitHours();
  });
  el('grid-body').addEventListener('input', function (e) {
    var inp = e.target.closest('input.hr-cell');
    if (!inp) return;
    var k = inp.getAttribute('data-ck');
    var kept = keepNumeric(inp.value);
    if (kept !== inp.value) {
      var at = inp.selectionStart == null ? kept.length : inp.selectionStart;
      var drop = inp.value.length - kept.length;
      inp.value = kept;
      try { inp.setSelectionRange(Math.max(0, at - drop), Math.max(0, at - drop)); } catch (err) {}
    }
    /* Half-typed is left on screen rather than written as a zero. */
    if (kept !== '' && isNaN(Number(kept))) return;
    var v = kept === '' ? 0 : Number(kept);
    var p = splitKey(k), en = entryById(p.id);
    var was = en && en.date === p.date
      ? { h: en.hours, s: en.start || '', f: en.finish || '', a: (en.allowances || []).slice() }
      : { h: '', s: '', f: '', a: [] };
    /* Typing a figure replaces the times it came from, unless it is the
       same figure. */
    var next = { h: v, s: '', f: '', a: draft[k] ? draft[k].a : was.a };
    if (v === Number(was.h)) { next.s = was.s; next.f = was.f; }
    draft[k] = next;
    delete cellErr[k];
    redrawKeeping();
    syncCellWarn();
  });
  el('grid-body').addEventListener('keydown', function (e) {
    var inp = e.target.closest('input.hr-cell');
    if (!inp) return;
    var atStart = inp.selectionStart === 0 && inp.selectionEnd === 0;
    var atEnd = inp.selectionStart === inp.value.length && inp.selectionEnd === inp.value.length;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelHours(); return; }
    if (e.key === 'Enter') { e.preventDefault(); stepFrom(inp, 0, 1); return; }
    if (e.key === 'Tab') { e.preventDefault(); stepFrom(inp, e.shiftKey ? -1 : 1, 0); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); stepFrom(inp, 0, -1); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); stepFrom(inp, 0, 1); return; }
    if (e.key === 'ArrowLeft' && atStart) { e.preventDefault(); stepFrom(inp, -1, 0); return; }
    if (e.key === 'ArrowRight' && atEnd) { e.preventDefault(); stepFrom(inp, 1, 0); return; }
  });
  window.addEventListener('scroll', function () { if (liveCell) syncCellWarn(); }, true);

  el('grid-body').addEventListener('input', function (e) {
    var sel = e.target.closest('.cell-input');
    if (!sel) return;
    var row = pending.filter(function (x) { return x.id === sel.getAttribute('data-row'); })[0];
    if (!row) return;
    var k = sel.getAttribute('data-field'), was = row[k];
    row[k] = sel.value;
    /* Hours are kept against a date, so moving the row to another day has
       to take them with it — otherwise the figure stays booked to the day
       it was typed on and the row saves to two days at once. */
    if (k === 'date' && was !== row.date) {
      Object.keys(draft || {}).forEach(function (key) {
        if (key !== row.id + '|' + was) return;
        draft[row.id + '|' + row.date] = draft[key];
        delete draft[key];
      });
    }
    /* The site is what the other answers are drawn from, so changing it
       lets go of the ones that came from the old one — and does not
       guess the new ones. A site runs several supervisors and several
       projects, and a guess printed as an answer is read as one. */
    if (k === 'site') { row.levels = []; row.task = ''; row.sup = ''; row.project = ''; }
    render();
  });

  el('grid-body').addEventListener('click', function (e) {
    var drop = e.target.closest('[data-drop]');
    if (!drop) return;
    e.stopPropagation();
    var id = drop.getAttribute('data-drop');
    pending = pending.filter(function (x) { return x.id !== id; });
    Object.keys(draft || {}).forEach(function (k) { if (k.indexOf(id + '|') === 0) delete draft[k]; });
    render();
  });

  /* ─── Add a task ────────────────────────────────────────────────────
     Not a dialog. Add task drops an empty row at the top of the table and
     the row itself is the form: every answer is a cell, on the line the
     answer will live on. Which cells those are depends on the view —
     Entries has a column per field, Period has one, the task. */
  function supervisorOn(date, site) {
    var found = null;
    ENTRIES.forEach(function (e) { if (!found && e.date === date && e.site === site) found = e.sup; });
    return found;
  }

  /* The day the week is sitting on, so the row lands somewhere real. */
  function defaultDate() {
    var ds = days(), t = iso(TODAY);
    if (ds.some(function (d) { return iso(d) === t; })) return t;
    return ds.length ? iso(ds[0]) : t;
  }

  var nSeq = 0;
  /* What a row still has to be asked for. */
  function rowGaps(r) {
    var out = [];
    ['site', 'sup', 'project'].forEach(function (k) { if (!r[k]) out.push(k); });
    if (state.tab !== 'mine' && !r.worker) out.push('worker');
    if (!r.task) out.push('task');
    return out;
  }
  /* A seed is whatever is already settled: the group the add was started
     from, or the row being copied. */
  function addInlineRow(seed, anchor) {
    if (popKey) commitCell();
    closeTaskPop();
    var row = {
      id: 'n' + (++nSeq), date: defaultDate(),
      site: '', sup: '', worker: state.tab === 'mine' ? ME : '',
      project: '', task: '', levels: [], status: 'Draft',
      allowances: [], start: '', finish: '', hours: '', isNew: true
    };
    Object.keys(seed || {}).forEach(function (k) { if (seed[k]) row[k] = seed[k]; });
    pending.unshift(row);
    pinnedAt[row.id] = anchor || '';
    /* A row added under a folded heading would be added out of sight. */
    if (anchor) collapsed['\u00a7' + String(anchor).split('\u00a7')[1]] = false;
    justAdded = row.id;
    addedOn = row.date;
    render();
    /* After this click has finished travelling: the close-on-outside
       handler is still on its way up and would shut the editor again. */
    setTimeout(function () {
      var tr = document.querySelector('tr.just-added');
      if (tr) tr.scrollIntoView({ block: 'center' });
      /* A copy is already answered — it only wants its hours, so nothing
         is opened over it. */
      if (!rowGaps(row).length) return;
      var btn = document.querySelector('[data-task="' + row.id + '"]');
      /* Period has nowhere else to ask, so it asks at once. Entries has
         the whole row, so it starts at the first blank on it. */
      if (state.mode === 'period' && rowGaps(row).indexOf('task') !== -1) {
        if (btn) openTaskPop(btn);
        return;
      }
      var first = tr && (tr.querySelector('.cell-input.need') || tr.querySelector('.task-pick.need'));
      if (first) first.focus();
    }, 0);
  }
  el('btn-new-task').addEventListener('click', function () { addInlineRow(null, ''); });

  /* A heading already says what it groups by, so a row started from one
     is asked only for what is left. */
  function seedFromKey(key) {
    var vals = String(key || '').split('\u00a7').slice(1);
    var g = groups(), seed = {};
    vals.forEach(function (v, i) {
      if (!g[i] || v === '\u2014') return;
      seed[g[i]] = v;
    });
    /* The date is a value in Entries and a column in Period; either way
       it is a date, not a field the row has to be told twice. */
    if (seed.date) { var d = fromIso(seed.date); if (isNaN(d)) delete seed.date; }
    return seed;
  }

  el('grid-body').addEventListener('click', function (e) {
    var add = e.target.closest('[data-addhere]');
    if (!add) return;
    e.stopPropagation();
    addInlineRow(seedFromKey(add.getAttribute('data-addhere')), add.getAttribute('data-addhere'));
  });

  /* The same task again, on another day. Everything that said what the
     row was for is copied; the hours are not, because those are the
     thing being written. */
  el('grid-body').addEventListener('click', function (e) {
    var dup = e.target.closest('[data-dup]');
    if (!dup) return;
    e.stopPropagation();
    var id = dup.getAttribute('data-dup');
    var src = ENTRIES.concat(pending).filter(function (x) { return x.id === id; })[0];
    if (!src) return;
    addInlineRow({
      date: src.date, site: src.site, sup: src.sup, worker: src.worker,
      project: src.project, task: src.task,
      levels: String(src.task || '').split(' | ').filter(Boolean)
    }, groupKeyOf(src));
  });

  /* ─── The task, and whatever the view has no column for ───────────── */
  var tpop = el('task-pop'), tpId = null;
  function tpRow() { return pending.filter(function (x) { return x.id === tpId; })[0] || null; }

  function tpFields(r) {
    var out = [];
    /* Period shows one column, so the rest of the row is asked here —
       except for what grouping has put back on screen as a column of its
       own, which the row asks for in that column. */
    if (state.mode === 'period') {
      var g = groups();
      var ask = function (k, name) { if (g.indexOf(k) === -1) out.push({ k: k, name: name }); };
      ask('site', 'Site');
      if (state.tab !== 'mine') ask('worker', 'Worker');
      ask('sup', 'Supervisor');
      ask('project', 'Project');
    }
    (SITE_FIELDS[r.site] || []).forEach(function (f, i) {
      out.push({ k: 'lvl' + i, name: f.name, values: f.values });
    });
    return out;
  }

  function renderTaskPop() {
    var r = tpRow();
    if (!r) return;
    var html = tpFields(r).map(function (f) {
      var lvl = f.k.indexOf('lvl') === 0;
      var vals = lvl ? f.values : optsFor(r, f.k).map(function (o) { return o.v; });
      var cur = lvl ? (r.levels[Number(f.k.slice(3))] || '') : (r[f.k] || '');
      return '<label class="tp-fld"><span class="tp-lab">' + Shell.esc(f.name) + '</span>' +
        '<select class="cell-input' + (cur ? '' : ' need') + '" data-tp="' + f.k + '">' +
        '<option value="">Select\u2026</option>' +
        vals.map(function (v) {
          return '<option' + (v === cur ? ' selected' : '') + '>' + Shell.esc(v) + '</option>';
        }).join('') + '</select></label>';
    }).join('');
    el('tp-fields').innerHTML = html ||
      '<div class="alw-empty">Choose the site on the row first.</div>';
  }

  /* The editor follows the cell it belongs to, the way the hours one
     does — and the cell is rebuilt on every answer, so it is found again
     by the row it is for rather than held on to. */
  function anchorTaskPop() {
    var btn = document.querySelector('[data-task="' + tpId + '"]');
    if (!btn) { closeTaskPop(); return; }
    var r = btn.getBoundingClientRect();
    var top = r.bottom + 6, left = r.left;
    if (top + tpop.offsetHeight > window.innerHeight - 8) top = r.top - tpop.offsetHeight - 6;
    if (left + tpop.offsetWidth > window.innerWidth - 8) left = window.innerWidth - tpop.offsetWidth - 8;
    tpop.style.top = Math.max(8, top) + 'px';
    tpop.style.left = Math.max(8, left) + 'px';
  }
  function openTaskPop(btn) {
    tpId = btn.getAttribute('data-task');
    if (!tpRow()) { tpId = null; return; }
    tpop.classList.add('open');
    renderTaskPop();
    anchorTaskPop();
    var first = tpop.querySelector('select:not(:disabled)');
    if (first) first.focus();
  }
  function closeTaskPop() { tpop.classList.remove('open'); tpId = null; }

  el('tp-fields').addEventListener('change', function (ev) {
    var sel = ev.target.closest('[data-tp]');
    var r = tpRow();
    if (!sel || !r) return;
    var k = sel.getAttribute('data-tp');
    if (k.indexOf('lvl') === 0) r.levels[Number(k.slice(3))] = sel.value;
    else {
      r[k] = sel.value;
      if (k === 'site') { r.levels = []; r.sup = ''; r.project = ''; }
    }
    /* A task is its levels, in order, as far as they have been given. */
    r.task = (r.levels || []).filter(Boolean).join(' | ');
    renderTaskPop();
    render();
    anchorTaskPop();
  });

  el('tp-clear').addEventListener('click', function () {
    var r = tpRow();
    if (!r) return;
    r.levels = []; r.task = '';
    renderTaskPop();
    render();
    anchorTaskPop();
  });
  el('tp-done').addEventListener('click', closeTaskPop);

  tpop.addEventListener('click', function (e) { e.stopPropagation(); });
  tpop.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.stopPropagation(); closeTaskPop(); }
  });
  document.addEventListener('click', function () { if (tpId) closeTaskPop(); });
  window.addEventListener('scroll', function () { if (tpId) anchorTaskPop(); }, true);

  el('grid-body').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-task]');
    if (!btn) return;
    e.stopPropagation();
    if (popKey) commitCell();
    var id = btn.getAttribute('data-task');
    if (tpId === id) { closeTaskPop(); return; }
    closeTaskPop();
    /* Committing the hours editor re-renders, so the button just clicked
       may already be detached — it is found again by the row it is for. */
    openTaskPop(document.querySelector('[data-task="' + id + '"]') || btn);
  });

  /* ─── Entries or Period ─────────────────────────────────────────── */
  el('modeswitch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mode]');
    if (!b) return;
    state.mode = b.getAttribute('data-mode');
    this.querySelectorAll('.seg-btn').forEach(function (x) { x.classList.toggle('active', x === b); });
    collapsed = Object.create(null);
    unpinAll();
    render();
  });

  render();
})();
</script>
</body>
</html>
