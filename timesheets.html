<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timesheets — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style id="frozen-cols"></style>
<style>
  /* ─── Timesheets-only ─────────────────────────────────────────────── */
  td.col-chk, th.col-chk { padding-left: 16px; padding-right: 0; }
  td.col-issued { color: var(--text-main); font-variant-numeric: tabular-nums; }
  td.col-act { padding: 6px 12px 6px 6px; }
  /* Nested timesheet rows leave the group column empty so every value below
     the header sits under the heading that names it. */
  td.col-group { color: var(--text-main); }
  .flat-name { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  td.col-sheets, th.col-sheets { text-align: right; font-variant-numeric: tabular-nums; padding-right: 24px; }
  th.col-sheets { padding-right: 24px; }

  td.col-chk, th.col-chk { padding-left: 16px; padding-right: 0; }
  td.col-issued { color: var(--text-main); font-variant-numeric: tabular-nums; }
  td.col-act { padding: 6px 12px 6px 6px; }

  /* ─── Columns button & panel — same component as the Workers module ─── */
  .btn-columns {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 8px;
    background: var(--white); border: 1px solid var(--grey-350);
    font-size: 14px; font-weight: 500; line-height: 18px;
    color: var(--grey-800); cursor: pointer; font-family: var(--fs-sans);
    white-space: nowrap; transition: border-color 0.15s, background 0.15s;
  }
  .btn-columns:hover { border-color: #aab6cc; background: var(--bg-blue-light); }
  .btn-columns.active { background: var(--bg-blue-light); border-color: var(--primary); color: var(--primary); }

  .col-panel-wrap { position: relative; }
  .col-panel {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    min-width: 210px; background: var(--white);
    border: 1px solid var(--grey-350); border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    z-index: 50; padding: 6px 0; overflow: hidden;
  }
  .col-panel.open { display: block; }
  .col-panel-section { padding: 6px 14px 2px; font-size: 11px; font-weight: 600; color: var(--grey-400); text-transform: uppercase; letter-spacing: 0.6px; }
  .col-panel-divider { border: none; border-top: 1px solid var(--grey-300); margin: 6px 0; }
  .col-panel-row {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; height: 36px; cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .col-panel-row:hover { background: var(--bg-blue-light); }
  .col-chk-box {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    border: 1.5px solid var(--grey-400); background: var(--white);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .col-panel-row input[type="checkbox"] { display: none; }
  .col-panel-row input:checked + .col-chk-box { background: var(--primary); border-color: var(--primary); }
  .col-panel-row input:checked + .col-chk-box::after {
    content: ''; width: 9px; height: 5px;
    border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px); display: block;
  }
  .col-panel-name { font-size: 14px; color: var(--text-main); }
  /* Frozen columns can't be hidden — the table's anchor points.
     Kept checked so the state reads as "on", dimmed so it reads as locked. */
  .col-panel-row.locked { cursor: not-allowed; }
  .col-panel-row.locked:hover { background: transparent; }
  .col-panel-row.locked .col-chk-box { opacity: 0.4; }
  .col-panel-row.locked .col-panel-name { color: var(--grey-600); opacity: 0.75; }

  td.col-task, td.col-allow { white-space: normal; line-height: 18px; }

  /* Timesheet tab: sheet rows lead, their jobs sit under them on a tint. */
  tr.ts-parent { cursor: pointer; }
  tr.ts-parent > td { border-top: 1px solid var(--grey-300); }
  #tbody tr.ts-parent:first-child > td { border-top: none; }
  .ts-parent-main { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-main); }
  .ts-caret { display: inline-flex; color: var(--grey-500); transition: transform var(--t-fast); }
  tr.ts-parent.collapsed .ts-caret { transform: rotate(-90deg); }
  td.ts-count { font-weight: 600; color: var(--text-main); }
  td.ts-total { font-weight: 700; }

  /* Frozen cells inherit their row's background, so each row state must set
     one. All at matching specificity, ordered so selection wins over hover. */
  #tbody tr { background: var(--white); }
  #tbody tr.group-row { background: var(--grey-100); }
  #tbody tr:hover { background: #fafbfe; }
  #tbody tr.selected { background: var(--bg-blue-light); }
  .table-card thead tr { background: var(--white); }
  tr.ts-job > td { border-bottom: none; font-size: 13px; }

  td.col-hrs, th.col-hrs { text-align: right; font-variant-numeric: tabular-nums; }
  th.col-hrs { padding-right: 16px; }
  td.col-hrs { font-weight: 600; color: var(--text-main); }

  .updated-cell { display: flex; align-items: baseline; gap: 12px; }
  .updated-time { color: var(--grey-600); font-variant-numeric: tabular-nums; }

  /* Group header rows, shown when Group by is Worker or Project */
  tr.group-row { height: 40px; }
  tr.group-row td {
    background: inherit; padding: 6px 16px;
    font-size: 13px; font-weight: 500; color: var(--grey-800);
    letter-spacing: 0.13px; border-bottom: 1px solid var(--row-divider);
  }
  tr.group-row:hover td { background: var(--grey-100); }
  .group-toggle {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; color: inherit;
  }
  .group-caret { transition: transform var(--t-fast); color: var(--grey-600); flex-shrink: 0; }
  tr.group-row.collapsed .group-caret { transform: rotate(-90deg); }
  .group-count { color: var(--grey-600); font-weight: 400; }
  .avatar-sm { width: 24px; height: 24px; font-size: 10px; }
  td.group-total { font-weight: 700; color: var(--text-main); }

  /* Selection bar replaces the toolbar while rows are checked */
  .sel-bar {
    display: none; align-items: center; gap: 16px;
    height: 36px; padding: 0 12px; border-radius: 8px;
    background: var(--bg-blue-light); border: 1px solid var(--primary);
  }
  .sel-bar.visible { display: flex; }
  .sel-count { font-size: 14px; font-weight: 500; color: var(--primary); white-space: nowrap; }
  .sel-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .sel-action {
    background: none; border: none; cursor: pointer; font-family: var(--fs-sans);
    font-size: 14px; font-weight: 500; color: var(--primary);
    height: 28px; padding: 0 10px; border-radius: 6px;
  }
  .sel-action:hover { background: var(--primary-pressed-bg); }
  .sel-action.danger { color: var(--error); }
  .sel-action.danger:hover { background: var(--error-light); }
  .sel-action:disabled { color: var(--grey-400); cursor: default; }
  .sel-action:disabled:hover { background: none; }

  /* Row kebab menu */
  .kebab-wrap { position: relative; }

  /* ─── Date range calendar (MUI date-range picker layout) ─────────── */
  .dd-chev { width: 12px; height: 12px; margin-left: auto; color: var(--grey-600); }
  .dd-panel.cal-mode { min-width: 0; padding: 0; }
  .dd-panel.cal-mode #date-quick { display: none; }
  #date-cal { display: none; }
  .dd-panel.cal-mode #date-cal { display: block; }

  .cal { width: 600px; padding: 8px 8px 0; }
  .cal-head { display: flex; align-items: center; padding: 4px 8px 6px; }
  .cal-nav {
    width: 32px; height: 32px; flex-shrink: 0; border: none; border-radius: 50%;
    background: none; cursor: pointer; color: var(--grey-700);
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav:hover { background: var(--grey-200); }
  .cal-nav.next svg { transform: rotate(180deg); }
  .cal-title { flex: 1; text-align: center; font-size: 15px; font-weight: 500; color: var(--text-main); }

  .cal-months { display: flex; gap: 24px; padding: 0 8px; }
  .cal-month { flex: 1; }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow span { height: 30px; line-height: 30px; text-align: center; font-size: 12px; color: var(--grey-600); }

  /* The cell carries the range band; the button carries the day circle. */
  .cal-cell { height: 36px; display: flex; align-items: center; justify-content: center; }
  .cal-cell.in { background: var(--bg-blue-light); }
  .cal-cell.start { border-radius: 18px 0 0 18px; }
  .cal-cell.end { border-radius: 0 18px 18px 0; }
  .cal-cell.start.end { border-radius: 18px; }
  .cal-day {
    width: 34px; height: 34px; border: none; border-radius: 50%; background: none;
    cursor: pointer; font-family: var(--fs-sans); font-size: 13px; color: var(--text-main);
  }
  .cal-day:hover { background: var(--grey-200); }
  .cal-day.today { border: 1px solid var(--grey-400); }
  .cal-cell.sel .cal-day { background: var(--primary); color: #fff; font-weight: 500; }
  .cal-cell.sel .cal-day.today { border-color: var(--primary); }

  .cal-foot {
    margin-top: 8px; padding: 10px 16px; border-top: 1px solid var(--grey-300);
    font-size: 13px; color: var(--grey-600);
  }

  /* macOS hides overlay scrollbars until you scroll, which leaves no hint that
     the table pans sideways — so paint one permanently under every tab. */
  /* No scrollbar-color here: setting it makes Chrome ignore the
     ::-webkit-scrollbar rules below and fall back to an overlay bar. */
  .table-scroll { overflow-x: scroll; }
  @supports (-moz-appearance: none) {
    .table-scroll { scrollbar-color: var(--grey-400) var(--grey-200); }
  }
  .table-scroll::-webkit-scrollbar { -webkit-appearance: none; height: 10px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--grey-200); }
  .table-scroll::-webkit-scrollbar-thumb {
    background: var(--grey-400); border-radius: 5px;
    border: 2px solid var(--grey-200); background-clip: padding-box;
  }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--grey-600); background-clip: padding-box; }

</style>
</head>
<body data-module="timesheets">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <div class="page-header">
        <h1 class="page-title">Timesheets</h1>
        <div class="header-actions">
          <div class="dd-wrap" id="super-dd">
            <button class="dd-trigger" type="button">
              <span>Supervisor: <span id="super-dd-value">All</span></span>
              <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dd-panel" id="super-dd-panel"></div>
          </div>
          <div class="dd-wrap" id="date-dd">
            <button class="dd-trigger" type="button">
              <span>Date: <span id="date-dd-value">Last 7 days</span></span>
              <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dd-panel" id="date-dd-panel"></div>
          </div>
          <button class="btn-primary" type="button" id="btn-create">Create Timesheet</button>
        </div>
      </div>

      <div class="toolbar" id="toolbar">
        <div class="search-wrap">
          <label class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input class="search-input-el" id="search" type="text" placeholder="Search" autocomplete="off" />
            <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
          </label>
        </div>
        <div class="toolbar-right">
          <span class="seg-label">Group by</span>
          <div class="seg" id="groupby">
            <button class="seg-btn active" type="button" data-group="none">Timesheet</button>
            <button class="seg-btn" type="button" data-group="worker">Worker</button>
            <button class="seg-btn" type="button" data-group="flat">No Grouping</button>
          </div>
          <button class="btn-ghost" type="button" id="expand-all">Expand all</button>
          <div class="col-panel-wrap">
            <button class="btn-columns" id="btn-columns" type="button" aria-expanded="false" aria-haspopup="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="1" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>
                <rect x="6" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>
                <rect x="11" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>
              </svg>
              Columns
            </button>
            <div class="col-panel" id="col-panel"></div>
          </div>
        </div>
      </div>

      <div class="sel-bar" id="sel-bar">
        <span class="sel-count" id="sel-count">0 selected</span>
        <div class="sel-actions">
          <button class="sel-action" type="button" data-bulk="export">Export</button>
          <button class="sel-action" type="button" data-bulk="finalise">Finalise</button>
          <button class="sel-action danger" type="button" data-bulk="delete">Delete</button>
          <button class="sel-action" type="button" data-bulk="clear">Clear</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table>
            <colgroup id="main-colgroup"></colgroup>
            <thead id="main-thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="empty">
          <div class="empty-title">No timesheets found</div>
          <div class="empty-sub" id="empty-sub">Try a different search term or date range.</div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  /* ─── Mock data ───────────────────────────────────────────────────────
     Hardcoded, as in every other OPMS prototype — there is no backend.    */
  var STATUS_COLOR = {
    Created:   'grey',
    Exported:  'purple',
    Submitted: 'blue',
    Updated:   'indigo',
    Imported:  'violet',
    Revised:   'lime',
    Finalised: 'green'
  };

  var TIMESHEETS = [
    { id: 'TS-1041', ago: 70, supervisor: 'Olivia Rhye',    site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Smith John',   status: 'Created',   updAgo: 69, time: '10:03 am' },
    { id: 'TS-1042', ago: 62, supervisor: 'Priya Nair',   site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Stone Emma',   status: 'Exported',  updAgo: 62, time: '10:03 am' },
    { id: 'TS-1043', ago: 55, supervisor: 'Tom Halloran', site: 'SA BHP OLYMPIC DAM', project: 'Shutdown Factory XYZ',  worker: 'Adams Sophia', status: 'Submitted', updAgo: 54, time: '10:03 am' },
    { id: 'TS-1044', ago: 47, supervisor: 'Grace Okafor', site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Miller Ava',   status: 'Updated',   updAgo: 46, time: '09:14 am' },
    { id: 'TS-1045', ago: 40, supervisor: 'Grace Okafor', site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Clark Emma',   status: 'Imported',  updAgo: 40, time: '04:41 pm' },
    { id: 'TS-1046', ago: 33, supervisor: 'Grace Okafor', site: 'SA BHP OLYMPIC DAM', project: 'Olympic Dam Expansion', worker: 'Baker Liam',   status: 'Revised',   updAgo: 32, time: '11:52 am' },
    { id: 'TS-1047', ago: 26, supervisor: 'Olivia Rhye',    site: 'MMA VIGILANT – 360', project: 'Shutdown Factory XYZ',  worker: 'Brown Olivia', status: 'Finalised', updAgo: 25, time: '08:20 am' },
    { id: 'TS-1048', ago: 19, supervisor: 'Priya Nair',   site: 'SA BHP OLYMPIC DAM', project: 'Olympic Dam Expansion', worker: 'Clark Olivia', status: 'Created',   updAgo: 19, time: '02:07 pm' },
    { id: 'TS-1049', ago: 12, supervisor: 'Tom Halloran', site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Hill Allison', status: 'Submitted', updAgo: 11, time: '10:33 am' },
    { id: 'TS-1050', ago: 6 , supervisor: 'Olivia Rhye',    site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Davis Noah',   status: 'Exported',  updAgo: 5 , time: '03:55 pm' },
    { id: 'TS-1051', ago: 4 , supervisor: 'Grace Okafor', site: 'SA BHP OLYMPIC DAM', project: 'Shutdown Factory XYZ',  worker: 'Smith John',   status: 'Updated',   updAgo: 4 , time: '09:02 am' },
    { id: 'TS-1052', ago: 2 , supervisor: 'Priya Nair',   site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Miller Ava',   status: 'Revised',   updAgo: 1 , time: '01:18 pm' },
    { id: 'TS-1053', ago: 0 , supervisor: 'Tom Halloran', site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Baker Liam',   status: 'Finalised', updAgo: 0 , time: '07:45 am' },
    { id: 'TS-1054', ago: 0 , supervisor: 'Olivia Rhye',    site: 'SA BHP OLYMPIC DAM', project: 'Olympic Dam Expansion', worker: 'Hill Allison', status: 'Imported',  updAgo: 0 , time: '12:30 pm' }
  ];

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var FULL_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function fmtDate(iso) {
    var p = iso.split('-');
    return String(Number(p[2])) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }

  /* ─── Dates ────────────────────────────────────────────────────────
     The mock timesheets carry day offsets, not fixed dates, and are rebased
     onto today at load. A hardcoded dataset would age out of "Last 7 days"
     and leave the default view empty a week after this was written. */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function toIso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseIso(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

  var TODAY = new Date();
  TODAY.setHours(0, 0, 0, 0);

  function daysAgoIso(n) {
    var d = new Date(TODAY.getTime());
    d.setDate(d.getDate() - n);
    return toIso(d);
  }

  TIMESHEETS.forEach(function (t) {
    t.issued  = daysAgoIso(t.ago);
    t.updated = daysAgoIso(t.updAgo);
  });

  /* "12 Aug – 20 Aug 2025", collapsing the year when both ends share it. */
  function fmtRange(from, to) {
    if (from === to) return fmtDate(from);
    var a = fmtDate(from), b = fmtDate(to);
    if (from.slice(0, 4) === to.slice(0, 4)) a = a.slice(0, a.lastIndexOf(' '));
    return a + ' – ' + b;
  }

  /* ─── State ───────────────────────────────────────────────────────── */
  var state = { query: '', range: 'last7', from: null, to: null, supervisor: 'all', group: 'none' };

  /* Columns the user has switched off. Position and Work Type ship hidden. */
  var hiddenCols = { position: true, worktype: true };
  /* The frozen columns anchor the table, so they can't be switched off. */
  var LOCKED_COLS = ['chk', 'group', 'issued', 'site', 'super', 'act'];
  var selected = Object.create(null);
  /* Rows start collapsed, so an unrecorded key counts as collapsed and
     only an explicit false means a row has been opened. */
  var collapsed = Object.create(null);
  /* A search opens the rows it matches inside. That lives in its own map, so
     clearing the search puts the manual open/closed state back as it was. */
  var searchCollapsed = Object.create(null);
  function isCollapsed_(key) {
    if (state.query) return searchCollapsed[key] === true;
    return collapsed[key] !== false;
  }
  function setCollapsed_(key, v) {
    if (state.query) searchCollapsed[key] = v; else collapsed[key] = v;
  }
  var openKeys = [];       // what the Expand all button acts on, set during render
  var renderedKeys = [];   // parent rows the current render actually emitted
  var renderedSheets = Object.create(null);   // timesheet ids the render touched
  var shownIds = [];       // timesheet ids on screen, for select-all

  var tbody     = document.getElementById('tbody');
  var empty     = document.getElementById('empty');
  var emptySub  = document.getElementById('empty-sub');
  var mainTable    = document.querySelector('.table-card table');
  var mainColgroup = document.getElementById('main-colgroup');
  var mainThead    = document.getElementById('main-thead');
  function chkAll() { return document.getElementById('chk-all'); }
  var selBar    = document.getElementById('sel-bar');
  var selCount  = document.getElementById('sel-count');
  var toolbar   = document.getElementById('toolbar');
  var searchEl  = document.getElementById('search');
  var clearBtn  = document.getElementById('search-clear');

  var CHECK = '<svg class="dd-check" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ─── Supervisor filter ───────────────────────────────────────────── */
  /* The signed-in account in the shell — what "Me" resolves to. */
  var CURRENT_USER = 'Olivia Rhye';

  var superPanel = document.getElementById('super-dd-panel');
  var superValue = document.getElementById('super-dd-value');

  var supervisors = [];
  TIMESHEETS.forEach(function (t) {
    if (t.supervisor === CURRENT_USER) return;      // covered by the Me option
    if (supervisors.indexOf(t.supervisor) === -1) supervisors.push(t.supervisor);
  });
  supervisors.sort();

  superPanel.innerHTML =
    '<button class="dd-item active" type="button" data-super="all">' + CHECK + 'All supervisors</button>' +
    '<button class="dd-item" type="button" data-super="me">' + CHECK + 'Me (' + Shell.esc(CURRENT_USER) + ')</button>' +
    '<hr class="dd-divider" />' +
    supervisors.map(function (n) {
      return '<button class="dd-item" type="button" data-super="' + Shell.esc(n) + '">' + CHECK + Shell.esc(n) + '</button>';
    }).join('');

  superPanel.addEventListener('click', function (e) {
    var item = e.target.closest('.dd-item');
    if (!item) return;
    state.supervisor = item.getAttribute('data-super');
    superPanel.querySelectorAll('.dd-item').forEach(function (i) { i.classList.remove('active'); });
    item.classList.add('active');
    superValue.textContent = state.supervisor === 'all' ? 'All'
      : state.supervisor === 'me' ? 'Me' : state.supervisor;
    Shell.closeAllDropdowns();
    render();
  });

  /* ─── Date filter: quick ranges + a custom range calendar ─────────── */
  var datePanel = document.getElementById('date-dd-panel');
  var dateValue = document.getElementById('date-dd-value');
  var dateTrigger = document.querySelector('#date-dd .dd-trigger');

  var QUICK = [
    { k: 'today', label: 'Today' },
    { k: 'last7', label: 'Last 7 days' },
    { k: 'month', label: 'Last month' }
  ];
  var CHEV = '<svg class="dd-chev" viewBox="0 0 12 12" fill="none"><path d="M4.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  datePanel.innerHTML =
    '<div class="dd-view" id="date-quick">' +
      QUICK.map(function (r) {
        return '<button class="dd-item' + (r.k === state.range ? ' active' : '') + '" type="button" data-range="' + r.k + '">' +
          CHECK + r.label + '</button>';
      }).join('') +
      '<button class="dd-item" type="button" data-range="custom">' + CHECK + 'Custom' + CHEV + '</button>' +
      '<hr class="dd-divider" />' +
      '<button class="dd-item" type="button" data-range="all">' + CHECK + 'All time</button>' +
    '</div>' +
    '<div class="cal" id="date-cal"></div>';

  function markRange(k) {
    datePanel.querySelectorAll('#date-quick .dd-item').forEach(function (i) {
      i.classList.toggle('active', i.getAttribute('data-range') === k);
    });
  }
  function syncDateLabel() {
    if (state.range === 'custom') { dateValue.textContent = fmtRange(state.from, state.to); return; }
    if (state.range === 'all')    { dateValue.textContent = 'All time'; return; }
    dateValue.textContent = QUICK.filter(function (r) { return r.k === state.range; })[0].label;
  }

  /* The date window every filter reads. null means no date limit. */
  function rangeBounds() {
    if (state.range === 'today')  return { from: daysAgoIso(0),  to: daysAgoIso(0) };
    if (state.range === 'last7')  return { from: daysAgoIso(6),  to: daysAgoIso(0) };
    if (state.range === 'month')  return { from: daysAgoIso(29), to: daysAgoIso(0) };
    if (state.range === 'custom') return { from: state.from, to: state.to };
    return null;
  }

  /* ─── Custom range calendar (two months, MUI date-range style) ─────── */
  var DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var calAnchor = null;                    // first day of the left-hand month
  var pick = { from: null, to: null };     // in-progress selection
  var hoverIso = null;

  var ARROW = '<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function openCalendar() {
    var base = (state.range === 'custom' && state.from) ? parseIso(state.from) : new Date(TODAY.getTime());
    /* Show the previous month alongside the current one — most of the
       records being picked over are in the past. */
    calAnchor = new Date(base.getFullYear(), base.getMonth() - 1, 1);
    pick = state.range === 'custom' ? { from: state.from, to: state.to } : { from: null, to: null };
    hoverIso = null;
    datePanel.classList.add('cal-mode');
    renderCal();
  }

  function monthGrid(y, m) {
    var lead = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var lo = pick.from;
    var hi = pick.to || (lo && hoverIso && hoverIso > lo ? hoverIso : null);
    var today = daysAgoIso(0);
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell"></div>';
    for (var d = 1; d <= days; d++) {
      var iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var isStart = !!lo && iso === lo;
      var isEnd   = !!hi && iso === hi;
      var cls = 'cal-cell';
      if (lo && hi && iso >= lo && iso <= hi) cls += ' in';
      if (isStart) cls += ' start';
      if (isEnd)   cls += ' end';
      if (isStart || isEnd) cls += ' sel';
      cells += '<div class="' + cls + '"><button class="cal-day' + (iso === today ? ' today' : '') +
        '" type="button" data-iso="' + iso + '">' + d + '</button></div>';
    }
    return '<div class="cal-month">' +
      '<div class="cal-dow">' + DOW.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
    '</div>';
  }

  function renderCal() {
    var y = calAnchor.getFullYear(), m = calAnchor.getMonth();
    var right = new Date(y, m + 1, 1);
    var hint = !pick.from ? 'Select start date'
             : !pick.to   ? 'Select end date'
             : fmtRange(pick.from, pick.to);
    document.getElementById('date-cal').innerHTML =
      '<div class="cal-head">' +
        '<button class="cal-nav" type="button" data-nav="-1" aria-label="Previous month">' + ARROW + '</button>' +
        '<div class="cal-title">' + FULL_MONTHS[m] + ' ' + y + '</div>' +
        '<div class="cal-title">' + FULL_MONTHS[right.getMonth()] + ' ' + right.getFullYear() + '</div>' +
        '<button class="cal-nav next" type="button" data-nav="1" aria-label="Next month">' + ARROW + '</button>' +
      '</div>' +
      '<div class="cal-months">' + monthGrid(y, m) + monthGrid(right.getFullYear(), right.getMonth()) + '</div>' +
      '<div class="cal-foot">' + hint + '</div>';
  }

  function pickDay(iso) {
    if (!pick.from || pick.to) { pick = { from: iso, to: null }; hoverIso = null; renderCal(); return; }
    if (iso < pick.from) { pick.from = iso; renderCal(); return; }
    pick.to = iso;
    state.range = 'custom'; state.from = pick.from; state.to = pick.to;
    markRange('custom');
    syncDateLabel();
    Shell.closeAllDropdowns();
    render();
  }

  /* The panel lives inside the document-level "click closes dropdowns"
     handler, so calendar clicks have to be kept from bubbling to it. */
  datePanel.addEventListener('click', function (e) { e.stopPropagation(); });
  datePanel.addEventListener('click', function (e) {
    var item = e.target.closest('.dd-item');
    if (item) {
      var k = item.getAttribute('data-range');
      if (k === 'custom') { openCalendar(); return; }
      state.range = k;
      markRange(k);
      syncDateLabel();
      Shell.closeAllDropdowns();
      render();
      return;
    }
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + Number(nav.getAttribute('data-nav')), 1);
      renderCal();
      return;
    }
    var day = e.target.closest('.cal-day');
    if (day) pickDay(day.getAttribute('data-iso'));
  });

  datePanel.addEventListener('mouseover', function (e) {
    var day = e.target.closest('.cal-day');
    if (!day || !pick.from || pick.to) return;
    var iso = day.getAttribute('data-iso');
    if (iso === hoverIso) return;
    hoverIso = iso;
    renderCal();
  });

  // Reopening the dropdown always lands back on the quick list.
  dateTrigger.addEventListener('click', function () { datePanel.classList.remove('cal-mode'); });

  syncDateLabel();

  /* ─── Filtering + grouping ────────────────────────────────────────── */
  /* Date and supervisor narrow the set of timesheets. The search runs later,
     per row, because what it covers depends on the tab and on which columns
     are switched on. */
  function matches(t) {
    var b = rangeBounds();
    if (b && (t.issued < b.from || t.issued > b.to)) return false;
    if (state.supervisor === 'me') return t.supervisor === CURRENT_USER;
    return state.supervisor === 'all' || t.supervisor === state.supervisor;
  }

  /* ─── Search ──────────────────────────────────────────────────────────
     Only what is on screen is searchable: switch Position off in the Columns
     picker and its values stop matching — the same rule as the Documents and
     Expense Claims screens. Checkbox, actions and the derived Hours figures
     carry no text of their own and stay out of it. */
  var SEARCH_SKIP = { chk: true, act: true, hrs: true };

  function visibleKeys() {
    var vis = Object.create(null);
    columnsFor(state.group).forEach(function (c) {
      if (!hiddenCols[c.k] && !SEARCH_SKIP[c.k]) vis[c.k] = true;
    });
    return vis;
  }

  function hitsQuery(values, vis) {
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    return Object.keys(values).some(function (k) {
      return vis[k] && values[k] && String(values[k]).toLowerCase().indexOf(q) !== -1;
    });
  }

  /* The columns a timesheet owns — the ones its parent row carries. */
  function sheetValues(t) {
    return { issued: fmtDate(t.issued), site: t.site, super: t.supervisor,
             status: t.status, updated: fmtDate(t.updated) + ' ' + t.time };
  }

  /* withSheet says whether this row repeats the timesheet's own columns:
     jobs nested under a timesheet don't (those values sit on the parent),
     jobs on the Worker and No Grouping tabs do. */
  function jobValues(t, w, a, fields, withSheet) {
    var v = { worker: w.worker, position: w.position, worktype: w.workType,
              project: a.project, task: taskPath(a, fields),
              allow: allowText(a), times: timesText(a) };
    if (withSheet) {
      v.issued = fmtDate(t.issued);
      v.site = t.site;
      v.super = t.supervisor;
      v.status = t.status;
      v.updated = fmtDate(t.updated) + ' ' + t.time;
    }
    return v;
  }

  function groupKeyOf(t) {
    if (state.group === 'project') return t.project;
    return null;
  }

  /* Worker grouping expands each timesheet into one row per worker inside it,
     so a timesheet appears under every worker it actually contains. */
  function workerIndex(rows) {
    var order = [], buckets = Object.create(null);
    rows.forEach(function (t) {
      workersFor(t).forEach(function (w) {
        if (!buckets[w.worker]) { buckets[w.worker] = []; order.push(w.worker); }
        buckets[w.worker].push({ ts: t, rec: w });
      });
    });
    order.sort();
    return { order: order, buckets: buckets };
  }

  /* Hours booked against one project within one timesheet. */
  function projectHours(t, project) {
    var sum = 0;
    workersFor(t).forEach(function (w) {
      w.assignments.forEach(function (a) {
        if (a.project === project) sum += Number(a.hours) || 0;
      });
    });
    return sum;
  }

  /* Same idea as workerIndex: a timesheet's jobs can span projects, so it
     belongs under every project it actually references, not just its lead. */
  function projectIndex(rows) {
    var order = [], buckets = Object.create(null);
    rows.forEach(function (t) {
      var seen = Object.create(null);
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) { seen[a.project] = true; });
      });
      Object.keys(seen).forEach(function (proj) {
        if (!buckets[proj]) { buckets[proj] = []; order.push(proj); }
        buckets[proj].push({ ts: t, hours: projectHours(t, proj) });
      });
    });
    order.sort();
    return { order: order, buckets: buckets };
  }

  /* ─── Columns ─────────────────────────────────────────────────────────
     Worker and Project grouping add a leading column naming the group, so
     that with every group collapsed the header still describes what is on
     screen. Timesheet grouping has no parent rows and so no such column. */
  function columnsFor(group) {
    /* No Grouping is the full base: one row per job, every timesheet field
       repeated on it. No checkbox — a row here is a job, and the bulk
       actions act on whole timesheets. */
    if (group === 'flat') {
      return [
        // Sized to fit their content: this table scrolls sideways by nature,
        // and clipped values are worse than a scrollbar.
        { k: 'chk',     w: 44,  label: '' },
        { k: 'issued',  w: 120, label: 'Date' },
        { k: 'site',    w: 195, label: 'Site' },
        { k: 'super',   w: 140, label: 'Supervisor' },
        { k: 'status',  w: 125, label: 'Status' },
        { k: 'worker',  w: 140, label: 'Worker' },
        { k: 'position', w: 155, label: 'Position' },
        { k: 'worktype', w: 130, label: 'Work Type' },
        { k: 'project', w: 190, label: 'Project' },
        { k: 'task',    w: 300, label: 'Task' },
        { k: 'allow',   w: 185, label: 'Allowance' },
        { k: 'times',   w: 125, label: 'Start - Finish' },
        { k: 'hrs',     w: 80,  label: 'Hours', num: true },
        { k: 'updated', w: 185, label: 'Last Updated' }
      ];
    }

    if (group === 'none') {
      return [
        { k: 'chk',     w: 44,  label: '' },
        { k: 'issued',  w: 145, label: 'Date' },
        { k: 'site',    w: 195, label: 'Site' },
        { k: 'super',   w: 140, label: 'Supervisor' },
        { k: 'status',  w: 125, label: 'Status' },
        { k: 'worker',  w: 140, label: 'Worker' },
        { k: 'position', w: 155, label: 'Position' },
        { k: 'worktype', w: 130, label: 'Work Type' },
        { k: 'project', w: 190, label: 'Project' },
        { k: 'task',    w: 300, label: 'Task' },
        { k: 'allow',   w: 185, label: 'Allowance' },
        { k: 'times',   w: 125, label: 'Start - Finish' },
        { k: 'hrs',     w: 80,  label: 'Hours', num: true },
        { k: 'updated', w: 185, label: 'Last Updated' },
        { k: 'act',     w: 70,  label: '' }
      ];
    }

    if (group === 'worker') {
      return [
        { k: 'chk',     w: 44,  label: '' },
        { k: 'group',   w: 200, label: 'Worker' },
        { k: 'issued',  w: 120, label: 'Date' },
        { k: 'site',    w: 185, label: 'Site' },
        { k: 'super',   w: 140, label: 'Supervisor' },
        { k: 'status',  w: 125, label: 'Status' },
        { k: 'position', w: 155, label: 'Position' },
        { k: 'worktype', w: 130, label: 'Work Type' },
        { k: 'project', w: 180, label: 'Project' },
        { k: 'task',    w: 290, label: 'Task' },
        { k: 'allow',   w: 180, label: 'Allowance' },
        { k: 'times',   w: 125, label: 'Start - Finish' },
        { k: 'hrs',     w: 80,  label: 'Hours', num: true },
        { k: 'updated', w: 185, label: 'Last Updated' },
        { k: 'act',     w: 70,  label: '' }
      ];
    }

    var cols = [{ k: 'chk', w: 44, label: '' }];

    if (group === 'worker')  cols.push({ k: 'group', w: 180, label: 'Worker' });
    if (group === 'project') cols.push({ k: 'group', w: 180, label: 'Project' });
    return cols.concat([
      { k: 'issued',  w: 120, label: 'Issue Date' },
      { k: 'super',   w: 145, label: 'Supervisor' },
      { k: 'site',    w: 180, label: 'Site' },
      { k: 'status',  w: 130, label: 'Status' },
      { k: 'hrs',     w: 88,  label: 'Hours', num: true },
      { k: 'updated', w: 185, label: 'Last Updated' },
      { k: 'act',     w: 100, label: '' }
    ]);
  }

  /* Date, Site and Supervisor stay put while the table scrolls sideways,
     with the row actions pinned to the opposite edge. Offsets come from the
     column model rather than hard-coded pixels, so they survive width
     changes. Only the two wide tabs need it. */
  var LEFT_FROZEN = ['chk', 'group', 'issued', 'site', 'super'];

  function applyFrozen(cols, allCols) {
    var host = document.getElementById('frozen-cols');
    var rules = [];
    // Switched-off columns leave the layout entirely, so the remaining cells
    // line up with the <col> list without any per-cell bookkeeping.
    allCols.forEach(function (c) {
      if (hiddenCols[c.k]) {
        rules.push('.table-card th.col-' + c.k + ',.table-card td.col-' + c.k + '{display:none;}');
      }
    });

    var wide = state.group !== 'project';
    mainTable.classList.toggle('frozen', wide);
    if (!wide) { host.textContent = rules.join('\n'); return; }

    var offset = 0, lastLeft = null;
    cols.forEach(function (c) {
      if (LEFT_FROZEN.indexOf(c.k) === -1) return;
      rules.push('.frozen th.col-' + c.k + ',.frozen td.col-' + c.k +
        '{position:sticky;left:' + offset + 'px;z-index:2;background:inherit;}');
      offset += c.w;
      lastLeft = c.k;
    });
    /* box-shadow on a <td> is dropped under border-collapse: collapse, so the
       divider is drawn as a hairline pseudo-element just outside the frozen
       edge. The cell needs overflow:visible for it to escape. */
    if (lastLeft) {
      rules.push('.sx-left .frozen th.col-' + lastLeft + ',.sx-left .frozen td.col-' + lastLeft +
        '{overflow:visible;}');
      rules.push('.sx-left .frozen th.col-' + lastLeft + '::after,.sx-left .frozen td.col-' + lastLeft + '::after' +
        '{content:"";position:absolute;top:0;bottom:0;left:100%;width:1px;pointer-events:none;' +
        'background:var(--grey-400);}');
    }
    rules.push('.frozen th.col-act,.frozen td.col-act' +
      '{position:sticky;right:0;z-index:2;background:inherit;}');
    host.textContent = rules.join('\n');
  }

  function renderColPanel(allCols) {
    var panel = document.getElementById('col-panel');
    panel.innerHTML = '<div class="col-panel-section">Show columns</div>' +
      allCols.filter(function (c) { return c.label; }).map(function (c) {
        var locked = LOCKED_COLS.indexOf(c.k) !== -1;
        var on = !hiddenCols[c.k];
        return '<label class="col-panel-row' + (locked ? ' locked' : '') + '"' +
            (locked ? ' title="Always shown"' : '') + '>' +
          '<input type="checkbox" data-col="' + c.k + '"' + (on ? ' checked' : '') +
            (locked ? ' disabled' : '') + ' />' +
          '<span class="col-chk-box"></span>' +
          '<span class="col-panel-name">' + c.label + '</span>' +
        '</label>';
      }).join('');
  }

  var colBtn = document.getElementById('btn-columns');
  var colPanel = document.getElementById('col-panel');
  colBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = colPanel.classList.toggle('open');
    colBtn.classList.toggle('active', open);
    colBtn.setAttribute('aria-expanded', String(open));
  });
  colPanel.addEventListener('click', function (e) { e.stopPropagation(); });
  colPanel.addEventListener('change', function (e) {
    var box = e.target.closest('[data-col]');
    if (!box) return;
    var key = box.getAttribute('data-col');
    if (box.checked) delete hiddenCols[key]; else hiddenCols[key] = true;
    render();
  });
  document.addEventListener('click', function () {
    colPanel.classList.remove('open');
    colBtn.classList.remove('active');
    colBtn.setAttribute('aria-expanded', 'false');
  });

  function renderHead() {
    var allCols = columnsFor(state.group);
    var cols = allCols.filter(function (c) { return !hiddenCols[c.k]; });
    mainColgroup.innerHTML = cols.map(function (c) {
      return '<col class="col-' + c.k + '" style="width:' + c.w + 'px" />';
    }).join('');

    mainThead.innerHTML = '<tr>' + cols.map(function (c) {
      if (c.k === 'chk') {
        return '<th class="col-chk"><span class="chk" id="chk-all" role="checkbox" tabindex="0" aria-checked="false" aria-label="Select all"></span></th>';
      }
      return '<th class="col-' + c.k + (c.num ? ' num' : '') + '">' + c.label + '</th>';
    }).join('') + '</tr>';

    mainTable.style.minWidth = cols.reduce(function (s, c) { return s + c.w; }, 0) + 'px';
    applyFrozen(cols, allCols);
    renderColPanel(allCols);
    return cols.length;
  }

  /* ─── Rendering ───────────────────────────────────────────────────── */
  function statusChip(status) {
    return '<span class="status-sec status-sec-' + STATUS_COLOR[status] + '">' +
      Shell.highlight(status, state.query) + '</span>';
  }

  function updatedCell(t) {
    return '<span class="updated-cell"><span>' + Shell.highlight(fmtDate(t.updated), state.query) + '</span>' +
      '<span class="updated-time">' + Shell.highlight(t.time, state.query) + '</span></span>';
  }

  /* ctx is null (plain timesheet row), or {type:'worker'|'project', name, …},
     which decides both the Hours figure and what View opens. */
  function rowHtml(t, hidden, ctx) {
    var q = state.query;
    var checked = !!selected[t.id];
    var hours = !ctx ? workersFor(t).reduce(function (s, w) { return s + w.total; }, 0)
              : ctx.type === 'worker' ? ctx.rec.total
              : ctx.hours;
    return '' +
      '<tr class="' + (checked ? 'selected ' : '') + (hidden ? 'hidden ' : '') + '" data-id="' + t.id + '"' +
          (hidden ? ' data-group-child="' + Shell.esc(groupKeyOf(t) || '') + '"' : '') + '>' +
        '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '" role="checkbox" tabindex="0" aria-checked="' + checked + '" data-row-chk="' + t.id + '"></span></td>' +
        (ctx ? '<td class="col-group"></td>' : '') +
        '<td class="col-issued">' + Shell.highlight(fmtDate(t.issued), q) + '</td>' +
        '<td>' + Shell.highlight(t.supervisor, q) + '</td>' +
        '<td title="' + Shell.esc(t.site) + '">' + Shell.highlight(t.site, q) + '</td>' +
        '<td>' + statusChip(t.status) + '</td>' +
        // In Worker mode this is the worker's own hours; otherwise the sheet's.
        '<td class="col-hrs">' + fmtHours(hours) + '</td>' +
        '<td>' + updatedCell(t) + '</td>' +
        '<td class="col-act"><span class="action-cell">' +
          '<button class="kebab" type="button" data-kebab="' + t.id + '" aria-label="More actions">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg>' +
          '</button>' +
        '</span></td>' +
      '</tr>';
  }

  /* An assignment's populated custom-field path, joined — field names differ
     per site, so one flat grid can only carry the path. */
  function taskPath(a, fields) {
    return fields.map(function (f, i) { return a.levels[i]; }).filter(Boolean).join(' | ');
  }
  function allowText(a) { return [a.allow1, a.allow2].filter(Boolean).join(', '); }
  /* Finishing before you started means the shift ran past midnight. */
  function timesText(a) {
    if (!a.start || !a.finish) return '';
    return a.start + ' - ' + a.finish + (a.finish <= a.start ? ' (+1)' : '');
  }
  function jobCell(v, cls) {
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' +
      (v ? Shell.highlight(v, state.query) : '<span class="cell-empty">&mdash;</span>') + '</td>';
  }

  function workerRows(sheets) {
    var index = Object.create(null), order = [], vis = visibleKeys(), q = state.query;
    sheets.forEach(function (t) {
      var fields = fieldsFor(t.site);
      workersFor(t).forEach(function (w) {
        if (!index[w.worker]) { index[w.worker] = { color: w.color, jobs: [] }; order.push(w.worker); }
        w.assignments.forEach(function (a) {
          index[w.worker].jobs.push({ t: t, a: a, fields: fields,
            position: w.position, workType: w.workType,
            values: jobValues(t, w, a, fields, true) });
        });
      });
    });
    order.sort();

    var out = [];
    order.forEach(function (name) {
      var g = index[name];
      var position = g.jobs.length ? g.jobs[0].position : '';
      /* A worker stays when their own row matches — then everything under it
         belongs to the match — otherwise only the jobs that match show. */
      var parentHit = hitsQuery({ group: name, position: position }, vis);
      var jobs = (!q || parentHit) ? g.jobs
               : g.jobs.filter(function (j) { return hitsQuery(j.values, vis); });
      if (q && !parentHit && !jobs.length) return;
      renderedKeys.push(name);
      var isCollapsed = isCollapsed_(name);
      /* Selection is always by timesheet, so ticking a person means ticking
         every sheet they appear on — part-selected shows as indeterminate. */
      var sheetIds = [];
      jobs.forEach(function (j) {
        renderedSheets[j.t.id] = true;
        if (sheetIds.indexOf(j.t.id) === -1) sheetIds.push(j.t.id);
      });
      var picked = sheetIds.filter(function (id) { return selected[id]; }).length;
      var allPicked = picked > 0 && picked === sheetIds.length;
      var chkCls = allPicked ? ' checked' : (picked > 0 ? ' indeterminate' : '');
      var sites = {}, projects = {}, tasks = {}, allowances = {};
      var total = 0;
      jobs.forEach(function (j) {
        total += Number(j.a.hours) || 0;
        sites[j.t.site] = true;
        if (j.a.project) projects[j.a.project] = true;
        var path = taskPath(j.a, j.fields);
        if (path) tasks[path] = true;
        [j.a.allow1, j.a.allow2].forEach(function (x) { if (x) allowances[x] = true; });
      });
      function tally(m) { var n = Object.keys(m).length; return n ? String(n) : ''; }

      out.push('<tr class="ts-parent' + (allPicked ? ' selected' : '') + (isCollapsed ? ' collapsed' : '') +
            '" data-sheet="' + Shell.esc(name) + '">' +
        '<td class="col-chk"><span class="chk' + chkCls + '" role="checkbox" tabindex="0" aria-checked="' +
          (allPicked ? 'true' : (picked > 0 ? 'mixed' : 'false')) + '" data-worker-chk="' + Shell.esc(name) +
          '" data-sheet-ids="' + sheetIds.join(',') + '"></span></td>' +
        '<td class="col-group"><span class="ts-parent-main">' +
          '<span class="ts-caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '<span class="avatar avatar-sm" style="background:' + g.color + '">' + Shell.initials(name) + '</span>' +
          Shell.highlight(name, state.query) + '</span></td>' +
        '<td class="col-issued ts-count">' + jobs.length + '</td>' +
        '<td class="col-site ts-count">' + tally(sites) + '</td>' +
        '<td class="col-super"></td>' +
        '<td></td>' +
        '<td class="col-position">' + Shell.esc(position) + '</td>' +
        '<td class="col-worktype"></td>' +
        '<td class="ts-count">' + tally(projects) + '</td>' +
        '<td class="ts-count">' + tally(tasks) + '</td>' +
        '<td class="ts-count">' + tally(allowances) + '</td>' +
        '<td></td>' +
        '<td class="col-hrs ts-total">' + fmtHours(total) + '</td>' +
        '<td></td>' +
        '<td class="col-act"><span class="action-cell">' +
          '<button class="kebab" type="button" data-kebab="' + Shell.esc(name) + '" aria-label="More actions">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg>' +
          '</button>' +
        '</span></td>' +
      '</tr>');

      jobs.forEach(function (j) {
        out.push('<tr class="ts-job' + (isCollapsed ? ' hidden' : '') +
              '" data-child="' + Shell.esc(name) + '">' +
          '<td class="col-chk"></td>' +
          '<td class="col-group"></td>' +
          '<td class="col-issued">' + Shell.highlight(fmtDate(j.t.issued), state.query) + '</td>' +
          '<td class="col-site" title="' + Shell.esc(j.t.site) + '">' + Shell.highlight(j.t.site, state.query) + '</td>' +
          '<td class="col-super">' + Shell.highlight(j.t.supervisor, state.query) + '</td>' +
          '<td>' + statusChip(j.t.status) + '</td>' +
          jobCell(j.position, 'col-position') +
          jobCell(j.workType, 'col-worktype') +
          jobCell(j.a.project) +
          jobCell(taskPath(j.a, j.fields), 'col-task') +
          jobCell(allowText(j.a), 'col-allow') +
          jobCell(timesText(j.a)) +
          '<td class="col-hrs">' + fmtHours(j.a.hours) + '</td>' +
          '<td>' + updatedCell(j.t) + '</td>' +
          '<td class="col-act"></td>' +
        '</tr>');
      });
    });
    return out.join('');
  }

  /* Timesheet tab: the sheet is the parent row, its jobs nest underneath and
     start at the Worker column so every value sits under its own heading. */
  function timesheetRows(sheets) {
    var out = [];
    var vis = visibleKeys(), q = state.query;
    sheets.forEach(function (t) {
      var fields = fieldsFor(t.site);
      var all = [];
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) {
          all.push({ w: w, a: a, values: jobValues(t, w, a, fields, false) });
        });
      });
      /* A sheet stays when its own row matches — then every job on it belongs
         to the match — otherwise only the jobs that match are listed. */
      var parentHit = hitsQuery(sheetValues(t), vis);
      var jobs = (!q || parentHit) ? all : all.filter(function (j) { return hitsQuery(j.values, vis); });
      if (q && !parentHit && !jobs.length) return;
      renderedKeys.push(t.id);
      renderedSheets[t.id] = true;

      var checked = !!selected[t.id];
      var isCollapsed = isCollapsed_(t.id);
      /* Summaries count what is listed underneath, so a filtered sheet reads
         as what it shows rather than what it holds. */
      var people = {}, projects = {}, tasks = {}, allowances = {};
      jobs.forEach(function (j) {
        people[j.w.worker] = true;
        if (j.a.project) projects[j.a.project] = true;
        var path = taskPath(j.a, fields);
        if (path) tasks[path] = true;
        [j.a.allow1, j.a.allow2].forEach(function (x) { if (x) allowances[x] = true; });
      });
      var total = jobs.reduce(function (s, j) { return s + (Number(j.a.hours) || 0); }, 0);
      /* Each summary number counts distinct values among the jobs beneath, so
         it answers "how many different X are on this sheet" under its own
         heading. Blank cells don't count toward any of them. */
      function tally(map) {
        var n = Object.keys(map).length;
        return n ? String(n) : '';
      }

      out.push('<tr class="ts-parent' + (checked ? ' selected' : '') + (isCollapsed ? ' collapsed' : '') +
            '" data-id="' + t.id + '" data-sheet="' + t.id + '">' +
        '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '" role="checkbox" tabindex="0" aria-checked="' + checked + '" data-row-chk="' + t.id + '"></span></td>' +
        '<td class="col-issued"><span class="ts-parent-main">' +
          '<span class="ts-caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          Shell.highlight(fmtDate(t.issued), q) + '</span></td>' +
        '<td class="col-site" title="' + Shell.esc(t.site) + '">' + Shell.highlight(t.site, q) + '</td>' +
        '<td class="col-super">' + Shell.highlight(t.supervisor, q) + '</td>' +
        '<td>' + statusChip(t.status) + '</td>' +
        '<td class="ts-count">' + tally(people) + '</td>' +
        '<td class="col-position"></td><td class="col-worktype"></td>' +
        '<td class="ts-count">' + tally(projects) + '</td>' +
        '<td class="ts-count">' + tally(tasks) + '</td>' +
        '<td class="ts-count">' + tally(allowances) + '</td>' +
        '<td></td>' +
        '<td class="col-hrs ts-total">' + fmtHours(total) + '</td>' +
        '<td>' + updatedCell(t) + '</td>' +
        '<td class="col-act"><span class="action-cell">' +
          '<button class="kebab" type="button" data-kebab="' + t.id + '" aria-label="More actions">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg>' +
          '</button>' +
        '</span></td>' +
      '</tr>');

      jobs.forEach(function (j) {
        out.push('<tr class="ts-job' + (isCollapsed ? ' hidden' : '') + '" data-child="' + t.id + '">' +
          '<td class="col-chk"></td><td class="col-issued"></td>' +
          '<td class="col-site"></td><td class="col-super"></td><td></td>' +
          jobCell(j.w.worker) +
          jobCell(j.w.position, 'col-position') +
          jobCell(j.w.workType, 'col-worktype') +
          jobCell(j.a.project) +
          jobCell(taskPath(j.a, fields), 'col-task') +
          jobCell(allowText(j.a), 'col-allow') +
          jobCell(timesText(j.a)) +
          '<td class="col-hrs">' + fmtHours(j.a.hours) + '</td>' +
          '<td></td><td></td>' +
        '</tr>');
      });
    });
    return out.join('');
  }

  /* One row per job across every timesheet the filters allow through. */
  function flatJobRows(sheets) {
    var q = state.query, out = [], vis = visibleKeys();
    sheets.forEach(function (t) {
      var fields = fieldsFor(t.site);
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) {
          // Nothing nests here, so a row either matches or it is left out.
          if (!hitsQuery(jobValues(t, w, a, fields, true), vis)) return;
          renderedSheets[t.id] = true;
          // The site's custom fields, joined — their names vary by site, so a
          // single flat table can only carry the path, not a column each.
          var path = taskPath(a, fields);
          var allow = allowText(a);
          var times = timesText(a);
          var cell = jobCell;
          /* A row here is a job, but bulk actions act on whole timesheets —
             so the tick belongs to the sheet, and its sibling jobs tick with
             it. */
          var checked = !!selected[t.id];
          out.push('<tr class="' + (checked ? 'selected' : '') + '" data-id="' + t.id + '">' +
            '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '" role="checkbox" tabindex="0" aria-checked="' + checked + '" data-row-chk="' + t.id + '"></span></td>' +
            '<td class="col-issued">' + Shell.highlight(fmtDate(t.issued), q) + '</td>' +
            '<td class="col-site" title="' + Shell.esc(t.site) + '">' + Shell.highlight(t.site, q) + '</td>' +
            cell(t.supervisor, 'col-super') +
            '<td>' + statusChip(t.status) + '</td>' +
            cell(w.worker) +
            cell(w.position, 'col-position') +
            cell(w.workType, 'col-worktype') +
            cell(a.project) +
            '<td class="col-task" title="' + Shell.esc(path) + '">' +
              (path ? Shell.highlight(path, q) : '<span class="cell-empty">&mdash;</span>') + '</td>' +
            cell(allow, 'col-allow') +
            cell(times) +
            '<td class="col-hrs">' + fmtHours(a.hours) + '</td>' +
            '<td>' + updatedCell(t) + '</td>' +
          '</tr>');
        });
      });
    });
    return out.join('');
  }

  function groupRowHtml(key, count, person) {
    var isCollapsed = isCollapsed_(key);
    return '' +
      '<tr class="group-row' + (isCollapsed ? ' collapsed' : '') + '" data-group="' + Shell.esc(key) + '">' +
        '<td class="col-chk"></td>' +
        // Spans group → last-updated: the name starts under its own heading
        // and the cells it covers are empty on a group row anyway.
        '<td colspan="5">' +
          '<button class="group-toggle" type="button">' +
            '<svg class="group-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            (person && person.color ? '<span class="avatar avatar-sm" style="background:' + person.color + '">' + Shell.initials(key) + '</span>' : '') +
            '<span>' + Shell.esc(key) + '</span>' +
            '<span class="group-count">' + count + ' timesheet' + (count === 1 ? '' : 's') + '</span>' +
          '</button>' +
        '</td>' +
        // Hours the worker booked across everything the filters let through,
        // sitting in the Hours column so it totals the values beneath it.
        '<td class="col-hrs group-total">' + (person ? fmtHours(person.total) : '') + '</td>' +
        '<td></td><td></td>' +
      '</tr>';
  }

  /* The button reflects what clicking it will do, so it stays honest after
     rows are opened or closed one at a time. */
  function syncExpandBtn() {
    var btn = document.getElementById('expand-all');
    if (!openKeys.length) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    var anyClosed = openKeys.some(isCollapsed_);
    btn.textContent = anyClosed ? 'Expand all' : 'Collapse all';
  }

  document.getElementById('expand-all').addEventListener('click', function () {
    var anyClosed = openKeys.some(isCollapsed_);
    openKeys.forEach(function (k) { setCollapsed_(k, !anyClosed); });
    render();
  });

  /* A divider shows on an edge only while a frozen column is covering
     something there — nothing at rest, both edges mid-scroll. */
  var scrollBox = document.querySelector('.table-scroll');
  function syncScrollEdges() {
    var max = scrollBox.scrollWidth - scrollBox.clientWidth;
    scrollBox.classList.toggle('sx-left', scrollBox.scrollLeft > 0);
    scrollBox.classList.toggle('sx-right', max > 1 && scrollBox.scrollLeft < max - 1);
  }
  scrollBox.addEventListener('scroll', syncScrollEdges);
  window.addEventListener('resize', syncScrollEdges);

  function render() {
    renderHead();
    var rows = TIMESHEETS.filter(matches);
    renderedKeys = [];
    renderedSheets = Object.create(null);
    var html = '';

    if (state.group === 'flat') {
      html = flatJobRows(rows);
    } else if (state.group === 'none') {
      html = timesheetRows(rows);
    } else if (state.group === 'worker') {
      html = workerRows(rows);
    } else {
      var pidx = projectIndex(rows);
      pidx.order.forEach(function (name) {
        var list = pidx.buckets[name];
        html += groupRowHtml(name, list.length, {
          total: list.reduce(function (s, pair) { return s + pair.hours; }, 0)
        });
        html += list.map(function (pair) {
          return rowHtml(pair.ts, isCollapsed_(name), { type: 'project', name: name, hours: pair.hours });
        }).join('');
      });
    }

    tbody.innerHTML = html;

    // Which keys the Expand all button acts on — the parent rows actually
    // rendered, so a search narrows what it opens too.
    if (state.group === 'none' || state.group === 'worker') openKeys = renderedKeys.slice();
    else if (state.group === 'project') openKeys = projectIndex(rows).order;
    else                                openKeys = [];
    shownIds = Object.keys(renderedSheets);
    syncExpandBtn();

    var none = html === '';
    empty.classList.toggle('visible', none);
    tbody.closest('.table-scroll').style.display = none ? 'none' : '';
    if (none) {
      emptySub.textContent = state.query
        ? 'Nothing matches “' + state.query + '” in the columns on screen.'
        : state.supervisor === 'all'
          ? 'No timesheets in this date range.'
          : 'No timesheets match the current filters.';
    }

    syncSelectAll();
    syncSelectionBar();
    syncScrollEdges();
  }

  /* ─── Selection ───────────────────────────────────────────────────── */
  function visibleIds() { return shownIds.slice(); }
  function selectedIds() { return Object.keys(selected); }

  function syncSelectAll() {
    var ids = shownIds;
    var n = ids.filter(function (id) { return selected[id]; }).length;
    var box = chkAll();
    if (!box) return;
    box.classList.toggle('checked', n > 0 && n === ids.length);
    box.classList.toggle('indeterminate', n > 0 && n < ids.length);
    box.setAttribute('aria-checked', n === 0 ? 'false' : (n === ids.length ? 'true' : 'mixed'));
  }

  function statusOf(id) {
    for (var i = 0; i < TIMESHEETS.length; i++) if (TIMESHEETS[i].id === id) return TIMESHEETS[i].status;
    return '';
  }

  function syncSelectionBar() {
    var ids = selectedIds();
    var n = ids.length;
    selBar.classList.toggle('visible', n > 0);
    toolbar.style.display = n > 0 ? 'none' : '';
    selCount.textContent = n + ' timesheet' + (n === 1 ? '' : 's') + ' selected';

    /* Deleting acts on the whole timesheet, so it is offered only where the
       rows are timesheets. Export applies everywhere. */
    selBar.querySelector('[data-bulk="delete"]').style.display =
      state.group === 'none' ? '' : 'none';

    /* Finalising is only defined for a revised sheet, so anything else in the
       selection blocks it — shown but disabled, with the reason on hover. */
    var fin = selBar.querySelector('[data-bulk="finalise"]');
    var offenders = ids.filter(function (id) { return statusOf(id) !== 'Revised'; });
    fin.disabled = offenders.length > 0;
    fin.title = offenders.length
      ? (offenders.length === n
          ? 'Only revised timesheets can be finalised.'
          : offenders.length + ' of the selected timesheets ' +
            (offenders.length === 1 ? 'is' : 'are') + ' not revised.')
      : '';
  }

  function toggleRow(id) {
    if (selected[id]) delete selected[id]; else selected[id] = true;
    tbody.querySelectorAll('tr[data-id="' + id + '"]').forEach(function (tr) {
      tr.classList.toggle('selected', !!selected[id]);
      var box = tr.querySelector('[data-row-chk]');
      box.classList.toggle('checked', !!selected[id]);
      box.setAttribute('aria-checked', String(!!selected[id]));
    });
    syncSelectAll();
    syncSelectionBar();
  }

  function toggleAll() {
    var ids = visibleIds();
    var allOn = ids.length > 0 && ids.every(function (id) { return selected[id]; });
    ids.forEach(function (id) { if (allOn) delete selected[id]; else selected[id] = true; });
    render();
  }
  mainThead.addEventListener('click', function (e) {
    if (e.target.closest('#chk-all')) toggleAll();
  });
  mainThead.addEventListener('keydown', function (e) {
    if (e.target.closest('#chk-all') && (e.key === ' ' || e.key === 'Enter')) {
      e.preventDefault(); toggleAll();
    }
  });

  /* ─── Table interactions ──────────────────────────────────────────── */
  tbody.addEventListener('click', function (e) {
    var sheetRow = e.target.closest('.ts-parent');
    if (sheetRow && !e.target.closest('[data-row-chk], [data-worker-chk], .kebab')) {
      var sid = sheetRow.getAttribute('data-sheet');
      var nowCollapsed = !isCollapsed_(sid);
      setCollapsed_(sid, nowCollapsed);
      sheetRow.classList.toggle('collapsed', nowCollapsed);
      tbody.querySelectorAll('tr[data-child="' + sid + '"]').forEach(function (tr) {
        tr.classList.toggle('hidden', nowCollapsed);
      });
      syncExpandBtn();
      return;
    }

    var box = e.target.closest('[data-row-chk]');
    if (box) { toggleRow(box.getAttribute('data-row-chk')); return; }

    var wbox = e.target.closest('[data-worker-chk]');
    if (wbox) {
      var wids = (wbox.getAttribute('data-sheet-ids') || '').split(',').filter(Boolean);
      var allOn = wids.length > 0 && wids.every(function (id) { return selected[id]; });
      wids.forEach(function (id) { if (allOn) delete selected[id]; else selected[id] = true; });
      render();
      return;
    }

    var groupBtn = e.target.closest('.group-toggle');
    if (groupBtn) {
      var key = groupBtn.closest('.group-row').getAttribute('data-group');
      setCollapsed_(key, !isCollapsed_(key));
      render();
      return;
    }

    var kebab = e.target.closest('[data-kebab]');
    if (kebab) { Shell.snackbar('Row actions for ' + kebab.getAttribute('data-kebab') + ' — menu not designed yet.'); return; }
  });

  /* ─── Group by ────────────────────────────────────────────────────── */
  document.getElementById('groupby').addEventListener('click', function (e) {
    var btn = e.target.closest('.seg-btn');
    if (!btn) return;
    this.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.group = btn.getAttribute('data-group');
    collapsed = Object.create(null);
    render();
  });

  /* ─── Search ──────────────────────────────────────────────────────── */
  searchEl.addEventListener('input', function () {
    state.query = this.value.trim();
    searchCollapsed = Object.create(null);
    clearBtn.classList.toggle('visible', this.value.length > 0);
    render();
  });
  clearBtn.addEventListener('click', function () {
    searchEl.value = '';
    state.query = '';
    searchCollapsed = Object.create(null);
    clearBtn.classList.remove('visible');
    searchEl.focus();
    render();
  });

  /* ─── Bulk actions ────────────────────────────────────────────────── */
  selBar.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-bulk]');
    if (!btn) return;
    var action = btn.getAttribute('data-bulk');
    var n = selectedIds().length;

    if (action === 'clear') {
      selected = Object.create(null);
      render();
      return;
    }
    if (action === 'delete') {
      var ids = selectedIds();
      for (var i = TIMESHEETS.length - 1; i >= 0; i--) {
        if (ids.indexOf(TIMESHEETS[i].id) !== -1) TIMESHEETS.splice(i, 1);
      }
      selected = Object.create(null);
      render();
      Shell.snackbar(n + ' timesheet' + (n === 1 ? '' : 's') + ' deleted.');
      return;
    }

    var newStatus = action === 'export' ? 'Exported' : 'Finalised';
    TIMESHEETS.forEach(function (t) { if (selected[t.id]) t.status = newStatus; });
    selected = Object.create(null);
    render();
    Shell.snackbar(n + ' timesheet' + (n === 1 ? '' : 's') + ' ' + newStatus.toLowerCase() + '.');
  });

  document.getElementById('btn-create').addEventListener('click', function () {
    Shell.snackbar('Create Timesheet — flow not designed yet.');
  });

  /* ─── Timesheet entries — the rows inside the detail popup ────────────
     Shape follows the exported-spreadsheet example: a worker line per shift,
     with a 4-deep Level hierarchy (work order → task → delay code → sub) and
     two allowance slots. Any of those may legitimately be blank.            */
  /* name, position, avatar colour — colours match workers/index.html so the
     same person reads the same on both screens. */
  var E_WORKERS = [
    ['Smith, John',   'Boilermaker',    '#3b7dd8'],
    ['Stone, Emma',   'Safety Officer', '#c4845c'],
    ['Adams, Sophia', 'Rigger',         '#7b6c9e'],
    ['Miller, Ava',   'Pipefitter',     '#4a9b6f'],
    ['Clark, Emma',   'Crane Operator', '#b85555'],
    ['Baker, Liam',   'Electrician',    '#3a7ab5'],
    ['Brown, Olivia', 'Scaffolder',     '#8b7355'],
    ['Clark, Olivia', 'Welder',         '#5b8c8c'],
    ['Hill, Allison', 'Mechanic',       '#7a8cb5'],
    ['Davis, Noah',   'Boilermaker',    '#5a7a5a']
  ];
  var E_WORKTYPE = ['Day Shift', 'Night Shift', 'Back Shift'];
  /* Level 1-4 are custom fields configured per site, so both their names and
     their value sets differ site to site — and a site need not define all
     four. One timesheet is one day at one site, so a single popup's headers
     are unambiguous. (The Workers tab will be harder: a worker's day can span
     several sites, so its rows won't share one header.)                     */
  var SITE_FIELDS = {
    'MMA VIGILANT – 360': [
      { name: 'Work Order', values: ['WORK-00123', 'WORK-00124', 'WORK-00187', 'WORK-00201'] },
      { name: 'Task',       values: ['Repair the machine', 'Replace hydraulic hose', 'Weld handrail section', 'Deck plating repair'] },
      { name: 'Type',       values: ['Labour', 'Waiting for materials', 'Equipment breakdown'] },
      { name: 'Sub-task',   values: ['Preparation', 'Clean-up'] }
    ],
    'MMA VIGILANT ROV': [
      { name: 'Job Number', values: ['JOB-00451', 'JOB-00478', 'JOB-00492'] },
      { name: 'Activity',   values: ['ROV dive', 'Deck handling', 'Tooling change'] },
      { name: 'Type',       values: ['Labour', 'Weather standby'] }
    ],
    'SA BHP OLYMPIC DAM': [
      { name: 'Work Order', values: ['WORK-00123', 'WORK-00201'] },
      { name: 'Cost Code',  values: ['CC-1140', 'CC-1155', 'CC-1163'] },
      { name: 'Type',       values: ['Labour', 'Waiting for materials'] },
      { name: 'Shift Code', values: ['Day', 'Night'] }
    ]
  };

  function fieldsFor(site) { return SITE_FIELDS[site] || []; }

  /* A timesheet's entries do not all share one project. Each site runs a
     couple, and a project can span sites — so the list's lead project is
     just that, a lead. */
  var SITE_PROJECTS = {
    'MMA VIGILANT – 360': ['Vigilant 360 Refit', 'Shutdown Factory XYZ'],
    'MMA VIGILANT ROV':   ['ROV Mobilisation', 'Subsea Survey'],
    'SA BHP OLYMPIC DAM': ['Olympic Dam Expansion', 'Shutdown Factory XYZ']
  };

  var E_ALLOW = ['Rope Allowance', 'Offshore Allowance', 'Height Allowance', 'Travel Allowance', 'Meal Allowance'];
  var E_TIMES = [['06:00', '18:00'], ['07:30', '19:30'], ['18:00', '06:00'], ['05:45', '17:45'], ['06:30', '16:30']];

  /* Which fields a row carries. Covers the cases called out in review:
     levels but no times, times but no levels, and everything in between. */
  var E_PATTERNS = [
    { levels: 1, allow: 0, times: false, hours: 12 },
    { levels: 3, allow: 0, times: false, hours: 10 },
    { levels: 0, allow: 1, times: true },
    { levels: 2, allow: 2, times: true },
    { levels: 4, allow: 1, times: true },
    { levels: 1, allow: 0, times: true },
    { levels: 2, allow: 0, times: false, hours: 8 }
  ];

  function diffHours(from, to) {
    function mins(s) { var p = s.split(':'); return Number(p[0]) * 60 + Number(p[1]); }
    var d = mins(to) - mins(from);
    if (d <= 0) d += 24 * 60;
    return Math.round(d / 60 * 10) / 10;
  }

  /* A worker is the record. Their day is one shift, split across one or more
     assignments — a project plus a path through the site's custom fields —
     each with its own times and hours. */
  function workersFor(ts) {
    if (ts._workers) return ts._workers;
    var seed = Number(ts.id.replace(/\D/g, ''));
    var fields = fieldsFor(ts.site);
    var projects = SITE_PROJECTS[ts.site] || [ts.project];

    // Strides must be coprime with each pool's length, or the index repeats
    // and every row comes out identical.
    function pick(pool, i, stride) { return pool[(seed + i * stride) % pool.length]; }

    var people = 4 + (seed % 3);
    var out = [];

    for (var i = 0; i < people; i++) {
      var who = pick(E_WORKERS, i, 3);
      var nAssign = 1 + ((seed + i) % 3);
      var assignments = [];

      for (var a = 0; a < nAssign; a++) {
        var k = i * 3 + a;
        var pat = pick(E_PATTERNS, k, 3);
        var depth = Math.min(pat.levels, fields.length);
        var t = pick(E_TIMES, k, 2);
        var nAllow = (seed + k) % 3;

        assignments.push({
          project: pick(projects, k, 1),
          levels: fields.map(function (f, idx) {
            return idx < depth ? pick(f.values, k, 1 + idx * 2) : '';
          }),
          allow1: nAllow >= 1 ? pick(E_ALLOW, k, 2) : '',
          allow2: nAllow >= 2 ? pick(E_ALLOW, k + 2, 2) : '',
          start:  pat.times ? t[0] : '',
          finish: pat.times ? t[1] : '',
          hours:  pat.times ? diffHours(t[0], t[1]) : pat.hours
        });
      }

      out.push({
        id: ts.id + '-w' + i,
        worker: who[0],
        position: who[1],
        color: who[2],
        workType: pick(E_WORKTYPE, i, 1),   // one shift per worker per day
        assignments: assignments,
        total: assignments.reduce(function (s, x) { return s + (Number(x.hours) || 0); }, 0)
      });
    }

    ts._workers = out;
    return out;
  }

  function fmtHours(h) {
    return (h === '' || h == null) ? '' : Number(h).toFixed(1);
  }
  render();
})();
</script>
</body>
</html>
