  /* Date, Site and Supervisor stay put while the table scrolls sideways,
     with the row actions pinned to the opposite edge. Offsets come from the
     column model rather than hard-coded pixels, so they survive width
     changes. Only the two wide tabs need it. */
  var LEFT_FROZEN = ['chk', 'group', 'issued', 'site', 'super'];
  /* Hours is pinned beside the actions, so the total stays in view however far
     the custom-field columns push the table sideways. */
  var RIGHT_FROZEN = ['hrs', 'act'];

  function applyFrozen(cols, allCols) {
    var host = document.getElementById('frozen-cols');
    var rules = [];
    // Switched-off columns leave the layout entirely, so the remaining cells
    // line up with the <col> list without any per-cell bookkeeping.
    allCols.forEach(function (c) {
      if (hiddenCols[c.k]) {
        rules.push('.table-card th.col-' + c.k + ',.table-card td.col-' + c.k + '{display:none;}');
      }
    });

    var wide = state.group !== 'project';
    mainTable.classList.toggle('frozen', wide);
    if (!wide) { host.textContent = rules.join('\n'); return; }

    /* Stacking, from the back: ordinary cells, frozen cells (2), the pinned
       timesheet row (3) and its own frozen cells (4), then the header (5) and
       the header's frozen cells (6). */
    var frozenKeys = [];
    var offset = 0, lastLeft = null;
    cols.forEach(function (c) {
      if (LEFT_FROZEN.indexOf(c.k) === -1) return;
      rules.push('.frozen th.col-' + c.k + '{position:sticky;left:' + offset + 'px;z-index:6;background:inherit;}');
      rules.push('.frozen td.col-' + c.k + '{position:sticky;left:' + offset + 'px;z-index:2;background:inherit;}');
      frozenKeys.push(c.k);
      offset += c.w;
      lastLeft = c.k;
    });
    /* box-shadow on a <td> is dropped under border-collapse: collapse, so the
       divider is drawn as a hairline pseudo-element just outside the frozen
       edge. The cell needs overflow:visible for it to escape. */
    if (lastLeft) {
      rules.push('.sx-left .frozen th.col-' + lastLeft + ',.sx-left .frozen td.col-' + lastLeft +
        '{overflow:visible;}');
      rules.push('.sx-left .frozen th.col-' + lastLeft + '::after,.sx-left .frozen td.col-' + lastLeft + '::after' +
        '{content:"";position:absolute;top:0;bottom:0;left:100%;width:1px;pointer-events:none;' +
        'background:var(--grey-400);}');
    }
    // Right-hand offsets accumulate from the outer edge inwards.
    var rOffset = 0;
    for (var i = cols.length - 1; i >= 0; i--) {
      var rc = cols[i];
      if (RIGHT_FROZEN.indexOf(rc.k) === -1) continue;
      rules.push('.frozen th.col-' + rc.k + '{position:sticky;right:' + rOffset + 'px;z-index:6;background:inherit;}');
      rules.push('.frozen td.col-' + rc.k + '{position:sticky;right:' + rOffset + 'px;z-index:2;background:inherit;}');
      frozenKeys.push(rc.k);
      rOffset += rc.w;
    }

    /* A timesheet row stays pinned under the header while its entries scroll
       past; the next timesheet, painting later, slides over and replaces it. */
    // Ceil, so a fractional header height can't leave a hairline of scrolled
    // content showing between the header and the pinned row.
    var headH = Math.ceil(mainThead.getBoundingClientRect().height) || 41;
    rules.push('#tbody tr.ts-parent > td{position:sticky;top:' + headH + 'px;z-index:3;background:inherit;}');
    frozenKeys.forEach(function (k) {
      rules.push('#tbody tr.ts-parent > td.col-' + k + '{z-index:4;}');
    });

    host.textContent = rules.join('\n');
  }

  /* Frozen columns anchor the table and can't be switched off, so they are
     left out of the list entirely rather than shown as dead rows. */
  function renderColPanel(allCols) {
    var panel = document.getElementById('col-panel');
    panel.innerHTML = '<div class="col-panel-section">Show columns</div>' +
      allCols.filter(function (c) {
        return c.label && LOCKED_COLS.indexOf(c.k) === -1;
      }).map(function (c) {
        var on = !hiddenCols[c.k];
        return '<label class="col-panel-row">' +
          '<input type="checkbox" data-col="' + c.k + '"' + (on ? ' checked' : '') + ' />' +
          '<span class="col-chk-box"></span>' +
          '<span class="col-panel-name">' + c.label + '</span>' +
        '</label>';
      }).join('');
  }

  var colBtn = document.getElementById('btn-columns');
  var colPanel = document.getElementById('col-panel');
  colBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = colPanel.classList.toggle('open');
    colBtn.classList.toggle('active', open);
    colBtn.setAttribute('aria-expanded', String(open));
  });
  colPanel.addEventListener('click', function (e) { e.stopPropagation(); });
  colPanel.addEventListener('change', function (e) {
    var box = e.target.closest('[data-col]');
    if (!box) return;
    var key = box.getAttribute('data-col');
    if (box.checked) delete hiddenCols[key]; else hiddenCols[key] = true;
    render();
  });
  document.addEventListener('click', function () {
    colPanel.classList.remove('open');
    colBtn.classList.remove('active');
    colBtn.setAttribute('aria-expanded', 'false');
  });

  function renderHead() {
    var allCols = columnsFor(state.group);
    allCols.forEach(function (c) {
      var w = colWidths[state.group + ':' + c.k];
      if (w) c.w = w;
    });
    var cols = allCols.filter(function (c) { return !hiddenCols[c.k]; });
    currentCols = cols;
    currentAllCols = allCols;

    mainColgroup.innerHTML = cols.map(function (c) {
      return '<col class="col-' + c.k + '" style="width:' + c.w + 'px" />';
    }).join('');

    mainThead.innerHTML = '<tr>' + cols.map(function (c) {
      if (c.k === 'chk') {
        return '<th class="col-chk"><span class="chk" id="chk-all" role="checkbox" tabindex="0" aria-checked="false" aria-label="Select all"></span></th>';
      }
      // The pinned actions column has no width worth dragging.
      var grip = c.k === 'act' ? '' : '<span class="col-grip" data-grip="' + c.k + '"></span>';
      return '<th class="col-' + c.k + (c.num ? ' num' : '') + '" title="' + Shell.esc(c.label) + '">' +
        '<span class="th-label">' + c.label + '</span>' + grip + '</th>';
    }).join('') + '</tr>';

    mainTable.style.minWidth = cols.reduce(function (s, c) { return s + c.w; }, 0) + 'px';
    applyFrozen(cols, allCols);
    renderColPanel(allCols);
    return cols.length;
  }

  /* ─── Column resizing ─────────────────────────────────────────────────
     Widths live on the <col> elements, so a drag only has to touch those and
     the frozen offsets — the rows are left alone. */
  var drag = null;

  function applyLiveWidths() {
    mainTable.style.minWidth = currentCols.reduce(function (sum, c) { return sum + c.w; }, 0) + 'px';
    applyFrozen(currentCols, currentAllCols);
  }

  mainThead.addEventListener('mousedown', function (e) {
    var grip = e.target.closest('[data-grip]');
    if (!grip) return;
    e.preventDefault();
    var key = grip.getAttribute('data-grip');
    var col = mainColgroup.querySelector('col.col-' + key);
    if (!col) return;
    drag = { key: key, startX: e.clientX, startW: col.getBoundingClientRect().width, col: col, grip: grip };
    grip.classList.add('dragging');
    document.body.classList.add('col-resizing');
  });

  document.addEventListener('mousemove', function (e) {
    if (!drag) return;
    var w = Math.max(MIN_COL_W, Math.round(drag.startW + (e.clientX - drag.startX)));
    colWidths[state.group + ':' + drag.key] = w;
    drag.col.style.width = w + 'px';
    currentCols.forEach(function (c) { if (c.k === drag.key) c.w = w; });
    applyLiveWidths();
  });

  document.addEventListener('mouseup', function () {
    if (!drag) return;
    drag.grip.classList.remove('dragging');
    document.body.classList.remove('col-resizing');
    drag = null;
    syncScrollEdges();
  });

  /* ─── Period view ─────────────────────────────────────────────────
     The same filtered timesheets, pivoted: one column per day in the
     active date range, one row per task under site › supervisor › worker. */
  var DOW_P = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var pdCollapsed = Object.create(null);
  /* Hours typed into the period grid. Saved edits land in pdSaved; pdDraft
     holds what is being typed right now. */
  var pdSaved = Object.create(null);
  var pdDraft = null;
  var pdEditing = false;

  function pdCellKey(leafKey, isoDate) { return leafKey + '@' + isoDate; }
  function leafHours(leaf, isoDate) {
    var ck = pdCellKey(leaf.id, isoDate);
    if (pdDraft && ck in pdDraft) return pdDraft[ck];
    if (ck in pdSaved) return pdSaved[ck];
    return leaf.hours[isoDate] || 0;
  }

  function periodDays(rows) {
    var b = rangeBounds(), from, to;
    if (b) { from = parseIso(b.from); to = parseIso(b.to); }
    else {
      /* No date filter: span whatever the data covers. */
      var all = rows.map(function (t) { return t.issued; }).sort();
      if (!all.length) return [];
      from = parseIso(all[0]); to = parseIso(all[all.length - 1]);
    }
    var out = [], cur = new Date(from.getTime());
    while (cur <= to && out.length < 400) { out.push(new Date(cur.getTime())); cur.setDate(cur.getDate() + 1); }
    return out;
  }

  /* site › supervisor › worker › task, each leaf holding hours by date. */
  function periodTree(rows) {
    var sites = [], bySite = Object.create(null), q = state.query.toLowerCase();

    rows.forEach(function (t) {
      var fields = fieldsFor(t.site);
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) {
          /* Some entries carry no custom-field path; fall back to the
             project so the row still says what the work was. */
          var path = taskPath(a, fields) || a.project || 'No task';
          if (q) {
            var hay = [t.site, t.supervisor, w.worker, path, a.project].join(' ').toLowerCase();
            if (hay.indexOf(q) === -1) return;
          }
          if (!bySite[t.site]) { bySite[t.site] = { name: t.site, kids: [], by: Object.create(null) }; sites.push(bySite[t.site]); }
          var S = bySite[t.site];
          if (!S.by[t.supervisor]) { S.by[t.supervisor] = { name: t.supervisor, kids: [], by: Object.create(null) }; S.kids.push(S.by[t.supervisor]); }
          var P = S.by[t.supervisor];
          if (!P.by[w.worker]) { P.by[w.worker] = { name: w.worker, kids: [], by: Object.create(null) }; P.kids.push(P.by[w.worker]); }
          var W = P.by[w.worker];
          if (!W.by[path]) {
            W.by[path] = { name: path, hours: Object.create(null),
                           id: t.site + '§' + t.supervisor + '§' + w.worker + '§' + path };
            W.kids.push(W.by[path]);
          }
          var L = W.by[path];
          L.hours[t.issued] = (L.hours[t.issued] || 0) + (Number(a.hours) || 0);
        });
      });
    });
    return sites;
  }

  function leavesOf(node) {
    if (!node.kids) return [node];
    var out = [];
    node.kids.forEach(function (k) { out = out.concat(leavesOf(k)); });
    return out;
  }
  function sumOn(leaves, isoDate) {
    var n = 0;
    leaves.forEach(function (l) { n += leafHours(l, isoDate); });
    return n;
  }
  function sumAll(leaves, ds) {
    var n = 0;
    ds.forEach(function (d) { n += sumOn(leaves, toIso(d)); });
    return n;
  }
  function hoursCell(n, leaf, isoDate) {
    if (pdEditing && leaf) {
      return '<td class="pd-day"><input class="pd-input" type="text" inputmode="decimal" ' +
        'data-cell="' + Shell.esc(pdCellKey(leaf.id, isoDate)) + '" value="' + (n > 0 ? fmtHours(n) : '') + '" aria-label="Hours" /></td>';
    }
    return '<td class="pd-day">' + (n > 0 ? fmtHours(n) : '<span class="cell-empty">&mdash;</span>') + '</td>';
  }
  function pdCaret() {
    return '<span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }
  var PD_ICONS = {
    site: '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 14V3.5l5-1.5V14M3 14h10V6.5H8M3 14H1.5M13 14h1.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    sup:  '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 13.2c0-2.2 2-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M11.5 4.5h3M13 3v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    worker: '<svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M3 13.5c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
  };

  var pdRowsMode = 'nested';

  /* Flat: every level gets its own column and repeats are left blank, so
     the hierarchy reads without any nesting. */
  function renderPeriodFlat(rows, ds, tree) {
    mainColgroup.innerHTML = '<col style="width:190px" /><col style="width:150px" /><col style="width:150px" /><col style="width:260px" />' +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') + '<col style="width:96px" />';

    mainThead.innerHTML = '<tr>' +
      '<th class="pf-site">Site</th><th class="pf-sup">Supervisor</th>' +
      '<th class="pf-worker">Worker</th><th class="pf-task">Task</th>' +
      ds.map(function (d) {
        var today = toIso(d) === daysAgoIso(0);
        return '<th class="pd-day"><span class="pd-day-head' + (today ? ' is-today' : '') + '">' +
          '<span class="dow">' + DOW_P[d.getDay()] + '</span><span class="dnum">' + fmtDay_(d) + '</span></span></th>';
      }).join('') + '<th class="pd-total">Total</th></tr>';

    mainTable.classList.remove('frozen');
    mainTable.classList.add('pd-table');
    mainTable.style.minWidth = (750 + ds.length * 92 + 96) + 'px';

    var out = [], prev = { site: null, sup: null, worker: null }, count = 0;
    tree.forEach(function (site) {
      site.kids.forEach(function (sup) {
        sup.kids.forEach(function (wk) {
          wk.kids.forEach(function (task) {
            var newSite = site.name !== prev.site;
            var newSup = newSite || sup.name !== prev.sup;
            var newWorker = newSup || wk.name !== prev.worker;
            out.push('<tr class="pd-row' + (newSite && count ? ' pf-top' : '') + '">' +
              '<td class="pf-site" title="' + Shell.esc(site.name) + '">' + (newSite ? Shell.highlight(site.name, state.query) : '') + '</td>' +
              '<td class="pf-sup">' + (newSup ? Shell.highlight(sup.name, state.query) : '') + '</td>' +
              '<td class="pf-worker">' + (newWorker ? Shell.highlight(wk.name, state.query) : '') + '</td>' +
              '<td class="pf-task" title="' + Shell.esc(task.name) + '">' + Shell.highlight(task.name, state.query) + '</td>' +
              ds.map(function (d) { return hoursCell(leafHours(task, toIso(d)), task, toIso(d)); }).join('') +
              '<td class="pd-total">' + fmtHours(sumAll([task], ds)) + '</td>' +
            '</tr>');
            prev = { site: site.name, sup: sup.name, worker: wk.name };
            count++;
          });
        });
      });
    });

    if (!out.length) {
      out.push('<tr><td class="pf-site" colspan="' + (ds.length + 5) + '" style="color:var(--grey-600)">No hours in this period.</td></tr>');
    }

    var allLeaves = [];
    tree.forEach(function (s) { allLeaves = allLeaves.concat(leavesOf(s)); });
    out.push('<tr class="pd-foot">' +
      '<td class="pf-site">Total hours</td><td class="pf-sup"></td><td class="pf-worker"></td><td class="pf-task"></td>' +
      ds.map(function (d) { return hoursCell(sumOn(allLeaves, toIso(d))); }).join('') +
      '<td class="pd-total">' + fmtHours(sumAll(allLeaves, ds)) + '</td></tr>');

    openKeys = [];
    return out.join('');
  }

  function renderPeriod(rows) {
    var ds = periodDays(rows);
    var tree = periodTree(rows);
    if (pdRowsMode === 'flat') return renderPeriodFlat(rows, ds, tree);

    mainColgroup.innerHTML = '<col style="width:360px" />' +
      ds.map(function () { return '<col style="width:92px" />'; }).join('') +
      '<col style="width:96px" />';

    mainThead.innerHTML = '<tr>' +
      '<th class="pd-label">Breakdown</th>' +
      ds.map(function (d) {
        var today = toIso(d) === daysAgoIso(0);
        return '<th class="pd-day"><span class="pd-day-head' + (today ? ' is-today' : '') + '">' +
          '<span class="dow">' + DOW_P[d.getDay()] + '</span>' +
          '<span class="dnum">' + fmtDay_(d) + '</span></span></th>';
      }).join('') +
      '<th class="pd-total">Total</th>' +
    '</tr>';

    mainTable.classList.remove('frozen');
    mainTable.classList.add('pd-table');
    mainTable.style.minWidth = (360 + ds.length * 92 + 96) + 'px';

    var out = [], keys = [];
    function row(node, level, cls, icon, key) {
      var leaves = leavesOf(node);
      var leaf = node.kids ? null : node;
      var open = pdCollapsed[key] !== true;
      if (key) keys.push(key);
      out.push('<tr class="pd-row ' + cls + (open ? '' : ' pd-closed') + '"' +
          (key ? ' data-pd="' + Shell.esc(key) + '"' : '') + '>' +
        '<td class="pd-label"><span class="pd-tree" style="padding-left:' + (level * 22) + 'px">' +
          (node.kids ? pdCaret() : '') + (icon || '') +
          '<span class="name">' + Shell.highlight(node.name, state.query) + '</span></span></td>' +
        ds.map(function (d) { return hoursCell(sumOn(leaves, toIso(d)), leaf, toIso(d)); }).join('') +
        '<td class="pd-total">' + fmtHours(sumAll(leaves, ds)) + '</td>' +
      '</tr>');
      return open;
    }

    tree.forEach(function (site) {
      var sk = 'p:' + site.name;
      if (!row(site, 0, 'pd-site', PD_ICONS.site, sk)) return;
      site.kids.forEach(function (sup) {
        var pk = sk + '|' + sup.name;
        if (!row(sup, 1, 'pd-sup', PD_ICONS.sup, pk)) return;
        sup.kids.forEach(function (wk) {
          var wkey = pk + '|' + wk.name;
          if (!row(wk, 2, 'pd-worker', PD_ICONS.worker, wkey)) return;
          wk.kids.forEach(function (task) { row(task, 3, 'pd-task', '', null); });
        });
      });
    });

    if (!out.length) {
      out.push('<tr><td class="pd-label" colspan="' + (ds.length + 2) + '" style="color:var(--grey-600)">No hours in this period.</td></tr>');
    }

    var allLeaves = [];
    tree.forEach(function (s) { allLeaves = allLeaves.concat(leavesOf(s)); });
    out.push('<tr class="pd-foot">' +
      '<td class="pd-label">Total hours</td>' +
      ds.map(function (d) { return hoursCell(sumOn(allLeaves, toIso(d))); }).join('') +
      '<td class="pd-total">' + fmtHours(sumAll(allLeaves, ds)) + '</td>' +
    '</tr>');

    openKeys = keys;
    return out.join('');
  }

  function fmtDay_(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }

  /* ─── Rendering ───────────────────────────────────────────────────── */
  function statusChip(status) {
    return '<span class="status-sec status-sec-' + STATUS_COLOR[status] + '">' +
      Shell.highlight(status, state.query) + '</span>';
  }

  /* A finalised timesheet is read-only, so its row offers View; anything else
     is still editable. Both open the same timesheet detail page. */
  function openBtn(t) {
    return '<button class="btn-text row-open" type="button" data-open="' + t.id + '">' +
      (t.status === 'Finalised' ? 'View' : 'Edit') + '</button>';
  }
  function kebabBtn(id) {
    return '<button class="kebab" type="button" data-kebab="' + Shell.esc(id) + '" aria-label="More actions">' +
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg></button>';
  }
  function actionCell(inner) {
    return '<td class="col-act"><span class="action-cell">' + inner + '</span></td>';
  }

  function updatedCell(t) {
    return '<span class="updated-cell"><span>' + Shell.highlight(fmtDate(t.updated), state.query) + '</span>' +
      '<span class="updated-time">' + Shell.highlight(t.time, state.query) + '</span></span>';
  }

  /* ctx is null (plain timesheet row), or {type:'worker'|'project', name, …},
     which decides both the Hours figure and what View opens. */
  function rowHtml(t, hidden, ctx) {
    var q = state.query;
    var checked = !!selected[t.id];
    var hours = !ctx ? workersFor(t).reduce(function (s, w) { return s + w.total; }, 0)
              : ctx.type === 'worker' ? ctx.rec.total
              : ctx.hours;
    return '' +
      '<tr class="' + (checked ? 'selected ' : '') + (hidden ? 'hidden ' : '') + '" data-id="' + t.id + '"' +
          (hidden ? ' data-group-child="' + Shell.esc(groupKeyOf(t) || '') + '"' : '') + '>' +
        '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '" role="checkbox" tabindex="0" aria-checked="' + checked + '" data-row-chk="' + t.id + '"></span></td>' +
        (ctx ? '<td class="col-group"></td>' : '') +
        '<td class="col-issued">' + Shell.highlight(fmtDate(t.issued), q) + '</td>' +
        '<td>' + Shell.highlight(t.supervisor, q) + '</td>' +
        '<td title="' + Shell.esc(t.site) + '">' + Shell.highlight(t.site, q) + '</td>' +
        '<td>' + statusChip(t.status) + '</td>' +
        // In Worker mode this is the worker's own hours; otherwise the sheet's.
        '<td class="col-hrs">' + fmtHours(hours) + '</td>' +
        '<td>' + updatedCell(t) + '</td>' +
        '<td class="col-act"><span class="action-cell">' +
          '<button class="kebab" type="button" data-kebab="' + t.id + '" aria-label="More actions">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg>' +
          '</button>' +
        '</span></td>' +
      '</tr>';
  }

  /* An assignment's populated custom-field path, joined — field names differ
     per site, so one flat grid can only carry the path. */
  function taskPath(a, fields) {
    return fields.map(function (f, i) { return a.levels[i]; }).filter(Boolean).join(' | ');
  }
  /* Name and units together, one allowance per line. Clients without any
     allowances configured never see this column at all. */
  function allowText(a) {
    return [a.allow1 ? a.allow1 + ', ' + a.qty1 : '',
            a.allow2 ? a.allow2 + ', ' + a.qty2 : ''].filter(Boolean).join('\n');
  }
  /* Finishing before you started means the shift ran past midnight. */
  function timesText(a) {
    if (!a.start || !a.finish) return '';
    return a.start + ' - ' + a.finish + (a.finish <= a.start ? ' (+1)' : '');
  }
  function jobCell(v, cls) {
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' +
      (v ? Shell.highlight(v, state.query) : '<span class="cell-empty">&mdash;</span>') + '</td>';
  }

  function workerRows(sheets) {
    var index = Object.create(null), order = [], vis = visibleKeys(), q = state.query;
    sheets.forEach(function (t) {
      var fields = fieldsFor(t.site);
      workersFor(t).forEach(function (w) {
        if (!index[w.worker]) { index[w.worker] = { color: w.color, jobs: [] }; order.push(w.worker); }
        w.assignments.forEach(function (a) {
          index[w.worker].jobs.push({ t: t, a: a, fields: fields,
            position: w.position, workType: w.workType,
            values: jobValues(t, w, a, fields, true) });
        });
      });
    });
    order.sort();

    var out = [];
    order.forEach(function (name) {
      var g = index[name];
      var position = g.jobs.length ? g.jobs[0].position : '';
      /* A worker stays when their own row matches — then everything under it
         belongs to the match — otherwise only the jobs that match show. */
      var parentHit = hitsQuery({ group: name, position: position }, vis);
      var jobs = (!q || parentHit) ? g.jobs
               : g.jobs.filter(function (j) { return hitsQuery(j.values, vis); });
      if (q && !parentHit && !jobs.length) return;
      renderedKeys.push(name);
      var isCollapsed = isCollapsed_(name);
      /* Selection is always by timesheet, so ticking a person means ticking
         every sheet they appear on — part-selected shows as indeterminate. */
      var sheetIds = [];
      jobs.forEach(function (j) {
        renderedSheets[j.t.id] = true;
        if (sheetIds.indexOf(j.t.id) === -1) sheetIds.push(j.t.id);
      });
      var picked = sheetIds.filter(function (id) { return selected[id]; }).length;
      var allPicked = picked > 0 && picked === sheetIds.length;
      var chkCls = allPicked ? ' checked' : (picked > 0 ? ' indeterminate' : '');
      var sites = {}, projects = {}, tasks = {}, allowances = {};
      var total = 0;
      jobs.forEach(function (j) {
        total += Number(j.a.hours) || 0;
        sites[j.t.site] = true;
        if (j.a.project) projects[j.a.project] = true;
        var path = taskPath(j.a, j.fields);
        if (path) tasks[path] = true;
        [j.a.allow1, j.a.allow2].forEach(function (x) { if (x) allowances[x] = true; });
      });
      function tally(m) { var n = Object.keys(m).length; return n ? String(n) : ''; }

      out.push('<tr class="ts-parent' + (allPicked ? ' selected' : '') + (isCollapsed ? ' collapsed' : '') +
            '" data-sheet="' + Shell.esc(name) + '">' +
        '<td class="col-chk"><span class="chk' + chkCls + '" role="checkbox" tabindex="0" aria-checked="' +
          (allPicked ? 'true' : (picked > 0 ? 'mixed' : 'false')) + '" data-worker-chk="' + Shell.esc(name) +
          '" data-sheet-ids="' + sheetIds.join(',') + '"></span></td>' +
        '<td class="col-group"><span class="ts-parent-main">' +
          '<span class="ts-caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '<span class="avatar avatar-sm" style="background:' + g.color + '">' + Shell.initials(name) + '</span>' +
          '<a class="worker-link" href="#" data-worker="' + Shell.esc(name) + '">' +
            Shell.highlight(name, state.query) + '</a></span></td>' +
        '<td class="col-issued ts-count">' + jobs.length + '</td>' +
        '<td class="col-site ts-count">' + tally(sites) + '</td>' +
        '<td class="col-super"></td>' +
        '<td class="col-status"></td>' +
        '<td class="col-position">' + Shell.esc(position) + '</td>' +
        '<td class="col-worktype"></td>' +
        '<td class="col-project ts-count">' + tally(projects) + '</td>' +
        '<td class="col-task ts-count">' + tally(tasks) + '</td>' +
        '<td class="col-allow ts-count">' + tally(allowances) + '</td>' +
        '<td class="col-times"></td>' +
        '<td class="col-updated"></td>' +
        '<td class="col-hrs ts-total">' + fmtHours(total) + '</td>' +
        actionCell(kebabBtn(name)) +
      '</tr>');

      childHtml[name] = function () {
        return jobs.map(function (j) {
          return '<tr class="ts-job" data-child="' + Shell.esc(name) + '">' +
          '<td class="col-chk"></td>' +
          '<td class="col-group"></td>' +
          '<td class="col-issued">' + Shell.highlight(fmtDate(j.t.issued), state.query) + '</td>' +
          '<td class="col-site" title="' + Shell.esc(j.t.site) + '">' + Shell.highlight(j.t.site, state.query) + '</td>' +
          '<td class="col-super">' + Shell.highlight(j.t.supervisor, state.query) + '</td>' +
          '<td class="col-status">' + statusChip(j.t.status) + '</td>' +
          jobCell(j.position, 'col-position') +
          jobCell(j.workType, 'col-worktype') +
          jobCell(j.a.project, 'col-project') +
          jobCell(taskPath(j.a, j.fields), 'col-task') +
          jobCell(allowText(j.a), 'col-allow') +
          jobCell(timesText(j.a), 'col-times') +
          '<td class="col-updated">' + updatedCell(j.t) + '</td>' +
          '<td class="col-hrs">' + fmtHours(j.a.hours) + '</td>' +
          actionCell(openBtn(j.t)) +
        '</tr>';
        }).join('');
      };
      if (!isCollapsed) out.push(childHtml[name]());
    });
    return out.join('');
  }

  /* Timesheet tab: the sheet is the parent row, its jobs nest underneath and
     start at the Worker column so every value sits under its own heading. */
  function timesheetRows(sheets) {
    var out = [];
    var vis = visibleKeys(), q = state.query;
    sheets.forEach(function (t) {
      var fields = fieldsFor(t.site);
      var all = [];
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) {
          all.push({ w: w, a: a, values: jobValues(t, w, a, fields, false) });
        });
      });
      /* A sheet stays when its own row matches — then every job on it belongs
         to the match — otherwise only the jobs that match are listed. */
      var parentHit = hitsQuery(sheetValues(t), vis);
      var jobs = (!q || parentHit) ? all : all.filter(function (j) { return hitsQuery(j.values, vis); });
      if (q && !parentHit && !jobs.length) return;
      renderedKeys.push(t.id);
      renderedSheets[t.id] = true;

      var checked = !!selected[t.id];
      var isCollapsed = isCollapsed_(t.id);
      /* Summaries count what is listed underneath, so a filtered sheet reads
         as what it shows rather than what it holds. */
      var people = {}, projects = {}, tasks = {}, allowances = {};
      jobs.forEach(function (j) {
        people[j.w.worker] = true;
        if (j.a.project) projects[j.a.project] = true;
        var path = taskPath(j.a, fields);
        if (path) tasks[path] = true;
        [j.a.allow1, j.a.allow2].forEach(function (x) { if (x) allowances[x] = true; });
      });
      var total = jobs.reduce(function (s, j) { return s + (Number(j.a.hours) || 0); }, 0);
      /* Each summary number counts distinct values among the jobs beneath, so
         it answers "how many different X are on this sheet" under its own
         heading. Blank cells don't count toward any of them. */
      function tally(map) {
        var n = Object.keys(map).length;
        return n ? String(n) : '';
      }

      out.push('<tr class="ts-parent' + (checked ? ' selected' : '') + (isCollapsed ? ' collapsed' : '') +
            '" data-id="' + t.id + '" data-sheet="' + t.id + '">' +
        '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '" role="checkbox" tabindex="0" aria-checked="' + checked + '" data-row-chk="' + t.id + '"></span></td>' +
        '<td class="col-issued"><span class="ts-parent-main">' +
          '<span class="ts-caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          Shell.highlight(fmtDate(t.issued), q) + '</span></td>' +
        '<td class="col-site" title="' + Shell.esc(t.site) + '">' + Shell.highlight(t.site, q) + '</td>' +
        '<td class="col-super">' + Shell.highlight(t.supervisor, q) + '</td>' +
        '<td class="col-status">' + statusChip(t.status) + '</td>' +
        '<td class="col-worker ts-count">' + tally(people) + '</td>' +
        '<td class="col-position"></td><td class="col-worktype"></td>' +
        '<td class="col-project ts-count">' + tally(projects) + '</td>' +
        '<td class="col-task ts-count">' + tally(tasks) + '</td>' +
        '<td class="col-allow ts-count">' + tally(allowances) + '</td>' +
        '<td class="col-times"></td>' +
        '<td class="col-updated">' + updatedCell(t) + '</td>' +
        '<td class="col-hrs ts-total">' + fmtHours(total) + '</td>' +
        actionCell(openBtn(t) + kebabBtn(t.id)) +
      '</tr>');

      childHtml[t.id] = function () {
        return jobs.map(function (j) {
          return '<tr class="ts-job" data-child="' + t.id + '">' +
          '<td class="col-chk"></td><td class="col-issued"></td>' +
          '<td class="col-site"></td><td class="col-super"></td><td class="col-status"></td>' +
          jobCell(j.w.worker, 'col-worker') +
          jobCell(j.w.position, 'col-position') +
          jobCell(j.w.workType, 'col-worktype') +
          jobCell(j.a.project, 'col-project') +
          jobCell(taskPath(j.a, fields), 'col-task') +
          jobCell(allowText(j.a), 'col-allow') +
          jobCell(timesText(j.a), 'col-times') +
          '<td class="col-updated"></td>' +
          '<td class="col-hrs">' + fmtHours(j.a.hours) + '</td>' +
          '<td class="col-act"></td>' +
        '</tr>';
        }).join('');
      };
      if (!isCollapsed) out.push(childHtml[t.id]());
    });
    return out.join('');
  }

  /* One row per job across every timesheet the filters allow through. */
  function flatJobRows(sheets) {
    var q = state.query, out = [], vis = visibleKeys();
    sheets.forEach(function (t) {
      var fields = fieldsFor(t.site);
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) {
          // Nothing nests here, so a row either matches or it is left out.
          if (!hitsQuery(jobValues(t, w, a, fields, true), vis)) return;
          renderedSheets[t.id] = true;
          // The site's custom fields, joined — their names vary by site, so a
          // single flat table can only carry the path, not a column each.
          var path = taskPath(a, fields);
          var allow = allowText(a);
          var times = timesText(a);
          var cell = jobCell;
          /* A row here is a job, but bulk actions act on whole timesheets —
             so the tick belongs to the sheet, and its sibling jobs tick with
             it. */
          var checked = !!selected[t.id];
          out.push('<tr class="' + (checked ? 'selected' : '') + '" data-id="' + t.id + '">' +
            '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '" role="checkbox" tabindex="0" aria-checked="' + checked + '" data-row-chk="' + t.id + '"></span></td>' +
            '<td class="col-issued">' + Shell.highlight(fmtDate(t.issued), q) + '</td>' +
            '<td class="col-site" title="' + Shell.esc(t.site) + '">' + Shell.highlight(t.site, q) + '</td>' +
            cell(t.supervisor, 'col-super') +
            '<td class="col-status">' + statusChip(t.status) + '</td>' +
            cell(w.worker, 'col-worker') +
            cell(w.position, 'col-position') +
            cell(w.workType, 'col-worktype') +
            cell(a.project, 'col-project') +
            '<td class="col-task" title="' + Shell.esc(path) + '">' +
              (path ? Shell.highlight(path, q) : '<span class="cell-empty">&mdash;</span>') + '</td>' +
            cell(allow, 'col-allow') +
            cell(times, 'col-times') +
            '<td class="col-updated">' + updatedCell(t) + '</td>' +
            '<td class="col-hrs">' + fmtHours(a.hours) + '</td>' +
          '</tr>');
        });
      });
    });
    return out.join('');
  }

  function groupRowHtml(key, count, person) {
    var isCollapsed = isCollapsed_(key);
    return '' +
      '<tr class="group-row' + (isCollapsed ? ' collapsed' : '') + '" data-group="' + Shell.esc(key) + '">' +
        '<td class="col-chk"></td>' +
        // Spans group → last-updated: the name starts under its own heading
        // and the cells it covers are empty on a group row anyway.
        '<td colspan="5">' +
          '<button class="group-toggle" type="button">' +
            '<svg class="group-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            (person && person.color ? '<span class="avatar avatar-sm" style="background:' + person.color + '">' + Shell.initials(key) + '</span>' : '') +
            '<span>' + Shell.esc(key) + '</span>' +
            '<span class="group-count">' + count + ' timesheet' + (count === 1 ? '' : 's') + '</span>' +
          '</button>' +
        '</td>' +
        // Hours the worker booked across everything the filters let through,
        // sitting in the Hours column so it totals the values beneath it.
        '<td class="col-hrs group-total">' + (person ? fmtHours(person.total) : '') + '</td>' +
        '<td></td><td></td>' +
      '</tr>';
  }

  /* The button reflects what clicking it will do, so it stays honest after
     rows are opened or closed one at a time. */
  function pdClosed(k) { return pdCollapsed[k] === true; }

  function syncExpandBtn() {
    var btn = document.getElementById('expand-all');
    if (!openKeys.length) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    var anyClosed = state.mode === 'period' ? openKeys.some(pdClosed) : openKeys.some(isCollapsed_);
    btn.textContent = anyClosed ? 'Expand all' : 'Collapse all';
  }

  document.getElementById('expand-all').addEventListener('click', function () {
    if (state.mode === 'period') {
      var anyShut = openKeys.some(pdClosed);
      openKeys.forEach(function (k) { pdCollapsed[k] = !anyShut; });
      render();
      syncExpandBtn();
      return;
    }
    var anyClosed = openKeys.some(isCollapsed_);
    openKeys.forEach(function (k) { setCollapsed_(k, !anyClosed); });
    render();
  });

  /* A divider shows on an edge only while a frozen column is covering
     something there — nothing at rest, both edges mid-scroll. */
  var scrollBox = document.querySelector('.table-scroll');
  function syncScrollEdges() {
    var max = scrollBox.scrollWidth - scrollBox.clientWidth;
    scrollBox.classList.toggle('sx-left', scrollBox.scrollLeft > 0);
    scrollBox.classList.toggle('sx-right', max > 1 && scrollBox.scrollLeft < max - 1);
  }
  scrollBox.addEventListener('scroll', syncScrollEdges);
  window.addEventListener('resize', syncScrollEdges);

  /* Measured rather than guessed: the toolbar swaps for the taller selection
     bar, so a fixed viewport offset would be wrong half the time. */
  function sizeTableBox() {
    scrollBox.style.maxHeight = '';
    var top = scrollBox.getBoundingClientRect().top + window.pageYOffset;
    scrollBox.style.maxHeight = Math.max(240, window.innerHeight - top - 24) + 'px';
  }
  window.addEventListener('resize', sizeTableBox);

  function render() {
    var rows = TIMESHEETS.filter(matches);
    renderedKeys = [];
    renderedSheets = Object.create(null);
    childHtml = Object.create(null);
    var html = '';

    /* Period is its own table: a fixed hierarchy and a column per day, so
       it builds its own head rather than going through the column model. */
    if (state.mode === 'period') {
      html = renderPeriod(rows);
      tbody.innerHTML = html;
      rows.forEach(function (t) { renderedSheets[t.id] = true; });
      shownIds = Object.keys(renderedSheets);
      syncExpandBtn();
      var noneP = !tbody.querySelector('.pd-row');
      empty.classList.toggle('visible', noneP);
      tbody.closest('.table-scroll').style.display = noneP ? 'none' : '';
      if (noneP) {
        emptySub.textContent = state.query
          ? 'Nothing matches “' + state.query + '” in this period.'
          : 'No hours recorded in this period.';
      }
      syncSelectAll();
      syncSelectionBar();
      sizeTableBox();
      syncScrollEdges();
      return;
    }

    mainTable.classList.remove('pd-table');
    renderHead();

    if (state.group === 'flat') {
      html = flatJobRows(rows);
    } else if (state.group === 'none') {
      html = timesheetRows(rows);
    } else if (state.group === 'worker') {
      html = workerRows(rows);
    } else {
      var pidx = projectIndex(rows);
      pidx.order.forEach(function (name) {
        var list = pidx.buckets[name];
        html += groupRowHtml(name, list.length, {
          total: list.reduce(function (s, pair) { return s + pair.hours; }, 0)
        });
        html += list.map(function (pair) {
          return rowHtml(pair.ts, isCollapsed_(name), { type: 'project', name: name, hours: pair.hours });
        }).join('');
      });
    }

    tbody.innerHTML = html;

    // Which keys the Expand all button acts on — the parent rows actually
    // rendered, so a search narrows what it opens too.
    if (state.group === 'none' || state.group === 'worker') openKeys = renderedKeys.slice();
    else if (state.group === 'project') openKeys = projectIndex(rows).order;
    else                                openKeys = [];
    shownIds = Object.keys(renderedSheets);
    syncExpandBtn();

    var none = html === '';
    empty.classList.toggle('visible', none);
    tbody.closest('.table-scroll').style.display = none ? 'none' : '';
    if (none) {
      emptySub.textContent = state.query
        ? 'Nothing matches “' + state.query + '” in the columns on screen.'
        : state.supervisor === 'all'
          ? 'No timesheets in this date range.'
          : 'No timesheets match the current filters.';
    }

    syncSelectAll();
    syncSelectionBar();
    sizeTableBox();
    syncScrollEdges();
  }

  /* ─── Selection ───────────────────────────────────────────────────── */
  function visibleIds() { return shownIds.slice(); }
  function selectedIds() { return Object.keys(selected); }

  function syncSelectAll() {
    var ids = shownIds;
    var n = ids.filter(function (id) { return selected[id]; }).length;
    var box = chkAll();
    if (!box) return;
    box.classList.toggle('checked', n > 0 && n === ids.length);
    box.classList.toggle('indeterminate', n > 0 && n < ids.length);
    box.setAttribute('aria-checked', n === 0 ? 'false' : (n === ids.length ? 'true' : 'mixed'));
  }

  function statusOf(id) {
    for (var i = 0; i < TIMESHEETS.length; i++) if (TIMESHEETS[i].id === id) return TIMESHEETS[i].status;
    return '';
  }

  function syncSelectionBar() {
    var ids = selectedIds();
    var n = ids.length;
    selBar.classList.toggle('visible', n > 0);
    toolbar.style.display = n > 0 ? 'none' : '';
    selCount.textContent = n + ' timesheet' + (n === 1 ? '' : 's') + ' selected';

    /* Deleting acts on the whole timesheet, so it is offered only where the
       rows are timesheets. Export applies everywhere. */
    selBar.querySelector('[data-bulk="delete"]').style.display =
      state.group === 'none' ? '' : 'none';

    /* Finalising is only defined for a revised sheet, so anything else in the
       selection blocks it — shown but disabled, with the reason on hover. */
    var fin = selBar.querySelector('[data-bulk="finalise"]');
    var offenders = ids.filter(function (id) { return statusOf(id) !== 'Revised'; });
    fin.disabled = offenders.length > 0;
    fin.title = offenders.length
      ? (offenders.length === n
          ? 'Only revised timesheets can be finalised.'
          : offenders.length + ' of the selected timesheets ' +
            (offenders.length === 1 ? 'is' : 'are') + ' not revised.')
      : '';
  }

  function toggleRow(id) {
    if (selected[id]) delete selected[id]; else selected[id] = true;
    tbody.querySelectorAll('tr[data-id="' + id + '"]').forEach(function (tr) {
      tr.classList.toggle('selected', !!selected[id]);
      var box = tr.querySelector('[data-row-chk]');
      box.classList.toggle('checked', !!selected[id]);
      box.setAttribute('aria-checked', String(!!selected[id]));
    });
    syncSelectAll();
    syncSelectionBar();
  }

  function toggleAll() {
    var ids = visibleIds();
    var allOn = ids.length > 0 && ids.every(function (id) { return selected[id]; });
    ids.forEach(function (id) { if (allOn) delete selected[id]; else selected[id] = true; });
    render();
  }
  mainThead.addEventListener('click', function (e) {
    if (e.target.closest('#chk-all')) toggleAll();
  });
  mainThead.addEventListener('keydown', function (e) {
    if (e.target.closest('#chk-all') && (e.key === ' ' || e.key === 'Enter')) {
      e.preventDefault(); toggleAll();
    }
  });

  /* ─── Table interactions ──────────────────────────────────────────── */
  tbody.addEventListener('click', function (e) {
    var sheetRow = e.target.closest('.ts-parent');
    if (sheetRow && !e.target.closest('[data-row-chk], [data-worker-chk], [data-open], [data-worker], .kebab')) {
      var sid = sheetRow.getAttribute('data-sheet');
      var nowCollapsed = !isCollapsed_(sid);
      setCollapsed_(sid, nowCollapsed);
      sheetRow.classList.toggle('collapsed', nowCollapsed);
      var kids = tbody.querySelectorAll('tr[data-child="' + sid + '"]');
      if (!nowCollapsed && !kids.length && childHtml[sid]) {
        // First time this row is opened — build its entries now.
        sheetRow.insertAdjacentHTML('afterend', childHtml[sid]());
      } else {
        kids.forEach(function (tr) { tr.classList.toggle('hidden', nowCollapsed); });
      }
      syncExpandBtn();
      return;
    }

    var box = e.target.closest('[data-row-chk]');
    if (box) { toggleRow(box.getAttribute('data-row-chk')); return; }

    var wbox = e.target.closest('[data-worker-chk]');
    if (wbox) {
      var wids = (wbox.getAttribute('data-sheet-ids') || '').split(',').filter(Boolean);
      var allOn = wids.length > 0 && wids.every(function (id) { return selected[id]; });
      wids.forEach(function (id) { if (allOn) delete selected[id]; else selected[id] = true; });
      render();
      return;
    }

    var groupBtn = e.target.closest('.group-toggle');
    if (groupBtn) {
      var key = groupBtn.closest('.group-row').getAttribute('data-group');
      setCollapsed_(key, !isCollapsed_(key));
      render();
      return;
    }

    var open = e.target.closest('[data-open]');
    if (open) {
      Shell.snackbar('Timesheet ' + open.getAttribute('data-open') + ' — detail page not designed yet.');
      return;
    }

    var wlink = e.target.closest('[data-worker]');
    if (wlink) {
      e.preventDefault();
      Shell.snackbar(wlink.getAttribute('data-worker') + ' — worker details not designed yet.');
      return;
    }

    var kebab = e.target.closest('[data-kebab]');
    if (kebab) { Shell.snackbar('Row actions for ' + kebab.getAttribute('data-kebab') + ' — menu not designed yet.'); return; }
  });

  /* ─── Timesheets / Period ─────────────────────────────────────────
     Group by and the column picker belong to the list; Period has one
     hierarchy of its own. The list's grouping is remembered either way. */
  document.getElementById('modeswitch').addEventListener('click', function (e) {
    var btn = e.target.closest('.seg-btn');
    if (!btn) return;
    this.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.mode = btn.getAttribute('data-mode');
    document.body.classList.toggle('mode-period', state.mode === 'period');
    if (state.mode !== 'period' && pdEditing) { pdEditing = false; pdDraft = null; document.body.classList.remove('pd-editing'); }
    collapsed = Object.create(null);
    render();
    syncExpandBtn();
  });

  /* ─── Period edit mode ────────────────────────────────────────────
     Only the task rows take input; everything above them is a total, and
     saving keeps the typed hours against that cell. */
  function pdChanges() { return pdDraft ? Object.keys(pdDraft).length : 0; }
  function syncPdBar() {
    var n = pdChanges();
    document.getElementById('pd-status').textContent =
      n === 0 ? 'Editing · no changes yet' : 'Editing · ' + n + ' change' + (n === 1 ? '' : 's');
    document.getElementById('pd-save').disabled = n === 0;
  }
  function enterPdEdit() {
    pdEditing = true;
    pdDraft = Object.create(null);
    document.body.classList.add('pd-editing');
    render();
    syncPdBar();
  }
  function exitPdEdit() {
    pdEditing = false;
    pdDraft = null;
    document.body.classList.remove('pd-editing');
    render();
  }
  document.getElementById('pd-edit').addEventListener('click', enterPdEdit);
  document.getElementById('pd-cancel').addEventListener('click', exitPdEdit);
  document.getElementById('pd-save').addEventListener('click', function () {
    var n = pdChanges();
    Object.keys(pdDraft).forEach(function (k) { pdSaved[k] = pdDraft[k]; });
    exitPdEdit();
    Shell.snackbar(n + ' change' + (n === 1 ? '' : 's') + ' saved to the timesheets.');
  });

  tbody.addEventListener('input', function (e) {
    var box = e.target.closest('.pd-input');
    if (!box || !pdDraft) return;
    var raw = box.value.trim().replace(',', '.');
    var val = raw === '' ? 0 : Number(raw);
    if (isNaN(val) || val < 0) return;
    var cell = box.getAttribute('data-cell');
    pdDraft[cell] = val;
    box.classList.add('changed');
    var caretPos = box.selectionStart;
    render();
    syncPdBar();
    var again = tbody.querySelector('.pd-input[data-cell="' + cell.replace(/"/g, '\\"') + '"]');
    if (again) { again.focus(); try { again.setSelectionRange(caretPos, caretPos); } catch (err) {} }
  });

  var rowsSwitch = document.getElementById('rows-switch');
  rowsSwitch.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rows]');
    if (!b) return;
    pdRowsMode = b.getAttribute('data-rows');
    rowsSwitch.querySelectorAll('[data-rows]').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
    syncExpandBtn();
  });

  /* The period tree keeps its own open/closed map. */
  tbody.addEventListener('click', function (e) {
    var pd = e.target.closest('[data-pd]');
    if (!pd || state.mode !== 'period' || e.target.closest('.pd-input')) return;
    var k = pd.getAttribute('data-pd');
    pdCollapsed[k] = pdCollapsed[k] !== true;
    render();
    syncExpandBtn();
  });

  /* ─── Group by ────────────────────────────────────────────────────── */
  document.getElementById('groupby').addEventListener('click', function (e) {
    var btn = e.target.closest('.seg-btn');
    if (!btn) return;
    this.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.group = btn.getAttribute('data-group');
    collapsed = Object.create(null);
    render();
  });

  /* ─── Search ──────────────────────────────────────────────────────── */
  searchEl.addEventListener('input', function () {
    state.query = this.value.trim();
    searchCollapsed = Object.create(null);
    clearBtn.classList.toggle('visible', this.value.length > 0);
    render();
  });
  clearBtn.addEventListener('click', function () {
    searchEl.value = '';
    state.query = '';
    searchCollapsed = Object.create(null);
    clearBtn.classList.remove('visible');
    searchEl.focus();
    render();
  });

  /* ─── Bulk actions ────────────────────────────────────────────────── */
  selBar.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-bulk]');
    if (!btn) return;
    var action = btn.getAttribute('data-bulk');
    var n = selectedIds().length;

    if (action === 'clear') {
      selected = Object.create(null);
      render();
      return;
    }
    if (action === 'delete') {
      var ids = selectedIds();
      for (var i = TIMESHEETS.length - 1; i >= 0; i--) {
        if (ids.indexOf(TIMESHEETS[i].id) !== -1) TIMESHEETS.splice(i, 1);
      }
      selected = Object.create(null);
      render();
      Shell.snackbar(n + ' timesheet' + (n === 1 ? '' : 's') + ' deleted.');
      return;
    }

    var newStatus = action === 'export' ? 'Exported' : 'Finalised';
    TIMESHEETS.forEach(function (t) { if (selected[t.id]) t.status = newStatus; });
    selected = Object.create(null);
    render();
    Shell.snackbar(n + ' timesheet' + (n === 1 ? '' : 's') + ' ' + newStatus.toLowerCase() + '.');
  });

  document.getElementById('btn-create').addEventListener('click', function () {
    Shell.snackbar('Create Timesheet — flow not designed yet.');
  });

  /* ─── Timesheet entries — the rows inside the detail popup ────────────
     Shape follows the exported-spreadsheet example: a worker line per shift,
     with a 4-deep Level hierarchy (work order → task → delay code → sub) and
     two allowance slots. Any of those may legitimately be blank.            */
  /* name, position, avatar colour — colours match workers/index.html so the
     same person reads the same on both screens. */
  var E_WORKERS = [
    ['Smith, John',   'Boilermaker',    '#3b7dd8'],
    ['Stone, Emma',   'Safety Officer', '#c4845c'],
    ['Adams, Sophia', 'Rigger',         '#7b6c9e'],
    ['Miller, Ava',   'Pipefitter',     '#4a9b6f'],
    ['Clark, Emma',   'Crane Operator', '#b85555'],
    ['Baker, Liam',   'Electrician',    '#3a7ab5'],
    ['Brown, Olivia', 'Scaffolder',     '#8b7355'],
    ['Clark, Olivia', 'Welder',         '#5b8c8c'],
    ['Hill, Allison', 'Mechanic',       '#7a8cb5'],
    ['Davis, Noah',   'Boilermaker',    '#5a7a5a']
  ];
  var E_WORKTYPE = ['Day Shift', 'Night Shift', 'Back Shift'];
  /* Level 1-4 are custom fields configured per site, so both their names and
     their value sets differ site to site — and a site need not define all
     four. One timesheet is one day at one site, so a single popup's headers
     are unambiguous. (The Workers tab will be harder: a worker's day can span
     several sites, so its rows won't share one header.)                     */
  var SITE_FIELDS = {
    'MMA VIGILANT – 360': [
      { name: 'Work Order', values: ['WORK-00123', 'WORK-00124', 'WORK-00187', 'WORK-00201'] },
      { name: 'Task',       values: ['Repair the machine', 'Replace hydraulic hose', 'Weld handrail section', 'Deck plating repair'] },
      { name: 'Type',       values: ['Labour', 'Waiting for materials', 'Equipment breakdown'] },
      { name: 'Sub-task',   values: ['Preparation', 'Clean-up'] }
    ],
    'MMA VIGILANT ROV': [
      { name: 'Job Number', values: ['JOB-00451', 'JOB-00478', 'JOB-00492'] },
      { name: 'Activity',   values: ['ROV dive', 'Deck handling', 'Tooling change'] },
      { name: 'Type',       values: ['Labour', 'Weather standby'] }
    ],
    'SA BHP OLYMPIC DAM': [
      { name: 'Work Order', values: ['WORK-00123', 'WORK-00201'] },
      { name: 'Cost Code',  values: ['CC-1140', 'CC-1155', 'CC-1163'] },
      { name: 'Type',       values: ['Labour', 'Waiting for materials'] },
      { name: 'Shift Code', values: ['Day', 'Night'] }
    ]
  };

  function fieldsFor(site) { return SITE_FIELDS[site] || []; }

  /* A timesheet's entries do not all share one project. Each site runs a
     couple, and a project can span sites — so the list's lead project is
     just that, a lead. */
  var SITE_PROJECTS = {
    'MMA VIGILANT – 360': ['Vigilant 360 Refit', 'Shutdown Factory XYZ'],
    'MMA VIGILANT ROV':   ['ROV Mobilisation', 'Subsea Survey'],
    'SA BHP OLYMPIC DAM': ['Olympic Dam Expansion', 'Shutdown Factory XYZ']
  };

  var E_ALLOW = ['Rope Allowance', 'Offshore Allowance', 'Height Allowance', 'Travel Allowance', 'Meal Allowance'];
  var E_TIMES = [['06:00', '18:00'], ['07:30', '19:30'], ['18:00', '06:00'], ['05:45', '17:45'], ['06:30', '16:30']];

  /* Which fields a row carries. Covers the cases called out in review:
     levels but no times, times but no levels, and everything in between. */
  var E_PATTERNS = [
    { levels: 1, allow: 0, times: false, hours: 12 },
    { levels: 3, allow: 0, times: false, hours: 10 },
    { levels: 0, allow: 1, times: true },
    { levels: 2, allow: 2, times: true },
    { levels: 4, allow: 1, times: true },
    { levels: 1, allow: 0, times: true },
    { levels: 2, allow: 0, times: false, hours: 8 }
  ];

  function diffHours(from, to) {
    function mins(s) { var p = s.split(':'); return Number(p[0]) * 60 + Number(p[1]); }
    var d = mins(to) - mins(from);
    if (d <= 0) d += 24 * 60;
    return Math.round(d / 60 * 10) / 10;
  }

  /* A worker is the record. Their day is one shift, split across one or more
     assignments — a project plus a path through the site's custom fields —
     each with its own times and hours. */
  function workersFor(ts) {
    if (ts._workers) return ts._workers;
    var seed = Number(ts.id.replace(/\D/g, ''));
    var fields = fieldsFor(ts.site);
    var projects = SITE_PROJECTS[ts.site] || [ts.project];

    // Strides must be coprime with each pool's length, or the index repeats
    // and every row comes out identical.
    function pick(pool, i, stride) { return pool[(seed + i * stride) % pool.length]; }

    var people = 4 + (seed % 3);
    var out = [];

    for (var i = 0; i < people; i++) {
      var who = pick(E_WORKERS, i, 3);
      var nAssign = 1 + ((seed + i) % 3);
      var assignments = [];

      for (var a = 0; a < nAssign; a++) {
        var k = i * 3 + a;
        var pat = pick(E_PATTERNS, k, 3);
        var depth = Math.min(pat.levels, fields.length);
        var t = pick(E_TIMES, k, 2);
        var nAllow = (seed + k) % 3;

        assignments.push({
          project: pick(projects, k, 1),
          levels: fields.map(function (f, idx) {
            return idx < depth ? pick(f.values, k, 1 + idx * 2) : '';
          }),
          // Each allowance carries the number of units claimed against it.
          allow1: nAllow >= 1 ? pick(E_ALLOW, k, 2) : '',
          qty1:   1 + ((seed + k) % 3),
          allow2: nAllow >= 2 ? pick(E_ALLOW, k + 2, 2) : '',
          qty2:   1 + ((seed + k) % 2),
          start:  pat.times ? t[0] : '',
          finish: pat.times ? t[1] : '',
          hours:  pat.times ? diffHours(t[0], t[1]) : pat.hours
        });
      }

      out.push({
        id: ts.id + '-w' + i,
        worker: who[0],
        position: who[1],
        color: who[2],
        workType: pick(E_WORKTYPE, i, 1),   // one shift per worker per day
        assignments: assignments,
        total: assignments.reduce(function (s, x) { return s + (Number(x.hours) || 0); }, 0)
      });
    }

    ts._workers = out;
    return out;
  }

  function fmtHours(h) {
    return (h === '' || h == null) ? '' : Number(h).toFixed(1);
  }
  render();
})();
</script>
</body>
</html>
