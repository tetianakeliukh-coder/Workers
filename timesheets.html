<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Timesheets — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style id="frozen-cols"></style>
<style>
  /* ─── Timesheets-only ─────────────────────────────────────────────── */
  td.col-chk, th.col-chk { padding-left: 16px; padding-right: 0; }
  td.col-issued { color: var(--text-main); font-variant-numeric: tabular-nums; }
  td.col-act { padding: 6px 12px 6px 6px; }
  /* Nested timesheet rows leave the group column empty so every value below
     the header sits under the heading that names it. */
  td.col-group { color: var(--text-main); }
  .flat-name { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  td.col-sheets, th.col-sheets { text-align: right; font-variant-numeric: tabular-nums; padding-right: 24px; }
  th.col-sheets { padding-right: 24px; }

  td.col-chk, th.col-chk { padding-left: 16px; padding-right: 0; }
  td.col-issued { color: var(--text-main); font-variant-numeric: tabular-nums; }
  td.col-act { padding: 6px 12px 6px 6px; }

  /* ─── Columns button & panel — same component as the Workers module ─── */
  .btn-columns {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 8px;
    background: var(--white); border: 1px solid var(--grey-350);
    font-size: 14px; font-weight: 500; line-height: 18px;
    color: var(--grey-800); cursor: pointer; font-family: var(--fs-sans);
    white-space: nowrap; transition: border-color 0.15s, background 0.15s;
  }
  .btn-columns:hover { border-color: #aab6cc; background: var(--bg-blue-light); }
  .btn-columns.active { background: var(--bg-blue-light); border-color: var(--primary); color: var(--primary); }

  .col-panel-wrap { position: relative; }
  .col-panel {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    min-width: 210px; background: var(--white);
    border: 1px solid var(--grey-350); border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    z-index: 50; padding: 6px 0; overflow: hidden;
  }
  .col-panel.open { display: block; }
  .col-panel-section { padding: 6px 14px 2px; font-size: 11px; font-weight: 600; color: var(--grey-400); text-transform: uppercase; letter-spacing: 0.6px; }
  .col-panel-divider { border: none; border-top: 1px solid var(--grey-300); margin: 6px 0; }
  .col-panel-row {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; height: 36px; cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .col-panel-row:hover { background: var(--bg-blue-light); }
  .col-chk-box {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    border: 1.5px solid var(--grey-400); background: var(--white);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .col-panel-row input[type="checkbox"] { display: none; }
  .col-panel-row input:checked + .col-chk-box { background: var(--primary); border-color: var(--primary); }
  .col-panel-row input:checked + .col-chk-box::after {
    content: ''; width: 9px; height: 5px;
    border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px); display: block;
  }
  .col-panel-name { font-size: 14px; color: var(--text-main); }

  td.col-task { white-space: normal; line-height: 18px; }
  /* pre-line so each allowance keeps its own line inside the cell. */
  td.col-allow { white-space: pre-line; line-height: 18px; }

  /* Timesheet tab: sheet rows lead, their jobs sit under them on a tint. */
  tr.ts-parent { cursor: pointer; }
  tr.ts-parent > td { border-top: 1px solid var(--grey-300); }
  #tbody tr.ts-parent:first-child > td { border-top: none; }
  .ts-parent-main { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-main); }
  .ts-caret { display: inline-flex; color: var(--grey-500); transition: transform var(--t-fast); }
  tr.ts-parent.collapsed .ts-caret { transform: rotate(-90deg); }
  td.ts-count { font-weight: 600; color: var(--text-main); }
  td.ts-total { font-weight: 700; }

  /* Frozen cells inherit their row's background, so each row state must set
     one. All at matching specificity, ordered so selection wins over hover. */
  #tbody tr { background: var(--white); }
  #tbody tr.group-row { background: var(--grey-100); }
  #tbody tr:hover { background: #fafbfe; }
  #tbody tr.selected { background: var(--bg-blue-light); }
  .table-card thead tr { background: var(--white); }
  tr.ts-job > td { border-bottom: none; font-size: 13px; }

  td.col-hrs, th.col-hrs { text-align: right; font-variant-numeric: tabular-nums; }
  th.col-hrs { padding-right: 16px; }
  td.col-hrs { font-weight: 600; color: var(--text-main); }

  .updated-cell { display: flex; align-items: baseline; gap: 12px; }
  .updated-time { color: var(--grey-600); font-variant-numeric: tabular-nums; }

  /* Group header rows, shown when Group by is Worker or Project */
  tr.group-row { height: 40px; }
  tr.group-row td {
    background: inherit; padding: 6px 16px;
    font-size: 13px; font-weight: 500; color: var(--grey-800);
    letter-spacing: 0.13px; border-bottom: 1px solid var(--row-divider);
  }
  tr.group-row:hover td { background: var(--grey-100); }
  .group-toggle {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; color: inherit;
  }
  .group-caret { transition: transform var(--t-fast); color: var(--grey-600); flex-shrink: 0; }
  tr.group-row.collapsed .group-caret { transform: rotate(-90deg); }
  .group-count { color: var(--grey-600); font-weight: 400; }
  .avatar-sm { width: 24px; height: 24px; font-size: 10px; }
  td.group-total { font-weight: 700; color: var(--text-main); }

  /* Selection bar replaces the toolbar while rows are checked. Plain white
     with outlined actions on the right, per the Figma spec. */
  .sel-bar {
    display: none; align-items: center; gap: 16px;
    height: 52px; padding: 0 2px; background: var(--white);
  }
  .sel-bar.visible { display: flex; }
  .sel-count { font-size: 14px; color: var(--text-main); white-space: nowrap; }
  .sel-unselect {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500;
    color: var(--primary); white-space: nowrap;
  }
  .sel-unselect:hover { text-decoration: underline; }
  .sel-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sel-action {
    /* Same 32px height as Create Timesheet, so the two rows sit on one scale. */
    height: 32px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    background: var(--white); border: 1px solid var(--primary); color: var(--primary);
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; line-height: 18px;
    white-space: nowrap; transition: background var(--t-fast);
  }
  .sel-action:hover { background: var(--bg-blue-light); }
  .sel-action.danger { border-color: var(--error); color: var(--error); }
  .sel-action.danger:hover { background: var(--error-light); }
  .sel-action:disabled { border-color: var(--grey-350); color: var(--grey-400); cursor: default; }
  .sel-action:disabled:hover { background: var(--white); }

  /* The label truncates inside its own box, so the header cell itself can keep
     overflow visible for the frozen-edge divider. */
  .th-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Drag handle on the right edge of every resizable header cell. */
  .col-grip {
    position: absolute; top: 0; right: 0; width: 8px; height: 100%;
    cursor: col-resize; user-select: none; z-index: 7;
  }
  .col-grip::after {
    content: ''; position: absolute; top: 10px; bottom: 10px; right: 3px;
    width: 2px; border-radius: 1px; background: transparent;
  }
  .col-grip:hover::after, .col-grip.dragging::after { background: var(--primary); }
  body.col-resizing, body.col-resizing * { cursor: col-resize !important; user-select: none; }

  .worker-link { color: var(--text-main); text-decoration: none; }
  .worker-link:hover { color: var(--primary); text-decoration: underline; }
  .col-act .btn-text { font-size: 14px; }

  /* Row kebab menu */
  .kebab-wrap { position: relative; }

  /* ─── Date range calendar (MUI date-range picker layout) ─────────── */
  .dd-chev { width: 12px; height: 12px; margin-left: auto; color: var(--grey-600); }
  .dd-panel.cal-mode { min-width: 0; padding: 0; }
  .dd-panel.cal-mode #date-quick { display: none; }
  #date-cal { display: none; }
  .dd-panel.cal-mode #date-cal { display: block; }

  .cal { width: 600px; padding: 8px 8px 0; }
  .cal-head { display: flex; align-items: center; padding: 4px 8px 6px; }
  .cal-nav {
    width: 32px; height: 32px; flex-shrink: 0; border: none; border-radius: 50%;
    background: none; cursor: pointer; color: var(--grey-700);
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav:hover { background: var(--grey-200); }
  .cal-nav.next svg { transform: rotate(180deg); }
  .cal-title { flex: 1; text-align: center; font-size: 15px; font-weight: 500; color: var(--text-main); }

  .cal-months { display: flex; gap: 24px; padding: 0 8px; }
  .cal-month { flex: 1; }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow span { height: 30px; line-height: 30px; text-align: center; font-size: 12px; color: var(--grey-600); }

  /* The cell carries the range band; the button carries the day circle. */
  .cal-cell { height: 36px; display: flex; align-items: center; justify-content: center; }
  .cal-cell.in { background: var(--bg-blue-light); }
  .cal-cell.start { border-radius: 18px 0 0 18px; }
  .cal-cell.end { border-radius: 0 18px 18px 0; }
  .cal-cell.start.end { border-radius: 18px; }
  .cal-day {
    width: 34px; height: 34px; border: none; border-radius: 50%; background: none;
    cursor: pointer; font-family: var(--fs-sans); font-size: 13px; color: var(--text-main);
  }
  .cal-day:hover { background: var(--grey-200); }
  .cal-day.today { border: 1px solid var(--grey-400); }
  .cal-cell.sel .cal-day { background: var(--primary); color: #fff; font-weight: 500; }
  .cal-cell.sel .cal-day.today { border-color: var(--primary); }

  .cal-foot {
    margin-top: 8px; padding: 10px 16px; border-top: 1px solid var(--grey-300);
    font-size: 13px; color: var(--grey-600);
  }

  /* The table scrolls inside the card rather than with the page, so the
     header row and the timesheet being read can stay pinned to the top. */
  .table-scroll { max-height: calc(100vh - 180px); overflow-y: auto; }   /* JS refines this */
  .table-card thead th {
    position: sticky; top: 0; z-index: 5; background: var(--white);
  }

  /* macOS hides overlay scrollbars until you scroll, which leaves no hint that
     the table pans sideways — so paint one permanently under every tab. */
  /* No scrollbar-color here: setting it makes Chrome ignore the
     ::-webkit-scrollbar rules below and fall back to an overlay bar. */
  .table-scroll { overflow-x: scroll; }
  @supports (-moz-appearance: none) {
    .table-scroll { scrollbar-color: var(--grey-400) var(--grey-200); }
  }
  .table-scroll::-webkit-scrollbar { -webkit-appearance: none; height: 10px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--grey-200); }
  .table-scroll::-webkit-scrollbar-thumb {
    background: var(--grey-400); border-radius: 5px;
    border: 2px solid var(--grey-200); background-clip: padding-box;
  }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--grey-600); background-clip: padding-box; }

  /* ─── Period view ───────────────────────────────────────────────────
     Same data as the list, laid out with the days as columns. One fixed
     hierarchy — site › supervisor › worker › task — so Group by and the
     column picker step aside while it is showing. */
  body.mode-period #groupby,
  body.mode-period .seg-label,
  body.mode-period #columns-wrap { display: none; }

  #modeswitch .seg-btn { display: inline-flex; align-items: center; gap: 6px; }

  .pd-table { min-width: 100%; }
  .pd-table th, .pd-table td { white-space: nowrap; }
  .pd-table th.pd-label, .pd-table td.pd-label {
    position: sticky; left: 0; z-index: 2; background: inherit;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pd-table thead th { position: sticky; top: 0; z-index: 3; background: var(--white); vertical-align: bottom; }
  .pd-table thead th.pd-label { z-index: 4; }
  .pd-table th.pd-day, .pd-table td.pd-day,
  .pd-table th.pd-total, .pd-table td.pd-total { text-align: right; }
  .pd-table td.pd-day, .pd-table td.pd-total { font-variant-numeric: tabular-nums; }
  .pd-table th.pd-total, .pd-table td.pd-total {
    position: sticky; right: 0; z-index: 2; background: inherit; font-weight: 600;
  }
  .pd-table thead th.pd-total { z-index: 4; }
  .pd-day-head { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; line-height: 16px; }
  .pd-day-head .dow { font-size: 12px; font-weight: 400; color: var(--grey-600); }
  .pd-day-head .dnum { font-size: 14px; font-weight: 500; color: var(--text-main); }
  .pd-day-head.is-today .dow, .pd-day-head.is-today .dnum { color: var(--primary); }

  #tbody tr.pd-row { background: var(--white); }
  #tbody tr.pd-row:hover { background: #fafbfe; }
  .pd-tree { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .pd-tree .caret {
    width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--grey-600); transition: transform var(--t-fast);
  }
  tr.pd-closed .caret { transform: rotate(-90deg); }
  .pd-tree .ico { flex-shrink: 0; color: var(--grey-600); }
  .pd-tree .name { overflow: hidden; text-overflow: ellipsis; }
  .pd-site .name { font-weight: 600; }
  .pd-sup .name, .pd-worker .name { font-weight: 500; }
  .pd-task td.pd-label { padding-left: 86px; color: var(--grey-700); }
  .pd-foot td {
    position: sticky; bottom: 0; background: var(--white);
    border-top: 1px solid var(--grey-350); font-weight: 600;
  }
  .pd-foot td.pd-label { z-index: 3; color: var(--grey-700); font-weight: 500; }
  .pd-foot td.pd-total { z-index: 3; }

  /* ─── Period edit bar ──────────────────────────────────────────── */
  #pd-edit { display: none; }
  body.mode-period #pd-edit { display: inline-flex; }
  .edit-bar {
    display: none; align-items: center; gap: 16px; flex-wrap: wrap;
    height: 52px; padding: 0 2px; background: var(--white);
  }
  body.pd-editing .edit-bar { display: flex; }
  body.pd-editing .toolbar { display: none; }
  .edit-status { font-size: 14px; color: var(--text-main); white-space: nowrap; }
  .edit-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .edit-actions .btn-outline {
    height: 32px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--white); border: 1px solid var(--primary); color: var(--primary);
    font-family: var(--fs-sans); font-size: 14px; font-weight: 500; line-height: 18px;
    white-space: nowrap; transition: background var(--t-fast);
  }
  .edit-actions .btn-outline:hover { background: var(--bg-blue-light); }
  .pd-input {
    width: 100%; max-width: 72px; height: 32px; padding: 0 8px; text-align: right;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main);
    border: 1px solid var(--grey-350); border-radius: 6px; background: var(--white);
  }
  .pd-input:focus { outline: none; border-color: var(--primary); }
  .pd-input.changed { border-color: var(--primary); background: var(--bg-blue-light); }

  /* ─── Row layout switcher (Period only) ────────────────────────── */
  .rows-switch {
    display: none; position: fixed; right: 20px; bottom: 20px; z-index: 400;
    padding: 4px; gap: 2px; border-radius: 10px;
    background: var(--white); border: 1px solid var(--grey-350); box-shadow: var(--shadow-dropdown);
  }
  body.mode-period .rows-switch { display: inline-flex; }
  .rows-switch button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px; border: none; border-radius: 7px; cursor: pointer;
    background: none; color: var(--grey-700);
    font-family: var(--fs-sans); font-size: 13px; font-weight: 500;
  }
  .rows-switch button:hover { background: var(--grey-100); color: var(--text-main); }
  .rows-switch button.on { background: var(--bg-blue-light); color: var(--primary); }

  /* Flat period rows: a column each, printed only when the value changes. */
  .pd-table th.pf-site, .pd-table td.pf-site { position: sticky; left: 0; z-index: 2; background: inherit; }
  .pd-table th.pf-sup,  .pd-table td.pf-sup  { position: sticky; left: 190px; z-index: 2; background: inherit; }
  .pd-table th.pf-worker, .pd-table td.pf-worker { position: sticky; left: 340px; z-index: 2; background: inherit; }
  .pd-table th.pf-task, .pd-table td.pf-task { position: sticky; left: 490px; z-index: 2; background: inherit; }
  .pd-table th.pf-site, .pd-table td.pf-site, .pd-table th.pf-sup, .pd-table td.pf-sup,
  .pd-table th.pf-worker, .pd-table td.pf-worker, .pd-table th.pf-task, .pd-table td.pf-task {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pd-table thead th.pf-site, .pd-table thead th.pf-sup,
  .pd-table thead th.pf-worker, .pd-table thead th.pf-task { z-index: 4; }
  td.pf-site { font-weight: 600; }
  td.pf-sup, td.pf-worker { font-weight: 500; }
  td.pf-task { color: var(--grey-700); }
  #tbody tr.pf-top > td { border-top: 1px solid var(--grey-350); }

</style>
</head>
<body data-module="timesheets">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <div class="page-header">
        <h1 class="page-title">Team Timesheets</h1>
        <div class="header-actions">
          <div class="dd-wrap" id="super-dd">
            <button class="dd-trigger" type="button">
              <span>Supervisor: <span id="super-dd-value">All</span></span>
              <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dd-panel" id="super-dd-panel"></div>
          </div>
          <div class="dd-wrap" id="date-dd">
            <button class="dd-trigger" type="button">
              <span>Date: <span id="date-dd-value">Last 7 days</span></span>
              <svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dd-panel" id="date-dd-panel"></div>
          </div>
          <div class="seg" id="modeswitch">
            <button class="seg-btn active" type="button" data-mode="list">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="2.8" cy="4" r="1" fill="currentColor"/><circle cx="2.8" cy="8" r="1" fill="currentColor"/><circle cx="2.8" cy="12" r="1" fill="currentColor"/></svg>
              Timesheets
            </button>
            <button class="seg-btn" type="button" data-mode="period">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 6h12M6 6v7.5M10 6v7.5" stroke="currentColor" stroke-width="1.3"/></svg>
              Period
            </button>
          </div>
          <button class="btn-primary" type="button" id="btn-create">Create Timesheet</button>
        </div>
      </div>

      <div class="toolbar" id="toolbar">
        <div class="search-wrap">
          <label class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input class="search-input-el" id="search" type="text" placeholder="Search" autocomplete="off" />
            <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
          </label>
        </div>
        <div class="toolbar-right">
          <span class="seg-label">Group by</span>
          <div class="seg" id="groupby">
            <button class="seg-btn active" type="button" data-group="none">Timesheet</button>
            <button class="seg-btn" type="button" data-group="worker">Worker</button>
            <button class="seg-btn" type="button" data-group="flat">No Grouping</button>
          </div>
          <button class="btn-ghost" type="button" id="pd-edit">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.2 2.8l2 2L6 12H4v-2l7.2-7.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            Edit
          </button>
          <button class="btn-ghost" type="button" id="expand-all">Expand all</button>
          <div class="col-panel-wrap" id="columns-wrap">
            <button class="btn-columns" id="btn-columns" type="button" aria-expanded="false" aria-haspopup="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="1" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>
                <rect x="6" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  /* ─── Mock data ───────────────────────────────────────────────────────

  var TIMESHEETS = [

    { id: 'TS-1043', ago: 55, supervisor: 'Tom Halloran', site: 'SA BHP OLYMPIC DAM', project: 'Shutdown Factory XYZ',  worker: 'Adams Sophia', status: 'Submitted', updAgo: 54, time: '10:03 am' },
    { id: 'TS-1044', ago: 47, supervisor: 'Grace Okafor', site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Miller Ava',   status: 'Updated',   updAgo: 46, time: '09:14 am' },
    { id: 'TS-1045', ago: 40, supervisor: 'Grace Okafor', site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Clark Emma',   status: 'Imported',  updAgo: 40, time: '04:41 pm' },
    { id: 'TS-1046', ago: 33, supervisor: 'Grace Okafor', site: 'SA BHP OLYMPIC DAM', project: 'Olympic Dam Expansion', worker: 'Baker Liam',   status: 'Revised',   updAgo: 32, time: '11:52 am' },
    { id: 'TS-1047', ago: 26, supervisor: 'Olivia Rhye',    site: 'MMA VIGILANT – 360', project: 'Shutdown Factory XYZ',  worker: 'Brown Olivia', status: 'Finalised', updAgo: 25, time: '08:20 am' },
    { id: 'TS-1048', ago: 19, supervisor: 'Priya Nair',   site: 'SA BHP OLYMPIC DAM', project: 'Olympic Dam Expansion', worker: 'Clark Olivia', status: 'Created',   updAgo: 19, time: '02:07 pm' },
    { id: 'TS-1049', ago: 12, supervisor: 'Tom Halloran', site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Hill Allison', status: 'Submitted', updAgo: 11, time: '10:33 am' },
    { id: 'TS-1050', ago: 6 , supervisor: 'Olivia Rhye',    site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Davis Noah',   status: 'Exported',  updAgo: 5 , time: '03:55 pm' },
    { id: 'TS-1051', ago: 4 , supervisor: 'Grace Okafor', site: 'SA BHP OLYMPIC DAM', project: 'Shutdown Factory XYZ',  worker: 'Smith John',   status: 'Updated',   updAgo: 4 , time: '09:02 am' },
    { id: 'TS-1052', ago: 2 , supervisor: 'Priya Nair',   site: 'MMA VIGILANT ROV',   project: 'ROV Mobilisation',      worker: 'Miller Ava',   status: 'Revised',   updAgo: 1 , time: '01:18 pm' },
    { id: 'TS-1053', ago: 0 , supervisor: 'Tom Halloran', site: 'MMA VIGILANT – 360', project: 'Vigilant 360 Refit',    worker: 'Baker Liam',   status: 'Finalised', updAgo: 0 , time: '07:45 am' },
    { id: 'TS-1054', ago: 0 , supervisor: 'Olivia Rhye',    site: 'SA BHP OLYMPIC DAM', project: 'Olympic Dam Expansion', worker: 'Hill Allison', status: 'Imported',  updAgo: 0 , time: '12:30 pm' }
  ];

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var FULL_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function fmtDate(iso) {
    var p = iso.split('-');
    return String(Number(p[2])) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }

  /* ─── Dates ────────────────────────────────────────────────────────
     The mock timesheets carry day offsets, not fixed dates, and are rebased
     onto today at load. A hardcoded dataset would age out of "Last 7 days"
     and leave the default view empty a week after this was written. */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function toIso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseIso(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

  var TODAY = new Date();
  TODAY.setHours(0, 0, 0, 0);

  function daysAgoIso(n) {
    var d = new Date(TODAY.getTime());
    d.setDate(d.getDate() - n);
    return toIso(d);
  }

  TIMESHEETS.forEach(function (t) {
    t.issued  = daysAgoIso(t.ago);
    t.updated = daysAgoIso(t.updAgo);
  });

  /* "12 Aug – 20 Aug 2025", collapsing the year when both ends share it. */
  function fmtRange(from, to) {
    if (from === to) return fmtDate(from);
    var a = fmtDate(from), b = fmtDate(to);
    if (from.slice(0, 4) === to.slice(0, 4)) a = a.slice(0, a.lastIndexOf(' '));
    return a + ' – ' + b;
  }

  /* ─── State ───────────────────────────────────────────────────────── */
  var state = { query: '', range: 'last7', from: null, to: null, supervisor: 'all', group: 'none', mode: 'list' };

  /* Columns the user has switched off. Position and Work Type ship hidden. */
  var hiddenCols = { position: true, worktype: true, project: true };
  /* The frozen columns anchor the table, so they can't be switched off. */
  var LOCKED_COLS = ['chk', 'group', 'issued', 'site', 'super', 'hrs', 'act'];
  var selected = Object.create(null);
  /* Rows start collapsed, so an unrecorded key counts as collapsed and
     only an explicit false means a row has been opened. */
  var collapsed = Object.create(null);
  /* A search opens the rows it matches inside. That lives in its own map, so
     clearing the search puts the manual open/closed state back as it was. */
  var searchCollapsed = Object.create(null);
  function isCollapsed_(key) {
    if (state.query) return searchCollapsed[key] === true;
    return collapsed[key] !== false;
  }
  function setCollapsed_(key, v) {
    if (state.query) searchCollapsed[key] = v; else collapsed[key] = v;
  }
  /* Column widths the user has dragged, keyed by tab so the same column can
     be sized differently where it carries different content. */
  var colWidths = Object.create(null);
  var MIN_COL_W = 64;
  var currentCols = [], currentAllCols = [];
  /* Child rows are built on demand: a timesheet can carry hundreds of entries,
     and rendering every one of them for a collapsed row costs the same as
     rendering the whole table. Key -> function returning that row's <tr>s. */
  var childHtml = Object.create(null);

  var openKeys = [];       // what the Expand all button acts on, set during render
  var renderedKeys = [];   // parent rows the current render actually emitted
  var renderedSheets = Object.create(null);   // timesheet ids the render touched
  var shownIds = [];       // timesheet ids on screen, for select-all

  var tbody     = document.getElementById('tbody');
  var empty     = document.getElementById('empty');
  var emptySub  = document.getElementById('empty-sub');
  var mainTable    = document.querySelector('.table-card table');
  var mainColgroup = document.getElementById('main-colgroup');
  var mainThead    = document.getElementById('main-thead');
  function chkAll() { return document.getElementById('chk-all'); }
  var selBar    = document.getElementById('sel-bar');
  var selCount  = document.getElementById('sel-count');
  var toolbar   = document.getElementById('toolbar');
  var searchEl  = document.getElementById('search');
  var clearBtn  = document.getElementById('search-clear');

  var CHECK = '<svg class="dd-check" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ─── Supervisor filter ───────────────────────────────────────────── */
  /* The signed-in account in the shell — what "Me" resolves to. */
  var CURRENT_USER = 'Olivia Rhye';

  var superPanel = document.getElementById('super-dd-panel');
  var superValue = document.getElementById('super-dd-value');

  var supervisors = [];
  TIMESHEETS.forEach(function (t) {
    if (t.supervisor === CURRENT_USER) return;      // covered by the Me option
    if (supervisors.indexOf(t.supervisor) === -1) supervisors.push(t.supervisor);
  });
  supervisors.sort();

  superPanel.innerHTML =
    '<button class="dd-item active" type="button" data-super="all">' + CHECK + 'All supervisors</button>' +
    '<button class="dd-item" type="button" data-super="me">' + CHECK + 'Me (' + Shell.esc(CURRENT_USER) + ')</button>' +
    '<hr class="dd-divider" />' +
    supervisors.map(function (n) {
      return '<button class="dd-item" type="button" data-super="' + Shell.esc(n) + '">' + CHECK + Shell.esc(n) + '</button>';
    }).join('');

  superPanel.addEventListener('click', function (e) {
    var item = e.target.closest('.dd-item');
    if (!item) return;
    state.supervisor = item.getAttribute('data-super');
    superPanel.querySelectorAll('.dd-item').forEach(function (i) { i.classList.remove('active'); });
    item.classList.add('active');
    superValue.textContent = state.supervisor === 'all' ? 'All'
      : state.supervisor === 'me' ? 'Me' : state.supervisor;
    Shell.closeAllDropdowns();
    render();
  });

  /* ─── Date filter: quick ranges + a custom range calendar ─────────── */
  var datePanel = document.getElementById('date-dd-panel');
  var dateValue = document.getElementById('date-dd-value');
  var dateTrigger = document.querySelector('#date-dd .dd-trigger');

  var QUICK = [
    { k: 'today', label: 'Today' },
    { k: 'last7', label: 'Last 7 days' },
    { k: 'month', label: 'Last month' }
  ];
  var CHEV = '<svg class="dd-chev" viewBox="0 0 12 12" fill="none"><path d="M4.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  datePanel.innerHTML =
    '<div class="dd-view" id="date-quick">' +
      QUICK.map(function (r) {
        return '<button class="dd-item' + (r.k === state.range ? ' active' : '') + '" type="button" data-range="' + r.k + '">' +
          CHECK + r.label + '</button>';
      }).join('') +
      '<button class="dd-item" type="button" data-range="custom">' + CHECK + 'Custom' + CHEV + '</button>' +
      '<hr class="dd-divider" />' +
      '<button class="dd-item" type="button" data-range="all">' + CHECK + 'All time</button>' +
    '</div>' +
    '<div class="cal" id="date-cal"></div>';

  function markRange(k) {
    datePanel.querySelectorAll('#date-quick .dd-item').forEach(function (i) {
      i.classList.toggle('active', i.getAttribute('data-range') === k);
    });
  }
  function syncDateLabel() {
    if (state.range === 'custom') { dateValue.textContent = fmtRange(state.from, state.to); return; }
    if (state.range === 'all')    { dateValue.textContent = 'All time'; return; }
    dateValue.textContent = QUICK.filter(function (r) { return r.k === state.range; })[0].label;
  }

  /* The date window every filter reads. null means no date limit. */
  function rangeBounds() {
    if (state.range === 'today')  return { from: daysAgoIso(0),  to: daysAgoIso(0) };
    if (state.range === 'last7')  return { from: daysAgoIso(6),  to: daysAgoIso(0) };
    if (state.range === 'month')  return { from: daysAgoIso(29), to: daysAgoIso(0) };
    if (state.range === 'custom') return { from: state.from, to: state.to };
    return null;
  }

  /* ─── Custom range calendar (two months, MUI date-range style) ─────── */
  var DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var calAnchor = null;                    // first day of the left-hand month
  var pick = { from: null, to: null };     // in-progress selection
  var hoverIso = null;

  var ARROW = '<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function openCalendar() {
    var base = (state.range === 'custom' && state.from) ? parseIso(state.from) : new Date(TODAY.getTime());
    /* Show the previous month alongside the current one — most of the
       records being picked over are in the past. */
    calAnchor = new Date(base.getFullYear(), base.getMonth() - 1, 1);
    pick = state.range === 'custom' ? { from: state.from, to: state.to } : { from: null, to: null };
    hoverIso = null;
    datePanel.classList.add('cal-mode');
    renderCal();
  }

  function monthGrid(y, m) {
    var lead = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var lo = pick.from;
    var hi = pick.to || (lo && hoverIso && hoverIso > lo ? hoverIso : null);
    var today = daysAgoIso(0);
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell"></div>';
    for (var d = 1; d <= days; d++) {
      var iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var isStart = !!lo && iso === lo;
      var isEnd   = !!hi && iso === hi;
      var cls = 'cal-cell';
      if (lo && hi && iso >= lo && iso <= hi) cls += ' in';
      if (isStart) cls += ' start';
      if (isEnd)   cls += ' end';
      if (isStart || isEnd) cls += ' sel';
      cells += '<div class="' + cls + '"><button class="cal-day' + (iso === today ? ' today' : '') +
        '" type="button" data-iso="' + iso + '">' + d + '</button></div>';
    }
    return '<div class="cal-month">' +
      '<div class="cal-dow">' + DOW.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
    '</div>';
  }

  function renderCal() {
    var y = calAnchor.getFullYear(), m = calAnchor.getMonth();
    var right = new Date(y, m + 1, 1);
    var hint = !pick.from ? 'Select start date'
             : !pick.to   ? 'Select end date'
             : fmtRange(pick.from, pick.to);
    document.getElementById('date-cal').innerHTML =
      '<div class="cal-head">' +
        '<button class="cal-nav" type="button" data-nav="-1" aria-label="Previous month">' + ARROW + '</button>' +
        '<div class="cal-title">' + FULL_MONTHS[m] + ' ' + y + '</div>' +
        '<div class="cal-title">' + FULL_MONTHS[right.getMonth()] + ' ' + right.getFullYear() + '</div>' +
        '<button class="cal-nav next" type="button" data-nav="1" aria-label="Next month">' + ARROW + '</button>' +
      '</div>' +
      '<div class="cal-months">' + monthGrid(y, m) + monthGrid(right.getFullYear(), right.getMonth()) + '</div>' +
      '<div class="cal-foot">' + hint + '</div>';
  }

  function pickDay(iso) {
    if (!pick.from || pick.to) { pick = { from: iso, to: null }; hoverIso = null; renderCal(); return; }
    if (iso < pick.from) { pick.from = iso; renderCal(); return; }
    pick.to = iso;
    state.range = 'custom'; state.from = pick.from; state.to = pick.to;
    markRange('custom');
    syncDateLabel();
    Shell.closeAllDropdowns();
    render();
  }

  /* The panel lives inside the document-level "click closes dropdowns"
     handler, so calendar clicks have to be kept from bubbling to it. */
  datePanel.addEventListener('click', function (e) { e.stopPropagation(); });
  datePanel.addEventListener('click', function (e) {
    var item = e.target.closest('.dd-item');
    if (item) {
      var k = item.getAttribute('data-range');
      if (k === 'custom') { openCalendar(); return; }
      state.range = k;
      markRange(k);
      syncDateLabel();
      Shell.closeAllDropdowns();
      render();
      return;
    }
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + Number(nav.getAttribute('data-nav')), 1);
      renderCal();
      return;
    }
    var day = e.target.closest('.cal-day');
    if (day) pickDay(day.getAttribute('data-iso'));
  });

  datePanel.addEventListener('mouseover', function (e) {
    var day = e.target.closest('.cal-day');
    if (!day || !pick.from || pick.to) return;
    var iso = day.getAttribute('data-iso');
    if (iso === hoverIso) return;
    hoverIso = iso;
    renderCal();
  });

  // Reopening the dropdown always lands back on the quick list.
  dateTrigger.addEventListener('click', function () { datePanel.classList.remove('cal-mode'); });

  syncDateLabel();

  /* ─── Filtering + grouping ────────────────────────────────────────── */
  /* Date and supervisor narrow the set of timesheets. The search runs later,
     per row, because what it covers depends on the tab and on which columns
     are switched on. */
  function matches(t) {
    var b = rangeBounds();
    if (b && (t.issued < b.from || t.issued > b.to)) return false;
    if (state.supervisor === 'me') return t.supervisor === CURRENT_USER;
    return state.supervisor === 'all' || t.supervisor === state.supervisor;
  }

  /* ─── Search ──────────────────────────────────────────────────────────
     Only what is on screen is searchable: switch Position off in the Columns
     picker and its values stop matching — the same rule as the Documents and
     Expense Claims screens. Checkbox, actions and the derived Hours figures
     carry no text of their own and stay out of it. */
  var SEARCH_SKIP = { chk: true, act: true, hrs: true };

  function visibleKeys() {
    var vis = Object.create(null);
    columnsFor(state.group).forEach(function (c) {
      if (!hiddenCols[c.k] && !SEARCH_SKIP[c.k]) vis[c.k] = true;
    });
    return vis;
  }

  function hitsQuery(values, vis) {
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    return Object.keys(values).some(function (k) {
      return vis[k] && values[k] && String(values[k]).toLowerCase().indexOf(q) !== -1;
    });
  }

  /* The columns a timesheet owns — the ones its parent row carries. */
  function sheetValues(t) {
    return { issued: fmtDate(t.issued), site: t.site, super: t.supervisor,
             status: t.status, updated: fmtDate(t.updated) + ' ' + t.time };
  }

  /* withSheet says whether this row repeats the timesheet's own columns:
     jobs nested under a timesheet don't (those values sit on the parent),
     jobs on the Worker and No Grouping tabs do. */
  function jobValues(t, w, a, fields, withSheet) {
    var v = { worker: w.worker, position: w.position, worktype: w.workType,
              project: a.project, task: taskPath(a, fields),
              allow: allowText(a), times: timesText(a) };
    if (withSheet) {
      v.issued = fmtDate(t.issued);
      v.site = t.site;
      v.super = t.supervisor;
      v.status = t.status;
      v.updated = fmtDate(t.updated) + ' ' + t.time;
    }
    return v;
  }

  function groupKeyOf(t) {
    if (state.group === 'project') return t.project;
    return null;
  }

  /* Worker grouping expands each timesheet into one row per worker inside it,
     so a timesheet appears under every worker it actually contains. */
  function workerIndex(rows) {
    var order = [], buckets = Object.create(null);
    rows.forEach(function (t) {
      workersFor(t).forEach(function (w) {
        if (!buckets[w.worker]) { buckets[w.worker] = []; order.push(w.worker); }
        buckets[w.worker].push({ ts: t, rec: w });
      });
    });
    order.sort();
    return { order: order, buckets: buckets };
  }

  /* Hours booked against one project within one timesheet. */
  function projectHours(t, project) {
    var sum = 0;
    workersFor(t).forEach(function (w) {
      w.assignments.forEach(function (a) {
        if (a.project === project) sum += Number(a.hours) || 0;
      });
    });
    return sum;
  }

  /* Same idea as workerIndex: a timesheet's jobs can span projects, so it
     belongs under every project it actually references, not just its lead. */
  function projectIndex(rows) {
    var order = [], buckets = Object.create(null);
    rows.forEach(function (t) {
      var seen = Object.create(null);
      workersFor(t).forEach(function (w) {
        w.assignments.forEach(function (a) { seen[a.project] = true; });
      });
      Object.keys(seen).forEach(function (proj) {
        if (!buckets[proj]) { buckets[proj] = []; order.push(proj); }
        buckets[proj].push({ ts: t, hours: projectHours(t, proj) });
      });
    });
    order.sort();
    return { order: order, buckets: buckets };
  }

  /* ─── Columns ─────────────────────────────────────────────────────────
     Worker and Project grouping add a leading column naming the group, so
     that with every group collapsed the header still describes what is on
     screen. Timesheet grouping has no parent rows and so no such column. */
  function columnsFor(group) {
    /* No Grouping is the full base: one row per job, every timesheet field
       repeated on it. No checkbox — a row here is a job, and the bulk
       actions act on whole timesheets. */
    if (group === 'flat') {
      return [
        // Sized to fit their content: this table scrolls sideways by nature,
        // and clipped values are worse than a scrollbar.
        { k: 'chk',     w: 44,  label: '' },
        { k: 'issued',  w: 120, label: 'Date' },
        { k: 'site',    w: 195, label: 'Site' },
        { k: 'super',   w: 180, label: 'Supervisor / Group' },

      { k: 'issued',  w: 120, label: 'Issue Date' },
