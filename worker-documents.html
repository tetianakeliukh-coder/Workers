<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Documents — James Hetfield — OPMS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style>
  /* ─── Worker documents ──────────────────────────────────────────────
     A single worker's document list. The worker page itself doesn't exist
     yet, so the breadcrumb carries the hierarchy on its own. */

  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; }
  .crumbs a { color: var(--grey-700); text-decoration: none; }
  .crumbs a:hover { color: var(--primary); text-decoration: underline; }
  .crumbs .sep { color: var(--grey-400); display: flex; }
  .crumbs .current { color: var(--text-main); font-weight: 500; }

  .doc-title {
    font-family: var(--fs-roboto); font-weight: 700; font-size: 28px;
    line-height: 34px; letter-spacing: 0.2px; color: var(--black);
  }

  .doc-search { width: 215px; }
  .doc-search .search-bar { height: 36px; }

  /* ─── Tabs ─────────────────────────────────────────────────────── */
  .tabs { display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--grey-300); }
  .tab {
    position: relative; background: none; border: none; cursor: pointer;
    font-family: var(--fs-sans); font-size: 14px; line-height: 18px; font-weight: 400;
    color: var(--grey-700); padding: 10px 2px 12px; white-space: nowrap;
  }
  .tab:hover { color: var(--text-main); }
  .tab.active { color: var(--primary); font-weight: 500; }
  .tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--primary); border-radius: 1px;
  }

  .doc-section { display: flex; flex-direction: column; gap: 12px; }
  .doc-section + .doc-section { margin-top: 20px; }
  .section-title {
    font-size: 16px; line-height: 22px; font-weight: 600; color: var(--text-main);
  }

  /* ─── Table ────────────────────────────────────────────────────── */
  .doc-table { min-width: 1420px; }
  .doc-table th, .doc-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-table td { color: var(--text-main); }
  .doc-table td.muted { color: var(--grey-700); }
  .doc-table th.col-act, .doc-table td.col-act { text-align: right; }

  /* The rows needing attention carry a warm wash rather than a status chip. */
  #outstanding tbody tr { background: var(--white); }
  #outstanding tbody tr.flagged, .doc-card tbody tr.flagged { background: #fff7ec; }
  .doc-card tbody tr:hover { background: #fafbfe; }
  .doc-card tbody tr.flagged:hover { background: #fdf1e0; }

  .you-chip {
    display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
    margin-left: 6px; border-radius: 4px; background: #5577ff;
    font-size: 11px; font-weight: 500; line-height: 18px; color: var(--white);
    vertical-align: 1px;
  }

  .reason { display: inline-flex; align-items: center; gap: 8px; color: var(--grey-700); }
  .reason svg { flex-shrink: 0; color: var(--grey-700); }
  .reason .note { color: #e88f1a; }
  .reason .sent { color: #17b26a; }

  .row-actions { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .row-actions .btn-text { font-size: 14px; }

  .cell-empty { color: var(--grey-400); }

  /* ─── Tabs with nothing designed behind them yet ───────────────── */
  .tab-panel { display: none; }
  .tab-panel.visible { display: block; }
  .panel-empty {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 72px 24px; border: 1px solid var(--grey-350); border-radius: 12px;
    background: var(--white); text-align: center;
  }
  .panel-empty .t { font-size: 16px; font-weight: 600; color: var(--text-main); }
  .panel-empty .s { font-size: 14px; color: var(--grey-600); }
  /* ─── Create link popup ────────────────────────────────────────── */
  .modal.link-modal { max-width: 560px; width: 100%; }
  .link-modal .modal-body { padding: 20px 24px 4px; display: flex; flex-direction: column; gap: 18px; }
  .link-intro { font-size: 14px; line-height: 20px; color: var(--grey-700); margin: 0; }
  .link-intro b { color: var(--text-main); font-weight: 500; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 14px; font-weight: 500; line-height: 18px; color: var(--text-main); }
  .field-label .req { color: var(--error); margin-left: 2px; }
  .field-input, .field-area {
    width: 100%; font-family: var(--fs-sans); font-size: 14px; line-height: 20px;
    color: var(--text-main); background: var(--white);
    border: 1px solid var(--grey-350); border-radius: 8px; padding: 9px 12px;
    transition: border-color var(--t-fast);
  }
  .field-input:focus, .field-area:focus { outline: none; border-color: var(--primary); }
  .field-area { min-height: 132px; resize: vertical; }
  .field-foot { display: flex; align-items: center; gap: 12px; min-height: 16px; }
  .field-error { font-size: 12px; line-height: 16px; color: var(--error); display: none; }
  .field.invalid .field-input, .field.invalid .field-area { border-color: var(--error); }
  .field.invalid .field-error { display: block; }
  .char-count { margin-left: auto; font-size: 12px; color: var(--grey-600); font-variant-numeric: tabular-nums; }

  /* ─── Date field + single-month picker ─────────────────────────── */
  .date-field { position: relative; }
  .date-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; height: 40px; padding: 0 12px; cursor: pointer;
    background: var(--white); border: 1px solid var(--grey-350); border-radius: 8px;
    font-family: var(--fs-sans); font-size: 14px; color: var(--text-main); text-align: left;
  }
  .date-trigger:hover { border-color: var(--border-hover); }
  .date-trigger.open { border-color: var(--primary); }
  .date-trigger svg { color: var(--grey-600); flex-shrink: 0; }

  .cal-pop {
    display: none; position: absolute; z-index: 20; bottom: calc(100% + 6px); left: 0;
    width: 300px; padding: 8px; background: var(--white);
    border: 1px solid var(--grey-350); border-radius: 10px; box-shadow: var(--shadow-dropdown);
  }
  .cal-pop.open { display: block; }
  .cal-head { display: flex; align-items: center; padding: 2px 4px 8px; }
  .cal-nav {
    width: 30px; height: 30px; flex-shrink: 0; border: none; border-radius: 50%;
    background: none; cursor: pointer; color: var(--grey-700);
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav:hover:not(:disabled) { background: var(--grey-200); }
  .cal-nav:disabled { color: var(--grey-350); cursor: default; }
  .cal-title { flex: 1; text-align: center; font-size: 14px; font-weight: 500; color: var(--text-main); }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow span { height: 26px; line-height: 26px; text-align: center; font-size: 11px; color: var(--grey-600); }
  .cal-cell { height: 36px; display: flex; align-items: center; justify-content: center; }
  .cal-day {
    width: 32px; height: 32px; border: none; border-radius: 50%; background: none;
    font-family: var(--fs-sans); font-size: 13px; color: var(--text-main); cursor: pointer;
  }
  .cal-day:hover:not(:disabled) { background: var(--grey-200); }
  .cal-day:disabled { color: var(--grey-400); cursor: default; }
  .cal-day.sel { background: var(--primary); color: var(--white); font-weight: 500; }
  .cal-foot {
    margin-top: 6px; padding: 8px 8px 2px; border-top: 1px solid var(--grey-300);
    font-size: 12px; color: var(--grey-600);
  }

  .link-modal .modal-footer { padding: 16px 24px 20px; }
  .link-modal .modal-footer-actions { gap: 12px; }
  .btn-primary:disabled { background: var(--grey-350); cursor: default; }
  .btn-primary:disabled:hover { background: var(--grey-350); }
</style>
</head>
<body data-module="workers">

<div class="page">
  <aside id="shell-sidebar"></aside>

  <main class="main">
    <div class="content">

      <nav class="crumbs" aria-label="Breadcrumb">
        <a id="bc-workers" href="workers/index.html">Workers</a>
        <span class="sep" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <a href="#" id="bc-worker">James Hetfield</a>
        <span class="sep" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="current" aria-current="page">Documents</span>
      </nav>

      <h1 class="doc-title">Documents</h1>

      <div class="doc-search search-wrap">
        <label class="search-bar">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input class="search-input-el" id="search" type="text" placeholder="Search" autocomplete="off" />
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </label>
      </div>

      <div class="tabs" id="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" data-tab="outstanding">Outstanding Docs</button>
        <button class="tab" type="button" role="tab" data-tab="completed">Completed</button>
        <button class="tab" type="button" role="tab" data-tab="archived">Archived</button>
      </div>

      <div class="tab-panel visible" id="panel-outstanding"></div>

      <div class="tab-panel" id="panel-completed">
        <div class="panel-empty">
          <span class="t">Completed documents</span>
          <span class="s">This tab hasn't been designed yet.</span>
        </div>
      </div>

      <div class="tab-panel" id="panel-archived">
        <div class="panel-empty">
          <span class="t">Archived documents</span>
          <span class="s">This tab hasn't been designed yet.</span>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- ── Create Link for External User ─────────────────────────────── -->
<div class="modal-backdrop" id="link-modal" role="dialog" aria-modal="true" aria-labelledby="link-modal-title">
  <div class="modal link-modal">
    <div class="modal-header">
      <div class="modal-heading">
        <span class="modal-title" id="link-modal-title">Create Link for External User</span>
      </div>
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <p class="link-intro" id="link-intro"></p>

      <div class="field" id="field-recipient">
        <label class="field-label" for="link-recipient">Recipient<span class="req">*</span></label>
        <input class="field-input" id="link-recipient" type="email" autocomplete="off"
               placeholder="name@company.com" />
        <div class="field-foot">
          <span class="field-error" id="recipient-error">Enter a valid email address.</span>
        </div>
      </div>

      <div class="field" id="field-message">
        <label class="field-label" for="link-message">Message<span class="req">*</span></label>
        <textarea class="field-area" id="link-message" maxlength="2000"></textarea>
        <div class="field-foot">
          <span class="field-error" id="message-error">A message is required.</span>
          <span class="char-count" id="message-count">0/2000</span>
        </div>
      </div>

      <div class="field date-field" id="field-valid">
        <label class="field-label" for="link-valid">Link is valid until<span class="req">*</span></label>
        <button class="date-trigger" id="link-valid" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span id="link-valid-value"></span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5.5 2v3M10.5 2v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <div class="cal-pop" id="link-cal" role="dialog" aria-label="Choose a date"></div>
        <div class="field-foot">
          <span class="field-error" id="valid-error">Choose a future date.</span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <div class="modal-footer-actions">
        <button class="btn-ghost" type="button" data-close>Cancel</button>
        <button class="btn-primary" type="button" id="link-send">Send Link</button>
      </div>
    </div>
  </div>
</div>


<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  /* ─── Icons for the Outstanding Reason column ─────────────────────── */
  var S = 'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"';
  function icon(paths, cls) {
    return '<svg class="' + (cls || '') + '" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' + paths + '</svg>';
  }
  var ICONS = {
    rejected:   icon('<circle cx="6.5" cy="5" r="2.5" ' + S + '/><path d="M2 13.5c0-2.2 2-4 4.5-4" ' + S + '/><path d="M10.5 9.5l3.5 3.5M14 9.5l-3.5 3.5" ' + S + '/>'),
    review:     icon('<circle cx="6.5" cy="5" r="2.5" ' + S + '/><path d="M2 13.5c0-2.2 2-4 4.5-4" ' + S + '/><circle cx="11.5" cy="11" r="2.5" ' + S + '/><path d="M13.4 12.9L15 14.5" ' + S + '/>'),
    upload:     icon('<path d="M3.5 2h5L12.5 6v8h-9V2z" ' + S + '/><path d="M8 11.5V7.5M6.2 9.3L8 7.5l1.8 1.8" ' + S + '/>'),
    link:       icon('<path d="M6.5 9.5a2.8 2.8 0 0 0 4 0l2-2a2.8 2.8 0 0 0-4-4l-.8.8" ' + S + '/><path d="M9.5 6.5a2.8 2.8 0 0 0-4 0l-2 2a2.8 2.8 0 0 0 4 4l.8-.8" ' + S + '/>'),
    expiring:   icon('<circle cx="8" cy="8.5" r="5.5" ' + S + '/><path d="M8 5.5v3.3l2.2 1.4" ' + S + '/>'),
    expired:    icon('<path d="M3.5 2h5L12.5 6v8h-9V2z" ' + S + '/><path d="M6.3 8.3l3.4 3.4M9.7 8.3l-3.4 3.4" ' + S + '/>'),
    note:       icon('<path d="M13.5 8.5a5 5 0 0 1-7.2 4.5L3 14l1.1-3.2A5 5 0 1 1 13.5 8.5z" ' + S + '/><circle cx="12.8" cy="3.6" r="2.2" fill="currentColor"/>', 'note'),
    sent:       icon('<rect x="2" y="3.5" width="12" height="9" rx="1.5" ' + S + '/><path d="M2.5 4.5L8 8.5l5.5-4" ' + S + '/>', 'sent')
  };

  var REASONS = {
    'Rejected':       ICONS.rejected,
    'Pending Review': ICONS.review,
    'Pending Upload': ICONS.upload,
    'Complete Form':  ICONS.link,
    'About to Expire': ICONS.expiring,
    'Expired':        ICONS.expired
  };

  /* ─── Mock data ───────────────────────────────────────────────────
     James Hetfield's documents, as drawn. "flag" is the warm row wash;
     "note" is the rejection comment, "sent" the form already emailed. */
  var MANDATORY = 'Mandatory, Legal, Development';

  var OUTSTANDING = [
    { doc: 'Drivers licence',     sub: 'Sub-type', expiry: '1 May 2025', level: MANDATORY,     who: 'J. Sith', you: true,  type: 'Workflow',     reason: 'Rejected',        note: true, action: 'Review',        flag: true },
    { doc: 'Drivers licence',     sub: 'Sub-type', expiry: '3 May 2025', level: 'Mandatory',   who: 'J. Sith', you: true,  type: 'Workflow',     reason: 'Pending Review',              action: 'Review',        flag: true },
    { doc: 'Passport',            sub: 'Sub-type', expiry: '7 May 2025', level: 'Legal',       who: 'E. Stone',            type: 'Upload',       reason: 'Pending Upload',              action: 'Upload' },
    { doc: 'Passport',            sub: 'Sub-type', expiry: '1 May 2025', level: 'Development', who: 'E. Stone',            type: 'External URL', reason: 'Complete Form',               action: 'Complete Form' },
    { doc: 'Passport',            sub: 'Sub-type', expiry: '1 May 2025', level: MANDATORY,     who: 'E. Stone',            type: 'Upload',       reason: 'About to Expire',             action: 'Review' },
    { doc: 'Employer Feedback 1', sub: 'Sub-type', expiry: '',           level: 'HR',          who: 'E. Stone',            type: 'External URL', reason: 'Complete Form',               action: 'Send Link' },
    { doc: 'Employer Feedback 2', sub: 'Sub-type', expiry: '',           level: 'HR',          who: 'E. Stone',            type: 'External URL', reason: 'Complete Form',  sent: true,  action: 'Review' },
    { doc: 'HWRL',                sub: 'Sub-type', expiry: '1 May 2025', level: MANDATORY,     who: '',                    type: 'Upload',       reason: 'Expired',                     action: 'Upload' }
  ];

  var NON_OUTSTANDING = [
    { doc: 'Drivers licence', sub: 'Sub-type', expiry: '1 May 2025',  level: MANDATORY, who: 'J. Sith', you: true, type: 'Workflow',     reason: 'Rejected',       note: true, action: 'Review', flag: true },
    { doc: 'Passport',        sub: 'Sub-type', expiry: '12 May 2025', level: 'Legal',   who: 'E. Stone',           type: 'Upload',       reason: 'Pending Upload',             action: 'Upload' },
    { doc: 'HWRL',            sub: 'Sub-type', expiry: '',            level: 'HR',      who: 'E. Stone',           type: 'External URL', reason: 'Complete Form',              action: 'Send Link' }
  ];

  var COLS = [
    { k: 'doc',     w: 230, label: 'Document Type' },
    { k: 'sub',     w: 200, label: 'Document Sub-Type' },
    { k: 'expiry',  w: 140, label: 'Expiry Date' },
    { k: 'level',   w: 215, label: 'Level' },
    { k: 'who',     w: 160, label: 'Assigned to' },
    { k: 'type',    w: 150, label: 'Type' },
    { k: 'reason',  w: 235, label: 'Outstanding Reason' },
    { k: 'act',     w: 170, label: 'Actions' }
  ];

  var state = { query: '' };
  var panel = document.getElementById('panel-outstanding');

  function cell(v, q) {
    return v ? Shell.highlight(v, q) : '<span class="cell-empty">&ndash;</span>';
  }

  function rowHtml(r, q) {
    var reason = (REASONS[r.reason] || '') + '<span>' + Shell.highlight(r.reason, q) + '</span>' +
      (r.note ? ICONS.note : '') + (r.sent ? ICONS.sent : '');
    return '<tr class="' + (r.flag ? 'flagged' : '') + '">' +
      '<td class="col-doc">' + Shell.highlight(r.doc, q) + '</td>' +
      '<td class="col-sub muted">' + cell(r.sub, q) + '</td>' +
      '<td class="col-expiry">' + cell(r.expiry, q) + '</td>' +
      '<td class="col-level" title="' + Shell.esc(r.level) + '">' + cell(r.level, q) + '</td>' +
      '<td class="col-who">' + (r.who ? Shell.highlight(r.who, q) : '<span class="cell-empty">&ndash;</span>') +
        (r.you ? '<span class="you-chip">You</span>' : '') + '</td>' +
      '<td class="col-type">' + cell(r.type, q) + '</td>' +
      '<td class="col-reason"><span class="reason">' + reason + '</span></td>' +
      '<td class="col-act"><span class="row-actions">' +
        '<button class="btn-text" type="button" data-action="' + Shell.esc(r.action) + '" data-doc="' + Shell.esc(r.doc) + '">' + r.action + '</button>' +
        '<button class="kebab" type="button" data-kebab="' + Shell.esc(r.doc) + '" aria-label="More actions">' +
          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg>' +
        '</button>' +
      '</span></td>' +
    '</tr>';
  }

  function matches(r, q) {
    if (!q) return true;
    var hay = [r.doc, r.sub, r.expiry, r.level, r.who, r.type, r.reason];
    return hay.some(function (v) { return v && v.toLowerCase().indexOf(q) !== -1; });
  }

  function tableHtml(rows, q) {
    return '<div class="table-card"><div class="table-scroll"><table class="doc-table">' +
      '<colgroup>' + COLS.map(function (c) { return '<col class="col-' + c.k + '" style="width:' + c.w + 'px" />'; }).join('') + '</colgroup>' +
      '<thead><tr>' + COLS.map(function (c) { return '<th class="col-' + c.k + '">' + c.label + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + rows.map(function (r) { return rowHtml(r, q); }).join('') + '</tbody>' +
    '</table></div></div>';
  }

  function sectionHtml(title, rows, q, id) {
    if (!rows.length) return '';
    return '<div class="doc-section" id="' + id + '">' +
      '<div class="section-title">' + title + ' (' + rows.length + ')</div>' +
      tableHtml(rows, q) +
    '</div>';
  }

  function render() {
    var q = state.query.toLowerCase();
    var a = OUTSTANDING.filter(function (r) { return matches(r, q); });
    var b = NON_OUTSTANDING.filter(function (r) { return matches(r, q); });

    if (!a.length && !b.length) {
      panel.innerHTML = '<div class="panel-empty">' +
        '<span class="t">No documents found</span>' +
        '<span class="s">Nothing matches &ldquo;' + Shell.esc(state.query) + '&rdquo;.</span></div>';
      return;
    }
    panel.innerHTML =
      sectionHtml('Outstanding Pending Docs', a, state.query, 'outstanding') +
      sectionHtml('Non &ndash; outstanding Pending Docs', b, state.query, 'non-outstanding');
  }

  /* ─── Search ──────────────────────────────────────────────────────── */
  var searchEl = document.getElementById('search');
  var clearBtn = document.getElementById('search-clear');
  searchEl.addEventListener('input', function () {
    state.query = this.value.trim();
    clearBtn.classList.toggle('visible', this.value.length > 0);
    render();
  });
  clearBtn.addEventListener('click', function () {
    searchEl.value = '';
    state.query = '';
    clearBtn.classList.remove('visible');
    searchEl.focus();
    render();
  });

  /* ─── Tabs ────────────────────────────────────────────────────────── */
  document.getElementById('tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    this.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    var key = tab.getAttribute('data-tab');
    document.querySelectorAll('.tab-panel').forEach(function (p) {
      p.classList.toggle('visible', p.id === 'panel-' + key);
    });
  });

  /* ─── Row actions ─────────────────────────────────────────────────
     Send Link opens the create-link popup; the rest aren't designed yet. */
  panel.addEventListener('click', function (e) {
    var act = e.target.closest('[data-action]');
    if (act) {
      var action = act.getAttribute('data-action');
      if (action === 'Send Link') { openLinkModal(act.getAttribute('data-doc')); return; }
      Shell.snackbar(action + ' — flow not designed yet.');
      return;
    }
    var kebab = e.target.closest('[data-kebab]');
    if (kebab) { Shell.snackbar('Row actions for ' + kebab.getAttribute('data-kebab') + ' — menu not designed yet.'); }
  });

  /* ─── Create Link for External User ───────────────────────────────
     POST /training/external_links always succeeds here. The failure path
     is built — flip FORCE_ERROR to demo it. */
  var FORCE_ERROR = false;
  var WORKER = 'James Hetfield';
  var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var modal      = document.getElementById('link-modal');
  var introEl    = document.getElementById('link-intro');
  var recipient  = document.getElementById('link-recipient');
  var message    = document.getElementById('link-message');
  var msgCount   = document.getElementById('message-count');
  var validBtn   = document.getElementById('link-valid');
  var validValue = document.getElementById('link-valid-value');
  var calPop     = document.getElementById('link-cal');
  var sendBtn    = document.getElementById('link-send');

  var linkState = { competency: '', date: null, calMonth: null, touched: {} };

  function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function fmtLong(d) { return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear(); }

  function defaultMessage(competency) {
    var me = (Shell.account && Shell.account.name) || 'Olivia Rhye';
    return 'Hi,\n' +
      'Could you please complete the form ' + competency + ' for ' + WORKER + ', using the button below?\n' +
      'Kind regards,\n' + me;
  }

  function openLinkModal(competency) {
    linkState.competency = competency;
    linkState.touched = {};
    /* Only future dates are allowed, so the default sits a week out. */
    linkState.date = addDays(startOfToday(), 7);
    linkState.calMonth = new Date(linkState.date.getFullYear(), linkState.date.getMonth(), 1);

    introEl.innerHTML = 'This will create a link for an external user, so that they can complete the form for ' +
      '<b>' + Shell.esc(competency) + '</b> for <b>' + Shell.esc(WORKER) + '</b>.';
    recipient.value = '';
    message.value = defaultMessage(competency);
    validValue.textContent = fmtLong(linkState.date);

    ['field-recipient', 'field-message', 'field-valid'].forEach(function (id) {
      document.getElementById(id).classList.remove('invalid');
    });
    syncCount();
    syncSend();
    closeCal();
    modal.classList.add('open');
    recipient.focus();
  }

  function closeLinkModal() {
    modal.classList.remove('open');
    closeCal();
  }

  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); }
  function dateOk() { return !!linkState.date && linkState.date > startOfToday(); }

  function syncCount() { msgCount.textContent = message.value.length + '/2000'; }

  function syncSend() {
    sendBtn.disabled = !(validEmail(recipient.value) && message.value.trim() && dateOk());
    if (linkState.touched.recipient) {
      document.getElementById('field-recipient').classList.toggle('invalid', !validEmail(recipient.value));
    }
    if (linkState.touched.message) {
      document.getElementById('field-message').classList.toggle('invalid', !message.value.trim());
    }
  }

  recipient.addEventListener('input', syncSend);
  recipient.addEventListener('blur', function () { linkState.touched.recipient = true; syncSend(); });
  message.addEventListener('input', function () { syncCount(); syncSend(); });
  message.addEventListener('blur', function () { linkState.touched.message = true; syncSend(); });

  /* ─── Date picker ─────────────────────────────────────────────────── */
  var DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

  function renderCal() {
    var y = linkState.calMonth.getFullYear(), m = linkState.calMonth.getMonth();
    var today = startOfToday();
    var lead = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    /* Nothing to go back to once the grid reaches the current month. */
    var atFloor = y === today.getFullYear() && m === today.getMonth();

    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell"></div>';
    for (var d = 1; d <= days; d++) {
      var cur = new Date(y, m, d);
      var past = cur <= today;
      var sel = sameDay(cur, linkState.date);
      cells += '<div class="cal-cell"><button class="cal-day' + (sel ? ' sel' : '') + '" type="button"' +
        (past ? ' disabled' : ' data-day="' + d + '"') + '>' + d + '</button></div>';
    }

    calPop.innerHTML =
      '<div class="cal-head">' +
        '<button class="cal-nav" type="button" data-nav="-1" aria-label="Previous month"' + (atFloor ? ' disabled' : '') + '>' +
          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<div class="cal-title">' + MONTHS_LONG[m] + ' ' + y + '</div>' +
        '<button class="cal-nav" type="button" data-nav="1" aria-label="Next month">' +
          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '</div>' +
      '<div class="cal-dow">' + DOW.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-foot">Only future dates can be chosen.</div>';
  }

  function openCal() {
    linkState.calMonth = new Date(linkState.date.getFullYear(), linkState.date.getMonth(), 1);
    renderCal();
    calPop.classList.add('open');
    validBtn.classList.add('open');
    validBtn.setAttribute('aria-expanded', 'true');
  }
  function closeCal() {
    calPop.classList.remove('open');
    validBtn.classList.remove('open');
    validBtn.setAttribute('aria-expanded', 'false');
  }

  validBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (calPop.classList.contains('open')) closeCal(); else openCal();
  });
  calPop.addEventListener('click', function (e) {
    e.stopPropagation();
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      linkState.calMonth = new Date(linkState.calMonth.getFullYear(), linkState.calMonth.getMonth() + Number(nav.getAttribute('data-nav')), 1);
      renderCal();
      return;
    }
    var day = e.target.closest('[data-day]');
    if (!day) return;
    linkState.date = new Date(linkState.calMonth.getFullYear(), linkState.calMonth.getMonth(), Number(day.getAttribute('data-day')));
    validValue.textContent = fmtLong(linkState.date);
    document.getElementById('field-valid').classList.remove('invalid');
    syncSend();
    closeCal();
  });

  /* ─── Send ────────────────────────────────────────────────────────── */
  sendBtn.addEventListener('click', function () {
    var to = recipient.value.trim();
    postExternalLink().then(function () {
      closeLinkModal();
      Shell.snackbar('Successfully sent link to ' + to);
      markLinkSent(linkState.competency);
    }).catch(function () {
      // The popup stays open so the user can correct and retry.
      Shell.snackbar('Could not send link, please try again', { variant: 'error', persistent: true });
    });
  });

  // Stands in for POST /training/external_links.
  function postExternalLink() {
    return new Promise(function (resolve, reject) {
      setTimeout(function () { FORCE_ERROR ? reject() : resolve(); }, 350);
    });
  }

  /* With a link now out, the row no longer has "no active links" — it drops
     the Send Link action and shows the sent-form marker instead. */
  function markLinkSent(competency) {
    [OUTSTANDING, NON_OUTSTANDING].forEach(function (set) {
      set.forEach(function (r) {
        if (r.doc === competency && r.action === 'Send Link') { r.action = 'Review'; r.sent = true; }
      });
    });
    render();
  }

  modal.addEventListener('click', function (e) {
    if (e.target === modal || e.target.closest('[data-close]')) { closeLinkModal(); return; }
    closeCal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !modal.classList.contains('open')) return;
    if (calPop.classList.contains('open')) closeCal(); else closeLinkModal();
  });

  /* The Workers crumb points wherever the shell's own nav points, so the
     deployed copy (which rewrites that href) stays correct. */
  var workersNav = (Shell.nav || []).filter(function (n) { return n.id === 'workers'; })[0];
  if (workersNav && workersNav.href) document.getElementById('bc-workers').href = workersNav.href;

  document.getElementById('bc-worker').addEventListener('click', function (e) {
    e.preventDefault();
    Shell.snackbar('James Hetfield — worker page not designed yet.');
  });

  render();
})();
</script>
</body>
</html>
